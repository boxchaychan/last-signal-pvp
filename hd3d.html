<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HD-2D test</title>
<style>
  html, body { margin: 0; height: 100%; background: #10140f; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 10px; top: 8px; color: #f4ecd8; font: 600 13px/1.4 system-ui, sans-serif; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #fx { position: fixed; right: 10px; top: 8px; display: flex; gap: 6px; }
  #fx button { font: 600 13px system-ui, sans-serif; padding: 6px 10px; border: 2px solid #1d1a22; background: #f4ecd8; border-radius: 6px; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25); }
  #knob { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.5); }
</style>
</head>
<body>
<div id="hud">ฉากทดลอง HD-2D · WASD / จอยซ้าย เดิน</div>
<div id="fx"><button id="bTilt">เบลอขอบ: เปิด</button><button id="bZoom">ซูม</button></div>
<div id="stick"><div id="knob"></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
// HD-2D test (owner 2026-11-10, a screenshot of a pixel game in a 3D world: "ลองดู"): our own pixel art in a small three.js
// scene. Ground = blocks: grass raised above the dirt road, water sunk, every face textured with our ground pictures
// (nearest filter, so pixels stay crisp); trees, houses, grass tufts and the hero = upright cards that always face the
// camera and cast real shadows (alpha-tested depth material); a warm low sun; a tilt-shift blur at the top and bottom
// edges + vignette + warm grade done in one full-screen pass.
const T = 1;                                   // one tile = 1 world unit = 32 ground pixels
const W = 30, H = 22;                          // the test map in tiles
const map = [];                                // 0 grass, 1 road, 2 water
for (let y = 0; y < H; y++) { map.push([]); for (let x = 0; x < W; x++) {
  let t = 0; if (Math.abs(x - 14) <= 1 || Math.abs(y - 13) <= 1) t = 1;            // a crossroads
  if (x >= 22 && x <= 24 && y < 11) t = 2; if (x >= 22 && x <= 24 && y >= 15) t = 2;  // a stream on the right
  if (x >= 2 && x <= 9 && y >= 2 && y <= 8 && !(x >= 5 && x <= 6 && y >= 4 && y <= 6)) t = (x === 2 || x === 9 || y === 2 || y === 8) ? 0 : 2;   // a pond with an island
  map[y].push(t); } }
for (let x = 22; x <= 24; x++) map[13][x] = 3;     // the bridge over the stream
const HGT = [0.32, 0, -0.35, 0];                     // grass sits higher than the road, water lower

const renderer = new THREE.WebGLRenderer({antialias: false});
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x9fb48a, 24, 46); scene.background = new THREE.Color(0x9fb48a);
const cam = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.5, 200);
let ZOOM = 13;
const sun = new THREE.DirectionalLight(0xffe6c0, .95); sun.position.set(-10, 18, 8); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60}); sun.shadow.bias = -0.0008;
scene.add(sun, sun.target, new THREE.HemisphereLight(0xcfe6ff, 0x4a5a2a, 0.45));

const LD = new THREE.TextureLoader();
function tex(src, rep) { const t = LD.load(src); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter; t.encoding = THREE.sRGBEncoding;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t; }
const G = 'art/action/ground_hr/';
const tGrass = tex(G + 'grass.png', 1), tDirt = tex(G + 'dirt.png', 1), tWater = tex(G + 'water.png', 1), tSide = tex(G + 'dirt.png', 1), tPlank = tex(G + 'planks.png', 1);
// world-space UVs so the textures run across tiles without seams (one picture ~ 10 tiles)
function worldUV(geo, sx, sy) { const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), ny = Math.abs(n.getY(i));
    if (ny > .5) uv.setXY(i, x / sx, z / sy); else uv.setXY(i, (Math.abs(n.getX(i)) > .5 ? z : x) / sx, y / sy); } }
const mats = {
  grass: [new THREE.MeshLambertMaterial({map: tSide, color: 0x8a6a48}), new THREE.MeshLambertMaterial({map: tGrass, color: 0xd8e8c8})],
  road: new THREE.MeshLambertMaterial({map: tDirt, color: 0xf2dcc0}),
  water: new THREE.MeshLambertMaterial({map: tWater, color: 0xbfe0ff, transparent: true, opacity: .92}),
  plank: new THREE.MeshLambertMaterial({map: tPlank})};
const ground = new THREE.Group(); scene.add(ground);
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
  const t = map[y][x], h = HGT[t] + 1;                    // every block reaches down to -1
  const geo = new THREE.BoxGeometry(T, h, T); geo.translate(x + .5, h / 2 - 1, y + .5); worldUV(geo, 4, 4);   // one ground picture over ~4 tiles = the hero's pixel size
  const m = t === 0 ? [mats.grass[0], mats.grass[0], mats.grass[1], mats.grass[0], mats.grass[0], mats.grass[0]] : t === 1 ? mats.road : t === 3 ? mats.road : mats.water;
  const b = new THREE.Mesh(geo, m); b.receiveShadow = true; b.castShadow = t === 0; ground.add(b);
  if (t === 3) { const pg = new THREE.BoxGeometry(T, .12, T * 1.4); pg.translate(x + .5, .22, y + .5); worldUV(pg, 4, 4); const pl = new THREE.Mesh(pg, mats.plank); pl.castShadow = pl.receiveShadow = true; ground.add(pl); }
}
// ---------- upright cards (billboards that turn round the vertical axis only) with real shadows ----------
const cards = [];
function card(src, x, z, hWorld, opt = {}) {
  const t = tex(src); const mat = new THREE.MeshLambertMaterial({map: t, alphaTest: .5, side: THREE.DoubleSide});
  const geo = new THREE.PlaneGeometry(1, 1); geo.translate(0, .5, 0);
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = !!opt.recv;
  m.customDepthMaterial = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking, map: t, alphaTest: .5});
  const y = HGT[map[Math.min(H - 1, Math.max(0, z | 0))][Math.min(W - 1, Math.max(0, x | 0))]] || 0;
  m.position.set(x, y, z); scene.add(m); const c = {m, t, h: hWorld, flat: opt.flat};
  t.image && t.image.width ? fit(c) : (t.onUpdate = () => fit(c)); LD.manager.onLoad = () => cards.forEach(fit); cards.push(c); return c;
}
function fit(c) { const im = c.t.image; if (!im || !im.width) return; c.m.scale.set(c.h * im.width / im.height, c.h, 1); }
const P = 'art/action/props_hr/';
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const free = (x, y) => map[y | 0] && map[y | 0][x | 0] === 0 && !(Math.abs(x - 14.5) < 2.6) && !(Math.abs(y - 13.5) < 2.6);
for (let i = 0; i < 26; i++) { const x = 1 + rnd() * (W - 2), y = 1 + rnd() * (H - 2); if (free(x, y)) card(P + (rnd() < .6 ? 'oak.png' : 'pine.png'), x, y, 2.8 + rnd() * 1.0); }
for (const [x, y] of [[12, 16.5], [17.5, 11.8], [11.5, 11.6], [16.8, 15.6], [19.5, 15.2], [9.8, 14.6]]) card(P + (x > 15 ? 'pine.png' : 'oak.png'), x, y, 3.0);   // a few trees close to the crossroads
card(P + 'house_red.png', 18.5, 9.5, 3.0); card(P + 'cottage_thatch.png', 10.5, 17.5, 2.6); card(P + 'tent.png', 17.8, 16.4, 1.5);
card(P + 'campfire.png', 16.8, 17.6, .8); card(P + 'well.png', 11.2, 10.4, 1.6); card(P + 'signpost.png', 12.6, 11.6, 1.3); card(P + 'crate.png', 19.6, 11.2, .7);
for (let i = 0; i < 160; i++) { const x = rnd() * W, y = rnd() * H; if (map[y | 0][x | 0] === 0 && free(x, y)) card(P + (rnd() < .82 ? 'grass.png' : 'flowers.png'), x, y, .45 + rnd() * .25); }
for (let i = 0; i < 6; i++) { const x = 3 + rnd() * 6, y = 3 + rnd() * 5; if (map[y | 0][x | 0] === 2) card(P + 'boulder.png', x, y, .7); }

// ---------- the hero: the Guardian's idle / run sheets, one card ----------
const hero = {x: 14.5, z: 15, dir: 1, moving: false, t: 0};
let HM = null, HIMG = {};
fetch('art/action/n128/guardian.json').then(r => r.json()).then(m => { HM = m;
  for (const a of ['idle', 'run']) { const t = tex('art/action/n128/' + m.anims[a].img); HIMG[a] = t; } });
const hc = document.createElement('canvas'); hc.width = hc.height = 132; const hg = hc.getContext('2d'); hg.imageSmoothingEnabled = false;
const htex = new THREE.CanvasTexture(hc); htex.magFilter = THREE.NearestFilter; htex.minFilter = THREE.NearestFilter; htex.encoding = THREE.sRGBEncoding;
const hmat = new THREE.MeshBasicMaterial({map: htex, alphaTest: .5, side: THREE.DoubleSide, color: 0xffffff});   // the hero is never lost in shade
const hgeo = new THREE.PlaneGeometry(1, 1); hgeo.translate(0, .5, 0);
const hmesh = new THREE.Mesh(hgeo, hmat); hmesh.castShadow = true; hmesh.customDepthMaterial = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking, map: htex, alphaTest: .5});
hmesh.scale.set(2.5, 2.5, 1); scene.add(hmesh);
function drawHero(dt) {
  if (!HM) return; hero.t += dt; const a = hero.moving ? 'run' : 'idle', A = HM.anims[a], T2 = HIMG[a]; if (!T2.image || !T2.image.width) return;
  const C = HM.cell, f = Math.floor(hero.t * (hero.moving ? 14 : 9)) % A.east.n;
  hg.clearRect(0, 0, 132, 132); hg.save(); if (hero.dir < 0) { hg.translate(132, 0); hg.scale(-1, 1); }
  hg.drawImage(T2.image, f * C, A.east.r * C, C, C, 0, 132 - HM.fy - 4, C, C); hg.restore();
  // a 1 px light rim round the figure (owner "ตัวละครเราเบลอ แต่ฉากชัด": the dark armour sank into the bold ground)
  const id = hg.getImageData(0, 0, 132, 132), d = id.data, a2 = new Uint8Array(132 * 132); for (let i = 0; i < a2.length; i++) a2[i] = d[i * 4 + 3] > 100;
  for (let y = 1; y < 131; y++) for (let x = 1; x < 131; x++) { const i = y * 132 + x; if (a2[i]) continue;
    if (a2[i - 1] || a2[i + 1] || a2[i - 132] || a2[i + 132]) { d[i * 4] = 255; d[i * 4 + 1] = 240; d[i * 4 + 2] = 200; d[i * 4 + 3] = 255; } }
  hg.putImageData(id, 0, 0); htex.needsUpdate = true;
}
// ---------- input ----------
const K = {}; addEventListener('keydown', e => K[e.key.toLowerCase()] = 1); addEventListener('keyup', e => K[e.key.toLowerCase()] = 0);
const stick = {x: 0, y: 0, id: null}; const st = document.getElementById('stick'), kn = document.getElementById('knob');
st.addEventListener('pointerdown', e => { stick.id = e.pointerId; st.setPointerCapture(e.pointerId); mv(e); });
st.addEventListener('pointermove', e => { if (e.pointerId === stick.id) mv(e); });
st.addEventListener('pointerup', () => { stick.id = null; stick.x = stick.y = 0; kn.style.left = kn.style.top = '40px'; });
function mv(e) { const r = st.getBoundingClientRect(); let dx = e.clientX - r.left - 60, dy = e.clientY - r.top - 60; const l = Math.hypot(dx, dy); if (l > 44) { dx *= 44 / l; dy *= 44 / l; }
  stick.x = dx / 44; stick.y = dy / 44; kn.style.left = 40 + dx + 'px'; kn.style.top = 40 + dy + 'px'; }
// ---------- post: tilt-shift blur + vignette + warm grade ----------
let TILT = true;
const rt = new THREE.WebGLRenderTarget(1, 1); rt.texture.encoding = THREE.sRGBEncoding;
const post = new THREE.ShaderMaterial({uniforms: {tex: {value: rt.texture}, px: {value: new THREE.Vector2()}, on: {value: 1}},
  vertexShader: 'varying vec2 v; void main(){ v = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tex; uniform vec2 px; uniform float on; varying vec2 v;
    void main(){ float b = on * smoothstep(.22, .5, abs(v.y - .47)) * 4.;   // sharp band in the middle, blur grows to the top / bottom
      vec4 c = vec4(0.); float w = 0.;
      for (int i = -3; i <= 3; i++) for (int j = -3; j <= 3; j++) { float k = exp(-float(i*i + j*j) / 6.); c += texture2D(tex, v + vec2(float(i), float(j)) * px * b) * k; w += k; }
      c /= w; vec3 col = c.rgb;
      col = mix(col, col * vec3(1.05, 1.0, .9), .45);                   // warm
      float vg = smoothstep(.95, .35, length((v - .5) * vec2(1.15, 1.)));   // vignette
      gl_FragColor = vec4(col * mix(.62, 1., vg), 1.); }`});
const pscene = new THREE.Scene(), pcam = new THREE.Camera(); pscene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
document.getElementById('bTilt').onclick = e => { TILT = !TILT; post.uniforms.on.value = TILT ? 1 : 0; e.target.textContent = 'เบลอขอบ: ' + (TILT ? 'เปิด' : 'ปิด'); };
document.getElementById('bZoom').onclick = () => { ZOOM = ZOOM > 20 ? 11 : ZOOM + 5; };
function size() { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  const pr = renderer.getPixelRatio(); rt.setSize(innerWidth * pr, innerHeight * pr); post.uniforms.px.value.set(1 / (innerWidth * pr), 1 / (innerHeight * pr)); }
addEventListener('resize', size); size();
// ---------- loop ----------
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now;
  let mx = (K.d || K.arrowright ? 1 : 0) - (K.a || K.arrowleft ? 1 : 0) + stick.x, mz = (K.s || K.arrowdown ? 1 : 0) - (K.w || K.arrowup ? 1 : 0) + stick.y;
  const l = Math.hypot(mx, mz); hero.moving = l > .15;
  if (hero.moving) { mx /= Math.max(1, l); mz /= Math.max(1, l); const nx = hero.x + mx * 4 * dt, nz = hero.z + mz * 4 * dt, t = map[nz | 0] && map[nz | 0][nx | 0];
    if (t !== undefined && t !== 2) { hero.x = nx; hero.z = nz; } if (Math.abs(mx) > .2) hero.dir = mx > 0 ? 1 : -1; }
  const gy = HGT[map[hero.z | 0][hero.x | 0]] || 0; hmesh.position.set(hero.x, gy, hero.z); drawHero(dt);
  const a = .95;   // camera pitch (radians from the horizon)
  cam.position.set(hero.x, gy + Math.sin(a) * ZOOM, hero.z + Math.cos(a) * ZOOM); cam.lookAt(hero.x, gy + .6, hero.z);
  sun.position.set(hero.x - 10, 18, hero.z + 8); sun.target.position.set(hero.x, 0, hero.z);
  const ang = Math.atan2(cam.position.x - hero.x, cam.position.z - hero.z);
  for (const c of cards) c.m.rotation.y = ang; hmesh.rotation.y = ang;
  tWater.offset.x = (now / 9000) % 1;
  renderer.setRenderTarget(rt); renderer.render(scene, cam); renderer.setRenderTarget(null); renderer.render(pscene, pcam);
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
