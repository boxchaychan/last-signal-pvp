<!-- pixgrind.html = the pixel 3D level-grinding game, ONE hero who changes weapons (owner 2026-11-26). Map 1 = the desert oasis of the
     owner's Gemini target picture (art/incoming/pixgrind/target_map_v1_gemini.png). A real 3D world drawn small (about PXH texels across the
     short side of the screen), outlined on depth edges and blown up with hard pixels; orthographic camera at a fixed angle, snapped to whole
     texels. Hero = 2D pixel card, 1 sprite pixel = 1 texel, 60 px tall (H = 1.6 m). Size standard (docs/action-game.md): palms 3-4 H,
     one rock level 1.2 H, landmark about 5-7 H, mobs 0.8 H. Notes: the NEXT PLAN / pixgrind lines at the end of docs/action-game.md. -->

<script>
'use strict';

/* ---------- noise */

  [50, 65, 6.5], [57, 67, 5], [44, 68, 4], [53, 61, 4.5], /* main oasis, just north of the start */
  [94, 32, 6], [100, 35, 4.5],                             /* spring on the upper level */

];
const START = [60, 78], HEAD = [46, 55];                   /* hero start; the stone head on the far bank of the main pool */
const RAMPS = [   /* sand ramps: x0, x1, z0, z1, way up ('n', 'e', 'w', 's') */

];

  if (x > 122 && x < 146 && z > 54 && z < 80) return 1;                         /* east mesa */

const sun = new THREE.DirectionalLight(0xffdc9e, .66); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);

const GS = .5, GX = MW / GS, GZ = MD / GS;
const gg = new THREE.PlaneGeometry(MW, MD, GX, GZ); gg.rotateX(-Math.PI / 2); gg.translate(MW / 2, 0, MD / 2);
{ const p = gg.attributes.position; for (let k = 0; k < p.count; k++) p.setY(k, groundH(p.getX(k), p.getZ(k))); gg.computeVertexNormals(); }
const POOLU = POOLS.map(p => new THREE.Vector3(p[0], p[1], p[2]));

/* ---------- water */
const TIMEU = { value: 0 };

    vertexShader: 'varying vec3 vWP; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vWP = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: GLSL_SDF + `\n uniform float t; varying vec3 vWP;

{ const bg = new THREE.BoxGeometry(1, 1, 1), bm = new THREE.MeshLambertMaterial({ color: 0xffffff });

  if (palms.length) {
    let n = 0; for (let k = 0; k < 4000 && n < 46; k++) {   /* round the water */
      const x = 4 + rnd() * (MW - 8), z = 4 + rnd() * (MD - 8), d = poolSDF(x, z); if (d < 1 || d > 4.5 || !free(x, z, 1.6) || onLevelEdge(x, z)) continue;
      place(palms[Math.floor(rnd() * palms.length)], x, z, .9 + rnd() * .3, rnd() * 6.28, palmM); SOLID.push([x, z, .45]); n++; }
    for (let k = 0, m = 0; k < 3000 && m < 22; k++) {   /* a few lone palms */
      const x = 8 + rnd() * (MW - 16), z = 8 + rnd() * (MD - 16); if (poolSDF(x, z) < 6 || !free(x, z, 4) || onLevelEdge(x, z)) continue;
      place(palms[Math.floor(rnd() * palms.length)], x, z, .85 + rnd() * .3, rnd() * 6.28, palmM); SOLID.push([x, z, .45]); m++; }
  }
  const rockM = m => { m.material = rockMats[rnd() < .6 ? 0 : 1]; };
  if (rocks.length) {
    for (let k = 0, m = 0; k < 5000 && m < 70; k++) {   /* boulders: many near the ledges, some on open sand */
      const x = 4 + rnd() * (MW - 8), z = 4 + rnd() * (MD - 8); if (poolSDF(x, z) < 1.2) continue; const edge = onLevelEdge(x, z); if (!edge && rnd() > .25) continue;
      const s = edge ? 1.6 + rnd() * 1.8 : .9 + rnd() * 1.2; if (!free(x, z, s * .5)) continue;
      place(rocks[Math.floor(rnd() * rocks.length)], x, z, s, rnd() * 6.28, rockM); SOLID.push([x, z, s * .38]); m++; }
    for (const p of [[47, 56, 1.4], [53, 60, 1.2], [58, 53, 1.5], [44, 52, 1], [62, 60, 1.1]]) {   /* stepping stones in the main pool */
      const o = place(rocks[1 % rocks.length], p[0], p[1], p[2], rnd() * 6.28, rockM); o.position.y = poolAt(p[0], p[1]).wy - .25; o.scale.y *= .45; }
  }
  if (grass) {
    const gM = m => { m.material = grassMat; m.castShadow = false; };
    for (let k = 0, m = 0; k < 6000 && m < 160; k++) {
      const x = 4 + rnd() * (MW - 8), z = 4 + rnd() * (MD - 8), d = poolSDF(x, z); const near = d > .4 && d < 2.6; if (!near && rnd() > .03) continue;
      const o = place(grass, x, z, near ? .9 + rnd() * .7 : .6 + rnd() * .4, rnd() * 6.28, gM); if (near && rnd() < .4) o.scale.y *= 2.2; m++; }   /* tall clumps = reeds */
  }
  PG.propsReady = true;
}

/* ---------- landmark: the stone head art comes later (Gemini kit, owner); its place HEAD stays free of props */

/* ---------- hero card: idle 8 + run 6 frames (72 px cells, feet at row 68), faces left; mirrored for right */
function sheet(p, n) { const t = tl.load(p); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; t.repeat.set(1 / n, 1); return t; }
const HERO = { x: START[0], z: START[1], y: 0, vx: 0, vz: 0, face: -1, moving: false, t: 0, speed: 5.2 };
const heroTex = { idle: sheet('art/pixgrind/hero_idle8.png', 8), run: sheet('art/pixgrind/hero_run6.png', 6) };
const heroMat = new THREE.MeshBasicMaterial({ map: heroTex.idle, alphaTest: .5, side: THREE.DoubleSide, toneMapped: false, fog: false });
const heroCard = new THREE.Mesh(new THREE.PlaneGeometry(72 * TW, 72 * TW), heroMat); scene.add(heroCard);
const blobMat = new THREE.MeshBasicMaterial({ color: 0x7a4f86, transparent: true, opacity: .38, depthWrite: false });
const heroBlob = new THREE.Mesh(new THREE.CircleGeometry(1, 16), blobMat); heroBlob.rotation.x = -Math.PI / 2; heroBlob.scale.set(.46, .26, 1); scene.add(heroBlob);

/* ---------- scorpions (pixel cards from art/horde/mobs, 1 art pixel = 1 texel), wander in packs; no fighting yet */
const MOBS = []; const scTex = tl.load('art/horde/mobs/mob_desert_stingclaw_scorpion.png'); scTex.magFilter = scTex.minFilter = THREE.NearestFilter; scTex.generateMipmaps = false; scTex.repeat.set(1 / 4, .5); scTex.offset.set(0, .5);
{ const SC = { w: 173, h: 126, fx: 95, fy: 124, px: 2 }; SEED = 23;
  for (const home of [[96, 66], [84, 40], [30, 70], [128, 86], [108, 48], [70, 30]]) for (let k = 0; k < 3; k++) {
    const t = scTex.clone(); const ww = SC.w / SC.px * TW, hh = SC.h / SC.px * TW;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ww, hh), new THREE.MeshBasicMaterial({ map: t, alphaTest: .5, side: THREE.DoubleSide, toneMapped: false }));
    const b = new THREE.Mesh(new THREE.CircleGeometry(1, 12), blobMat); b.rotation.x = -Math.PI / 2; b.scale.set(.7, .36, 1); scene.add(m, b);
    MOBS.push({ m, b, t, home, x: home[0] + (rnd() - .5) * 5, z: home[1] + (rnd() - .5) * 5, tx: 0, tz: 0, wait: rnd() * 3, face: 1, f: 0, ax: (SC.fx / SC.w - .5) * ww, ay: (.5 - SC.fy / SC.h) * hh }); }
}

/* ---------- walking rules */
function walkable(x, z, fromH) { if (x < 3 || z < 3 || x > MW - 3 || z > MD - 3) return false; if (poolSDF(x, z) < .35) return false;
  if (Math.abs(levelH(x, z) - fromH) > .55) return false; for (const c of SOLID) if (Math.hypot(c[0] - x, c[1] - z) < c[2] + .3) return false; return true; }

/* ---------- input: keys + a drag stick anywhere on the screen */
const KEYS = {}; addEventListener('keydown', e => { KEYS[e.code] = true; }); addEventListener('keyup', e => { KEYS[e.code] = false; });
const STICK = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
addEventListener('pointerdown', e => { if (STICK.id === null) { STICK.id = e.pointerId; STICK.ox = STICK.x = e.clientX; STICK.oy = STICK.y = e.clientY; } });
addEventListener('pointermove', e => { if (e.pointerId === STICK.id) { STICK.x = e.clientX; STICK.y = e.clientY; } });
const endStick = e => { if (e.pointerId === STICK.id) STICK.id = null; }; addEventListener('pointerup', endStick); addEventListener('pointercancel', endStick);

/* ---------- life: drifting sand motes (1 texel dots) */
const MOTES = 140, mg = new THREE.BufferGeometry(), mp = new Float32Array(MOTES * 3); mg.setAttribute('position', new THREE.BufferAttribute(mp, 3));
for (let k = 0; k < MOTES; k++) { mp[k * 3] = rnd() * 30 - 15; mp[k * 3 + 1] = .3 + rnd() * 2.5; mp[k * 3 + 2] = rnd() * 24 - 12; }
const motes = new THREE.Points(mg, new THREE.PointsMaterial({ color: 0xfff0d2, size: 1, sizeAttenuation: false, transparent: true, opacity: .75, depthWrite: false })); scene.add(motes);

/* ---------- update */
const CAM = { look: new V3(START[0], 0, START[1]), lead: new V3() }; const _r = new V3(), _u = new V3(), _p = new V3();
function step(dt) {
  TIMEU.value += dt; HERO.t += dt;
  let ix = (KEYS.KeyD || KEYS.ArrowRight ? 1 : 0) - (KEYS.KeyA || KEYS.ArrowLeft ? 1 : 0), iz = (KEYS.KeyS || KEYS.ArrowDown ? 1 : 0) - (KEYS.KeyW || KEYS.ArrowUp ? 1 : 0);
  if (STICK.id !== null) { const dx = STICK.x - STICK.ox, dy = STICK.y - STICK.oy, l = Math.hypot(dx, dy); if (l > 8) { ix = dx / Math.max(l, 40); iz = dy / Math.max(l, 40); } }
  if (PG.auto) { ix = PG.auto[0]; iz = PG.auto[1]; }
  const il = Math.hypot(ix, iz); if (il > 1) { ix /= il; iz /= il; }
  HERO.moving = il > .1; const hNow = levelH(HERO.x, HERO.z);
  if (HERO.moving) { if (Math.abs(ix) > .15) HERO.face = ix > 0 ? 1 : -1;
    const s = HERO.speed * dt * Math.min(1, il), nx = HERO.x + ix * s, nz = HERO.z + iz * s;
    if (walkable(nx, nz, hNow)) { HERO.x = nx; HERO.z = nz; } else if (walkable(nx, HERO.z, hNow)) HERO.x = nx; else if (walkable(HERO.x, nz, hNow)) HERO.z = nz; }
  HERO.y = groundH(HERO.x, HERO.z);
  for (const m of MOBS) {   /* wander */
    if (m.wait > 0) { m.wait -= dt; m.f = 0; }
    else { const dx = m.tx - m.x, dz = m.tz - m.z, l = Math.hypot(dx, dz);
      if (l < .2 || !m.tx) { m.tx = m.home[0] + (rnd() - .5) * 12; m.tz = m.home[1] + (rnd() - .5) * 10; m.wait = .5 + rnd() * 2.5; if (poolSDF(m.tx, m.tz) < 1 || Math.abs(levelH(m.tx, m.tz) - levelH(m.x, m.z)) > .5) m.tx = 0; }
      else { const s = 1.3 * dt; m.x += dx / l * s; m.z += dz / l * s; m.face = dx > 0 ? 1 : -1; m.f += dt * 8; } }
    m.t.offset.x = (Math.floor(m.f) % 4) / 4; }
  updCam(dt); placeCards();
  const mo = mg.attributes.position; for (let k = 0; k < MOTES; k++) { let x = mo.getX(k) + dt * (.8 + (k % 5) * .15), y = mo.getY(k) + Math.sin(TIMEU.value * 2 + k) * dt * .15, z = mo.getZ(k) + dt * .25;
    if (x > 16) x -= 32; if (z > 13) z -= 26; mo.setXYZ(k, x, y, z); } mo.needsUpdate = true; motes.position.set(CAM.look.x, CAM.look.y, CAM.look.z);
}
function snapCard(obj, fx, fy, fz, ax, ay) {   /* the card's pixel grid on the texel grid: feet point + offset, rounded in camera right / up */
  _p.set(fx, fy, fz).addScaledVector(_r, ax).addScaledVector(_u, ay); const pr = _p.dot(_r), pu = _p.dot(_u);
  _p.addScaledVector(_r, Math.round(pr / TW) * TW - pr).addScaledVector(_u, Math.round(pu / TW) * TW - pu); obj.position.copy(_p); obj.quaternion.copy(camera.quaternion); }
function placeCards() {
  const run = HERO.moving, n = run ? 6 : 8, fps = run ? 12 : 7.5, fr = Math.floor(HERO.t * fps) % n, t = run ? heroTex.run : heroTex.idle;
  if (heroMat.map !== t) { heroMat.map = t; heroMat.needsUpdate = true; } t.offset.x = fr / n;
  snapCard(heroCard, HERO.x, HERO.y, HERO.z, 0, (36 - 68) * -TW); heroCard.scale.x = HERO.face > 0 ? -1 : 1;
  heroBlob.position.set(HERO.x + .2, HERO.y + .03, HERO.z + .12);
  for (const m of MOBS) { const y = groundH(m.x, m.z); snapCard(m.m, m.x, y, m.z, -m.ax * m.face * -1, -m.ay); m.m.scale.x = m.face > 0 ? -1 : 1; m.b.position.set(m.x + .2, y + .03, m.z + .1); }
}
function updCam(dt) {
  const want = new V3(HERO.x, HERO.y + .6, HERO.z);
  const ldx = HERO.moving ? (KEYS.KeyD || KEYS.ArrowRight || (STICK.id !== null && STICK.x > STICK.ox + 8) || (PG.auto && PG.auto[0] > 0) ? 1 : (KEYS.KeyA || KEYS.ArrowLeft || (STICK.id !== null && STICK.x < STICK.ox - 8) || (PG.auto && PG.auto[0] < 0) ? -1 : 0)) : 0;
  const ldz = HERO.moving ? (KEYS.KeyS || KEYS.ArrowDown || (STICK.id !== null && STICK.y > STICK.oy + 8) || (PG.auto && PG.auto[1] > 0) ? 1 : (KEYS.KeyW || KEYS.ArrowUp || (STICK.id !== null && STICK.y < STICK.oy - 8) || (PG.auto && PG.auto[1] < 0) ? -1 : 0)) : 0;
  CAM.lead.lerp(new V3(ldx * 3.2, 0, ldz * 2.2), 1 - Math.exp(-dt * 1.6));   /* more ground ahead than behind */
  want.add(CAM.lead).add(new V3(0, 0, -.8));   /* the hero sits a little below the middle */
  if (Q.get('ov')) {   /* ?ov=1 = the whole map in one picture (to look at the layout) */
    const vh = Math.max(MD * Math.sin(PITCH) + 10, (MW + 6) * PX.bh / PX.bw); camera.left = -vh * PX.bw / PX.bh / 2; camera.right = -camera.left; camera.top = vh / 2; camera.bottom = -vh / 2; camera.updateProjectionMatrix();
    CAM.look.set(MW / 2, 0, MD / 2 + 2); camera.position.copy(CAM.look).addScaledVector(CDIR, 120); camera.lookAt(CAM.look); camera.updateMatrixWorld(); glc.style.transform = `translate(${-PX.m}px, ${-PX.m}px)`;
    sun.shadow.camera.left = sun.shadow.camera.bottom = -90; sun.shadow.camera.right = sun.shadow.camera.top = 90; sun.shadow.camera.far = 300; sun.shadow.camera.updateProjectionMatrix(); sun.position.copy(CAM.look).addScaledVector(SUN, 140); sun.target.position.copy(CAM.look); sun.target.updateMatrixWorld(); return; }
  const vh = PX.bh * TW, vw = PX.bw * TW, dz = vh / Math.sin(PITCH) / 2;
  want.x = clamp(want.x, vw / 2 + 2, MW - vw / 2 - 2); want.z = clamp(want.z, dz * .55 + 2, MD - dz * .45 - 2);
  CAM.look.lerp(want, 1 - Math.exp(-dt * 5));
  camera.left = -vw / 2; camera.right = vw / 2; camera.top = vh / 2; camera.bottom = -vh / 2; camera.updateProjectionMatrix();
  camera.position.copy(CAM.look).addScaledVector(CDIR, 90); camera.lookAt(CAM.look); camera.updateMatrixWorld();
  _r.set(1, 0, 0).applyQuaternion(camera.quaternion); _u.set(0, 1, 0).applyQuaternion(camera.quaternion);
  const pr = camera.position.dot(_r), pu = camera.position.dot(_u), dr = Math.round(pr / TW) * TW - pr, du = Math.round(pu / TW) * TW - pu;
  camera.position.addScaledVector(_r, dr).addScaledVector(_u, du); camera.updateMatrixWorld();
  const dpx = devicePixelRatio || 1, snapD = v => Math.round(v * dpx) / dpx;
  glc.style.transform = `translate(${snapD(-PX.m + dr / TW * PX.T)}px, ${snapD(-PX.m - du / TW * PX.T)}px)`;
  sun.position.copy(CAM.look).addScaledVector(SUN, 70); sun.target.position.copy(CAM.look); sun.target.updateMatrixWorld();
}

/* ---------- UI */
let FPS = 60;
function drawUI() { ui.setTransform(DPR, 0, 0, DPR, 0, 0); ui.clearRect(0, 0, SW, SH); if (Q.get('noui') === '1') return;
  ui.font = '600 13px sans-serif'; ui.fillStyle = 'rgba(60,30,20,.55)'; ui.fillText('โอเอซิสหัวศิลา  ·  ลากนิ้ว / WASD เดิน', 12, 20);
  if (Q.get('fps')) { ui.fillText(FPS.toFixed(0) + ' fps', 12, SH - 10); }
  if (STICK.id !== null) { ui.strokeStyle = 'rgba(255,245,225,.7)'; ui.lineWidth = 3; ui.beginPath(); ui.arc(STICK.ox, STICK.oy, 40, 0, 7); ui.stroke();
    const dx = STICK.x - STICK.ox, dy = STICK.y - STICK.oy, l = Math.hypot(dx, dy), k = l > 40 ? 40 / l : 1; ui.fillStyle = 'rgba(255,245,225,.8)'; ui.beginPath(); ui.arc(STICK.ox + dx * k, STICK.oy + dy * k, 16, 0, 7); ui.fill(); } }

/* ---------- loop */
const PG = window.PG = { HERO, MOBS, MW, MD, H, TW, PX, groundH, levelH, poolSDF, walkable, renderer, scene, camera, auto: null, propsReady: false, frames: 0,
  sim(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) step(dt); render(); } };
function render() { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); renderer.render(postScene, postCam); drawUI(); PG.frames++; }
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; FPS = lerp(FPS, 1 / Math.max(dt, 1e-3), .05); step(dt); render(); requestAnimationFrame(loop); }
props(); requestAnimationFrame(loop);
</script>
