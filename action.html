<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>นักมีด ต้นแบบ</title>
<style>
:root{--ink:#1d1a22;--hp:#e04848;--st:#e8c440;--panel:rgba(20,18,26,.72)}
html,body{margin:0;height:100%;background:#21331d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,system-ui,sans-serif;color:#fff}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.bar{width:min(34vw,220px);height:12px;background:#2a2430;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bar>i{display:block;height:100%;width:100%;transition:width .08s linear}
#hpb>i{background:var(--hp)} #stb>i{background:var(--st)}
#stb.no{animation:no .25s 2}
@keyframes no{50%{border-color:#ff5050}}
#score{position:fixed;right:max(10px,env(safe-area-inset-right));top:8px;font-size:15px;font-weight:700;text-shadow:0 2px 0 var(--ink);pointer-events:none;text-align:right}
#help{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;opacity:.8;text-shadow:0 1px 0 var(--ink);pointer-events:none;white-space:nowrap}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:16px;display:none;gap:14px;align-items:flex-end}
.touch #btns{display:flex} .touch #help{display:none}
.bt{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:#f0ece0;color:var(--ink);font-size:16px;font-weight:800;
  box-shadow:0 5px 0 #8c8678;display:flex;align-items:center;justify-content:center;touch-action:none}
.bt.small{width:64px;height:64px;font-size:14px;background:#cfe8f0;box-shadow:0 5px 0 #6f8f99}
.bt.on{transform:translateY(4px);box-shadow:0 1px 0 #8c8678}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,10,.55)}
#ov>div{background:var(--panel);border:3px solid var(--ink);padding:18px 26px;text-align:center;max-width:86vw}
#ov h1{margin:0 0 8px;font-size:26px} #ov p{margin:6px 0;font-size:14px;line-height:1.5}
#ov button{margin-top:10px;font:inherit;font-size:17px;font-weight:800;padding:8px 26px;border:3px solid var(--ink);background:#f0ece0;color:var(--ink);box-shadow:0 4px 0 #8c8678}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="bar" id="hpb"><i></i></div><div class="bar" id="stb"><i></i></div></div>
<div id="score"></div>
<div id="help">WASD เดิน · คลิกซ้าย / J ตี (หันตามเมาส์) · Space / คลิกขวา / K กลิ้งหลบ</div>
<div id="btns"><div class="bt small" id="bRoll">กลิ้ง</div><div class="bt" id="bAtk">ตี</div></div>
<div id="ov"><div><h1>นักมีด</h1><p>ต้นแบบเกมแอคชัน · ตี 2 ฮิต · กลิ้งหลบ · แถบแรง</p>
<p>สไลม์จะกะพริบ + วงแดงก่อนพุ่งใส่ กลิ้งหลบให้ทัน</p><button id="go" disabled>กำลังสร้างแผนที่…</button></div></div>
<script>
'use strict';
// ---------- setup ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (TOUCH) document.body.classList.add('touch');
const WW = 4200, WH = 2800, MARGIN = {l: 180, r: 180, t: 240, b: 260};   // owner: a bigger, taller world so the rogue looks small
const DIRS = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];
let S = 1, VW = 960, VH = 540, DPR = 1, U = 2;
function onResize() {
  DPR = window.devicePixelRatio || 1;
  const dw = Math.round(innerWidth * DPR), dh = Math.round(innerHeight * DPR);
  cv.width = dw; cv.height = dh;
  // whole-number pixel size only (no blur): 1 art px = 1 screen px up to ~1900 px tall screens. The owner does not want
  // the rogue shrunk (2026-11-08 "ไม่อยากลดตัวละคร เดี๋ยวเบลอ"): the world is made bigger instead (big props, see makeProps)
  S = Math.max(1, Math.floor(dh / 950));
  VW = Math.ceil(dw / S); VH = Math.ceil(dh / S);
  U = Math.max(2, Math.round(DPR * 2 / S));        // size of numbers / sparks so they stay readable on phones
}
addEventListener('resize', onResize); onResize();
const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// ---------- pixel painter (background + code sprites) ----------
function painter(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  const P = {c, w, h, d,
    set(px, py, col, a = 255) { px |= 0; py |= 0; if (px < 0 || py < 0 || px >= w || py >= h) return; const i = (py * w + px) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = a; },
    get(px, py) { const i = (py * w + px) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; },
    disc(cx, cy, rx, ry, col) { for (let yy = -ry; yy <= ry; yy++) for (let xx = -rx; xx <= rx; xx++) if ((xx * xx) / (rx * rx + .5) + (yy * yy) / (ry * ry + .5) <= 1) P.set(cx + xx, cy + yy, col); },
    done() { x.putImageData(id, 0, 0); return c; }};
  return P;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
// ---------- terrain layout: lake, stream, hamlet, meadows ----------
const LAKE = {cx: WW * .7, cy: WH * .66, parts: [[0, 0, 300, 170], [215, 70, 190, 115], [-200, 50, 170, 105], [40, -85, 170, 90]]};
LAKE.box = [LAKE.cx - 440, LAKE.cy - 220, LAKE.cx + 460, LAKE.cy + 230];
function lakeF(x, y) {           // > 0 inside the water, about 1 in the middle
  let v = -9; for (const [ox, oy, rx, ry] of LAKE.parts) { const dx = (x - LAKE.cx - ox) / rx, dy = (y - LAKE.cy - oy) / ry; v = Math.max(v, 1 - (dx * dx + dy * dy)); }
  return v + .06 * Math.sin(x / 31) * Math.sin(y / 23);
}
// stream: from the lake's north shore up to the top edge, crossing the path (bridge there)
const STREAM = (() => {
  const K = [[LAKE.cx + 40, LAKE.cy - 120], [LAKE.cx + 120, LAKE.cy - 480], [LAKE.cx + 40, LAKE.cy - 860], [LAKE.cx + 210, LAKE.cy - 1260], [LAKE.cx + 280, -40]];
  const pts = []; for (let i = 0; i < K.length - 1; i++) { const p0 = K[Math.max(0, i - 1)], p1 = K[i], p2 = K[i + 1], p3 = K[Math.min(K.length - 1, i + 2)];
    for (let t = 0; t < 1; t += .1) { const t2 = t * t, t3 = t2 * t, f = (a, b, c, d) => .5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      pts.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]); } }
  pts.push(K[K.length - 1]);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return {pts, box: [Math.min(...xs) - 50, Math.min(...ys) - 50, Math.max(...xs) + 50, Math.max(...ys) + 50]};
})();
function streamD(x, y) {
  let best = 1e9; const P = STREAM.pts;
  for (let i = 0; i < P.length - 1; i++) { const [ax, ay] = P[i], [bx, by] = P[i + 1], dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    const t = l ? Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / l)) : 0, ex = ax + dx * t - x, ey = ay + dy * t - y, d = ex * ex + ey * ey; if (d < best) best = d; }
  return Math.sqrt(best);
}
const HAMLET = {x: WW * .28 + 240, y: WH * .3 + 200, rx: 580, ry: 400};   // the cottages stand round its middle
const MEADOWS = [[WW * .5, WH * .78], [WW * .14, WH * .62], [WW * .86, WH * .28], [WW * .55, WH * .2]];
// water map for walking: 8 px cells, 1 = water (blocked), 2 = bridge (open)
const WG = 8, GW = Math.ceil(WW / WG), GH = Math.ceil(WH / WG), WATER = new Uint8Array(GW * GH);
function markWater(x, y, v) { const i = (y / WG | 0) * GW + (x / WG | 0); if (v === 2 || WATER[i] !== 2) WATER[i] = v; }
function waterAt(x, y) { if (x < 0 || y < 0 || x >= WW || y >= WH) return false; return WATER[(y / WG | 0) * GW + (x / WG | 0)] === 1; }
function makeGround() {
  const P = painter(WW, WH);
  const G = ['#5c9f3f', '#6bb048', '#7bbf51', '#8dce5c', '#9edb68'].map(hex);
  // low-frequency noise for patches of lighter / darker grass
  const NW = 26, NH = 18, N = []; for (let i = 0; i < NW * NH; i++) N.push(rnd());
  const noise = (x, y) => { const fx = x / WW * (NW - 1), fy = y / WH * (NH - 1), ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const a = N[iy * NW + ix], b = N[iy * NW + ix + 1], c = N[(iy + 1) * NW + ix], e = N[(iy + 1) * NW + ix + 1];
    const s = t => t * t * (3 - 2 * t); return (a + (b - a) * s(tx)) + ((c + (e - c) * s(tx)) - (a + (b - a) * s(tx))) * s(ty); };
  const pathY = x => WH * .5 + 320 * Math.sin(x / 560) + 80 * Math.sin(x / 210 + 1.3);
  const AREA = WW * WH / (2400 * 1600);
  const SAND = ['#b48f58', '#c9a66b', '#d8b97c', '#e6cc94'].map(hex);
  // water, shore, bridge and the hamlet's stone yard (owner 2026-11-08 "ทำแมพต่อสวยๆ")
  const WC = ['#2a628f', '#3a82b4', '#55a6d4', '#8fd0ee', '#d6f3fd'].map(hex), SH = ['#cdb47c', '#e0c993', '#efdcaa'].map(hex);
  const WD = ['#4a2f1a', '#6e4a2a', '#8e6538', '#ab8048'].map(hex), CB = ['#7a7682', '#94909b', '#aba7b0', '#c4c0c6'].map(hex);
  const lb = LAKE.box, sb = STREAM.box, hz = HAMLET;
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const u = Math.floor(x / 96 + y / 48), v = Math.floor(x / 96 - y / 48), chk = (u + v) & 1;   // diamond tiles
    let t = noise(x, y) * 0.75 + chk * 0.13 + 0.12;
    const dpath = Math.abs(y - pathY(x)), pw = 34 + 8 * Math.sin(x / 57);
    const b = BAYER[(y & 3) * 4 + (x & 3)];
    const lf = x > lb[0] && x < lb[2] && y > lb[1] && y < lb[3] ? lakeF(x, y) : -9;
    const sd = x > sb[0] && x < sb[2] && y > sb[1] && y < sb[3] ? streamD(x, y) : 1e9, sw = 22 + 5 * Math.sin(y / 70);
    if (dpath < pw + 8 && sd < sw + 12) {                 // wooden bridge where the path crosses the stream
      const e = dpath > pw + 5, rail = dpath > pw + 2;
      P.set(x, y, e ? WD[0] : rail ? WD[1] : (x % 9 === 0 ? WD[0] : (x % 9 < 4 ? WD[2] : WD[3])));
      if (dpath < pw + 2) markWater(x, y, 2);              // the deck is walkable, the rails are not
      continue;
    }
    if (lf > 0 || sd < sw) {                              // water: deep middle, light edge, foam rim
      const dep = Math.max(lf > 0 ? lf / .5 : 0, sd < sw ? 1 - sd / sw : 0);
      const k = dep > .85 ? 0 : dep > .5 ? 1 : dep > .22 ? 2 : dep > .08 ? 3 : 4;
      P.set(x, y, WC[k === 4 && b > .55 ? 3 : k === 1 && b < .12 ? 2 : k]); markWater(x, y, 1);
      continue;
    }
    if (lf > -.13 || sd < sw + 8) { const k = lf > -.05 || sd < sw + 3 ? 0 : b < .5 ? 1 : 2; P.set(x, y, SH[k]); continue; }   // sandy shore
    const hd = ((x - hz.x) / hz.rx) ** 2 + ((y - hz.y) / hz.ry) ** 2;
    if (hd < 1 && dpath >= pw) {                          // cobbled yard of the hamlet, fraying into the grass
      if (hd > .82 && b < (hd - .82) / .18) { P.set(x, y, G[1]); continue; }
      const row = Math.floor(y / 11), cx = Math.floor((x + (row & 1) * 7) / 14), j = ((cx * 73856093) ^ (row * 19349663)) >>> 0;
      const mx = (x + (row & 1) * 7) % 14, my = y % 11;
      P.set(x, y, mx === 0 || my === 0 ? CB[0] : CB[1 + j % 3]); continue;
    }
    if (dpath < pw) {                                     // dirt path, lighter in the middle
      const m = 1 - dpath / pw; const k = clamp(Math.floor(m * 3.2 + b * .9), 0, 3); P.set(x, y, SAND[k]);
      continue;
    }
    if (dpath < pw + 3 && b < .6) { P.set(x, y, G[0]); continue; }  // worn grass edge
    P.set(x, y, G[clamp(Math.floor(t * 4 + b * .8), 0, 4)]);
  }
  // pebbles on the path
  for (let i = 0; i < 260 * AREA; i++) { const x = rnd() * WW | 0, y = pathY(x) + (rnd() - .5) * 50 | 0; if (waterAt(x, y)) continue; P.set(x, y, hex('#9c7c4c')); P.set(x + 1, y, hex('#f0dcae')); }
  // lily pads with a few pink flowers, reeds along the shore
  const LP = ['#2f6e2a', '#4f9a3a', '#7cc455'].map(hex), PK = hex('#ff9ec7');
  for (let i = 0; i < 140; i++) { const x = lb[0] + rnd() * (lb[2] - lb[0]), y = lb[1] + rnd() * (lb[3] - lb[1]); if (lakeF(x, y) < .12) continue;
    const r = 4 + rnd() * 4 | 0; P.disc(x | 0, y | 0, r + 1, r * .6 + 1 | 0, LP[0]); P.disc(x | 0, y | 0, r, r * .6 | 0, LP[1]); P.set(x - 1, y - 1, LP[2]);
    for (let k = 0; k < r; k++) P.set(x + k, y, WC[2]);                  // the notch
    if (rnd() < .25) { P.set(x, y - 2, PK); P.set(x + 1, y - 2, PK); P.set(x, y - 3, hex('#ffe066')); } }
  const RD = ['#3f6f2a', '#5c8f36', '#a7864a'].map(hex);
  for (let i = 0; i < 900; i++) { const a = rnd() * Math.PI * 2, x = LAKE.cx + Math.cos(a) * (lb[2] - lb[0]) * .5 * rnd(), y = LAKE.cy + Math.sin(a) * (lb[3] - lb[1]) * .5 * rnd();
    const f = lakeF(x, y); if (f > .03 || f < -.08 || rnd() < .4) continue;
    const h = 6 + rnd() * 8 | 0; for (let k = 0; k < h; k++) P.set(x, y - k, RD[k > h - 3 && rnd() < .5 ? 2 : k & 1]); }
  // flower meadows: a few patches packed with flowers
  for (const [mx, my] of MEADOWS) for (let i = 0; i < 900; i++) { const a = rnd() * 6.28, d = Math.sqrt(rnd()) * 230, x = mx + Math.cos(a) * d | 0, y = my + Math.sin(a) * d * .7 | 0;
    if (waterAt(x, y) || Math.abs(y - pathY(x)) < 46) continue; const c = [hex('#ffffff'), hex('#ffe066'), hex('#ff9ec7'), hex('#c7a8ff')][rnd() * 4 | 0];
    P.set(x, y + 1, hex('#467f30')); P.set(x, y, c); if (rnd() < .4) P.set(x + 1, y, c); }
  // grass tufts and flowers
  const TD = hex('#467f30'), TL = hex('#b4e67a');
  for (let i = 0; i < 4200 * AREA; i++) { const x = rnd() * WW | 0, y = rnd() * WH | 0; if (Math.abs(y - pathY(x)) < 46) continue;
    P.set(x, y, TD); P.set(x - 1, y - 1, TD); P.set(x + 1, y - 1, TD); P.set(x, y - 2, TD); P.set(x - 2, y - 2, TD); P.set(x + 2, y - 3, TD); P.set(x, y - 3, TL); }
  const FL = ['#ffffff', '#ffe066', '#ff9ec7', '#a8d8ff'].map(hex);
  for (let i = 0; i < 520 * AREA; i++) { const x = rnd() * WW | 0, y = rnd() * WH | 0, c = FL[rnd() * 4 | 0]; if (Math.abs(y - pathY(x)) < 46) continue;
    for (let k = 0; k < 3; k++) { const fx = x + (rnd() * 9 - 4 | 0), fy = y + (rnd() * 7 - 3 | 0); P.set(fx, fy + 1, TD); P.set(fx, fy, c); } }
  // rocks and bushes (low, drawn into the ground)
  const blob = (cx, cy, r, pal) => { P.disc(cx, cy + 2, r + 2, Math.round(r * .55) + 1, hex('#3a6a2a')); // ground shadow
    P.disc(cx, cy, r + 1, Math.round(r * .75) + 1, pal[0]); P.disc(cx, cy, r, Math.round(r * .75), pal[1]);
    P.disc(cx - Math.round(r * .2), cy - Math.round(r * .2), Math.round(r * .7), Math.round(r * .5), pal[2]);
    P.disc(cx - Math.round(r * .4), cy - Math.round(r * .4), Math.max(1, Math.round(r * .3)), Math.max(1, Math.round(r * .22)), pal[3]); };
  const ROCK = ['#3b3f4a', '#7d8494', '#9aa1ad', '#d0d4da'].map(hex), BUSH = ['#24451f', '#3f7a30', '#559a3b', '#86c95a'].map(hex);
  for (let i = 0; i < 46 * AREA; i++) { const x = 200 + rnd() * (WW - 400) | 0, y = 240 + rnd() * (WH - 500) | 0; if (Math.abs(y - pathY(x)) < 60) continue;
    if (rnd() < .45) blob(x, y, 6 + rnd() * 9 | 0, ROCK);
    else { const r = 9 + rnd() * 8 | 0; blob(x, y, r, BUSH); blob(x + r, y + 2, r - 3, BUSH); blob(x - r + 2, y + 3, r - 4, BUSH);
      if (rnd() < .5) for (let k = 0; k < 4; k++) P.set(x - r + (rnd() * r * 2 | 0), y - (rnd() * r * .6 | 0), FL[rnd() * 3 | 0]); } }
  // tree ring round the edge
  const LEAF = ['#1f3b1c', '#2f6a2a', '#3f8a33', '#5aa844', '#7cc95a'].map(hex), BARK = ['#3a2416', '#5a3a22', '#7a5030'].map(hex);
  const tree = (cx, by) => { const r = 30 + rnd() * 14 | 0, top = by - 40 - r;
    P.disc(cx + 6, by + 2, r - 4, 9, hex('#3d6c2c'));
    for (let y = by - 44; y <= by; y++) for (let x = -7; x <= 7; x++) P.set(cx + x, y, Math.abs(x) >= 6 ? BARK[0] : x < -1 ? BARK[1] : BARK[2]);
    const lobes = [[0, 0, r], [-r * .55, r * .25, r * .7], [r * .55, r * .3, r * .7], [0, -r * .45, r * .7]];
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox | 0, top + oy | 0, rr + 2 | 0, rr * .85 + 2 | 0, LEAF[0]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox | 0, top + oy | 0, rr | 0, rr * .85 | 0, LEAF[1]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox - rr * .2 | 0, top + oy - rr * .2 | 0, rr * .7 | 0, rr * .55 | 0, LEAF[2]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox - rr * .35 | 0, top + oy - rr * .35 | 0, rr * .38 | 0, rr * .3 | 0, LEAF[3]);
    for (let k = 0; k < 10; k++) P.set(cx - r + (rnd() * r * 1.6 | 0), top - r * .6 + (rnd() * r | 0), LEAF[4]); };

  GROUND_PATH = pathY;

}
let GROUND_PATH = null;

// ---------- big props (owner 2026-11-08 "เอาแมพสูงใหญ่ ทำให้สเกลตัวละครดูเล็ก") ----------
// huge trees (2-3x the rogue), boulders and tall ruined stone pillars, pixel sprites at 1 art px = 1 world px,
// drawn back to front with the bodies (a prop covers you when you stand behind it, and fades a little), with a
// solid base you cannot walk through; their ground shadows are baked into the ground picture
const PAL_TREE = [['#1c3519', '#2b6227', '#3c8431', '#58a743', '#86cc5c'], ['#20381a', '#355f22', '#4d812c', '#6ea43a', '#a3cf5a']].map(p => p.map(hex));
const BARK = ['#2e1c11', '#4e321d', '#6e4729', '#8c5e38'].map(hex), OUTL = hex('#1d1a22');
function bigTree(r, th, pal) {
  const W = Math.ceil(r * 2.5) + 16, H = th + Math.ceil(r * 1.9) + 16, P = painter(W, H), cx = W >> 1, by = H - 6, top = by - th - (r * .55 | 0);
  for (let y = by - th - 6; y <= by; y++) {                                      // trunk with a root flare
    const fl = Math.max(0, (y - (by - 14)) * .9), w = 9 + fl | 0;
    for (let x = -w - 1; x <= w + 1; x++) P.set(cx + x, y, Math.abs(x) > w ? OUTL : x < -w * .45 ? BARK[1] : x < w * .1 ? BARK[2] : x < w * .55 ? BARK[3] : BARK[1]);

  for (const m of G.mobs) if (m.hp > 0) ctx.drawImage(SHS, Math.round(m.x - 20), Math.round(m.y - 6));
  ctx.globalAlpha = 1;
  for (const m of G.mobs) if (m.st === 'tell' && m.hp > 0) { ctx.globalAlpha = .5 + .5 * Math.sin(m.t * 30); ctx.drawImage(RING, Math.round(m.x - 35), Math.round(m.y - 12)); ctx.globalAlpha = 1; }
  for (const f of G.fx) if (f.k === 'puff') { ctx.globalAlpha = 1 - f.t / f.life; ctx.fillStyle = f.c; const s = (f.t < f.life * .5 ? 2 : 1) * Math.ceil(U / 2) * 2; ctx.fillRect(Math.round(f.x), Math.round(f.y), s, s); }
  ctx.globalAlpha = 1;
  // dodge after-images
  for (const g of G.ghosts) { const ar = animRow('roll', g.dir), a = .35 * (1 - g.t / .22);   // after-images copy the roll pose
    if (ar) drawCell(ar.img, ar.r, Math.min(ar.n - 1, Math.floor(g.k * ar.n)), g.x, g.y, ar.flip, a); else drawStill(g.dir, g.x, g.y, a); }
  // bodies, back to front
  // big props join the back-to-front pass; one standing in front of the rogue fades so she stays visible
  const inView = q => q.x - q.ox < cx + VW && q.x - q.ox + q.w > cx && q.y - q.oy < cy + VH && q.y - q.oy + q.h > cy;
  const props = PROPS.filter(inView).map(q => ({y: q.y, d: () => {
    const cover = p.y < q.y && p.y > q.y - q.oy + 30 && Math.abs(p.x - q.x) < q.w * .42 && p.y - 60 > q.y - q.oy;
    if (cover) ctx.globalAlpha = .45; ctx.drawImage(q.img, Math.round(q.x - q.ox), Math.round(q.y - q.oy)); ctx.globalAlpha = 1; }}));
  const list = [{y: p.y, d: () => drawPlayer(p)}, ...G.mobs.map(m => ({y: m.y, d: () => drawMob(m)})), ...props].sort((a, b) => a.y - b.y);
  for (const o of list) o.d();
  drawFlies();
  // hit arcs (pixel squares along a curve in front of the rogue) and sparks
  for (const f of G.fx) {
    if (f.k === 'arc') { const a0 = Math.atan2(DV[f.dir][1], DV[f.dir][0]), R = f.big ? 62 : 52, k = f.t / f.life;
      ctx.fillStyle = k < .5 ? '#ffffff' : '#e8f4ff';
      for (let s = -1; s <= 1; s += .06) { const a = a0 + s * 1.2, rr = R * (1 - .25 * Math.abs(s)), w = Math.round((1 - Math.abs(s)) * (f.big ? 4 : 3)) + 1;
        if (Math.abs(s) > .3 + k * 1.2) continue; ctx.fillRect(Math.round(f.x + Math.cos(a) * rr), Math.round(f.y + Math.sin(a) * rr * .6), w, w); } }
    if (f.k === 'spark') { ctx.fillStyle = f.c; ctx.globalAlpha = 1 - f.t / f.life; ctx.fillRect(Math.round(f.x), Math.round(f.y), U + 1, U + 1); ctx.globalAlpha = 1; }
    if (f.k === 'air') { const k = f.t / f.life, im = (f.big ? FXS.airB : FXS.air)[f.dir][k < .5 ? 0 : 1], a = k < .15 ? k / .15 : 1 - (k - .15) / .85;
      glowAt(f.x, f.y, im.width * .6, im.height * .7, FXS.glowArc, a * .7);
      ctx.globalAlpha = a; ctx.drawImage(im, Math.round(f.x - im.width / 2), Math.round(f.y - im.height / 2)); ctx.globalAlpha = 1; }
    if (f.k === 'wave') { const set = (f.big ? FXS.waveB : FXS.wave)[f.dir], im = set[Math.min(3, Math.floor(f.t / f.life * 4))];
      ctx.drawImage(im, Math.round(f.x - im.width / 2), Math.round(f.y - im.height / 2)); }
    if (f.k === 'burst') { const k = f.t / f.life, R = f.big ? 34 : 24; glowAt(f.x, f.y, R, R, FXS.glowHit, (1 - k) * .5); }
    if (f.k === 'burst') { const set = f.big ? FXS.burstB : FXS.burst, im = set[Math.min(set.length - 1, Math.floor(f.t / f.life * set.length))];
      ctx.drawImage(im, Math.round(f.x - im.width / 2), Math.round(f.y - im.height / 2)); }
    if (f.k === 'splat') { const set = FXS['splat_' + f.c], im = set[Math.min(set.length - 1, Math.floor(f.t / f.life * set.length))];
      ctx.drawImage(im, Math.round(f.x - im.width / 2), Math.round(f.y - im.height / 2)); }
  }
  for (const n of G.nums) { const k = n.t / .75; ctx.globalAlpha = k > .7 ? (1 - k) / .3 : 1; drawDigits(n.v, n.x, n.y - k * 26 - (k < .15 ? (1 - k / .15) * -6 : 0), n.big ? U + 1 : U, n.red ? '#ff6060' : n.big ? '#ffe066' : '#ffffff'); ctx.globalAlpha = 1; }
  // screen-space: hit flash, joystick, wave banner
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (G.flash / .09 * .16).toFixed(3) + ')'; ctx.fillRect(0, 0, innerWidth, innerHeight); }
  if (stick.on) { ctx.globalAlpha = .35; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 50, 0, 7); ctx.fill();
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy), k = l > 50 ? 50 / l : 1;
    ctx.globalAlpha = .7; ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 22, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
  if (G.banner) { const k = G.banner.t; ctx.globalAlpha = k < .2 ? k / .2 : k > 1.3 ? (1.6 - k) / .3 : 1;
    ctx.font = '800 30px "Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 6; ctx.strokeStyle = '#1d1a22'; ctx.fillStyle = '#ffe066';
    ctx.strokeText(G.banner.txt, innerWidth / 2, innerHeight * .3); ctx.fillText(G.banner.txt, innerWidth / 2, innerHeight * .3); ctx.globalAlpha = 1; }
}
const hpI = document.querySelector('#hpb>i'), stI = document.querySelector('#stb>i'), scoreEl = document.getElementById('score');
function hud() { if (!G) return; hpI.style.width = G.p.hp + '%'; stI.style.width = G.p.st + '%'; scoreEl.textContent = 'ระลอก ' + G.wave + ' · ล้ม ' + G.kills; }

// ---------- overlay + loop ----------
const ov = document.getElementById('ov');
function showOver() { ov.innerHTML = '<div><h1>แพ้แล้ว</h1><p>ถึงระลอก ' + G.wave + ' · ล้มสไลม์ ' + G.kills + ' ตัว</p><button id="go">เล่นใหม่</button></div>'; ov.style.display = 'flex'; document.getElementById('go').onclick = start; }
function start() {
  ov.style.display = 'none'; newGame();
  if (TOUCH) { try { document.documentElement.requestFullscreen?.().then(() => screen.orientation?.lock?.('landscape')).catch(() => {}); } catch (e) {} }
}
let last = performance.now();
function frame(t) { const dt = Math.min(1 / 30, (t - last) / 1000); last = t; if (G) step(dt); draw(); hud(); requestAnimationFrame(frame); }
load().then(() => { const go = document.getElementById('go'); go.disabled = false; go.textContent = 'เริ่ม'; go.onclick = start; if (TEST) { start(); testSetup(); } requestAnimationFrame(frame); })
  .catch(e => { ov.innerHTML = '<div><h1>โหลดภาพไม่ได้</h1><p>เปิดผ่านตัวรันเกม (เล่นเกม.bat) แล้วเข้า /action.html</p></div>'; console.error(e); });
window.ACT = {get G() { return G; }, start, step, draw, newGame};
</script>
