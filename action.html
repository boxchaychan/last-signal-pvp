<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>นักมีด ต้นแบบ</title>
<style>
:root{--ink:#1d1a22;--hp:#e04848;--st:#e8c440;--panel:rgba(20,18,26,.72)}
html,body{margin:0;height:100%;background:#21331d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;
  font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,system-ui,sans-serif;color:#fff}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;pointer-events:none;display:flex;flex-direction:column;gap:5px}
.bar{width:min(34vw,220px);height:12px;background:#2a2430;border:2px solid var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.bar>i{display:block;height:100%;width:100%;transition:width .08s linear}
#hpb>i{background:var(--hp)} #stb>i{background:var(--st)}
#stb.no{animation:no .25s 2}
@keyframes no{50%{border-color:#ff5050}}
#score{position:fixed;right:max(10px,env(safe-area-inset-right));top:8px;font-size:15px;font-weight:700;text-shadow:0 2px 0 var(--ink);pointer-events:none;text-align:right}
#help{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);font-size:12px;opacity:.8;text-shadow:0 1px 0 var(--ink);pointer-events:none;white-space:nowrap}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:16px;display:none;gap:14px;align-items:flex-end}
.touch #btns{display:flex} .touch #help{display:none}
.bt{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);background:#f0ece0;color:var(--ink);font-size:16px;font-weight:800;
  box-shadow:0 5px 0 #8c8678;display:flex;align-items:center;justify-content:center;touch-action:none}
.bt.small{width:64px;height:64px;font-size:14px;background:#cfe8f0;box-shadow:0 5px 0 #6f8f99}
.bt.on{transform:translateY(4px);box-shadow:0 1px 0 #8c8678}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,14,10,.55)}
#ov>div{background:var(--panel);border:3px solid var(--ink);padding:18px 26px;text-align:center;max-width:86vw}
#ov h1{margin:0 0 8px;font-size:26px} #ov p{margin:6px 0;font-size:14px;line-height:1.5}
#ov button{margin-top:10px;font:inherit;font-size:17px;font-weight:800;padding:8px 26px;border:3px solid var(--ink);background:#f0ece0;color:var(--ink);box-shadow:0 4px 0 #8c8678}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="bar" id="hpb"><i></i></div><div class="bar" id="stb"><i></i></div></div>
<div id="score"></div>
<div id="help">WASD เดิน · คลิกซ้าย / J ตี (หันตามเมาส์) · Space / คลิกขวา / K กลิ้งหลบ</div>
<div id="btns"><div class="bt small" id="bRoll">กลิ้ง</div><div class="bt" id="bAtk">ตี</div></div>
<div id="ov"><div><h1>นักมีด</h1><p>ต้นแบบเกมแอคชัน · ตี 2 ฮิต · กลิ้งหลบ · แถบแรง</p>
<p>สไลม์จะกะพริบ + วงแดงก่อนพุ่งใส่ กลิ้งหลบให้ทัน</p><button id="go">เริ่ม</button></div></div>
<script>
'use strict';
// ---------- setup ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (TOUCH) document.body.classList.add('touch');
const WW = 3600, WH = 2400, MARGIN = {l: 150, r: 150, t: 190, b: 230};   // owner: wider field, camera further out
const DIRS = ['east', 'south-east', 'south', 'south-west', 'west', 'north-west', 'north', 'north-east'];
let S = 1, VW = 960, VH = 540, DPR = 1, U = 2;
function onResize() {
  DPR = window.devicePixelRatio || 1;
  const dw = Math.round(innerWidth * DPR), dh = Math.round(innerHeight * DPR);
  cv.width = dw; cv.height = dh;
  // whole-number pixel size only (no blur): 1 art px = 1 screen px up to ~1900 px tall screens (owner: camera further out)
  S = Math.max(1, Math.floor(dh / 950));
  VW = Math.ceil(dw / S); VH = Math.ceil(dh / S);
  U = Math.max(2, Math.round(DPR * 2 / S));        // size of numbers / sparks so they stay readable on phones
}
addEventListener('resize', onResize); onResize();
const rnd = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

// ---------- pixel painter (background + code sprites) ----------
function painter(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  const P = {c, w, h, d,
    set(px, py, col, a = 255) { px |= 0; py |= 0; if (px < 0 || py < 0 || px >= w || py >= h) return; const i = (py * w + px) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = a; },
    get(px, py) { const i = (py * w + px) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; },
    disc(cx, cy, rx, ry, col) { for (let yy = -ry; yy <= ry; yy++) for (let xx = -rx; xx <= rx; xx++) if ((xx * xx) / (rx * rx + .5) + (yy * yy) / (ry * ry + .5) <= 1) P.set(cx + xx, cy + yy, col); },
    done() { x.putImageData(id, 0, 0); return c; }};
  return P;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
function makeGround() {
  const P = painter(WW, WH);
  const G = ['#5c9f3f', '#6bb048', '#7bbf51', '#8dce5c', '#9edb68'].map(hex);
  // low-frequency noise for patches of lighter / darker grass
  const NW = 26, NH = 18, N = []; for (let i = 0; i < NW * NH; i++) N.push(rnd());
  const noise = (x, y) => { const fx = x / WW * (NW - 1), fy = y / WH * (NH - 1), ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
    const a = N[iy * NW + ix], b = N[iy * NW + ix + 1], c = N[(iy + 1) * NW + ix], e = N[(iy + 1) * NW + ix + 1];
    const s = t => t * t * (3 - 2 * t); return (a + (b - a) * s(tx)) + ((c + (e - c) * s(tx)) - (a + (b - a) * s(tx))) * s(ty); };
  const pathY = x => WH * .5 + 320 * Math.sin(x / 560) + 80 * Math.sin(x / 210 + 1.3);
  const AREA = WW * WH / (2400 * 1600);
  const SAND = ['#b48f58', '#c9a66b', '#d8b97c', '#e6cc94'].map(hex);
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const u = Math.floor(x / 96 + y / 48), v = Math.floor(x / 96 - y / 48), chk = (u + v) & 1;   // diamond tiles
    let t = noise(x, y) * 0.75 + chk * 0.13 + 0.12;
    const dpath = Math.abs(y - pathY(x)), pw = 34 + 8 * Math.sin(x / 57);
    const b = BAYER[(y & 3) * 4 + (x & 3)];
    if (dpath < pw) {                                     // dirt path, lighter in the middle
      const m = 1 - dpath / pw; const k = clamp(Math.floor(m * 3.2 + b * .9), 0, 3); P.set(x, y, SAND[k]);
      continue;
    }
    if (dpath < pw + 3 && b < .6) { P.set(x, y, G[0]); continue; }  // worn grass edge
    P.set(x, y, G[clamp(Math.floor(t * 4 + b * .8), 0, 4)]);
  }
  // pebbles on the path
  for (let i = 0; i < 260 * AREA; i++) { const x = rnd() * WW | 0, y = pathY(x) + (rnd() - .5) * 50 | 0; P.set(x, y, hex('#9c7c4c')); P.set(x + 1, y, hex('#f0dcae')); }
  // grass tufts and flowers
  const TD = hex('#467f30'), TL = hex('#b4e67a');
  for (let i = 0; i < 4200 * AREA; i++) { const x = rnd() * WW | 0, y = rnd() * WH | 0; if (Math.abs(y - pathY(x)) < 46) continue;
    P.set(x, y, TD); P.set(x - 1, y - 1, TD); P.set(x + 1, y - 1, TD); P.set(x, y - 2, TD); P.set(x - 2, y - 2, TD); P.set(x + 2, y - 3, TD); P.set(x, y - 3, TL); }
  const FL = ['#ffffff', '#ffe066', '#ff9ec7', '#a8d8ff'].map(hex);
  for (let i = 0; i < 520 * AREA; i++) { const x = rnd() * WW | 0, y = rnd() * WH | 0, c = FL[rnd() * 4 | 0]; if (Math.abs(y - pathY(x)) < 46) continue;
    for (let k = 0; k < 3; k++) { const fx = x + (rnd() * 9 - 4 | 0), fy = y + (rnd() * 7 - 3 | 0); P.set(fx, fy + 1, TD); P.set(fx, fy, c); } }
  // rocks and bushes (low, drawn into the ground)
  const blob = (cx, cy, r, pal) => { P.disc(cx, cy + 2, r + 2, Math.round(r * .55) + 1, hex('#3a6a2a')); // ground shadow
    P.disc(cx, cy, r + 1, Math.round(r * .75) + 1, pal[0]); P.disc(cx, cy, r, Math.round(r * .75), pal[1]);
    P.disc(cx - Math.round(r * .2), cy - Math.round(r * .2), Math.round(r * .7), Math.round(r * .5), pal[2]);
    P.disc(cx - Math.round(r * .4), cy - Math.round(r * .4), Math.max(1, Math.round(r * .3)), Math.max(1, Math.round(r * .22)), pal[3]); };
  const ROCK = ['#3b3f4a', '#7d8494', '#9aa1ad', '#d0d4da'].map(hex), BUSH = ['#24451f', '#3f7a30', '#559a3b', '#86c95a'].map(hex);
  for (let i = 0; i < 46 * AREA; i++) { const x = 200 + rnd() * (WW - 400) | 0, y = 240 + rnd() * (WH - 500) | 0; if (Math.abs(y - pathY(x)) < 60) continue;
    if (rnd() < .45) blob(x, y, 6 + rnd() * 9 | 0, ROCK);
    else { const r = 9 + rnd() * 8 | 0; blob(x, y, r, BUSH); blob(x + r, y + 2, r - 3, BUSH); blob(x - r + 2, y + 3, r - 4, BUSH);
      if (rnd() < .5) for (let k = 0; k < 4; k++) P.set(x - r + (rnd() * r * 2 | 0), y - (rnd() * r * .6 | 0), FL[rnd() * 3 | 0]); } }
  // tree ring round the edge
  const LEAF = ['#1f3b1c', '#2f6a2a', '#3f8a33', '#5aa844', '#7cc95a'].map(hex), BARK = ['#3a2416', '#5a3a22', '#7a5030'].map(hex);
  const tree = (cx, by) => { const r = 30 + rnd() * 14 | 0, top = by - 40 - r;
    P.disc(cx + 6, by + 2, r - 4, 9, hex('#3d6c2c'));
    for (let y = by - 44; y <= by; y++) for (let x = -7; x <= 7; x++) P.set(cx + x, y, Math.abs(x) >= 6 ? BARK[0] : x < -1 ? BARK[1] : BARK[2]);
    const lobes = [[0, 0, r], [-r * .55, r * .25, r * .7], [r * .55, r * .3, r * .7], [0, -r * .45, r * .7]];
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox | 0, top + oy | 0, rr + 2 | 0, rr * .85 + 2 | 0, LEAF[0]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox | 0, top + oy | 0, rr | 0, rr * .85 | 0, LEAF[1]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox - rr * .2 | 0, top + oy - rr * .2 | 0, rr * .7 | 0, rr * .55 | 0, LEAF[2]);
    for (const [ox, oy, rr] of lobes) P.disc(cx + ox - rr * .35 | 0, top + oy - rr * .35 | 0, rr * .38 | 0, rr * .3 | 0, LEAF[3]);
    for (let k = 0; k < 10; k++) P.set(cx - r + (rnd() * r * 1.6 | 0), top - r * .6 + (rnd() * r | 0), LEAF[4]); };
  const T = [];
  for (let x = 30; x < WW; x += 70 + rnd() * 40) { T.push([x, 110 + rnd() * 40]); T.push([x + 20, WH - 20 - rnd() * 30]); }
  for (let y = 160; y < WH - 80; y += 70 + rnd() * 40) { T.push([40 + rnd() * 50, y]); T.push([WW - 40 - rnd() * 50, y]); }
  T.sort((a, b) => a[1] - b[1]).forEach(([x, y]) => tree(x | 0, y | 0));
  return P.done();
}

// slime sprites: frames normal / squash / stretch, plus white silhouettes for the hit flash
function makeSlime(base) {
  const [dk, md, lt, hl] = base.map(hex), out = [], white = [];
  for (const [w, h] of [[40, 30], [48, 23], [34, 37]]) {
    const P = painter(w + 2, h + 2), a = w / 2;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const dx = x + .5 - a, dy = y + .5 - h; if ((dx * dx) / (a * a) + (dy * dy) / (h * h) > 1) continue;
      if (y > h - 3 && Math.abs(dx) > a - 3) continue;
      const nx = dx / a, ny = (y + .5) / h, sh = -nx * .45 + (1 - ny) * .8;          // light from the top left
      P.set(x + 1, y + 1, sh > .55 ? lt : sh > .05 ? md : dk);
    }
    // outline
    const src = P.d.slice();
    for (let y = 0; y < h + 2; y++) for (let x = 0; x < w + 2; x++) { const i = (y * (w + 2) + x) * 4; if (src[i + 3]) continue;
      const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([ox, oy]) => { const xx = x + ox, yy = y + oy; return xx >= 0 && yy >= 0 && xx < w + 2 && yy < h + 2 && src[(yy * (w + 2) + xx) * 4 + 3]; });
      if (n) P.set(x, y, [29, 26, 34]); }
    P.disc(Math.round(a * .55), Math.round(h * .35), 2, 1, hl);                      // shine
    const ey = Math.round(h * .55), ex = Math.round(a * .38);                        // eyes
    for (const s of [-1, 1]) { const cx = Math.round(a + s * ex); for (let yy = 0; yy < 4; yy++) for (let xx = 0; xx < 3; xx++) P.set(cx + xx - 1, ey + yy, [29, 26, 34]); P.set(cx - 1, ey, [255, 255, 255]); }
    const c = P.done(); out.push(c);
    const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height; const wx = wc.getContext('2d');
    wx.drawImage(c, 0, 0); wx.globalCompositeOperation = 'source-in'; wx.fillStyle = '#fff'; wx.fillRect(0, 0, c.width, c.height); white.push(wc);
  }
  return {f: out, w: white};
}
function ellipseSprite(w, h, col, ring) {
  const P = painter(w, h), c = hex(col);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const dx = (x + .5 - w / 2) / (w / 2), dy = (y + .5 - h / 2) / (h / 2), r = dx * dx + dy * dy;
    if (r <= 1 && (!ring || r > .62)) P.set(x, y, c, ring ? 255 : 255); }
  return P.done();
}
// 3x5 pixel digits for damage numbers
const DIG = ['111101101101111', '010110010010111', '111001111100111', '111001111001111', '101101111001001', '111100111001111', '111100111101111', '111001001010010', '111101111101111', '111101111001111'];

// ---------- assets ----------
const IMG = new Image(); let META = null, BG = null;
const SL = {}, SHP = ellipseSprite(46, 12, '#000000'), SHS = ellipseSprite(40, 10, '#000000'), RING = ellipseSprite(70, 24, '#ff3b3b', 1);
async function load() {
  const [m] = await Promise.all([fetch('art/action/rogue.json').then(r => r.json()), new Promise((ok, no) => { IMG.onload = ok; IMG.onerror = no; IMG.src = 'art/action/rogue.png'; })]);
  META = m; BG = makeGround();
  SL.green = makeSlime(['#2f6f2a', '#56b045', '#8fe070', '#e8ffd8']);
  SL.blue = makeSlime(['#284a8a', '#4a7fd0', '#86b8f4', '#eef6ff']);
}

// ---------- state ----------
let G;
function newGame() {
  G = {t: 0, hs: 0, shake: 0, wave: 0, kills: 0, over: false, fx: [], nums: [], ghosts: [], mobs: [], next: 1.2,
    p: {x: WW / 2, y: WH / 2 + 60, dir: 2, hp: 100, st: 100, stT: 0, inv: 0, state: 'idle', a: null, roll: null, step: 0, bob: 0, buf: null}};
  cam.x = G.p.x - VW / 2; cam.y = G.p.y - VH / 2;
}
const cam = {x: 0, y: 0};
// attack: every direction has its own frames; the swing frames (hits) come from the sheet json (widest frames)
const ATK = {base: 42, hitMs: 85, preMs: 34, cost: 15, push: 8};
function atkPlan(dir) {
  const ar = animRow('attack', dir); if (!ar) return null;
  const hits = ar.hits && ar.hits.length ? ar.hits : [4, 9], n = hits.length;
  const dmg = n === 1 ? [26] : n === 2 ? [12, 20] : hits.map((_, i) => i === n - 1 ? 15 : 10);
  const ms = []; for (let f = 0; f < ar.n; f++) ms.push(hits.includes(f) ? ATK.hitMs : hits.includes(f + 1) ? ATK.preMs : ATK.base);
  return {ar, hits, dmg, ms, first: hits[0], last: hits[n - 1]};
}
const ROLL = {t: .32, sp: 430, cost: 26};
function dirOf(dx, dy) { return ((Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) % 8) + 8) % 8; }
const DV = [...Array(8)].map((_, i) => [Math.cos(i * Math.PI / 4), Math.sin(i * Math.PI / 4)]);
function animRow(name, dir) {
  const A = META.anims[name] || {}, R = (v, flip) => ({r: v.r, n: v.n, hits: v.hits, flip: flip !== !!v.flip});
  if (A[DIRS[dir]]) return R(A[DIRS[dir]], false);
  const m = (12 - dir) % 8; if (A[DIRS[m]]) return R(A[DIRS[m]], true);        // mirror (weapon swaps hands)
  for (let k = 1; k < 5; k++) for (const s of [1, -1]) { const d = (dir + s * k + 8) % 8; if (A[DIRS[d]]) return R(A[DIRS[d]], false); }
  return null;
}

// ---------- input ----------
const keys = {}, stick = {id: null, ox: 0, oy: 0, x: 0, y: 0, on: false}, mouse = {x: 0, y: 0, used: false};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyJ') wantAtk(); if (e.code === 'Space' || e.code === 'KeyK') { wantRoll(); e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') { if (e.clientX < innerWidth * .55 && stick.id === null) { stick.id = e.pointerId; stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY; stick.on = true; } return; }
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.used = true;
  if (e.button === 0) wantAtk(); else if (e.button === 2) wantRoll();
});
addEventListener('pointermove', e => { if (e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; } else if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.used = true; } });
const endStick = e => { if (e.pointerId === stick.id) { stick.id = null; stick.on = false; } };
addEventListener('pointerup', endStick); addEventListener('pointercancel', endStick);
for (const [id, fn] of [['bAtk', () => wantAtk()], ['bRoll', () => wantRoll()]]) {
  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.classList.add('on'); fn(); });
  b.addEventListener('pointerup', () => b.classList.remove('on')); b.addEventListener('pointerleave', () => b.classList.remove('on'));
}
function moveInput() {
  let x = 0, y = 0;
  if (keys.KeyA || keys.ArrowLeft) x--; if (keys.KeyD || keys.ArrowRight) x++; if (keys.KeyW || keys.ArrowUp) y--; if (keys.KeyS || keys.ArrowDown) y++;
  if (stick.on) { const dx = stick.x - stick.ox, dy = stick.y - stick.oy, l = Math.hypot(dx, dy); if (l > 8) { x = dx / Math.max(l, 50); y = dy / Math.max(l, 50); } }
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } return [x, y];
}
function aimDir() {
  const p = G.p;
  if (!TOUCH && mouse.used) { const wx = mouse.x * DPR / S + cam.x, wy = mouse.y * DPR / S + cam.y; return dirOf(wx - p.x, wy - (p.y - 50)); }
  let best = null, bd = 230; for (const m of G.mobs) { const d = Math.hypot(m.x - p.x, m.y - p.y); if (d < bd && m.hp > 0) { bd = d; best = m; } }
  if (best) return dirOf(best.x - p.x, best.y - p.y);
  const [mx, my] = moveInput(); return (mx || my) ? dirOf(mx, my) : p.dir;
}
function noStamina() { const b = document.getElementById('stb'); b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); }
function wantAtk() { if (!G || G.over) return; G.p.buf = 'atk'; G.p.bufT = .3; }
function wantRoll() { if (!G || G.over) return; G.p.buf = 'roll'; G.p.bufT = .3; }

// ---------- rules ----------
function startAtk(p) {
  if (p.st < 1) { noStamina(); return false; }
  const d = aimDir(), plan = atkPlan(d); if (!plan) return false;
  p.st = Math.max(0, p.st - ATK.cost); p.stT = .6;
  p.dir = d; p.state = 'atk'; p.a = {i: 0, t: 0, done: {}, plan}; return true;
}
function startRoll(p) {
  if (p.st < ROLL.cost * .5) { noStamina(); return false; }
  p.st = Math.max(0, p.st - ROLL.cost); p.stT = .6;
  const [mx, my] = moveInput(); const d = (mx || my) ? dirOf(mx, my) : p.dir; p.dir = d;

function puff(x, y, c) { G.fx.push({k: 'puff', x, y, vx: (rnd() - .5) * 40, vy: -10 - rnd() * 20, t: 0, life: .35 + rnd() * .2, c}); }
function spark(x, y, n, c) { for (let k = 0; k < n; k++) { const a = rnd() * Math.PI * 2, s = 80 + rnd() * 160; G.fx.push({k: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: .18 + rnd() * .12, c}); } }

function hurtPlayer(dmg, fromX, fromY) {

}
function spawnWave() {
  G.wave++; const n = 3 + G.wave * 2, far = Math.max(560, Math.min(VW, VH) * .55);
  for (let i = 0; i < n; i++) {
    let x, y, k = 0; do { x = MARGIN.l + rnd() * (WW - MARGIN.l - MARGIN.r); y = MARGIN.t + rnd() * (WH - MARGIN.t - MARGIN.b); } while (Math.hypot(x - G.p.x, y - G.p.y) < far && ++k < 50);

function stepPlayer(dt) {

function stepMobs(dt) {

const TEST = new URLSearchParams(location.search).get('test');   // ?test=atk: screenshot helper, freezes on the second hit

function step(dt) {

// ---------- drawing ----------
function drawCell(r, c, x, y, flip, alpha) {
  const C = META.cell; x = Math.round(x); y = Math.round(y);

}
function drawPlayer(p) {
  if (p.inv > 0 && p.state !== 'roll' && ((G.t * 14) | 0) % 2) return;     // blink while hurt
  if (p.state === 'atk' && p.a) { const ar = p.a.plan.ar; drawCell(ar.r, Math.min(p.a.i, ar.n - 1), p.x, p.y, ar.flip); return; }
  let y = p.y; if (p.state === 'move' && p.bob) y -= 2;
  if (p.state === 'roll' && p.roll) y -= Math.round(Math.sin(p.roll.t / ROLL.t * Math.PI) * 10);

}

  cam.x = clamp(cam.x, 0, Math.max(0, WW - VW)); cam.y = clamp(cam.y, 0, Math.max(0, WH - VH));

const hpI = document.querySelector('#hpb>i'), stI = document.querySelector('#stb>i'), scoreEl = document.getElementById('score');

load().then(() => { document.getElementById('go').onclick = start; if (TEST) { start(); testSetup(); } requestAnimationFrame(frame); })
