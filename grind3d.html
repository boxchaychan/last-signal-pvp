function addFx(o, life, upd, end) { scene.add(o); const f = { o, t: 0, life, upd, end }; FX.push(f); return f; }
function updFx(dt) { for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.t += dt; const k = f.t / f.life; if (k >= 1 || (f.upd && f.upd(f.o, Math.min(1, k), dt, f) === true)) { scene.remove(f.o); if (f.o.material) f.o.material.dispose(); f.end && f.end(); FX.splice(i, 1); } } }

// ---------- the huntress: the owner's Tripo model (split into parts in Tripo: body / bow / string), re-bound onto the KayKit skeleton

  const m = new THREE.MeshStandardMaterial({ map: src.map || null, normalMap: src.normalMap || null, roughnessMap: rmM, metalnessMap: scene.environment ? rmM : null, roughness: rmM ? 1 : .72, metalness: rmM && scene.environment ? 1 : 0, envMapIntensity: +(Q.get('envi') || .55) });

// Quaternius Ultimate Stylized Nature (CC0), light copies from tools/blender/nature_pack.py: no images inside, textures in art/tribe3d/nature/tex/
const NAT_FLAT = { MapleTree_Leaves: 0xf08a3c, BirchTree_Leaves: 0xf2cf4a, NormalTree_Leaves: 0x7cc24e, PineTree_Leaves: 0x3f9a6a, Bush_Leaves: 0x6fb848, Grass: 0x9ad860 }, NMAT = {}, TL = new THREE.TextureLoader();

function natMat(mn) {
  if (NMAT[mn]) return NMAT[mn];
  const card = !/Bark|Grass/.test(mn), flat = NAT_FLAT[mn], map = NAT_TEX.includes(mn) ? TL.load(`art/tribe3d/nature/tex/${mn}.png`) : null;
  if (map) { map.encoding = THREE.sRGBEncoding; map.anisotropy = 4; }

      if (/Tree_Leaves/.test(mn)) { geo.computeBoundingBox(); const c = geo.boundingBox.getCenter(new V3()), sz = geo.boundingBox.getSize(new V3()), Pp = geo.attributes.position, N = geo.attributes.normal, v = new V3(); c.y -= sz.y * .4;
