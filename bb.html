<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babies & Beasts · สัญญาณสุดท้าย</title>
<link rel="manifest" href="bb.webmanifest">
<meta name="theme-color" content="#0b0d22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Babies & Beasts">
<link rel="apple-touch-icon" href="art/bb/icon-192.png">
<link rel="icon" type="image/png" href="art/bb/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&display=swap">
<style>
/* Babies & Beasts: 5-player elimination tower defense (vs 4 bots for now). Board is a 960x540 canvas world; HUD hugs the edges. */
:root{--ink:#f4efe2;--dim:#a9b3c6;--pnl:rgba(16,18,30,.82);--edge:#3b4466;--gold:#ffd75a;--hp:#ff6a6a;--font:"Kanit",Tahoma,sans-serif}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0d0f1a;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;inset:0;display:block;touch-action:none;image-rendering:pixelated}
.hud{position:fixed;z-index:5}
button{font-family:var(--font);cursor:pointer;touch-action:manipulation}
#top{left:calc(env(safe-area-inset-left,0px) + 8px);top:calc(env(safe-area-inset-top,0px) + 6px);display:flex;gap:6px;align-items:center;pointer-events:none;flex-wrap:wrap;max-width:60vw}
.pill{background:var(--pnl);border:2px solid var(--edge);border-radius:12px;padding:2px 10px;font-weight:600;font-size:14px;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
#viewing{background:#4a2a6a;border-color:#b77bff}
#wv{position:relative;overflow:hidden}
#bossB{align-self:center;width:250px;background:var(--pnl);border:2px solid #ff4a6a;border-radius:12px;padding:3px 9px 6px;font-size:12.5px;font-weight:700;color:#ffe0e0;white-space:nowrap;overflow:hidden}
#bossB i{display:block;height:9px;border-radius:5px;background:#3a1020;overflow:hidden;margin-top:2px}
#bossB u{display:block;height:100%;width:100%;background:#ff3a5a;transition:width .2s}
#bossB.sh{border-color:#8ab8ff}#bossB.sh u{background:#8ab8ff}#bossB.rg{border-color:#ff2a2a;box-shadow:0 0 10px #ff2a2a}
/* the HUD grows on big screens (--hs set in onResize; 1 on phones) */
#top{transform-origin:0 0;transform:scale(var(--hs,1))}#side{transform-origin:100% 0;transform:scale(var(--hs,1))}#bar{transform-origin:0 100%;transform:scale(var(--hs,1))}
#wv i{position:absolute;left:0;bottom:0;height:3px;border-radius:2px}
#side{right:calc(env(safe-area-inset-right,0px) + 6px);top:calc(env(safe-area-inset-top,0px) + 6px);width:148px;display:flex;flex-direction:column;gap:5px}
.op{display:block;width:100%;text-align:left;background:var(--pnl);border:2px solid var(--edge);border-radius:10px;padding:4px 7px;color:var(--ink)}
.op.on{border-color:var(--gold)}
.op.me{border-color:#5fd35f}
.op.out{opacity:.45}
.op{display:grid;grid-template-columns:auto 1fr;column-gap:6px;align-items:center}
.op canvas{grid-row:span 3;width:28px;height:28px;border-radius:7px;background:#232a4a;image-rendering:pixelated}
.op b{display:block;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op i{display:block;height:7px;border-radius:4px;background:#2a2f44;margin-top:3px;overflow:hidden}
.op i u{display:block;height:100%;background:var(--hp)}
.op small{font-size:10.5px;color:var(--dim)}
#bar{left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);display:flex;gap:6px;align-items:flex-end}
.bt{min-width:84px;height:52px;border-radius:14px;border:3px solid #26304d;background:linear-gradient(#5f86c2,#34507e);color:#fff;font-size:14px;font-weight:700;line-height:1.1;padding:2px 8px;box-shadow:0 3px 0 #0a1020}
.bt small{display:block;font-size:11.5px;font-weight:600;color:#ffe9a0}
.bt.sum{background:linear-gradient(#ffd75a,#e0a010);color:#3a2200;min-width:104px}
.bt.sum small{color:#5a3a00}
.bt.wh{background:linear-gradient(#b77bff,#6a3ab8)}
.bt.poor{filter:grayscale(.7) brightness(.8)}
.bt.hint{animation:hint 1s ease-in-out infinite}@keyframes hint{50%{transform:translateY(-4px);box-shadow:0 0 0 4px #fff6b0,0 3px 0 #0a1020}}
.bt.sm{min-width:44px;font-size:13px}
#pop{left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 64px * var(--hs,1));transform:translateX(-50%) scale(var(--hs,1));transform-origin:50% 100%;width:min(420px,calc(100vw - 180px));background:rgba(16,18,30,.94);border:2px solid var(--edge);border-radius:14px;padding:8px 10px;font-size:13px}
#pop h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:6px}
#pop .tier{font-size:11px;border-radius:6px;padding:0 6px;color:#111;font-weight:700}
#pop ul{margin:2px 0 6px;padding-left:16px;line-height:1.35}
#pop li.off{color:#6a7290}
#pop .row{display:flex;gap:6px;flex-wrap:wrap}
#pop .row button{flex:1;min-width:90px;height:40px;border-radius:10px;border:2px solid #26304d;background:#34507e;color:#fff;font-weight:700;font-size:13px}
#pop .row button.go{background:linear-gradient(#ffd75a,#e0a010);color:#3a2200}
#pop .row button:disabled{opacity:.4}
#pop .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--dim);font-size:18px}
.screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#2a2050,#0d0f1a 70%);overflow:auto}
.card{width:min(620px,calc(100vw - 32px));background:rgba(16,18,30,.9);border:2px solid var(--edge);border-radius:18px;padding:16px 18px;box-sizing:border-box;margin:12px}
.card h1{margin:0;font-size:clamp(26px,6vw,40px);line-height:1.05;color:var(--gold)}
.card h1 span{display:block;font-size:.5em;color:#bfe8ff}
.card p{margin:8px 0;color:#dfe4f2;font-size:14px;line-height:1.5}
.card ul{margin:6px 0;padding-left:18px;font-size:13.5px;line-height:1.5;color:#cfd6ea}
.big{display:block;width:100%;height:54px;margin-top:10px;border-radius:14px;border:3px solid #26304d;background:linear-gradient(#ffd75a,#e0a010);color:#3a2200;font-size:20px;font-weight:700}
.big.ghost{background:#34507e;color:#fff}
.kids{display:flex;gap:4px;justify-content:center;margin:6px 0}
.kids canvas{width:52px;height:68px;image-rendering:pixelated}
#banner{left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-weight:700;font-size:clamp(22px,5vw,38px);color:var(--gold);text-shadow:0 3px 0 #000,0 0 12px #000;opacity:0;transition:opacity .25s}
#banner small{display:block;font-size:.5em;color:#fff}
#banner.show{opacity:1}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:grid;position:fixed;inset:0;z-index:50;place-items:center;background:#0d0f1a;color:var(--gold);font-size:20px;text-align:center;padding:20px}}
@media (max-height:500px){.card{padding:10px 14px}.card h1{font-size:26px}.card p,.card ul{font-size:12px;line-height:1.4;margin:4px 0}.kids canvas{width:36px;height:48px}.big{height:44px;font-size:17px;margin-top:6px}}
@media (max-height:420px){.bt{height:46px;min-width:74px;font-size:13px}.bt.sum{min-width:92px}#side{width:128px}.op b{font-size:11.5px}.pill{font-size:12.5px;padding:1px 8px}}
/* ---------- lobby (full-screen pixel night scene, UI hugs the corners) ---------- */
.screen.lob{display:block;background:#0b0d22;overflow:hidden}
#lcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.lb{position:absolute;z-index:2}
.logo{left:calc(env(safe-area-inset-left,0px) + 14px);top:8px;line-height:1;pointer-events:none}
.logo b{display:block;font-size:clamp(28px,8.6vh,76px);font-weight:700;color:#ffd75a;letter-spacing:.5px;-webkit-text-stroke:2px #3a1d00;paint-order:stroke fill;text-shadow:0 4px 0 #3a1d00,0 0 18px rgba(255,190,80,.45)}
.logo b i{font-style:normal;color:#ff9a5a}
.logo span{display:inline-block;margin-top:5px;font-size:clamp(14px,4.2vh,34px);font-weight:700;color:#bfe8ff;background:rgba(10,14,40,.66);border:2px solid #3b4a8a;border-radius:10px;padding:1px 10px;text-shadow:0 2px 0 #000}
.prof{right:calc(env(safe-area-inset-right,0px) + 12px);top:8px;display:flex;align-items:center;gap:8px;background:rgba(14,16,34,.84);border:2px solid #3b4466;border-radius:14px;padding:4px 12px 4px 4px;color:var(--ink);text-align:left;max-width:46vw}
.prof canvas{width:clamp(36px,11vh,70px);height:clamp(36px,11vh,70px);border-radius:10px;background:#232a4a;image-rendering:pixelated;flex:none}
.prof b{display:block;font-size:clamp(13px,3.8vh,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prof small{display:block;font-size:clamp(11px,3vh,17px);color:var(--dim);white-space:nowrap}
.lmenu{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:10px;display:flex;gap:8px}
.lbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(72px,20vh,132px);height:clamp(58px,16.5vh,108px);border-radius:16px;border:3px solid #1c2440;background:linear-gradient(#4a68aa,#28396a);color:#fff;font-size:clamp(20px,6vh,40px);box-shadow:0 4px 0 #0a1020;line-height:1;padding:0}
.lbtn span{font-size:clamp(11px,3.3vh,19px);font-weight:700;margin-top:4px}
.lbtn:active,.play:active,.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1020}
.lplay{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:10px;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.mapsel{display:flex;align-items:center;gap:4px;background:rgba(14,16,34,.84);border:2px solid #3b4466;border-radius:12px;padding:3px}
.mapsel button{width:clamp(30px,9vh,48px);height:clamp(30px,9vh,48px);border-radius:9px;border:0;background:#34507e;color:#fff;font-size:clamp(13px,4vh,22px);flex:none}
.mapsel span{flex:1;text-align:center;line-height:1.05}
.mapsel small{display:block;font-size:clamp(10px,2.8vh,15px);color:var(--dim)}
.mapsel b{font-size:clamp(13px,3.9vh,22px);white-space:nowrap}
.play{width:clamp(196px,56vh,360px);height:clamp(62px,18vh,124px);border-radius:20px;border:4px solid #4a2a00;background:linear-gradient(#ffe27a,#f0a818 62%,#d88a08);color:#3a2200;font-size:clamp(28px,9vh,60px);font-weight:700;line-height:1;box-shadow:0 6px 0 #4a2a00;animation:pulse 1.6s ease-in-out infinite;padding:0}
.play small{display:block;font-size:clamp(11px,3.2vh,19px);font-weight:600;color:#5a3a00;margin-top:3px}
@keyframes pulse{50%{transform:scale(1.035);filter:brightness(1.08)}}
.ltip{left:50%;top:calc(env(safe-area-inset-top,0px) + 4px);transform:translateX(-50%);font-size:clamp(10px,2.8vh,15px);color:#c9d3ff;opacity:.75;pointer-events:none;white-space:nowrap;display:none}
/* modal windows (kids, how to play, rename, pause) */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(4,6,16,.66)}
.mbox{width:min(860px,94vw);max-height:92vh;display:flex;flex-direction:column;background:linear-gradient(#1b2040,#12152c);border:3px solid #3b4a8a;border-radius:18px;box-shadow:0 10px 0 #070914;overflow:hidden}
.mbox.sm{width:min(420px,92vw)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;background:#232a52;border-bottom:2px solid #3b4a8a}
.mhead b{font-size:clamp(15px,4.4vh,24px);color:var(--gold)}
.mx{width:36px;height:36px;border-radius:10px;border:0;background:#3a2a4a;color:#fff;font-size:20px}
.mbody{padding:8px 12px 12px;overflow:auto;font-size:clamp(12px,3.4vh,16px);line-height:1.45;color:#dfe4f2}
.mbody h4{margin:6px 0 2px;color:#ffd75a;font-size:1.08em}
.mbody ul{margin:2px 0 4px;padding-left:18px}
.mbody p{margin:4px 0}
.mbtn{height:clamp(40px,11vh,56px);border-radius:12px;border:3px solid #1c2440;background:linear-gradient(#4a68aa,#28396a);color:#fff;font-weight:700;font-size:clamp(14px,4vh,20px);box-shadow:0 3px 0 #0a1020;padding:0 14px}
.mbtn.gold{background:linear-gradient(#ffe27a,#e0a010);color:#3a2200;border-color:#4a2a00}
.mbtn.red{background:linear-gradient(#e0605a,#9a2a2a)}
.mbtn:disabled{opacity:.42;filter:grayscale(.7);box-shadow:none}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mrow .mbtn{flex:1}
.nm{width:100%;box-sizing:border-box;height:44px;border-radius:10px;border:2px solid #3b4a8a;background:#0d1024;color:#fff;font:600 18px var(--font);padding:0 10px}
/* kids collection */
.col{display:grid;grid-template-columns:clamp(96px,30vh,160px) 1fr;gap:10px}
.ctabs{display:flex;flex-direction:column;gap:4px}
.ctab{display:flex;align-items:center;gap:6px;height:clamp(38px,10.5vh,56px);border-radius:10px;border:2px solid #2c355e;background:#1a1f3c;color:#fff;font-weight:700;font-size:clamp(12px,3.4vh,17px);padding:0 6px;text-align:left}
.ctab canvas{width:clamp(28px,8vh,42px);height:clamp(28px,8vh,42px);image-rendering:pixelated;flex:none}
.ctab.on{border-color:var(--gold);background:#2b2a4a}
.cdet{display:grid;grid-template-columns:clamp(96px,30vh,170px) 1fr;gap:4px 12px;align-items:start}
.cbig{width:100%;aspect-ratio:4/5;image-rendering:pixelated;background:radial-gradient(circle at 50% 70%,#2f3870,#151a36 70%);border-radius:12px}
.cinfo h4{margin:0;font-size:clamp(17px,5vh,26px);color:#fff}
.cinfo h4 small{font-size:.6em;color:var(--dim);font-weight:600}
.cinfo .rng{color:var(--dim);font-size:.92em}
.cinfo .rng b{color:#ffd75a;letter-spacing:1px}
.cinfo ul{list-style:none;padding:0;margin:4px 0}
.cinfo li{padding:2px 0;border-bottom:1px dashed #2c355e}
.cinfo li i{font-style:normal;display:inline-block;min-width:4.6em;border-radius:6px;padding:0 5px;margin-right:4px;color:#111;font-weight:700;font-size:.85em;text-align:center}
.ctiers{grid-column:1/-1;display:flex;gap:6px;margin-top:6px}
.ctier{flex:1;text-align:center;font-size:clamp(10px,2.8vh,14px);border-radius:10px;background:#151a36;border:2px solid #2c355e;padding:3px 2px}
.ctier canvas{width:100%;max-width:min(64px,12vh);aspect-ratio:4/5;image-rendering:pixelated;display:block;margin:0 auto}
.ctier.miss canvas{opacity:.28;filter:grayscale(1)}
.ctier small{display:block;color:var(--dim);font-size:.9em}
/* matchmaking */
#mm{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:rgba(4,6,16,.72)}
.mmbox{text-align:center;width:min(900px,96vw)}
.mmbox h2{margin:0 0 10px;font-size:clamp(20px,6.5vh,40px);color:var(--gold);text-shadow:0 3px 0 #000}
.mmrow{display:flex;gap:8px;justify-content:center}
.mms{flex:1;max-width:160px;background:linear-gradient(#1f2550,#141833);border:3px solid #2c355e;border-radius:14px;padding:6px 4px;transition:transform .2s,border-color .2s}
.mms canvas{width:clamp(44px,15vh,84px);height:clamp(44px,15vh,84px);image-rendering:pixelated;border-radius:10px;background:#232a4a}
.mms b{display:block;font-size:clamp(11px,3.4vh,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mms small{display:block;font-size:clamp(10px,3vh,15px);color:var(--dim)}
.mms.ok{border-color:#5fd35f;transform:translateY(-4px)}
.mms.ok small{color:#7fe08a}
.mms.me{border-color:var(--gold)}
.mms.wait canvas{opacity:.25}
#cd{font-size:clamp(60px,26vh,200px);font-weight:700;color:#fff;text-shadow:0 6px 0 #000,0 0 30px #ffd75a;height:1.1em;line-height:1.1}
/* in-game pause button */
#bPause{pointer-events:auto;cursor:pointer;color:var(--ink);padding:2px 9px}
/* end screen */
#end{background:rgba(6,8,20,.74)}
.endc{text-align:center}
.est .mvp{display:flex;align-items:center;gap:6px;text-align:left;border-color:#ffd75a}
.est .mvp canvas{width:clamp(30px,9vh,44px);height:clamp(30px,9vh,44px);image-rendering:pixelated;border-radius:8px;background:#232a4a}
.est .mvp b{font-size:clamp(13px,3.8vh,18px);color:#ffd75a}
.ms{display:flex;gap:10px;align-items:center;background:#151a36;border:2px solid #2c355e;border-radius:12px;padding:6px 10px;margin:6px 0}
.ms>div{flex:1}.ms.ok{border-color:#ffd75a}.ms.got{opacity:.55}.ms .kbar{margin-top:4px}.ms .mbtn{min-width:96px}
.gain{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:2px 0 4px;font-size:clamp(11px,3.2vh,15px);color:var(--dim)}
.gain span{display:inline-flex;align-items:center;gap:3px;background:#151a36;border:2px solid #2c355e;border-radius:10px;padding:1px 8px 1px 2px;color:#ffd75a;font-weight:700}
.gain canvas{width:24px;height:24px;image-rendering:pixelated;border-radius:6px}
.gain em{font-style:normal;color:#7fe08a;font-weight:700}
.klv{display:flex;align-items:center;gap:8px;margin:4px 0}
.klv>b{font-size:1.25em;color:#ffd75a;min-width:3.4em}
.kbar{flex:1;position:relative;height:22px;border-radius:11px;background:#0d1024;border:2px solid #2c355e;overflow:hidden}
.kbar u{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4a8ac8,#7fd0ff)}
.kbar span{position:relative;display:block;text-align:center;font-size:.85em;line-height:18px;color:#fff;text-shadow:0 1px 0 #000}
.klv .mbtn{height:clamp(34px,9vh,46px);padding:0 10px;font-size:clamp(12px,3.4vh,16px)}
.perks{grid-column:1/-1;margin-top:6px}
.pk{padding:3px 8px;border-radius:8px;margin:2px 0;background:#151a36;color:var(--dim)}
.pk.on{color:#fff;background:#1d2a4a}
.pk.major{border-left:4px solid #ffd75a}
.ctab em{font-style:normal;font-size:.72em;color:#ffd75a;margin-left:5px;font-weight:700}
.pk b{color:#ffd75a;display:inline-block;min-width:3.6em}
.lvmsg{background:linear-gradient(90deg,#3a2a00,#5a4200);border:2px solid #ffd75a;color:#ffe9a0;border-radius:10px;padding:4px 10px;margin-bottom:6px;font-weight:700;text-align:center}
.lbtn{position:relative}
.lbtn.dot::after{content:'';position:absolute;top:6px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff4a5a;box-shadow:0 0 0 2px #1c2440}
.ctab i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff4a5a;margin-left:4px;vertical-align:middle}
.endc h1{font-size:clamp(26px,9vh,52px)!important}
.rk{display:inline-block;font-size:clamp(34px,13vh,80px);line-height:1;margin-top:2px}
.est{display:flex;gap:8px;justify-content:center;margin:8px 0}
.est div{background:#151a36;border:2px solid #2c355e;border-radius:12px;padding:4px 12px;font-size:clamp(11px,3.2vh,15px);color:var(--dim)}
.est b{display:block;color:#fff;font-size:clamp(16px,5vh,26px)}
.endc .mrow .mbtn{min-width:110px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud" id="top"><button class="pill" id="bPause" type="button">⏸</button><span class="pill" id="wv"></span><span class="pill" id="hpP"></span><span class="pill" id="gdP"></span><span class="pill" id="viewing" hidden></span></div>
<div class="hud" id="side"></div>
<div class="hud" id="bar">
  <button class="bt sum" id="bSum" type="button">🧸 เรียกเด็ก<small id="sumC"></small></button>
  <button class="bt" id="bUp" type="button">💪 อัปพลัง<small>6 คลาส</small></button>
  <button class="bt wh" id="bWh" type="button">📣 นกหวีด<small>ส่งปีศาจ</small></button>

    $('#mmT').textContent='กำลังหาแก๊ง…';$('#cd').textContent='';$('#mmX').hidden=false;$('#mm').hidden=false;MM=[];let tt=450;MM.push(setTimeout(()=>bgFor(LOB.map),300));
    names.forEach((n,i)=>{tt+=rnd(300,700);MM.push(setTimeout(()=>{const el=row.children[i+1];el.classList.remove('wait');el.classList.add('ok');el.querySelector('b').textContent=n;el.querySelector('small').textContent='พร้อม ✓';SFX.play('pop')},tt))});
    tt+=350;MM.push(setTimeout(()=>{$('#mmT').textContent='เจอครบ 5 แก๊ง! · '+(MAPS.find(m=>m.id===LOB.map)||MAPS[0]).n;$('#mmX').hidden=true},tt));
    ['3','2','1','ไป!'].forEach((s,i)=>MM.push(setTimeout(()=>{$('#cd').textContent=s;SFX.play(i<3?'beep':'go')},tt+250+i*600)));
    MM.push(setTimeout(()=>{MM=null;$('#mm').hidden=true;MENU.hidden=true;newGame({names,map:LOB.map,me:LOB.name,avs:[LOB.fav,...av],klv:LOB.prog.lv})},tt+250+3*600+450))}
  $('#mmX').addEventListener('click',()=>{if(!MM)return;MM.forEach(clearTimeout);MM=null;$('#mm').hidden=true});
  $('#go').addEventListener('click',startMatch);
  // pause, leaving, end screen
  function pauseModal(){const me=G.players[0];openModal('⏸ หยุดเกม','<p>ระลอก '+Math.max(1,G.wave)+' · ปีศาจในลาน '+me.mons.length+'/'+me.hp+' · ยังเหลือ '+alive().length+' แก๊ง</p><div class="mrow"><button class="mbtn gold" type="button" data-a="res">▶ เล่นต่อ</button><button class="mbtn" type="button" data-a="how">📖 วิธีเล่น</button><button class="mbtn" type="button" data-a="set">⚙️ เสียง</button><button class="mbtn red" type="button" data-a="quit">ออกไปล็อบบี้</button></div>',true);
    $('#mB').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;if(a==='res')closeModal();if(a==='how')howModal();if(a==='set')setModal(true);if(a==='quit'){if(G&&!G.over&&G.players[0].alive)recordResult(alive().length);toLobby()}}}
  $('#bPause').addEventListener('click',()=>{if(!G||G.over)return;G.paused=true;pauseModal()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over&&!G.paused&&MENU.hidden){G.paused=true;pauseModal()}});
  function toLobby(){$('#modal').hidden=true;$('#end').hidden=true;hidePop();G=null;drag=null;MENU.hidden=false;SFX.duck(.3);profUI();mapUI()}
  $('#again').addEventListener('click',()=>{toLobby();startMatch()});
  $('#watch').addEventListener('click',()=>{$('#end').hidden=true});
  $('#toLobby').addEventListener('click',toLobby);
  profUI();mapUI();
  let hudT=0;
  function frame(ts){const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;
    if(G&&!G.over&&!G.paused){for(let i=0;i<G.spd;i++)step(dt)}else if(G)for(const p of G.players){for(const f of p.fx)f.t+=dt;p.fx=p.fx.filter(f=>f.t<f.T)}
    if(G&&G.players[0].offer&&G.popup!=='tal'&&!G.placing)talPop();
    if(G&&G.bannerT>0)G.bannerT-=dt;if(flashT>0)flashT-=dt*1.5;hudT-=dt;if(hudT<=0&&G){hudT=.2;updHud()}
    if(MENU.hidden)draw();else drawLobby(ts/1000);requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
}
if(typeof module!=='undefined')module.exports={newGame,step,get G(){return G},alive,summon,merge,canMerge,CK,CLS,TIER};
</script>
