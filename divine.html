<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ศึกผู้รับพร</title>
<style>
@font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-thai-800-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
@font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
:root { --ink: #24160f; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f17; font-family: Kanit, system-ui, sans-serif; touch-action: manipulation; }
body { display: grid; place-items: center; }
#app { position: relative; width: min(100vw, calc(100vh * 585 / 1266)); height: min(100vh, calc(100vw * 1266 / 585)); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui { position: absolute; font-size: calc(var(--u) * 1); }
#app { --u: min(1vw * 100 / 585, 1vh * 100 / 1266); }
button { font-family: Kanit, system-ui, sans-serif; font-weight: 800; color: #fff; border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 18); cursor: pointer; text-shadow: 0 calc(var(--u) * 2) 0 var(--ink), 0 0 calc(var(--u) * 2) var(--ink); box-shadow: inset 0 calc(var(--u) * 5) 0 #ffffff40, inset 0 calc(var(--u) * -6) 0 #00000040, 0 calc(var(--u) * 5) 0 #0000006a; padding: 0; line-height: 1.05; }
button:active { transform: translateY(calc(var(--u) * 3)); box-shadow: inset 0 calc(var(--u) * 5) 0 #ffffff40, inset 0 calc(var(--u) * -4) 0 #00000040, 0 calc(var(--u) * 2) 0 #0000006a; }
button[disabled] { filter: grayscale(.7) brightness(.75); }
button small { display: block; font-size: .62em; font-weight: 600; }
#big { left: 3.5%; right: 3.5%; top: 76.2%; height: 10.4%; display: grid; grid-template-columns: 1fr 1.6fr; gap: 3%; }
#small { left: 5%; right: 5%; top: 87.9%; height: 6.4%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; }
#big button { font-size: calc(var(--u) * 27); }
#summon { font-size: calc(var(--u) * 36) !important; background: linear-gradient(#ffe25a, #f2b51c 55%, #d98f0c); color: #fff; }
#fuse { background: linear-gradient(#8b6cf0, #5a3ac4); }
#small button { font-size: calc(var(--u) * 21); }
#boss { background: linear-gradient(#ff6d61, #c9302c); }
#chrono { background: linear-gradient(#5e8ff0, #2f52b0); }
#upgrade { background: linear-gradient(#8a8f9c, #555b68); }
#speed { position: absolute; right: 4%; top: 70.6%; width: 10.5%; height: 4.4%; font-size: calc(var(--u) * 19); background: linear-gradient(#5a5f6b, #343843); border-radius: 50%; }
#sel { position: absolute; left: 4%; right: 4%; top: 63.4%; height: 6.4%; display: none; align-items: center; gap: 2%; padding: 0 2.4%; background: linear-gradient(#5c3426, #3a1f17); border: calc(var(--u) * 4) solid var(--ink); border-radius: calc(var(--u) * 16); box-shadow: 0 calc(var(--u) * 5) 0 #0000006a; color: #fff; }
#sel.on { display: flex; }
#sel .nm { flex: 1; font-weight: 800; font-size: calc(var(--u) * 20); line-height: 1.1; text-shadow: 0 2px 0 var(--ink); }
#sel .nm small { display: block; font-weight: 600; font-size: .72em; color: #ffd98a; }
#sel button { height: 78%; padding: 0 3.4%; font-size: calc(var(--u) * 18); background: linear-gradient(#ffcf4a, #e0951a); }
#sel #sell { background: linear-gradient(#9aa0ab, #5f6571); }
#toast { position: absolute; left: 50%; top: 27%; transform: translateX(-50%); padding: .2em .9em; font-weight: 800; font-size: calc(var(--u) * 22); color: #fff4c2; background: #2a1810ee; border: calc(var(--u) * 4) solid var(--ink); border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .18s; pointer-events: none; }
#toast.on { opacity: 1; }
#over { position: absolute; inset: 0; display: none; place-items: center; background: #07060bcc; }
#over.on { display: grid; }
#over .card { width: 78%; padding: 6% 5%; text-align: center; color: #fff; background: linear-gradient(#5c3426, #301a12); border: calc(var(--u) * 5) solid var(--ink); border-radius: calc(var(--u) * 24); }
#over h2 { margin: 0 0 .3em; font-size: calc(var(--u) * 38); color: #ffcf4a; text-shadow: 0 3px 0 var(--ink); }
#over p { margin: 0 0 1.2em; font-weight: 600; font-size: calc(var(--u) * 20); }
#over button { width: 70%; height: calc(var(--u) * 72); font-size: calc(var(--u) * 28); background: linear-gradient(#ffe25a, #d98f0c); }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="sel"><div class="nm" id="selName">-</div><button id="merge">รวม 3</button><button id="sell">ขาย</button></div>
  <button id="speed">x1</button>
  <div id="big" class="ui"><button id="fuse">หลอมเทพ<small>เอปิคขึ้นไป 2 ตัว</small></button><button id="summon">อัญเชิญ<small id="sumCost">20 ทอง</small></button></div>
  <div id="small" class="ui"><button id="boss">ท้าบอส</button><button id="chrono">หยุดกาล</button><button id="upgrade">เสริมพลัง<small id="upCost">45 ทอง</small></button></div>
  <div id="toast"></div>
  <div id="over"><div class="card"><h2 id="rank">วิหารแตก!</h2><p id="sum"></p><button id="again">เล่นใหม่</button></div></div>
</div>
<script>
'use strict';
/* ศึกผู้รับพร (owner 2026-11-25: remodel to the owner's mock-up art/incoming/divine_game/ref/owner_target_mockup.jpg; ONE board of 7 x 3 = 21 slots, owner "ทำ 7 ช่อง" so it differs from the reference game).
   Genre: random summon + merge defence (owner's references: genre only, own names / HUD / board). Rules started from the Codex prototype
   on branch codex/divine-dark-compact. Characters = cut from the owner's own pictures (tools/art/divine_cut.py + divine_sprites.py -> art/divine).
   Logical canvas 585 x 1266, drawn at 2x. */
const $ = id => document.getElementById(id), cv = $('c'), g = cv.getContext('2d'), W = 585, H = 1266, SC = 2;
cv.width = W * SC; cv.height = H * SC;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
const COLS = 7, ROWS = 3, CW = 68, CH = 100, BX = Math.round((W - COLS * CW) / 2), BY = 360;   /* owner "ทำช่องขนาดตัวก่อน": a slot fits one character */
const cell = i => ({ x: BX + (i % COLS) * CW + CW / 2, y: BY + Math.floor(i / COLS) * CH + CH * .88 });   /* feet point */
/* monsters walk round the board on the centre line of the dirt ring */
const PL = BX - 31, PR = BX + COLS * CW + 31, PT = BY - 31, PB = BY + ROWS * CH + 31, LOOP = [[PL, PT], [PR, PT], [PR, PB], [PL, PB], [PL, PT]];
const SEG = []; let LEN = 0; for (let i = 0; i < 4; i++) { const [a, b] = [LOOP[i], LOOP[i + 1]], l = Math.hypot(b[0] - a[0], b[1] - a[1]); SEG.push({ a, b, l, s: LEN }); LEN += l; }
function along(d) { d = ((d % LEN) + LEN) % LEN; for (const s of SEG) if (d <= s.s + s.l) { const f = (d - s.s) / s.l; return { x: s.a[0] + (s.b[0] - s.a[0]) * f, y: s.a[1] + (s.b[1] - s.a[1]) * f, dx: Math.sign(s.b[0] - s.a[0]) }; } return { x: PL, y: PT, dx: 1 }; }

const TIERS = ['COMMON', 'RARE', 'EPIC', 'LEGEND', 'MYTHIC'];
const TD = {
  COMMON: { th: 'ธรรมดา', col: '#c9ced8', dmg: 14, cd: 40, rng: 300, sz: .82, stars: 1 },
  RARE: { th: 'หายาก', col: '#4cc9ff', dmg: 34, cd: 38, rng: 310, sz: .9, stars: 2 },
  EPIC: { th: 'เอปิค', col: '#b880ff', dmg: 75, cd: 34, rng: 320, sz: .96, stars: 3 },
  LEGEND: { th: 'ตำนาน', col: '#ffcf3a', dmg: 160, cd: 30, rng: 330, sz: 1.02, stars: 4 },
  MYTHIC: { th: 'มหาเทพ', col: '#ff5d7a', dmg: 380, cd: 24, rng: 345, sz: 1.12, stars: 5 }
};
const PAN = {
  greek: { th: 'กรีก', hero: ['ผู้รับพรซุส', 'ศิษย์สายฟ้า', 'ร่างทรงซุส', 'มหาเทพสายฟ้า'], col: '#7fe8ff', syn: 'สายฟ้ากระโดดเพิ่ม' },
  norse: { th: 'นอร์ส', hero: ['ผู้รับพรธอร์', 'นักรบค้อนฟ้า', 'ร่างทรงธอร์', 'มหาเทพอัสนี'], col: '#9fc4ff', syn: 'คริติคอล +15%' },
  egypt: { th: 'อียิปต์', hero: ['ผู้รับพรอานูบิส', 'ทหารหัวหมาไน', 'ร่างทรงอานูบิส', 'มหาเทพแห่งความตาย'], col: '#ffd36b', syn: 'ดาเมจ +15%' },
  asia: { th: 'เอเชีย', hero: ['ผู้รับพรเห้งเจีย', 'วานรเพลิง', 'ร่างทรงเห้งเจีย', 'มหาเทพวานร'], col: '#ff9a4a', syn: 'ตีเร็ว +15%' }
};
const PK = Object.keys(PAN);
const MOBS = [{ k: 'mob_robot_a', h: 75, sp: 1.05, face: 1 }, { k: 'mob_robot_b', h: 78, sp: 1.0, face: 1 }, { k: 'mob_robot_c', h: 59, sp: 1.35, face: 1 }, { k: 'mob_ghoul', h: 83, sp: .9, face: -1, hpk: 1.4 }];
const IMG = {};
const FIT = { greek: 1, norse: 1.1, egypt: 1.13, asia: 1.03, soldier: .97 };   /* same HEAD size for everyone: helmets and jackal ears add height */
const load = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(s); i.src = s; });

let G, BG, tt = 0;
const RIVAL_NAMES = ['ต้นกล้า', 'มายด์', 'บอสส์', 'น้ำหวาน', 'แทนไท', 'ปลายฟ้า', 'จิ๊บ', 'ภูผา'];
function makeRivals() { const n = [...RIVAL_NAMES].sort(() => Math.random() - .5); return [0, 1, 2, 3].map(i => ({ name: n[i], p: pick(PK), end: Math.round(rnd(18, 62)), count: 0, out: 0 })); }
/* no server yet: each rival has a hidden last wave; their monster count climbs toward 100 as it gets near */
function stepRivals() { for (const r of G.rivals) { if (r.out) continue; const f = clamp((G.wave + (20 - G.sec) / 20 - r.end * .45) / (r.end * .55), 0, 1.05), target = Math.round(100 * f * f + 6 * Math.sin(tt * .7 + r.end)); r.count += clamp(target - r.count, -2, 2); r.count = clamp(r.count, 0, 100); if (G.wave >= r.end && r.count >= 96) { r.out = 5 - G.rivals.filter(q => q.out).length; r.count = 100; toast(r.name + ' ตกรอบ! (อันดับ ' + r.out + ')'); if (G.rivals.every(q => q.out)) toast('เหลือคุณคนเดียว! อันดับ 1'); } } }
function fresh() {
  G = { gold: 180, atk: 1, upCost: 45, sumCost: 20, wave: 1, sec: 20, grid: Array(COLS * ROWS).fill(null), mobs: [], fx: [], num: [], sel: -1, speed: 1, freeze: 0, chronoCd: 0, spawn: 0, tick: 0, kills: 0, over: false, boss: null, rivals: makeRivals() };
  $('over').classList.remove('on'); sync();
}
function toast(s) { const e = $('toast'); e.textContent = s; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1600); }

/* ---------- units ---------- */
function unitName(u) { return u.kind === 'sol' ? 'ทหารรับจ้าง' : PAN[u.p].hero[Math.min(3, TIERS.indexOf(u.tier) - 1)]; }
function makeUnit(tier, p) { if (tier === 'COMMON') return { kind: 'sol', p: null, tier, cd: rnd(0, 30), bob: Math.random() * 6, flash: 0, awake: false }; return { kind: 'hero', p: p || pick(PK), tier, cd: rnd(0, 30), bob: Math.random() * 6, flash: 0, awake: false }; }
function same(a, b) { return a && b && a.kind === b.kind && a.tier === b.tier && a.p === b.p; }
function place(u) { const free = []; G.grid.forEach((v, i) => { if (!v) free.push(i); }); if (!free.length) { toast('กระดานเต็ม 21 ช่องแล้ว'); return -1; } const i = free[0]; G.grid[i] = u; const c = cell(i); burst(c.x, c.y - 40, TD[u.tier].col, 18, 4); ring(c.x, c.y - 4, TD[u.tier].col, 10, 44, .4); return i; }
function summon() {
  if (G.over) return; if (G.gold < G.sumCost) return toast('ทองไม่พอ');
  const r = Math.random() + G.atk * .004, t = r > .97 ? 'LEGEND' : r > .84 ? 'EPIC' : r > .55 ? 'RARE' : 'COMMON';
  if (place(makeUnit(t)) < 0) return; G.gold -= G.sumCost; G.sumCost = Math.min(60, G.sumCost + 1); if (t !== 'COMMON' && t !== 'RARE') toast('ได้ระดับ' + TD[t].th + '!'); sync();
}
function fuse() {
  if (G.over) return; const idx = []; G.grid.forEach((u, i) => { if (u && u.kind === 'hero' && (u.tier === 'EPIC' || u.tier === 'LEGEND')) idx.push(i); });
  if (idx.length < 2) return toast('ต้องมีเอปิคขึ้นไป 2 ตัว');
  const p = G.grid[idx[0]].p; G.grid[idx[0]] = G.grid[idx[1]] = null; const i = place(makeUnit('MYTHIC', p)); G.sel = -1; const c = cell(i);
  ring(c.x, c.y - 40, '#ff5d7a', 10, 120, .6); T.flash = .25; toast(PAN[p].hero[3] + ' จุติ!'); sync();
}
function merge() {
  const u = G.grid[G.sel]; if (!u || u.tier === 'MYTHIC') return; const ids = []; G.grid.forEach((v, i) => { if (same(v, u) && ids.length < 3) ids.push(i); });
  if (ids.length < 3) return toast('ต้องมีตัวเหมือนกัน 3 ตัว');
  const next = TIERS[TIERS.indexOf(u.tier) + 1]; ids.forEach(i => G.grid[i] = null); G.grid[ids[0]] = makeUnit(next, u.kind === 'hero' ? u.p : null);
  const c = cell(ids[0]); burst(c.x, c.y - 40, TD[next].col, 26, 5); ring(c.x, c.y - 30, TD[next].col, 10, 70, .45); G.sel = ids[0]; toast('เลื่อนเป็น' + TD[next].th + '!'); sync();
}
function sell() { const u = G.grid[G.sel]; if (!u) return; G.gold += [10, 22, 48, 90, 150][TIERS.indexOf(u.tier)]; G.grid[G.sel] = null; G.sel = -1; sync(); }
function upgrade() { if (G.gold < G.upCost) return toast('ทองไม่พอ'); G.gold -= G.upCost; G.atk++; G.upCost = Math.round(G.upCost * 1.45 + 5); toast('พลังโจมตี Lv ' + G.atk); sync(); }
function spawnBoss() { if (G.boss) return toast('บอสอยู่ในสนามแล้ว'); const hp = Math.round(mobHp(G.wave) * 28 + 1200); const m = { k: 'boss_ghoul', h: 150, d: 0, hp, max: hp, sp: .6, boss: true, face: -1, step: 0, hit: 0 }; G.mobs.push(m); G.boss = m; toast('ยักษ์มลทินบุก!'); }
function chrono() { if (G.chronoCd > 0) return toast('หยุดกาลพร้อมในอีก ' + Math.ceil(G.chronoCd / 60) + ' วิ'); G.freeze = 300; G.chronoCd = 1800; T.flash = .15; toast('หยุดกาล 5 วินาที!'); }
function syn() { const c = { greek: 0, norse: 0, egypt: 0, asia: 0 }; G.grid.forEach(u => { if (u && u.kind === 'hero') c[u.p]++; }); return c; }

/* ---------- effects ---------- */
const T = { flash: 0, shake: 0 };
function burst(x, y, col, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = rnd(.5, sp || 3); G.fx.push({ t: 'p', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, col, life: rnd(18, 34), max: 34, s: rnd(2, 5) }); } }
function ring(x, y, col, r0, r1, d, fl) { G.fx.push({ t: 'ring', x, y, col, r0, r1, life: d * 60, max: d * 60, fl: fl || .45 }); }
function bolt(x0, y0, x1, y1, col, w, d) { const pts = [[x0, y0]], n = Math.max(4, Math.round(Math.hypot(x1 - x0, y1 - y0) / 22)); for (let i = 1; i < n; i++) { const f = i / n; pts.push([x0 + (x1 - x0) * f + rnd(-12, 12), y0 + (y1 - y0) * f + rnd(-12, 12)]); } pts.push([x1, y1]); G.fx.push({ t: 'bolt', pts, col, w, life: d || 10, max: d || 10 }); }
function beam(x0, y0, x1, y1, col, w, d) { G.fx.push({ t: 'beam', x0, y0, x1, y1, col, w, life: d || 9, max: d || 9 }); }
function shot(x0, y0, m, col, kind, cb) { G.fx.push({ t: 'shot', x: x0, y: y0, m, col, kind, cb, life: 99, max: 99, sp: kind === 'fire' ? 9 : 18 }); }
function number(x, y, v, crit, big) { if (G.num.length > 16 && !crit && !big) return; const s = v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? (v / 1e3).toFixed(1) + 'K' : String(Math.round(v)); G.num.push({ x: x + rnd(-22, 22), y: y + rnd(-14, 8), s, crit, big, life: 46, max: 46 }); }

/* ---------- combat ---------- */
function dmgTo(m, d, crit) { m.hp -= d; m.hit = 6; number(m.x, m.y - (m.h || 80) * .8, d, crit, m.boss); }
function nearest(x, y, r, not) { let best = null, bd = r; for (const m of G.mobs) { if (m.hp <= 0 || (not && not.includes(m))) continue; const d = Math.hypot(m.x - x, m.y - y + 30); if (d < bd) { bd = d; best = m; } } return best; }
function attack(u, i) {
  const c = cell(i), D = TD[u.tier], s = syn(), tier = TIERS.indexOf(u.tier), tgt = nearest(c.x, c.y - 40, D.rng); if (!tgt) return false;
  let dmg = D.dmg * (1 + (G.atk - 1) * .12) * (u.awake ? 1.6 : 1) * (s.egypt >= 2 ? 1.15 : 1);
  const crit = Math.random() < .1 + (s.norse >= 2 ? .15 : 0) + G.atk * .005; if (crit) dmg *= 2.2;
  dmg = Math.round(dmg * rnd(.9, 1.1)); u.flash = 14; const hx = c.x + 18, hy = c.y - 62 * D.sz;
  if (u.kind === 'sol') { beam(hx + 8, hy + 14, tgt.x, tgt.y - 30, '#ffe066', 3, 6); dmgTo(tgt, dmg, crit); burst(tgt.x, tgt.y - 30, '#ffd23f', 4, 2); }
  else if (u.p === 'greek') {
    let from = { x: hx - 22, y: hy - 8 }, hit = [], m = tgt; const jumps = 1 + (tier >= 3 ? 2 : 1) + (s.greek >= 2 ? 1 : 0);
    for (let j = 0; j < jumps && m; j++) { bolt(from.x, from.y, m.x, m.y - 34, j ? '#bff6ff' : '#7fe8ff', tier >= 3 ? 5 : 3.5, 11); dmgTo(m, Math.round(dmg * (j ? .6 : 1)), crit && !j); burst(m.x, m.y - 34, '#bff6ff', 5, 2.5); hit.push(m); from = { x: m.x, y: m.y - 34 }; m = nearest(m.x, m.y, 150, hit); }
    if (tier >= 2) u.spirit = 26;
  } else if (u.p === 'norse') {
    bolt(tgt.x + rnd(-6, 6), tgt.y - 360, tgt.x, tgt.y - 20, '#cfe3ff', tier >= 3 ? 6 : 4, 12); ring(tgt.x, tgt.y - 6, '#9fc4ff', 6, 60 + tier * 8, .32, .4);
    dmgTo(tgt, dmg, crit); for (const m of G.mobs) if (m !== tgt && Math.hypot(m.x - tgt.x, m.y - tgt.y) < 60 + tier * 8) dmgTo(m, Math.round(dmg * .55), false); T.shake = Math.max(T.shake, tier >= 3 ? 4 : 2);
  } else if (u.p === 'egypt') {
    const ang = Math.atan2(tgt.y - 30 - hy, tgt.x - hx), x1 = hx + Math.cos(ang) * 420, y1 = hy + Math.sin(ang) * 420; beam(hx, hy, x1, y1, '#ffd36b', tier >= 3 ? 7 : 5, 10);
    for (const m of G.mobs) { const t = ((m.x - hx) * Math.cos(ang) + (m.y - 30 - hy) * Math.sin(ang)), dd = Math.abs(-(m.x - hx) * Math.sin(ang) + (m.y - 30 - hy) * Math.cos(ang)); if (t > 0 && t < 420 && dd < 26) { dmgTo(m, m === tgt ? dmg : Math.round(dmg * .7), crit && m === tgt); burst(m.x, m.y - 30, '#ffe7a0', 4, 2); } }
  } else if (u.p === 'asia') {

function star(x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } g.closePath(); g.fill(); g.stroke(); }
function drawMob(m) {
  const bob = Math.abs(Math.sin(m.step)) * (G.freeze > 0 ? 0 : 4), flip = m.face * (m.dir || 1) < 0;
  shadow(m.x, m.y, m.boss ? 46 : 22); spr(m.k, m.x, m.y - bob, m.h, flip);
  if (m.hit > 0) { g.save(); g.globalCompositeOperation = 'lighter'; spr(m.k, m.x, m.y - bob, m.h, flip, m.hit / 8); g.restore(); }
  if (G.freeze > 0) { g.save(); g.globalAlpha = .35; g.fillStyle = '#9fd8ff'; g.beginPath(); g.ellipse(m.x, m.y - m.h * .5, m.h * .45, m.h * .55, 0, 0, 6.3); g.fill(); g.restore(); }
  const w = m.boss ? 90 : 46, y = m.y - m.h - 10; g.fillStyle = '#24160f'; g.fillRect(m.x - w / 2 - 2, y - 2, w + 4, 9); g.fillStyle = m.boss ? '#ff5a4a' : '#7be36a'; g.fillRect(m.x - w / 2, y, w * clamp(m.hp / m.max, 0, 1), 5);
}
function drawFx() {
  for (const f of G.fx) {
    const a = clamp(f.life / f.max, 0, 1);
    if (f.t === 'p') { g.globalAlpha = a; g.fillStyle = f.col; g.beginPath(); g.arc(f.x, f.y, f.s * (.5 + a * .5), 0, 6.3); g.fill(); }
    else if (f.t === 'ring') { const r = f.r0 + (f.r1 - f.r0) * (1 - a ** 2); g.globalAlpha = a; g.lineWidth = 3 + 6 * a; g.strokeStyle = f.col; g.beginPath(); g.ellipse(f.x, f.y, r, r * f.fl, 0, 0, 6.3); g.stroke(); }
    else if (f.t === 'bolt' || f.t === 'beam') {
      const pts = f.t === 'bolt' ? f.pts : [[f.x0, f.y0], [f.x1, f.y1]]; g.save(); g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round'; g.lineCap = 'round';
      for (const [w, col, al] of [[f.w * 3.2, f.col, .35 * a], [f.w * 1.6, f.col, .8 * a], [f.w * .6, '#ffffff', a]]) { g.globalAlpha = al; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }
      g.restore();
    } else if (f.t === 'shot') { g.save(); g.globalCompositeOperation = 'lighter'; const gr = g.createRadialGradient(f.x, f.y, 1, f.x, f.y, 16); gr.addColorStop(0, '#fff6c8'); gr.addColorStop(.4, f.col); gr.addColorStop(1, '#00000000'); g.fillStyle = gr; g.fillRect(f.x - 16, f.y - 16, 32, 32); g.restore(); }
  }
  g.globalAlpha = 1;
  for (const n of G.num) { const a = n.life / n.max, up = (1 - a) * 34, sz = n.big ? 40 : n.crit ? 34 : 24; g.globalAlpha = a < .3 ? a / .3 : 1; if (n.crit) txt('คริ!', n.x, n.y - up - sz * .8, sz * .55, '#ffd23f'); txt(n.s, n.x, n.y - up, sz * (a > .85 ? 1 + (a - .85) * 3 : 1), n.crit || n.big ? '#ffd23f' : '#fff'); }
  g.globalAlpha = 1;
}
function chips() {
  const s = syn(), y = 862; let x = 40;
  for (const p of PK) { const on = s[p] >= 2; rr(g, x - 4, y - 24, 112, 48, 14); g.fillStyle = on ? '#4a2f20' : '#2b2420'; g.fill(); g.lineWidth = 5; g.strokeStyle = '#24160f'; g.stroke(); spr('hero_' + p, x + 20, y + 22, 44, false, on ? 1 : .55); txt(PAN[p].th, x + 66, y - 6, 17, on ? PAN[p].col : '#9b9188'); txt(s[p] + '/2', x + 66, y + 13, 16, on ? '#fff' : '#9b9188'); x += 128; }
  /* money row */
  const ry = 922; const pill = (x, w, icon, v) => { rr(g, x, ry - 20, w, 40, 14); g.fillStyle = '#2b1b14'; g.fill(); g.lineWidth = 5; g.stroke(); icon(x + 22, ry); txt(String(v), x + w / 2 + 14, ry, 22, '#fff'); };
  pill(150, 130, (x, y) => { g.fillStyle = '#ffd23f'; rr(g, x - 12, y - 10, 24, 20, 5); g.fill(); g.lineWidth = 3; g.stroke(); g.fillStyle = '#fff3a0'; g.fillRect(x - 6, y - 6, 8, 4); }, G.gold);
  pill(306, 130, (x, y) => { g.fillStyle = '#e8d6c0'; g.beginPath(); g.arc(x, y - 4, 7, 0, 6.3); g.fill(); g.lineWidth = 3; g.stroke(); g.beginPath(); g.ellipse(x, y + 9, 11, 6, 0, Math.PI, 0); g.fill(); g.stroke(); }, G.grid.filter(Boolean).length + '/21');
}
function draw() {
  g.setTransform(SC, 0, 0, SC, 0, 0); g.clearRect(0, 0, W, H);
  const sx = T.shake > .3 ? rnd(-T.shake, T.shake) : 0, sy = T.shake > .3 ? rnd(-T.shake, T.shake) : 0; g.translate(sx, sy);
  g.drawImage(BG, 0, 0, W, H);
  g.save(); g.translate(PL + 10, PT - 22); g.scale(.7, .7); portal(0, 0); g.restore(); ambient();
  G.grid.forEach((u, i) => { if (u) drawUnit(u, i); });
  [...G.mobs].sort((a, b) => a.y - b.y).forEach(drawMob);
  drawFx(); hud(); rivals(); chips();
  g.setTransform(SC, 0, 0, SC, 0, 0);
  if (T.flash > 0) { g.globalAlpha = clamp(T.flash / .25, 0, 1) * .45; g.fillStyle = '#eafcff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
  if (G.freeze > 0) { g.globalAlpha = .12; g.fillStyle = '#7fc8ff'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
}

/* ---------- ui ---------- */
function sync() {
  $('sumCost').textContent = G.sumCost + ' ทอง'; $('upCost').textContent = G.upCost + ' ทอง'; $('speed').textContent = 'x' + G.speed;
  const u = G.grid[G.sel]; $('sel').classList.toggle('on', !!u);
  if (u) { const n = G.grid.filter(v => same(v, u)).length; $('selName').innerHTML = unitName(u) + '<small>' + TD[u.tier].th + (u.kind === 'hero' ? ' · ' + PAN[u.p].th : '') + (u.awake ? ' · ปลุกแล้ว' : '') + ' · แตะช่องอื่นเพื่อย้าย</small>'; $('merge').disabled = u.tier === 'MYTHIC' || n < 3; $('merge').textContent = 'รวม 3 (' + Math.min(n, 3) + ')'; }
}
cv.addEventListener('pointerdown', e => {
  if (G.over) return; const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const k = Math.floor((x - BX) / CW), rw = Math.floor((y - BY) / CH); if (k < 0 || k >= COLS || rw < 0 || rw >= ROWS) { G.sel = -1; sync(); return; }
  const i = rw * COLS + k;
  if (G.sel >= 0 && G.sel !== i && G.grid[G.sel]) { const t = G.grid[i]; G.grid[i] = G.grid[G.sel]; G.grid[G.sel] = t; G.sel = -1; }
  else G.sel = G.sel === i || !G.grid[i] ? -1 : i;
  sync();
});
$('summon').onclick = summon; $('fuse').onclick = fuse; $('boss').onclick = spawnBoss; $('chrono').onclick = chrono; $('upgrade').onclick = upgrade;
$('merge').onclick = merge; $('sell').onclick = sell; $('again').onclick = fresh; $('speed').onclick = () => { G.speed = G.speed === 1 ? 2 : 1; sync(); };
let last = 0;
function frame(t) { const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; tt += dt; for (let k = 0; k < G.speed; k++) step(); draw(); requestAnimationFrame(frame); }
(async () => {
  const names = ['hero_greek', 'hero_norse', 'hero_egypt', 'hero_asia', 'soldier', 'spirit_greek', 'mob_robot_a', 'mob_robot_b', 'mob_robot_c', 'mob_ghoul', 'boss_ghoul'];
  const ims = await Promise.all(names.map(n => load('art/divine/' + n + '.png'))); names.forEach((n, i) => IMG[n] = ims[i]);
  try { await document.fonts.load('800 20px Kanit'); } catch (e) {}
  BG = paintBG(); fresh();
  window.DIVINE = { state: () => G, summon, fuse, merge, spawnBoss, chrono, upgrade, step, draw, place, makeUnit, ready: true };
  requestAnimationFrame(frame);
})().catch(e => { console.error(e); toast('โหลดไม่สำเร็จ ลองรีเฟรช'); });
