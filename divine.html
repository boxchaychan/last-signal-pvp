function canMerge(u){return u&&u.tier!=='MYTHIC'&&G.grid.filter(v=>v&&v.id===u.id&&v.tier===u.tier).length>=3}function makeUnit(tier){const p=PK[Math.floor(Math.random()*PK.length)],rank=Math.min(2,Math.max(0,TIER.indexOf(tier)-2));return{id:p+'_'+tier,name:NAMES[p][rank],p,tier,cd:0,bob:Math.random()*7,awakened:false,pose:'idle',poseT:0,casts:0}}

function spawnBoss(){if(G.boss)return toast('บอสอยู่ในสนามแล้ว');const hp=1200+G.wave*650,m={x:PATH[0][0],y:PATH[0][1],pi:1,hp,max:hp,sp:.55,boss:true,kind:2,step:0};G.mobs.push(m);G.boss=m;toast('ไททันมลทินบุก!')}function castChronos(){if(G.chrono>0)return;G.freeze=240;G.chrono=1500;toast('Chronos หยุดเวลา 4 วินาที');sync()}
function synergies(){const c={greek:0,norse:0,egypt:0,asia:0},seen=new Set;G.grid.forEach(u=>{if(u&&!seen.has(u.id)){seen.add(u.id);c[u.p]++}});return c}function spawnMob(){const hp=60+G.wave*48,k=Math.floor(Math.random()*3);G.mobs.push({x:PATH[0][0],y:PATH[0][1],pi:1,hp:hp*(k===1?1.3:1),max:hp*(k===1?1.3:1),sp:.85+G.wave*.025,kind:k,boss:false,step:Math.random()*6})}
function hit(m,d,crit){m.hp-=d;G.pop.push({x:m.x,y:m.y-24,s:(crit?'CRIT ':'')+Math.round(d),col:crit?'#ffe23f':'#fff',life:38});burst(m.x,m.y,crit?'#ffe23f':'#79e9ff',crit?8:4)}
function step(){if(G.over)return;G.tick++;if(G.freeze>0)G.freeze--;if(G.chrono>0)G.chrono--;if(G.tick%60===0){G.sec--;if(G.sec<=0){G.wave++;G.sec=20;G.gold+=30+G.wave*4;toast('WAVE '+G.wave+' · รับทองรางวัล');sync()}}G.spawn++;if(G.spawn>Math.max(30,70-G.wave*2)){G.spawn=0;spawnMob()}for(const m of G.mobs){m.step+=.18;if(G.freeze)continue;if(m.stun>0){m.stun--;continue}const p=PATH[m.pi],dx=p[0]-m.x,dy=p[1]-m.y,d=Math.hypot(dx,dy);if(d<m.sp){m.x=p[0];m.y=p[1];m.pi=(m.pi+1)%PATH.length}else{m.x+=dx/d*m.sp;m.y+=dy/d*m.sp}}
 const syn=synergies(),crit=.1+(syn.norse>=2?.16:0)+G.level*.01;G.grid.forEach((u,i)=>{if(!u)return;if(u.poseT>0){u.poseT--;if(u.poseT<=0)u.pose='idle'}if(u.cd>0){u.cd--;return}const p=slotPos(i),D=TD[u.tier];let target=null,bd=D.range;for(const m of G.mobs){const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<bd){target=m;bd=d}}if(target){const haste=u.awakened&&u.p==='asia'?.58:1;u.cd=Math.round(D.cd*(syn.asia>=2?.8:1)*haste);const cr=Math.random()<crit,dm=D.dmg*(1+(G.level-1)*.18)*(syn.egypt>=2?1.2:1)*(u.awakened?1.8:1)*(cr?1.8:1),skill=u.awakened&&++u.casts%4===0;u.pose=skill?'skill':'attack';u.poseT=skill?30:18;G.shots.push({x:p.x,y:p.y-20,t:target,d:dm,crit:cr,col:D.col,p:u.p,aw:u.awakened,skill})}});for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];if(!G.mobs.includes(s.t)){G.shots.splice(i,1);continue}const dx=s.t.x-s.x,dy=s.t.y-s.y,d=Math.hypot(dx,dy);if(d<15){hit(s.t,s.d,s.crit);if(s.p==='greek')G.vfx.push({kind:'slash',x:s.t.x,y:s.t.y,t:0,life:16});if(s.aw){if(s.p==='norse')s.t.stun=Math.max(s.t.stun||0,65);if(s.p==='greek'||s.p==='egypt'){let n=0;for(const m of G.mobs){if(m!==s.t&&n<(s.p==='greek'?3:5)&&Math.hypot(m.x-s.t.x,m.y-s.t.y)<(s.p==='greek'?150:95)){hit(m,s.d*(s.p==='greek'?.48:.38),false);n++}}}}G.shots.splice(i,1)}else{s.x+=dx/d*13;s.y+=dy/d*13}}
 for(let i=G.mobs.length-1;i>=0;i--){const m=G.mobs[i];if(m.hp<=0){G.mobs.splice(i,1);G.gold+=m.boss?80:4;G.kills++;if(m.boss){G.boss=null;G.core++;G.gem++;toast('ปราบไททันสำเร็จ +แก่น +ศิลา')}sync()}}G.fx.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.vy+=.05;f.life--});G.fx=G.fx.filter(f=>f.life>0);G.vfx.forEach(f=>f.t++);G.vfx=G.vfx.filter(f=>f.t<f.life);G.pop.forEach(p=>{p.y-=.7;p.life--});G.pop=G.pop.filter(p=>p.life>0);if(G.mobs.length>=100){G.over=true;E('summary').textContent='ผ่านถึงเวฟ '+G.wave+' · กำจัด '+G.kills+' ตัว';E('over').style.display='grid'}}
function text(s,x,y,z,c){g.font='900 '+z+'px system-ui,"Noto Sans Thai",sans-serif';g.textAlign='center';g.textBaseline='middle';g.strokeStyle='#2a160e';g.lineWidth=Math.max(3,z/7);g.strokeText(s,x,y);g.fillStyle=c;g.fillText(s,x,y)}
