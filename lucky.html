/* ---------- art: Codex cartoon pictures cut into single sprites (art/lucky2d/sprites.json: name -> file, w, h (units), ax, ay) */

/* ---------- data */

for (let b = 0; b < 2; b++) for (let i = 0; i < L.cols * L.rows; i++) G.grid[b].push(null);

}
function summon() { if (G.over || G.coin < G.cost) return false; const i = addHero(0, rollHero()); if (i < 0) return false; G.coin -= G.cost; G.cost += 2; return true; }

  pop(m.x + rnd(-6, 6), m.y - (m.boss ? 80 : 38), dmg, crit ? '#ffd84a' : '#ffffff', crit); if (m.hp <= 0) { G.coin += m.gold; pop(m.x, m.y - 22, '+' + m.gold, '#ffd84a'); burst(m.x, m.y - 14, '#ffffff', 8); burst(m.x, m.y - 14, '#ffd84a', 4, 45); } }

/* ---------- drawing helpers (vector UI) */

function drawMob(m) {

const UIB = [];

    else if (f.k === 'ring') { g.strokeStyle = f.col; g.lineWidth = 3 * (1 - k) + 1; g.beginPath(); g.ellipse(f.x, f.y, f.r * (.3 + .7 * (1 - (1 - k) * (1 - k))), f.r * (.3 + .7 * (1 - (1 - k) * (1 - k))) * .55, 0, 0, TAU); g.stroke(); }
    else if (f.k === 'flash') { const q = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); q.addColorStop(0, '#fff'); q.addColorStop(.4, f.col); q.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = q; g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill(); }
    else if (f.k === 'beam') { const q = g.createLinearGradient(0, f.y - 150, 0, f.y); q.addColorStop(0, 'rgba(255,255,255,0)'); q.addColorStop(1, f.col); g.fillStyle = q; g.fillRect(f.x - 14 * (1 - k * .6), f.y - 150, 28 * (1 - k * .6), 150); }
    g.globalAlpha = 1; }
  for (const p of G.pops) { const k = p.t / .75, sz = (p.big ? 17 : 12) * (k < .12 ? .6 + k / .12 * .6 : 1); g.globalAlpha = k > .7 ? 1 - (k - .7) / .3 : 1; txt(p.txt, p.x, p.y - k * 20, sz, p.col, 'center', 800, '#0e222a', .3); g.globalAlpha = 1; }
  g.restore();

  const uy = sy + 74; dn = button('up', cx - 88, uy, 176, 30, '#9ff0ff', '#22a9c2', '#0f6b7c', 12); txt('เสริมพลัง', cx, uy + 21 + dn, 15, '#fff', 'center', 800, '#0b5565');
  if (G.over) { g.fillStyle = 'rgba(6,16,22,.72)'; g.fillRect(0, 0, W, H); txt('มอนล้นสนาม!', cx, H * .42, 32, '#ff6a5a', 'center'); txt('ไปได้ถึงเวฟ ' + G.wave, cx, H * .42 + 30, 16, '#fff', 'center'); }
}
/* ---------- input */
function at(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * V.W, (e.clientY - r.top) / r.height * V.H]; }
const hitB = (x, y) => UIB.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
cv.addEventListener('pointerdown', e => { e.preventDefault(); const [x, y] = at(e), b = hitB(x, y); G.down = b ? b.id : null; });
addEventListener('pointerup', e => { const [x, y] = at(e), b = hitB(x, y); if (b && b.id === G.down && b.id === 'summon') summon(); G.down = null; });
addEventListener('keydown', e => { if (e.code === 'Space') summon(); });
/* ---------- loop */
let last = performance.now(), ready = false;
function frame(now) { requestAnimationFrame(frame); const dt = Math.min(.05, (now - last) / 1000); last = now; if (!ready) return; tick(dt); draw(); }
addEventListener('resize', resize);
(async () => { resize(); try { await document.fonts.load('800 20px Kanit', 'ก'); } catch (e) { } await loadArt(); resize();
  if (Q.get('demo') !== '0') { const A = [['archer', 3], ['recruit', 2], ['icemage', 2], ['firemage', 1], ['ninja', 2], ['paladin', 1], ['archer', 1], ['recruit', 3]]; for (const [id, n] of A) for (let i = 0; i < n; i++) addHero(0, id); for (let i = 0; i < 10; i++) addHero(1, rollHero()); G.spawnQ = 10; G.wave = 3; }
  ready = true; })();
window.LK = { G, V, L, FIELD, summon, layout, sim: (sec, dt = 1 / 30) => { for (let t = 0; t < sec; t += dt) tick(dt); draw(); } };
requestAnimationFrame(frame);
