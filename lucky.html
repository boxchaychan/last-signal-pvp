<script>

/* ---------- art */
const IMG = {}, META = {};

    ...MOBS.map(m => img('m_' + m, 'art/quest/mob_' + m + '.png')), ...MOBS.map(m => fetch('art/quest/mob_' + m + '.json?v=' + VER).then(r => r.json()).then(j => { META['m_' + m] = j; }).catch(() => { }))]);

  const gr = G.grid[b]; let i = gr.findIndex(c => c && c.id === id && c.u.length < 3); if (i < 0) { const free = []; gr.forEach((c, k) => { if (!c) free.push(k); }); if (!free.length) return -1; i = pick(free); gr[i] = { id, u: [] }; }

function pop(x, y, txt, col, big) { G.pops.push({ x, y, txt: String(txt), col, big, t: 0 }); if (G.pops.length > 70) G.pops.shift(); }

function burst(x, y, col, n = 6, sp = 60) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.283), s = rnd(.4, 1) * sp; G.fx.push({ k: 'dot', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, col, t: 0, life: rnd(.2, .45), sz: Math.random() < .4 ? 2 : 1 }); } }
function hit(m, dmg, H0) { if (m.hp <= 0) return; const crit = Math.random() < .1; if (crit) dmg *= 2; dmg = Math.round(dmg); m.hp -= dmg; m.flash = .1; if (H0.slow) m.slow = 1.5;
  pop(m.x + rnd(-6, 6), m.y - 34, dmg, crit ? '#ffd23c' : '#ffffff', crit); if (m.hp <= 0) { G.coin += m.gold; pop(m.x, m.y - 20, '+' + m.gold, '#ffd23c'); burst(m.x, m.y - 14, '#ffffff', 8, 70); burst(m.x, m.y - 14, '#ffd23c', 3, 40); } }
/* ---------- update */
function tick(dt) {

  for (const m of G.mobs) { m.slow = Math.max(0, m.slow - dt); m.flash = Math.max(0, m.flash - dt); m.at += dt; m.s += m.spd * (m.slow > 0 ? .55 : 1) * dt; const p = pathAt(m.s); m.x = p[0]; m.y = p[1]; if (p[2]) m.fx = p[2]; }
  G.mobs = G.mobs.filter(m => m.hp > 0); if (G.mobs.length >= G.limit) G.over = true;
  for (let b = 0; b < 2; b++) G.grid[b].forEach((c, i) => { if (!c) return; const H0 = HERO[c.id], [cx, cy] = cellXY(b, i);
    for (const u of c.u) { u.cd -= dt; u.pop = Math.max(0, u.pop - dt); u.atk = Math.max(0, (u.atk || 0) - dt); if (u.cd > 0) continue; let best = null, bs = -1;
      for (const m of G.mobs) { const d = Math.hypot(m.x - cx, m.y - 12 - cy); if (d < H0.rng && m.s > bs) { bs = m.s; best = m; } }
      if (best) { u.cd = H0.cd * rnd(.92, 1.08); u.atk = .16; G.shots.push({ k: H0.k, x: cx, y: cy - 26, m: best, H0, t: 0, sp: H0.k === 'slash' ? 520 : 300 }); } } });
  for (let i = G.shots.length - 1; i >= 0; i--) { const s = G.shots[i], tx = s.m.x, ty = s.m.y - 16, dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy), st = s.sp * dt; s.t += dt;
    if (d <= st || s.m.hp <= 0) { G.shots.splice(i, 1); if (s.m.hp > 0) { hit(s.m, s.H0.dmg, s.H0); const col = { arrow: '#fff4c8', ice: '#9ae8ff', fire: '#ff9a3c', holy: '#ffe27a', slash: '#ffffff' }[s.k]; burst(tx, ty, col, s.H0.aoe ? 10 : 4, s.H0.aoe ? 90 : 50);
        if (s.H0.aoe) { ring(tx, ty, col, s.H0.aoe); for (const m of G.mobs) if (m !== s.m && Math.hypot(m.x - tx, m.y - 16 - ty) < s.H0.aoe) hit(m, s.H0.dmg * .6, s.H0); } } continue; }
    s.x += dx / d * st; s.y += dy / d * st; s.a = Math.atan2(dy, dx); }
  for (const f of G.fx) { f.t += dt; if (f.k === 'dot') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; } } G.fx = G.fx.filter(f => f.t < f.life);
  for (const p of G.pops) p.t += dt; G.pops = G.pops.filter(p => p.t < .7);

}
/* ---------- drawing: pixel shapes on lo, text jobs for hi */
const TX = [];
function T(txt, x, y, size, col = '#fff', align = 'left', wt = 800, stroke = '#12202a') { TX.push([String(txt), x, y, size, col, align, wt, stroke]); }
function rr(x, y, w, h, r, col) { g.fillStyle = col; g.fillRect(x + r, y, w - 2 * r, h); g.fillRect(x, y + r, w, h - 2 * r); if (r > 1) { g.fillRect(x + 1, y + 1, w - 2, h - 2); } }   /* chunky rounded box */

function button(x, y, w, h, c1, c2, c3, down) { rr(x, y + (down ? 2 : 0), w, h + 3 - (down ? 2 : 0), 4, '#0b1a20'); rr(x + 1, y + 4, w - 2, h - 2, 3, c3); rr(x + 1, y + 1 + (down ? 2 : 0), w - 2, h - 3, 3, c2); g.fillStyle = c1; g.fillRect(x + 4, y + 2 + (down ? 2 : 0), w - 8, 2); }
const DIG = { 0: '111101101101111', 1: '010110010010111', 2: '111001111100111', 3: '111001111001111', 4: '101101111001001', 5: '111100111001111', 6: '111100111101111', 7: '111001010010010', 8: '111101111101111', 9: '111101111001111', '+': '000010111010000', '/': '001001010100100', ':': '000010000010000' };

const ICN = { coin: [['.oooo.', 'oyyywo', 'oywyyo', 'oyyyyo', 'oyyydo', '.oooo.'], { o: '#6b3a10', y: '#ffc93c', w: '#fff3b0', d: '#e09a1c' }], clover: [['.gg.gg.', 'gllglhg', 'glggglg', '.ggdgg.', 'gllglhg', 'glggglg', '.gg.dd.'], { g: '#1d6b2c', l: '#5fd45a', h: '#c8ffb0', d: '#0e3a18' }],
  skull: [['.wwww.', 'wwwwww', 'wdwwdw', 'wwwwww', '.wddw.', '.w..w.'], { w: '#f2f2f2', d: '#22262e' }], heart: [['.rr.rr.', 'rwrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r: '#ff4a6a', w: '#ffd0d8' }] };

function drawHero(id, x, y, u, sel) { const m = META.heroes.heroes[id], C = META.heroes.cell, bob = Math.floor((G.t * 2.2 + u.bob) % 2) ? 0 : 1, up = u.pop > 0 ? Math.round(Math.sin(u.pop / .25 * Math.PI) * 6) : 0, lunge = u.atk > 0 ? 2 : 0;

function drawMob(m) { const M = META['m_' + m.type], im = IMG['m_' + m.type]; if (!M || !im) return; const n = M.anims.walk.n, f = Math.floor(m.at * 9) % n, x = Math.round(m.x - M.ax), y = Math.round(m.y - M.ay + 6);
