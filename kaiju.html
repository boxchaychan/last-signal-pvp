<title>อสูรถล่มเมือง · เทส 3D พิกเซล</title>
<!--
  Kaiju city smasher: FREE 3D-pixel test (owner 2026-11-15 "ผมทำเทส 3D พิกเซลก่อน (ฟรี) เป็นเมืองกล่องหนึ่งบล็อก ล็อกกล้องมุมเฉียง").
  three.js renders a small box city into a LOW-RESOLUTION target (1 render pixel = 1 pixel of the kaiju sprite), a post pass draws
  dark outlines + light top edges from the depth buffer, the browser enlarges it with nearest-neighbour = chunky pixels.
  Camera is LOCKED (no rotation): 4 preset angles to pick the one PixelLab should draw the 8-direction kaiju for; zoom only.
  Kaiju = 2D cut-out standing upright, always facing the camera: the owner's GPT 4-view sheet (right, left, front, back three-quarter),
  picked by the walking direction on screen; 8 directions later from PixelLab. Everything else (buildings, windows, roads, trees, cars, dust, fire) is code.
  URL: ?cam=0..3 (A 30 / B 45 / C 60 / D straight 40), ?z=0..3 zoom, ?k=128 (default, ~128 px kaiju) | 16 (the 204 px set) | 96 (oldest),
  ?ol=0 no outlines, ?seed=N city.
  Keys: WASD / arrows walk, J or Space stomp, K hold breath, C camera, Q / E zoom, V kaiju 128 <-> 204, O outlines.
  QA hooks: window.KJ (ready, hold, step(dt), draw(), K, B, stomp(), fire(on), setCam(i), zoom(i), info()).
  three.js r147 (MIT) is vendored in vendor/threejs/. Font: Kanit (SIL OFL, vendor/kanit).
-->
<style>
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  @font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-thai-800-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #5f9a48; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Kanit, sans-serif; color: #fff; }
  #hud > * { pointer-events: auto; }
  .pn { position: fixed; background: #241a36e0; border: 2px solid #0f0918; border-radius: 12px; box-shadow: inset 0 -3px 0 #0007, inset 0 2px 0 #ffffff1c; }
  #tl { left: calc(8px + env(safe-area-inset-left)); top: 8px; padding: 5px 12px 8px; min-width: 150px; }
  #tl .t { font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: .3px; text-shadow: 0 2px 0 #0008; }
  #tl .t small { font-weight: 600; font-size: 11px; color: #c9b5f0; margin-left: 4px; }
  #bar { height: 9px; margin-top: 5px; background: #0d0816; border-radius: 5px; overflow: hidden; border: 1px solid #000; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(#e7a2ff, #9a3cf0); }
  #pct { font-size: 12px; font-weight: 600; margin-top: 3px; color: #f1e6ff; }
  #tr { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  .b { font: 600 13px Kanit, sans-serif; color: #fff; background: #2b2140ee; border: 2px solid #0f0918; border-radius: 10px; padding: 5px 10px; box-shadow: inset 0 -3px 0 #0008, inset 0 2px 0 #ffffff24; cursor: pointer; }
  .b.sq { width: 36px; padding: 5px 0; font-weight: 800; font-size: 16px; }
  .b:active, .b.on { transform: translateY(2px); box-shadow: inset 0 -1px 0 #0008; }
  .r { position: fixed; border-radius: 50%; font: 800 17px Kanit, sans-serif; color: #fff; text-shadow: 0 2px 0 #0009; border: 3px solid #160b26; cursor: pointer;
       box-shadow: 0 5px 0 #160b26, inset 0 4px 0 #ffffff50, inset 0 -6px 0 #0004; }
  .r.on { transform: translateY(4px); box-shadow: 0 1px 0 #160b26, inset 0 4px 0 #ffffff30; }
  #bStomp { right: calc(20px + env(safe-area-inset-right)); bottom: 24px; width: 98px; height: 98px; background: radial-gradient(circle at 50% 32%, #c58cff, #6f2bc4 70%); }

  #joyB { position: fixed; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: #ffffff1c; border: 3px solid #ffffff55; display: none; pointer-events: none; }

  #hint { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: #fff; background: #1a1228b8; padding: 3px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; }
  #msg { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%); font-weight: 800; font-size: 22px; text-align: center; text-shadow: 0 3px 0 #000a, 0 0 12px #8a3cff; pointer-events: none; transition: opacity .6s; white-space: nowrap; }
  #msg small { display: block; font-size: 14px; font-weight: 600; }

  @media (pointer: coarse) { #hint { display: none; } }

<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="tl" class="pn"><div class="t">อสูรถล่มเมือง<small>เทส 3D พิกเซล</small></div><div id="bar"><i></i></div><div id="pct">ถล่ม 0%</div></div>
  <div id="tr"><button id="bCam" class="b">มุมกล้อง</button><button id="bZo" class="b sq">−</button><button id="bZi" class="b sq">+</button><button id="bK" class="b">อสูร</button><button id="bOl" class="b">เส้นขอบ</button></div>
  <div id="joyB"><div id="joyK"></div></div>
  <button id="bFire" class="r">พ่นไฟ</button>
  <button id="bStomp" class="r">เหยียบ</button>
  <div id="hint">WASD / ลูกศร เดิน · J หรือ Space เหยียบ · ค้าง K พ่นไฟ · C เปลี่ยนมุมกล้อง · Q / E ซูม</div>

</div>
<div id="load">กำลังสร้างเมือง…</div>
<script src="vendor/threejs/three.min.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const qi = (k, lo, hi, d) => { const v = parseInt(Q.get(k), 10); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); };
const V3 = THREE.Vector3, D2R = Math.PI / 180;
const $ = id => document.getElementById(id);

// ---------- settings
const CAMS = [ { n: 'A · ต่ำ 30°', p: 30, y: 45 }, { n: 'B · 45°', p: 45, y: 45 }, { n: 'C · สูง 60°', p: 60, y: 45 }, { n: 'D · ตรง 40°', p: 40, y: 0 } ];
let camI = qi('cam', 0, 3, 1);
const ZOOMS = [38, 50, 64, 84];          // world units visible top to bottom
let zoomI = qi('z', 0, 3, 2);
const KS = ['96', '16', '128'].includes(Q.get('k')) ? Q.get('k') : '128';   // 128 = default (owner "เอา 128"), 16 = the big 204 px set, 96 = oldest
const M4 = { side: [.93, .38], sideL: [.07, .38], front: [.49, .47], back: [.88, .3] };
const MOUTH = { '16': M4, '128': M4, '96': { side: [.92, .35], front: [.5, .47] } };
const VIEWS = KS === '96' ? ['side', 'front'] : ['side', 'sideL', 'front', 'back'];
const KLABEL = { '128': 'อสูร 128', '16': 'อสูร 204', '96': 'อสูร 96' };
let OUTL = Q.get('ol') !== '0';
const KH = 24;                           // kaiju height in world units (buildings: 3 per floor)
const BAY = 2.5, FH = 3;                 // window bay width / floor height
const BS = 26, RW = 10, NB = 4, PER = BS + RW, CITY = NB * PER + RW, HALF = CITY / 2, G = 230;
const KR = 4.5, KSPD = 12, SR = 13, BR = 30, STOMP = .5;
const SEED = qi('seed', 1, 1e9, 7);

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R0 = rng(SEED);
function hash2(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctex(c, rep) { const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
function mixc(a, b, k) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }
function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('โหลดไม่ได้: ' + src)); im.src = src; }); }

// ---------- renderer, low-res target, outline pass
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5f9a48);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 900);
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postM = new THREE.ShaderMaterial({
  uniforms: { tC: { value: null }, tD: { value: null }, res: { value: new THREE.Vector2(1, 1) }, nf: { value: new THREE.Vector2(1, 900) }, thr: { value: .6 }, ol: { value: 1 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform sampler2D tD; uniform vec2 res; uniform vec2 nf; uniform float thr; uniform float ol; varying vec2 vUv;
    float D(vec2 o){ return nf.x + texture2D(tD, vUv + o / res).r * (nf.y - nf.x); }
    void main(){
      vec3 c = texture2D(tC, vUv).rgb;
      if (ol > .5) {
        float d = D(vec2(0.));
        float m = max(max(d - D(vec2(1., 0.)), d - D(vec2(-1., 0.))), max(d - D(vec2(0., 1.)), d - D(vec2(0., -1.))));
        if (m > thr) c = c * .36 + vec3(.04, .02, .08);
        else if (D(vec2(0., 1.)) - d > thr) c = min(c * 1.22 + .05, vec3(1.));
      }
      gl_FragColor = vec4(c, 1.);
    }`,
  depthTest: false, depthWrite: false });
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postM));

const SSTEP = [1, 1.5, 2, 3, 4, 5, 6];
const BASE_U = 24 / 204;   // the 204 px set: its default zoom decides the screen pixel size for all sets   // device pixels per game pixel (1.5 only matters on sharp phone screens)
let U = .125, T = 8, rw = 2, rh = 2, S = 2, zS = 0, rt = null, pitch = 0, yaw = 0;
const R = new V3(), F = new V3(), UPV = new V3(), TOC = new V3();

function layout() {
  const dpr = window.devicePixelRatio || 1, dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  const want = ZOOMS[zoomI] / BASE_U;   // pixel size on screen is the same for every kaiju set (owner "ไม่ต้องขยาย": the 128 kaiju is not blown up)
  S = zS || SSTEP.reduce((a, v) => Math.abs(v - dh / want) < Math.abs(a - dh / want) ? v : a, 2);
  const fit = () => { rh = Math.ceil(dh / S); rh += rh & 1; rw = Math.ceil(dw / S); rw += rw & 1; };
  fit(); while (rw * rh > 1400000) { S = SSTEP[Math.min(SSTEP.length - 1, SSTEP.indexOf(S) + 1)]; fit(); if (S === SSTEP[SSTEP.length - 1]) break; }
  zS = S;
  renderer.setSize(rw, rh, false);
  const cw = rw * S / dpr, ch = rh * S / dpr;
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: ((innerWidth - cw) / 2) + 'px', top: ((innerHeight - ch) / 2) + 'px' });
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  rt = new THREE.WebGLRenderTarget(rw, rh, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  rt.texture.generateMipmaps = false;
  rt.depthTexture = new THREE.DepthTexture(rw, rh); rt.depthTexture.type = THREE.UnsignedIntType;
  postM.uniforms.tC.value = rt.texture; postM.uniforms.tD.value = rt.depthTexture; postM.uniforms.res.value.set(rw, rh);
  cam.left = -rw / 2 * U; cam.right = rw / 2 * U; cam.top = rh / 2 * U; cam.bottom = -rh / 2 * U; cam.updateProjectionMatrix();
  postM.uniforms.nf.value.set(cam.near, cam.far);
}

function setCam(i) {
  camI = (i + CAMS.length) % CAMS.length; const c = CAMS[camI];
  pitch = c.p * D2R; yaw = c.y * D2R;
  TOC.set(Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw));
  R.set(Math.cos(yaw), 0, -Math.sin(yaw)); F.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  UPV.set(-Math.sin(pitch) * Math.sin(yaw), Math.cos(pitch), -Math.sin(pitch) * Math.cos(yaw));
  cam.up.copy(UPV);
  postM.uniforms.thr.value = Math.max(5 * U, .5);
  $('bCam').textContent = 'มุมกล้อง ' + c.n;
  if (kMesh) { kMesh.rotation.y = yaw; kSil.rotation.y = yaw; kBlob.rotation.y = yaw; }
}

// ---------- lights
scene.add(new THREE.HemisphereLight(0xe8eeff, 0x9a8a9a, .62));
const sun = new THREE.DirectionalLight(0xfff1dc, .5);
sun.position.set(-50, 100, 70); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -122, right: 122, top: 122, bottom: -122, near: 1, far: 400 });
sun.shadow.bias = -.0006; sun.shadow.normalBias = .04;
scene.add(sun); scene.add(sun.target);

// ---------- city layout helpers
const roadC = k => -HALF + RW / 2 + k * PER;   // centre line of road k (0..NB)
const blockO = i => -HALF + RW + i * PER;      // min corner of block i (0..NB-1)
const PARK = new Set(['0,3', '3,0']);

const STY = [
  { wall: '#6f8fb5', frame: '#4b6488', win: '#24365a', lit: '#a8dcff', roof: '#7c8798', cap: '#b9c8dc', glass: 1 },
  { wall: '#e6cf9e', frame: '#b39a6c', win: '#33405e', lit: '#ffd97a', roof: '#a1937f', cap: '#f6ead0' },
  { wall: '#b8573d', frame: '#7d3527', win: '#2b2640', lit: '#ffcf6e', roof: '#6e5e58', cap: '#dd9474' },
  { wall: '#7fc6ae', frame: '#4f9481', win: '#25455a', lit: '#e0fff2', roof: '#83958f', cap: '#c3eedf' },
  { wall: '#e7a3ad', frame: '#b46f7c', win: '#373250', lit: '#ffe08a', roof: '#9b8a8f', cap: '#f8d6db' },
  { wall: '#e4e2ec', frame: '#a3a1b5', win: '#3c5683', lit: '#c4e8ff', roof: '#8e8c99', cap: '#ffffff', glass: 1 },
  { wall: '#f1e3c6', frame: '#a08a6a', win: '#3e4f73', lit: '#ffe9a0', roof: '#a39486', cap: '#fff4dc', shop: '#e05a4f' },
  { wall: '#d9e4f0', frame: '#8796aa', win: '#334766', lit: '#fff0b0', roof: '#97a0ab', cap: '#f4f8ff', shop: '#2fa79b' },
];

function wallTex(sty) {
  const bw = Math.round(BAY * T), fh = Math.round(FH * T), W = bw * 4, H = fh * 4, c = mkC(W, H), x = c.getContext('2d'), r = rng(SEED + bw * 7 + sty.wall.length);
  x.fillStyle = sty.wall; x.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H * .05; i++) { x.fillStyle = r() < .5 ? mixc(sty.wall, '#000000', .08) : mixc(sty.wall, '#ffffff', .1); x.fillRect(r() * W | 0, r() * H | 0, 1, 1); }
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
    const y0 = H - (j + 1) * fh, x0 = i * bw;
    if (sty.shop && j === 0) {                                    // shop front + striped awning
      const ay = y0 + Math.round(fh * .1), ah = Math.max(2, Math.round(fh * .2)), st = Math.max(1, Math.round(T * .35));
      for (let k = 0; k < bw; k += st * 2) { x.fillStyle = sty.shop; x.fillRect(x0 + k, ay, st, ah); x.fillStyle = '#fff7ea'; x.fillRect(x0 + k + st, ay, st, ah); }
      x.fillStyle = mixc(sty.shop, '#000000', .35); x.fillRect(x0, ay + ah, bw, 1);
      const gy = ay + ah + 2, gh = y0 + fh - gy - 1;
      x.fillStyle = sty.frame; x.fillRect(x0 + 1, gy - 1, bw - 2, gh + 1);
      x.fillStyle = i % 2 ? sty.lit : sty.win; x.fillRect(x0 + 2, gy, bw - 4, gh - 1);
      x.fillStyle = mixc(sty.win, '#ffffff', .4); x.fillRect(x0 + 2, gy, bw - 4, 1);
      continue;
    }
    if (sty.glass) {                                              // glass bands with mullions + diagonal glints
      x.fillStyle = sty.frame; x.fillRect(x0, y0 + fh - Math.max(1, Math.round(fh * .14)), bw, Math.max(1, Math.round(fh * .14)));
      const gy = y0 + Math.round(fh * .08), gh = Math.round(fh * .76);
      const lit = r() < .14;
      x.fillStyle = lit ? sty.lit : sty.win; x.fillRect(x0 + 1, gy, bw - 1, gh);
      x.fillStyle = mixc(lit ? sty.lit : sty.win, '#ffffff', .28);
      for (let k = 0; k < gh; k++) { const gx = x0 + 1 + Math.round((gh - k) * .6) + (j * 3 + i * 5) % bw; if (gx < x0 + bw) x.fillRect(gx, gy + k, Math.max(1, Math.round(T * .2)), 1); }
      x.fillStyle = sty.frame; x.fillRect(x0, gy, 1, gh);
      continue;
    }
    const ww = Math.max(2, Math.round(bw * .5)), wh = Math.max(3, Math.round(fh * .48));
    const wx = x0 + Math.round((bw - ww) / 2), wy = y0 + Math.round(fh * .2);
    x.fillStyle = sty.frame; x.fillRect(wx - 1, wy - 1, ww + 2, wh + 2);
    const lit = r() < .16;
    x.fillStyle = lit ? sty.lit : sty.win; x.fillRect(wx, wy, ww, wh);
    x.fillStyle = lit ? '#fff8dc' : mixc(sty.win, '#ffffff', .35); x.fillRect(wx, wy, ww, 1); x.fillRect(wx, wy, 1, Math.max(1, wh >> 2));
    if (!lit && r() < .3) { x.fillStyle = mixc(sty.cap, sty.win, .3); x.fillRect(wx + ww - Math.max(1, ww >> 2), wy + 1, Math.max(1, ww >> 2), wh - 1); }   // curtain
    x.fillStyle = sty.cap; x.fillRect(wx - 1, wy + wh + 1, ww + 2, 1);
  }
  return ctex(c, true);
}

function roofTex(w, d, sty, r) {
  const W = Math.max(4, Math.round(w * T)), H = Math.max(4, Math.round(d * T)), c = mkC(W, H), x = c.getContext('2d');
  x.fillStyle = sty.roof; x.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H * .06; i++) { x.fillStyle = r() < .6 ? mixc(sty.roof, '#000000', .1) : mixc(sty.roof, '#ffffff', .12); x.fillRect(r() * W | 0, r() * H | 0, 1, 1); }
  const pw = Math.max(1, Math.round(T * .35));
  x.fillStyle = sty.cap; x.fillRect(0, 0, W, pw); x.fillRect(0, H - pw, W, pw); x.fillRect(0, 0, pw, H); x.fillRect(W - pw, 0, pw, H);
  x.fillStyle = mixc(sty.roof, '#000000', .3); x.fillRect(pw, pw, W - 2 * pw, 1); x.fillRect(pw, pw, 1, H - 2 * pw);
  const vents = 1 + (r() * 3 | 0);
  for (let i = 0; i < vents; i++) { const s = Math.max(2, Math.round(T * .6)); const vx = pw + 2 + r() * (W - 2 * pw - s - 4) | 0, vy = pw + 2 + r() * (H - 2 * pw - s - 4) | 0; x.fillStyle = '#4b4a58'; x.fillRect(vx, vy, s, s); x.fillStyle = '#8f8ea0'; x.fillRect(vx, vy, s, 1); }
  if (sty.glass && w >= 10 && d >= 10) {                          // helipad
    const cx = W / 2, cy = H / 2, rr = Math.min(W, H) * .3;

// ---------- ground painted in code
function paintGround() {
  const N = Math.round(G * T), c = mkC(N, N), x = c.getContext('2d'), id = x.createImageData(N, N), d = id.data;
  const GR = [108, 170, 80], GD = [94, 152, 70], GL = [128, 188, 94], PK = [96, 174, 74];
  const AS = [72, 72, 88], AD = [64, 64, 80], AL = [86, 86, 102];
  const SW = [190, 184, 176], SS = [170, 164, 158], CB = [126, 120, 130], LT = [156, 150, 146], LD = [144, 138, 136];
  const FL = [[255, 255, 255], [255, 214, 92], [255, 150, 190]];
  const seam = Math.max(2, Math.round(2 * T));
  for (let py = 0; py < N; py++) {
    const wz = (py + .5) / T - G / 2;
    for (let px = 0; px < N; px++) {
      const wx = (px + .5) / T - G / 2, h = hash2(px, py); let col;
      if (wx <= -HALF || wx >= HALF || wz <= -HALF || wz >= HALF) {
        col = h < .07 ? GD : h > .965 ? GL : GR;
        if (h > .9985) col = FL[(h * 1e5 | 0) % 3];
      } else {
        const u = wx + HALF, v = wz + HALF, ru = u % PER, rv = v % PER;
        if (ru < RW || rv < RW) col = h < .05 ? AD : h > .975 ? AL : AS;
        else {
          const bi = u / PER | 0, bj = v / PER | 0, lx = ru - RW, lz = rv - RW;
          const e = Math.min(lx, lz, BS - lx, BS - lz);
          if (e < 2) {
            if (e < .3) col = CB;
            else col = (((u * T | 0) % seam === 0) || ((v * T | 0) % seam === 0)) ? SS : (h < .04 ? SS : SW);
          } else if (PARK.has(bi + ',' + bj)) { col = h < .07 ? GD : h > .97 ? GL : PK; if (h > .996) col = FL[(h * 1e5 | 0) % 3]; }
          else col = h < .06 ? LD : LT;
        }
      }
      const o = (py * N + px) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
    }
  }
  x.putImageData(id, 0, 0);
  const W2T = v => Math.round((v + G / 2) * T);
  const rect = (x0, z0, x1, z1, fill) => { x.fillStyle = fill; const a = W2T(x0), b = W2T(z0); x.fillRect(a, b, Math.max(1, W2T(x1) - a), Math.max(1, W2T(z1) - b)); };
  for (let k = 0; k <= NB; k++) {
    const rc = roadC(k);
    for (let m = 0; m < NB; m++) {
      const a = roadC(m) + RW / 2 + 3.2, b = roadC(m + 1) - RW / 2 - 3.2;
      for (let p = a; p < b; p += 5.5) { rect(p, rc - .2, Math.min(p + 3, b), rc + .2, '#e8c548'); rect(rc - .2, p, rc + .2, Math.min(p + 3, b), '#e8c548'); }
    }
  }
  for (let a = 0; a <= NB; a++) for (let b = 0; b <= NB; b++) {
    const cx = roadC(a), cz = roadC(b), e0 = RW / 2 + .6, e1 = RW / 2 + 2.4;
    for (let s = -RW / 2 + .7; s < RW / 2 - .6; s += 1.3) {
      if (cx + e1 < HALF) rect(cx + e0, cz + s, cx + e1, cz + s + .65, '#f2f2f2');
      if (cx - e1 > -HALF) rect(cx - e1, cz + s, cx - e0, cz + s + .65, '#f2f2f2');
      if (cz + e1 < HALF) rect(cx + s, cz + e0, cx + s + .65, cz + e1, '#f2f2f2');
      if (cz - e1 > -HALF) rect(cx + s, cz - e1, cx + s + .65, cz - e0, '#f2f2f2');
    }
  }
  return ctex(c, false);
}

const B = [], TREES = [], CARS = [];

function addBuilding(cx, cz, w, d, floors, si, r) {

  const wallM = new THREE.MeshLambertMaterial({ map: styleTex[si] });

  const body = new THREE.Mesh(geo, [wallM, wallM, roofM, wallM, wallM, wallM]);

      m.position.set((r() - .5) * Math.max(0, w - 4), h + hh / 2, (r() - .5) * Math.max(0, d - 4));

}

function buildCity() {
  const r = rng(SEED * 31 + 5);
  for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {
    const ox = blockO(i), oz = blockO(j);
    if (PARK.has(i + ',' + j)) {
      for (let k = 0; k < 16; k++) addTree(ox + 4 + r() * (BS - 8), oz + 4 + r() * (BS - 8), .8 + r() * .5);
      continue;
    }
    const central = (i === 1 || i === 2) && (j === 1 || j === 2);
    const a0 = ox + 2, b0 = oz + 2, IN = BS - 4;
    if (r() < (central ? .35 : .15)) {                            // one big building fills the block
      const w = 6 * BAY, d = 6 * BAY, fl = central ? 4 + (r() * 2 | 0) : 3 + (r() * 2 | 0);
      addBuilding(a0 + IN / 2, b0 + IN / 2, w, d, fl, [0, 5, 3][r() * 3 | 0], r);
      continue;
    }
    const cxs = 9 + (r() * 5 | 0), czs = 9 + (r() * 5 | 0);
    const cells = [[a0, b0, cxs, czs], [a0 + cxs, b0, IN - cxs, czs], [a0, b0 + czs, cxs, IN - czs], [a0 + cxs, b0 + czs, IN - cxs, IN - czs]];
    for (const [x0, z0, cw, cd] of cells) {
      if (r() < .1) { addTree(x0 + cw / 2, z0 + cd / 2, 1 + r() * .3); continue; }
      const w = Math.max(2, Math.floor((cw - 1.5) / BAY)) * BAY, d = Math.max(2, Math.floor((cd - 1.5) / BAY)) * BAY;
      let fl = central ? 2 + (r() * 4 | 0) : 1 + (r() * 3 | 0);
      let si = fl <= 2 ? (r() < .65 ? 6 + (r() * 2 | 0) : 1 + (r() * 4 | 0)) : (r() * 6 | 0);
      if (si >= 6) fl = Math.min(fl, 3);
      addBuilding(x0 + cw / 2, z0 + cd / 2, w, d, fl, si, r);
    }
  }
  // street trees on some sidewalks + a ring of trees outside the city
  for (let i = 0; i < NB; i++) for (let j = 0; j < NB; j++) {
    if (PARK.has(i + ',' + j) || r() < .5) continue;
    const ox = blockO(i), oz = blockO(j);
    for (let p = 4; p < BS - 2; p += 7) addTree(ox + p, oz + 1, .7);
  }
  for (let k = 0; k < 90; k++) {
    const a = r() * Math.PI * 2, rr = HALF + 6 + r() * (G / 2 - HALF - 8);
    const x = Math.max(-G / 2 + 3, Math.min(G / 2 - 3, Math.cos(a) * rr * 1.2)), z = Math.max(-G / 2 + 3, Math.min(G / 2 - 3, Math.sin(a) * rr * 1.2));
    if (Math.abs(x) < HALF + 3 && Math.abs(z) < HALF + 3) continue;
    addTree(x, z, .9 + r() * .6);
  }
}

// ---------- pixel particles (square points, dithered fade)
const MAXP = 2400;
const pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3), pSize = new Float32Array(MAXP), pAl = new Float32Array(MAXP);
const PHALF = MAXP / 2;   // first half: dust (hidden behind buildings), second half: fire (always drawn on top)
const pV = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP), pS0 = new Float32Array(MAXP), pKind = new Uint8Array(MAXP), pGrav = new Float32Array(MAXP), pDrag = new Float32Array(MAXP);
let pN = 0, pF = PHALF, pGeo, pGeoF;
function buildParticles() {
  pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('pcol', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('psize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('palpha', new THREE.BufferAttribute(pAl, 1).setUsage(THREE.DynamicDrawUsage));
  pGeoF = new THREE.BufferGeometry(); for (const n of ['position', 'pcol', 'psize', 'palpha']) pGeoF.setAttribute(n, pGeo.attributes[n]);
  pGeo.setDrawRange(0, PHALF); pGeoF.setDrawRange(PHALF, PHALF);
  const m = new THREE.ShaderMaterial({
    vertexShader: 'attribute vec3 pcol; attribute float psize; attribute float palpha; varying vec3 vC; varying float vA; void main(){ vC = pcol; vA = palpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_PointSize = palpha > .01 ? psize : 0.; }',
    fragmentShader: `varying vec3 vC; varying float vA;
      float b2(vec2 a){ return mod(2. * a.x + 3. * a.y, 4.); }
      void main(){ vec2 p = floor(gl_FragCoord.xy); float th = (4. * b2(mod(p, 2.)) + b2(mod(floor(p * .5), 2.)) + .5) / 16.;
        if (vA < th) discard; gl_FragColor = vec4(vC, 1.); }`,
    depthWrite: false });
  const pts = new THREE.Points(pGeo, m); pts.frustumCulled = false; pts.renderOrder = 6; scene.add(pts);
  const mf = m.clone(); mf.depthTest = false;
  const ptsF = new THREE.Points(pGeoF, mf); ptsF.frustumCulled = false; ptsF.renderOrder = 12; scene.add(ptsF);
}
function spawnP(x, y, z, vx, vy, vz, life, size, col, kind, grav, drag) {
  let i; if (kind === 1) { i = pF; pF = pF + 1 >= MAXP ? PHALF : pF + 1; } else { i = pN; pN = (pN + 1) % PHALF; }
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z; pV[i * 3] = vx; pV[i * 3 + 1] = vy; pV[i * 3 + 2] = vz;
  pLife[i] = pMax[i] = life; pS0[i] = size; pKind[i] = kind; pGrav[i] = grav; pDrag[i] = drag;
  pCol[i * 3] = col[0]; pCol[i * 3 + 1] = col[1]; pCol[i * 3 + 2] = col[2]; pAl[i] = 1; pSize[i] = size;
}
const FIRE_RAMP = [[.97, .93, 1], [.9, .45, 1], [.62, .24, 1], [.29, .11, .48]];
function spawnFire(x, y, z, vx, vy, vz, life, big) { spawnP(x, y, z, vx, vy, vz, life, (big ? 6 : 3) + Math.random() * 4, FIRE_RAMP[0], 1, -2, .6); }
function dust(x, y, z, vx, vy, vz, life, col) { spawnP(x, y, z, vx, vy, vz, life, 5 + Math.random() * 6, col || [.83, .78, .7], 0, -1, 1.6); }
function updParticles(dt) {
  const px = Math.min(1, .118 / U);   // sizes in render pixels: the big set has finer pixels
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { pAl[i] = 0; continue; }
    pLife[i] -= dt; const k = 1 - pLife[i] / pMax[i];
    const dr = Math.max(0, 1 - pDrag[i] * dt);
    pV[i * 3] *= dr; pV[i * 3 + 2] *= dr; pV[i * 3 + 1] = pV[i * 3 + 1] * dr - pGrav[i] * dt;
    pPos[i * 3] += pV[i * 3] * dt; pPos[i * 3 + 1] += pV[i * 3 + 1] * dt; pPos[i * 3 + 2] += pV[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0) { pPos[i * 3 + 1] = 0; pV[i * 3 + 1] *= -.25; pV[i * 3] *= .7; pV[i * 3 + 2] *= .7; }
    if (pKind[i] === 1) { const c = FIRE_RAMP[Math.min(3, k * 4.2 | 0)]; pCol[i * 3] = c[0]; pCol[i * 3 + 1] = c[1]; pCol[i * 3 + 2] = c[2]; pSize[i] = pS0[i] * (1 + k * .8) * px * 1.6; pAl[i] = 1 - k * k; }
    else { pSize[i] = pS0[i] * (1 + k * 1.3) * px * 1.6; pAl[i] = 1.15 - k * 1.1; }
    if (pLife[i] <= 0) pAl[i] = 0;
  }
  for (const n of ['position', 'pcol', 'psize', 'palpha']) pGeo.attributes[n].needsUpdate = true;
}

      K.x = qx + ex / el * KR; K.z = qz + ez / el * KR;
      if (K.moving) hurt(b, 16 * dt, K.x, K.z, 'push');
    }
  }
  K.x = Math.max(-HALF - 8, Math.min(HALF + 8, K.x)); K.z = Math.max(-HALF - 8, Math.min(HALF + 8, K.z));
  if (K.moving) {
    TREES.forEach((t, i) => { if (t.alive && Math.hypot(t.x - K.x, t.z - K.z) < KR + .5) { knockTree(i, K.x, K.z, false); treeDirty = true; sfx('pop'); } });
    for (const c of CARS) if (c.alive && Math.hypot(c.x - K.x, c.z - K.z) < KR + 1.2) flingCar(c, K.x, K.z);
  }
  // stomp
  if (K.stompT > 0) {
    K.stompT -= dt; const t = 1 - K.stompT / STOMP, HOP = Math.round(SPR.side.body * .1);
    K.hopPx = t < .45 ? Math.round(Math.sin(t / .45 * Math.PI / 2) * HOP) : t < .55 ? Math.round(HOP * (1 - (t - .45) / .1)) : 0;
    if (!K.hit && t >= .55) { K.hit = true; impact(); }
    if (K.stompT <= 0) { K.stompT = 0; K.hopPx = 0; }
  }
  if (K.sq > 0) K.sq = Math.max(0, K.sq - dt);
  // breath
  K.breath = fireHeld && K.stompT <= 0; if (kMesh) embers(dt);
  const breathing = K.breath;
  if (breathing) { breath(dt); if (!fireOn) { fireOn = true; au(); fireSnd(true); } } else if (fireOn) { fireOn = false; fireSnd(false); }
  pickSprite();
  // buildings
  for (const b of B) {
    if (b.st === 0) {
      if (b.shake > 0) { b.shake = Math.max(0, b.shake - dt); b.g.position.x = b.x + (Math.random() - .5) * b.shake * 1.2; b.g.position.z = b.z + (Math.random() - .5) * b.shake * 1.2; if (b.shake === 0) b.g.position.set(b.x, 0, b.z); }
      if (b.fire > 0) {
        b.fire -= dt; hurt(b, 3 * dt, b.x, b.z, 'fire'); b.fire = Math.max(0, b.fire - dt);
        if (Math.random() < dt * 30) spawnFire(b.x + (Math.random() - .5) * b.w * .8, b.h + .5, b.z + (Math.random() - .5) * b.d * .8, (Math.random() - .5) * 2, 5 + Math.random() * 6, (Math.random() - .5) * 2, .6 + Math.random() * .5, Math.random() < .3);
      }
    } else if (b.st === 1) {
      b.t += dt; const e = Math.min(1, b.t / 1.4);
      b.g.position.set(b.x + (Math.random() - .5) * .7 * (1 - e), -b.h * 1.05 * e * e, b.z + (Math.random() - .5) * .7 * (1 - e));
      if (Math.random() < dt * 40) { const a = Math.random() * Math.PI * 2; dust(b.x + Math.cos(a) * b.w * .55, .5, b.z + Math.sin(a) * b.d * .55, Math.cos(a) * 3, 1.5 + Math.random() * 2, Math.sin(a) * 3, 1 + Math.random() * .6); }
      if (Math.random() < dt * 8) spawnChunk(b.x + (Math.random() - .5) * b.w, b.h * (1 - e * e), b.z + (Math.random() - .5) * b.d, (Math.random() - .5) * 8, 4 + Math.random() * 6, (Math.random() - .5) * 8, .5 + Math.random(), b.col);
      if (e >= 1) { b.st = 2; scene.remove(b.g); b.body.geometry.dispose(); b.roofM.map.dispose(); b.roofM.dispose(); b.wallM.dispose(); addRubble(b); }
    }
  }
  // trees falling
  TREES.forEach((t, i) => { if (!t.alive && t.fall <= 1.05) { t.fall += dt * 3; treeDirty = true; } });
  if (treeDirty) { for (let i = 0; i < TREES.length; i++) if (!TREES[i].alive) setTree(i); trunkI.instanceMatrix.needsUpdate = leafI.instanceMatrix.needsUpdate = leaf2I.instanceMatrix.needsUpdate = true; leafI.instanceColor.needsUpdate = leaf2I.instanceColor.needsUpdate = true; treeDirty = false; }
  // cars
  for (let i = 0; i < CARS.length; i++) {
    const c = CARS[i];
    if (!c.alive) { c.respawn -= dt; if (c.respawn <= 0) resetCar(c, true); else { dummy.position.set(0, -999, 0); dummy.scale.set(0, 0, 0); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); carI.setMatrixAt(i, dummy.matrix); carTopI.setMatrixAt(i, dummy.matrix); continue; } }
    const near = Math.hypot(c.x - K.x, c.z - K.z) < 34;
    c.p += c.dir * c.v * (near ? 1.9 : 1) * dt;
    if (c.p > HALF + 8) c.p = -HALF - 8; if (c.p < -HALF - 8) c.p = HALF + 8;
    const lane = roadC(c.k) + c.off;
    if (c.axis === 0) { c.x = c.p; c.z = lane; } else { c.x = lane; c.z = c.p; }
    dummy.position.set(c.x, 0, c.z); dummy.scale.set(1, 1, 1); dummy.rotation.set(0, c.axis === 0 ? (c.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (c.dir > 0 ? 0 : Math.PI), 0); dummy.updateMatrix();
    carI.setMatrixAt(i, dummy.matrix); carTopI.setMatrixAt(i, dummy.matrix); carI.setColorAt(i, c.col);
  }
  dummy.rotation.set(0, 0, 0);
  carI.instanceMatrix.needsUpdate = carTopI.instanceMatrix.needsUpdate = true; carI.instanceColor.needsUpdate = true;
  // chunks
  for (let i = 0; i < MAXCH; i++) {
    const c = CH[i];
    if (!c.on) continue;
    c.life -= dt; c.v.y -= 42 * dt; c.p.addScaledVector(c.v, dt);
    const half = c.s / 2;
    if (c.p.y < half) { c.p.y = half; c.v.y *= -.32; c.v.x *= .6; c.v.z *= .6; c.w.multiplyScalar(.6); }
    V0.copy(c.w).multiplyScalar(dt); const dq = new THREE.Quaternion().setFromEuler(new THREE.Euler(V0.x, V0.y, V0.z)); c.q.multiply(dq);
    const s = c.life < .5 ? c.s * Math.max(0, c.life / .5) : c.s;
    if (c.life <= 0) { c.on = false; dummy.position.set(0, -999, 0); dummy.scale.set(0, 0, 0); dummy.quaternion.identity(); }
    else { dummy.position.copy(c.p); dummy.quaternion.copy(c.q); dummy.scale.set(s, s, s); }
    dummy.updateMatrix(); chI.setMatrixAt(i, dummy.matrix);
  }
  dummy.quaternion.identity(); chI.instanceMatrix.needsUpdate = true;
  updParticles(dt); updRings(dt);
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
  // camera follows (smooth), a little ahead of the kaiju
  const lead = 4;
  camT.x += (K.x + K.fx * lead - camT.x) * Math.min(1, dt * 4); camT.z += (K.z + K.fz * lead - camT.z) * Math.min(1, dt * 4);
}

const CT = new V3();
function draw() {
  CT.set(camT.x, 0, camT.z);
  const tr = CT.dot(R), tu = CT.dot(UPV);
  CT.addScaledVector(R, Math.round(tr / U) * U - tr).addScaledVector(UPV, Math.round(tu / U) * U - tu);
  if (shakeT > 0 && shakeA > 0) { const a = Math.max(1, Math.round(shakeA * Math.min(1, shakeT / .2))); CT.addScaledVector(R, (Math.round(Math.random() * 2 * a) - a) * U).addScaledVector(UPV, (Math.round(Math.random() * 2 * a) - a) * U); }
  cam.position.copy(CT).addScaledVector(TOC, 400); cam.lookAt(CT);
  placeKaiju();
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}

const KJ = window.KJ = { ready: false, hold: false, step, draw, K, B, CARS, TREES, stomp, fire: on => { fireHeld = !!on; }, setCam, zoom: d => zoomBy(d), joy, info: () => ({ rw, rh, S, U, T, cam: camI, zoom: zoomI, kaiju: KS, pct, buildings: B.length, trees: TREES.length }) };
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (!KJ.hold) { step(dt); draw(); } requestAnimationFrame(frame); }

(async function init() {
  try {
    await loadKaiju();
    styleTex = STY.map(wallTex);
    const gtex = paintGround();
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(G, G).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: gtex }));
    ground.receiveShadow = true; scene.add(ground);
    const far = new THREE.Mesh(new THREE.PlaneGeometry(G * 8, G * 8).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x6caa50 }));
    far.position.y = -.05; scene.add(far);
    buildCity(); buildTrees(); buildCars(); buildChunks(); buildParticles(); buildRings();
    rbI = inst(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial(), MAXRB, true);
    buildKaiju();
    setCam(camI); layout();
    camT.set(K.x, 0, K.z);
    $('bK').textContent = KLABEL[KS];
    $('bOl').textContent = OUTL ? 'เส้นขอบ เปิด' : 'เส้นขอบ ปิด'; postM.uniforms.ol.value = OUTL ? 1 : 0;
    updPct();
    $('load').remove();
    KJ.ready = true;
    say(matchMedia('(pointer: coarse)').matches ? 'ลากนิ้วด้านซ้ายเพื่อเดิน<small>กด เหยียบ · กดค้าง พ่นไฟ · ปุ่มบนขวาเปลี่ยนมุมกล้อง</small>' : 'WASD เดิน · J เหยียบ · ค้าง K พ่นไฟ<small>C เปลี่ยนมุมกล้อง · Q / E ซูม</small>', 4500);
    requestAnimationFrame(frame);
  } catch (err) { $('load').textContent = 'โหลดไม่สำเร็จ: ' + err.message; console.error(err); }
})();
</script>
