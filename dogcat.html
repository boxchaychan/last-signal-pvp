<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>หมา vs แมว (ทดสอบขั้น 1)</title>
<style>
html,body{margin:0;height:100%;background:#16131c;overflow:hidden;touch-action:none;font-family:system-ui,"Noto Sans Thai",sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;background:#2a3a22}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000a;color:#fff;text-align:center;z-index:5}
#ov div{background:#241e2e;border:3px solid #f6ce6e;border-radius:12px;padding:22px 26px;max-width:80vw}
#ov h1{margin:0 0 8px;font-size:26px}#ov p{margin:6px 0;font-size:16px;line-height:1.5}
#ov button{margin-top:12px;font:700 18px system-ui;padding:10px 26px;border-radius:10px;border:0;background:#f6ce6e;color:#241e2e}
</style></head><body>
<div id="wrap"><canvas id="cv" width="585" height="1266"></canvas></div>
<div id="ov"><div><h1 id="ovt"></h1><p id="ovp"></p><button id="ovb">เล่นใหม่</button></div></div>
<script>
// Dogs vs cats, step 1 (2026-11-12): one stone board 7x4, monsters walk the loop, buy a dog, tap a pedestal to place it, it fights
// by itself; 3 of the same dog and star merge into the next star (TFT style). Each wave has a countdown: monsters still on the
// loop when it ends cost HP by their number and STAY for the next wave (owner "ให้มอนค้างไปก่อน"). HP 0 = lose.
// Not in yet: bench, bag expansion, drops + backpack, path choice every 10 waves, the cats' side. Art: art/dogcat/ (tools/art/
// dogcat_assets.py, BG=1 tw_scene.py). World = 585x1266 px, 1 art px = 1 world px, blown up by the browser with hard pixels.
'use strict';
const W=585,H=1266,cv=document.getElementById('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const Q=new URLSearchParams(location.search),SPD=+Q.get('spd')||1;
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*k)+'px';cv.style.height=Math.floor(H*k)+'px'}addEventListener('resize',fit);fit();
const IMG={};function img(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
const KIND={   // per star: damage; rng = reach in px, cd = seconds between attacks, aoe = splash radius round the target
 shiba:{name:'ชิบะ',cost:3,rng:92,cd:.85,aoe:34,dmg:[14,34,85],col:'#96a0ae'},
 corgi:{name:'คอร์กี้',cost:4,rng:250,cd:1.7,aoe:46,dmg:[22,52,130],col:'#68be78'}};
const MOBK=['shroom','wisp','kappa','kasa_obake','paper_doll','monkey','goblin_archer','wolf'];
let GEO,SP,G,FAST=+(localStorage.getItem('dc.fast')||1);   // owner "ลองทำให้เกม x2": a x1 / x2 speed button (top right), remembered
function newGame(){G={t:0,wave:0,wt:0,wlen:25,hp:100,gold:9,units:[],mobs:[],fx:[],num:[],shots:[],hs:0,shake:0,sel:null,pick:null,items:[],buf:{atk:0,crit:0,spd:0,rng:0,gold:0},shop:[],ban:null,gb:0,red:0,spawn:[],over:false,kills:0,msg:'แตะการ์ดข้างล่าง แล้วแตะแท่นหินเพื่อวางหมา',msgT:6};nextWave()}
// owner 2026-11-13 "แก้ให้ดูเป็นเกมมากขึ้น": a title screen, a shop of 5 random cards with a reroll (1 gold, free refresh every wave), a wave banner
// (red for bosses), coins that fly to the gold counter, a monster portal, tap a dog to see its reach and sell it, a red warning in the last 5 s
function roll(){G.shop=[];for(let i=0;i<5;i++)G.shop.push(Math.random()<.58?'shiba':'corgi');G.sel=null}
function sellVal(u){return KIND[u.kind].cost*Math.pow(3,u.star-1)-1}
let TITLE=!Q.get('skip');
// ---------- the bag (owner 2026-11-13 "ภาพช่วงล่างทำกระเป๋าเลย"): Backpack-style grid under the board. Items DROP from monsters (TFT style) into a tray of 3;
// drag one onto the grid, tap = turn it, drag to the bin = throw away. Every item in the grid works for EVERY dog; a treat makes the items touching it 25% stronger.
const BAG={x:22,y:800,c:7,r:4,s:56},TRAY={x:438,y:800,s:66,n:3},BIN={x:438,y:1018,w:126,h:64};   // matches art/dogcat/bag/panel.png drawn at (6,716)
const ITEM={
 bone:{name:'กระดูก',ico:'🦴',col:'#e8dcc0',cells:[[0,0],[1,0]],st:{atk:.10},d:'โจมตี +10%'},
 collar:{name:'ปลอกคอหนาม',ico:'📿',col:'#e09a9a',cells:[[0,0]],st:{crit:.06},d:'คริ +6%'},
 bowl:{name:'ชามข้าว',ico:'🥣',col:'#9ac4e8',cells:[[0,0],[1,0],[0,1],[1,1]],st:{spd:.18},d:'ตีเร็ว +18%'},
 leash:{name:'สายจูง',ico:'🔗',col:'#b8e09a',cells:[[0,0],[1,0],[2,0]],st:{rng:.14},d:'ระยะ +14%'},
 tag:{name:'ป้ายชื่อทอง',ico:'🏷️',col:'#f2d06a',cells:[[0,0],[0,1],[1,1]],st:{gold:.15},d:'ทองเพิ่ม 15%'},
 treat:{name:'ขนมหมา',ico:'🍖',col:'#e8b48c',cells:[[0,0]],st:{},d:'ของที่ติดกัน แรงขึ้น 25%'}};
const IKEYS=Object.keys(ITEM);let DRAG=null;
function cellsOf(it){let c=ITEM[it.k].cells.map(q=>q.slice());for(let i=0;i<it.rot;i++)c=c.map(([x,y])=>[-y,x]);const mx=Math.min(...c.map(q=>q[0])),my=Math.min(...c.map(q=>q[1]));return c.map(([x,y])=>[x-mx,y-my])}
function fits(it,gx,gy){for(const [cx,cy] of cellsOf(it)){const x=gx+cx,y=gy+cy;if(x<0||y<0||x>=BAG.c||y>=BAG.r)return false;
  for(const o of G.items)if(o!==it&&!o.tray)for(const [ox,oy] of cellsOf(o))if(o.gx+ox===x&&o.gy+oy===y)return false}return true}
function give(k){if(G.items.filter(i=>i.tray).length>=TRAY.n)return false;G.items.push({k,rot:0,tray:true,gx:0,gy:0,pop:.3});return true}
function buffs(){const B={atk:0,crit:0,spd:0,rng:0,gold:0},P=G.items.filter(i=>!i.tray),occ=it=>cellsOf(it).map(([x,y])=>[it.gx+x,it.gy+y]);
 for(const it of P){let m=1;for(const o of P)if(o.k==='treat'&&o!==it&&occ(it).some(([x,y])=>Math.abs(x-o.gx)+Math.abs(y-o.gy)===1))m+=.25;it.m=m;for(const k in ITEM[it.k].st)B[k]+=ITEM[it.k].st[k]*m}
 G.buf=B;return B}
function nextWave(){G.wave++;G.wt=G.wlen;const n=6+Math.floor(G.wave*1.6),hp=26*Math.pow(1.17,G.wave-1),boss=G.wave%5===0;
 for(let i=0;i<n;i++)G.spawn.push({at:G.t+i*(9/n),k:MOBK[Math.min(MOBK.length-2,Math.floor(Math.random()*Math.min(MOBK.length-1,1+G.wave/2)))],hp});
 if(boss)G.spawn.push({at:G.t+4,k:'wolf',hp:hp*9,boss:1});
 G.gold+=G.wave>1?3:0;roll();G.ban={t:0,txt:boss?'บอสมา!':'เวฟ '+G.wave,boss}}
// the loop: a rectangle walked clockwise from the top-left corner
function loopPos(d){const [a,b,c,e]=GEO.loop,w=c-a,h=e-b,p=2*(w+h);d=((d%p)+p)%p;if(d<w)return[a+d,b,1];d-=w;if(d<h)return[c,b+d,1];d-=h;if(d<w)return[c-d,e,-1];d-=w;return[a,e-d,-1]}
function unitAt(i){return G.units.find(u=>u.slot===i)}
function place(kind,slot){const K=KIND[kind];if(G.gold<K.cost){say('ทองไม่พอ');return}if(unitAt(slot)){say('แท่นนี้มีตัวอยู่แล้ว');return}
 G.gold-=K.cost;const [x,y]=GEO.slots[slot];G.units.push({kind,star:1,slot,x,y,cd:.3,at:-1,dir:1,pop:.25});merge()}
function merge(){for(;;){let done=true;for(const kind in KIND)for(let s=1;s<3;s++){const m=G.units.filter(u=>u.kind===kind&&u.star===s);
  if(m.length>=3){const keep=m[m.length-1];for(const u of m.slice(0,2)){G.units.splice(G.units.indexOf(u),1);G.fx.push({x:u.x,y:u.y-30,tx:keep.x,ty:keep.y-30,t:0,k:'fly'})}
   keep.star++;keep.pop=.5;G.pick=null;say(KIND[kind].name+' '+keep.star+' ดาว!');done=false}}if(done)break}}
function say(s){G.msg=s;G.msgT=2.5}
function step(dt){if(G.over)return;if(G.ban)G.ban.t+=dt;if(G.gb>0)G.gb-=dt;if(G.red>0)G.red-=dt;if(G.hs>0){G.hs-=dt;if(G.shake>0)G.shake-=dt;return}G.t+=dt;G.wt-=dt;if(G.msgT>0)G.msgT-=dt;
 while(G.spawn.length&&G.spawn[0].at<=G.t){const s=G.spawn.shift();G.mobs.push({k:s.k,hp:s.hp,max:s.hp,d:0,sp:(s.boss?30:44)+Math.random()*8,boss:s.boss||0,hurt:0,ph:Math.random()*9})}
 G.spawn.sort((a,b)=>a.at-b.at);
 for(const m of G.mobs){m.d+=m.sp*dt;m.hurt-=dt;if(m.kb>0)m.kb-=dt;const p=loopPos(m.d);m.x=p[0];m.y=p[1];m.dir=p[2]}
 for(const u of G.units){const K=KIND[u.kind],S=SP.units[u.kind+u.star];u.cd-=dt;if(u.pop>0)u.pop-=dt;
  if(u.at>=0){const f0=Math.floor(u.at*12);u.at+=dt;const f1=Math.floor(u.at*12);
   if(f0<S.hit&&f1>=S.hit&&u.tg){const t=u.tg,cr=Math.random()<G.buf.crit,dm=K.dmg[u.star-1]*(1+G.buf.atk)*(cr?2:1);
    if(u.kind==='corgi')G.shots.push({x:u.x+u.dir*34,y:u.y-34,m:t.m,tx:t.x,ty:t.y-14,dm,aoe:K.aoe,star:u.star,dir:u.dir});
    else blast(t.m&&t.m.hp>0?t.m.x:t.x,t.m&&t.m.hp>0?t.m.y:t.y,dm,K.aoe,u.star,u.dir,0)}
   if(f1>=S.n){u.at=-1}}
  else{let nm=null,nd=1e9;for(const m of G.mobs){const d=Math.hypot(m.x-u.x,m.y-u.y);if(d<nd){nd=d;nm=m}}if(nm&&nd<K.rng*(1+G.buf.rng)*1.6)u.dir=nm.x>=u.x?1:-1}
  if(u.at<0&&u.cd<=0){let best=null,bd=1e9;for(const m of G.mobs){const d=Math.hypot(m.x-u.x,m.y-u.y);if(d<=K.rng*(1+G.buf.rng)&&m.d>(best?best.d:-1)){best=m;bd=d}}
   if(best){u.tg={x:best.x,y:best.y,m:best};u.dir=best.x>=u.x?1:-1;u.at=0;u.cd=K.cd/(1+G.buf.spd)}}}
 for(const b of G.shots){if(b.m&&b.m.hp>0){b.tx=b.m.x;b.ty=b.m.y-14}const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy),v=560*dt;if(d<=v){b.done=1;blast(b.tx,b.ty+14,b.dm,b.aoe,b.star,b.dir,1)}else{b.x+=dx/d*v;b.y+=dy/d*v}}
 G.shots=G.shots.filter(b=>!b.done);
 G.mobs=G.mobs.filter(m=>{if(m.hp>0)return true;const gv=(m.boss?6:1)+(Math.random()<G.buf.gold?1:0);G.gold+=gv;if(Math.random()<(m.boss?1:.07)){const k=IKEYS[Math.floor(Math.random()*IKEYS.length)];if(give(k)){G.fx.push({x:m.x,y:m.y-20,t:0,k:'drop',ik:k});say('ได้ของ: '+ITEM[k].name+' (ลากลงกระเป๋า)')}}G.kills++;G.fx.push({x:m.x,y:m.y-14,t:0,k:'poof'});for(let i=0;i<Math.min(gv,4);i++)G.fx.push({x:m.x+i*6-6,y:m.y-20,t:-i*.06,k:'coin'});return false});
 for(const f of G.fx)f.t+=dt;for(const f of G.fx)if(f.k==='coin'&&f.t>=.55&&!f.d){f.d=1;G.gb=.18}G.fx=G.fx.filter(f=>f.t<(f.k==='fly'?.35:f.k==='dust'?.3:f.k==='coin'?.56:f.k==='drop'?.6:.4));for(const n of G.num)n.t+=dt;G.num=G.num.filter(n=>n.t<.7);
 if(G.wt<=0){const left=G.mobs.length;if(left){G.hp-=left;say('หมดเวลา! มอนเหลือ '+left+' ตัว เลือด -'+left);G.shake=.3;G.red=.6}else{G.gold+=2;say('เคลียร์หมด! +2 ทอง')}
  if(G.hp<=0){G.hp=0;G.over=true;over()}else nextWave()}
 else if(!G.mobs.length&&!G.spawn.length&&G.wt>1.5){G.gold+=2;say('เคลียร์ก่อนเวลา! +2 ทอง');nextWave()}
 if(G.shake>0)G.shake-=dt}
// owner 2026-11-13 "2 ก่อน เสียงยังไม่ต้อง" (hits you can feel): every hit shoves the monster back a little and squashes it, freezes the game for a blink
// (longer for bigger hits) and shakes the screen on blasts and 3-star hits; the corgi's shell is a plain ball that flies to its target first
function blast(x,y,dm,aoe,star,dir,shell){let n=0;for(const m of G.mobs){const d=Math.hypot(m.x-x,m.y-y);if(d<=aoe){hit(m,d<14?dm:dm*.6,dir);n++}}
 if(n){G.hs=Math.max(G.hs||0,shell?.05+star*.015:.03+star*.012);if(shell||star>=3)G.shake=Math.max(G.shake||0,.1+star*.03)}
 if(shell)G.fx.push({x,y:y-12,t:0,k:'dust',r:aoe})}
function hit(m,d,dir){d=Math.round(d);m.hp-=d;m.hurt=.16;m.kb=.18;m.kd=dir||1;m.d-=m.boss?1:4;G.num.push({x:m.x+(Math.random()*10-5),y:m.y-30,v:d,t:0})}
function over(){document.getElementById('ovt').textContent='บ้านแตกแล้ว!';document.getElementById('ovp').textContent='ไปถึงเวฟ '+G.wave+' · ฆ่ามอน '+G.kills+' ตัว';document.getElementById('ov').style.display='flex'}
document.getElementById('ovb').onclick=()=>{document.getElementById('ov').style.display='none';newGame()};
// ---------- drawing
function star(x,y,n){for(let i=0;i<n;i++){const cx=x-(n-1)*5.5+i*11;g.fillStyle='#221c28';g.beginPath();for(let k=0;k<10;k++){const r=k%2?3.2:7,a=-Math.PI/2+k*Math.PI/5;g.lineTo(cx+Math.cos(a)*r,y+Math.sin(a)*r)}g.fill();
 g.fillStyle='#ffd640';g.beginPath();for(let k=0;k<10;k++){const r=k%2?2:5.4,a=-Math.PI/2+k*Math.PI/5;g.lineTo(cx+Math.cos(a)*r,y+Math.sin(a)*r)}g.fill()}}
function panel(x,y,w,h,fill){g.fillStyle='#221c28';rr(x,y,w,h,8);g.fill();g.fillStyle='#f6ce6e';rr(x+2,y+2,w-4,h-4,7);g.fill();g.fillStyle=fill||'#241e2e';rr(x+4,y+4,w-8,h-8,5);g.fill()}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,sz,col,al){g.font='700 '+sz+'px system-ui,"Noto Sans Thai",sans-serif';g.textAlign=al||'left';g.textBaseline='middle';g.fillStyle='#221c28';g.fillText(s,x+1,y+1);g.fillStyle=col||'#faf0d6';g.fillText(s,x,y)}
const CARDS=[['shiba',14],['corgi',204]];   // shop cards: kind, x
function draw(){const sx=G.shake>0?Math.round((Math.random()-.5)*6):0;g.setTransform(1,0,0,1,sx,0);g.drawImage(IMG.bg,0,0);
 // free pedestals glow while a card is selected
 if(G.sel!==null)for(let i=0;i<GEO.slots.length;i++)if(!unitAt(i)){const [x,y]=GEO.slots[i];g.strokeStyle='rgba(255,236,120,'+(.55+.35*Math.sin(G.t*6))+')';g.lineWidth=2;g.beginPath();g.ellipse(x,y-3,24,10,0,0,7);g.stroke()}
 {const [pa,pb]=GEO.loop,px=Math.round(pa)-4,py=Math.round(pb)-8;for(let i=0;i<4;i++){g.fillStyle=['#2a1440','#5a2a96','#9a52e0','#e0b4ff'][i];g.beginPath();g.ellipse(px,py,26-i*6,13-i*3,0,0,7);g.fill()}
  for(let i=0;i<7;i++){const a=G.t*3+i*.9,r=22-((G.t*10+i*3)%20);g.fillStyle=i%2?'#e0b4ff':'#b478ff';g.fillRect(px+Math.round(Math.cos(a)*r)-1,py+Math.round(Math.sin(a)*r*.5)-1,3,3)}}
 if(G.pick){const u=G.pick,r=KIND[u.kind].rng*(1+G.buf.rng);g.fillStyle='rgba(120,200,255,.13)';g.beginPath();g.arc(u.x,u.y-8,r,0,7);g.fill();g.strokeStyle='rgba(160,220,255,.9)';g.lineWidth=2;g.setLineDash([6,5]);g.lineDashOffset=-G.t*14;g.stroke();g.setLineDash([])}
 const list=[];for(const u of G.units)list.push([u.y,u,0]);for(const m of G.mobs)list.push([m.y,m,1]);list.sort((a,b)=>a[0]-b[0]);
 for(const [,o,isM] of list){if(isM){const S=SP.mobs[o.k],im=IMG['m_'+o.k],f=Math.floor(G.t*8+o.ph)%S.n,k=o.boss?2:1,w=S.w*k,h=S.h*k,x=Math.round(o.x),y=Math.round(o.y);
   g.fillStyle='rgba(10,20,10,.3)';g.beginPath();g.ellipse(x,y,S.w*.3*k,4*k,0,0,7);g.fill();g.save();g.translate(x+(o.kb>0?Math.round(o.kd*o.kb*30):0),y);if(o.kb>0)g.scale(1+o.kb*.9,1-o.kb*1.1);if(o.dir<0)g.scale(-1,1);if(o.hurt>0)g.filter='brightness(2.2)';
   g.drawImage(im,f*S.w,0,S.w,S.h,-S.fx*k,-S.fy*k,w,h);g.restore();
   if(o.hp<o.max){const bw=o.boss?44:24;g.fillStyle='#221c28';g.fillRect(x-bw/2-1,y-S.fy*k-7,bw+2,5);g.fillStyle=o.boss?'#f6ce6e':'#ec5454';g.fillRect(x-bw/2,y-S.fy*k-6,Math.max(0,bw*o.hp/o.max),3)}}
  else{const S=SP.units[o.kind+o.star],im=IMG['u_'+o.kind+o.star],f=o.at>=0?Math.min(S.n-1,Math.floor(o.at*12)):0,x=o.x,y=o.y,sc=o.pop>0?1+o.pop*.5:1;
   g.fillStyle='rgba(10,20,10,.28)';g.beginPath();g.ellipse(x,y+1,17,5,0,0,7);g.fill();g.save();g.translate(x,y);g.scale(o.dir*sc,sc);
   if(o.at>=0)g.drawImage(im,f*S.w,0,S.w,S.h,-S.fx,-S.fy,S.w,S.h);
   else if(S.idle){const fi=Math.floor(G.t*(G.mobs.length?9:6)+o.slot*2.3)%S.idle;g.drawImage(IMG['i_'+o.kind+o.star],fi*S.w,0,S.w,S.h,-S.fx,-S.fy,S.w,S.h)}   // a real idle clip from PixelLab when the level has one
   else{   // owner "ตัวละครมันแข็งไป": standing dogs breathe: head and chest sink 1 px in turn (whole pixels, no stretching), each dog on its own beat; ready-to-hit dogs bounce faster
    const hh=S.fy-S.top,r1=S.top+Math.round(hh*.5),r2=S.top+Math.round(hh*.74),st=Math.floor(G.t*(G.mobs.length?4.2:2.6)+o.slot*1.7)%4,hd=[0,1,1,0][st],cd=[0,0,1,1][st];
    g.drawImage(im,0,r2,S.w,S.h-r2,-S.fx,r2-S.fy,S.w,S.h-r2);g.drawImage(im,0,r1,S.w,r2-r1,-S.fx,r1-S.fy+cd,S.w,r2-r1);g.drawImage(im,0,0,S.w,r1,-S.fx,-S.fy+hd+cd,S.w,r1)}
