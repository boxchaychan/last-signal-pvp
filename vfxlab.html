<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFX Lab</title>
<!-- owner 2026-11-10 "ทำ vfx สวย ปรับได้": build a skill effect out of layers of the cut effect sheets (fx/), tune each layer
     (size, squash onto the ground, turn, colour, glow, timing) and watch it play next to the hero at game scale; settings are kept
     in this browser and can be copied as text for Claude to put into the game. -->
<style>
:root { --bg: #15121b; --card: #221d2b; --line: #3a3248; --ink: #f3edff; --dim: #a59bb8; --acc: #ff5a6e; --ok: #6be08a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 12px 14px 40px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }
h1 { font-size: 20px; margin: 0 0 2px; grid-column: 1 / -1; } .sub { color: var(--dim); font-size: 13px; margin: 0; grid-column: 1 / -1; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
#stage { position: sticky; top: 8px; align-self: start; }
canvas { width: 100%; display: block; border-radius: 8px; image-rendering: pixelated; background: #5c963e; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
button, select { font: 600 14px system-ui, sans-serif; border-radius: 8px; border: 1px solid var(--line); background: #2e2739; color: var(--ink); padding: 8px 10px; }
button.acc { background: var(--acc); border-color: var(--acc); color: #fff; } button.on { background: #4a3b5c; border-color: #8d74b0; }
.layer { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: #1b1723; }
.layer.sel { border-color: var(--acc); }
.lh { display: flex; gap: 6px; align-items: center; } .lh select { flex: 1; min-width: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 6px; }
label { font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; } label b { color: var(--ink); font-weight: 600; }
input[type=range] { width: 100%; margin: 0 0 4px; }
textarea { width: 100%; height: 90px; background: #0f0d14; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 12px ui-monospace, monospace; padding: 6px; }
.msg { color: var(--dim); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body><main>
<h1>VFX Lab · ประกอบเอฟเฟกต์</h1>
<p class="sub">เลือกชิ้นเอฟเฟกต์มาซ้อนกันเป็นชั้น ปรับขนาด ทิศ สี แสง เวลา แล้วดูข้างตัวละครขนาดเท่าในเกม กด "คัดลอก" ส่งตัวเลขมาให้ผมใส่เกม</p>

<div id="stage" class="card">
  <canvas id="cv" width="640" height="400"></canvas>
  <div class="row">
    <button id="play" class="acc">▶ เล่นซ้ำ</button><button id="loop" class="on">วนอัตโนมัติ</button><button id="slow">ช้า ×0.3</button>
    <button id="zoom">ซูม ×1</button><button id="bgb">พื้น: หญ้า</button><button id="dirb">ทิศ: ขวา</button>
  </div>
  <div class="row"><select id="preset"></select><button id="savep">บันทึกเป็นชุด</button><button id="delp">ลบชุด</button></div>
  <div class="msg" id="msg">เปิดหน้านี้ผ่านเว็บของเกม (ไฟล์เอฟเฟกต์โหลดจากโฟลเดอร์ fx/)</div>
</div>

<div>
  <div class="card">
    <div class="row" style="margin-top:0"><button id="add" class="acc">+ เพิ่มชั้น</button><button id="dup">ทำซ้ำชั้นนี้</button><button id="del">ลบชั้นนี้</button><button id="up">ขึ้น</button><button id="down">ลง</button></div>
    <div id="layers" style="margin-top:10px"></div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="lh"><b style="flex:1">ตัวเลขสำหรับใส่เกม</b><button id="copy">คัดลอก</button><button id="load">โหลดจากกล่อง</button></div>
    <textarea id="out" spellcheck="false"></textarea>
  </div>
</div>
</main>
<script>
const $ = id => document.getElementById(id), cv = $('cv'), g = cv.getContext('2d');
// world px of the 2D game; the hero is ~76 px tall there, effects are cut to that scale (tools/video/vfx_cut.py)
const P = [   // per layer: name, min, max, step, default, Thai label
  ['sc', .2, 3, .05, 1, 'ขนาด'], ['sq', .2, 1, .05, 1, 'แบนลงพื้น (1 = ตั้ง)'], ['rot', -180, 180, 5, 0, 'หมุน (องศา)'], ['fwd', -150, 300, 5, 0, 'ระยะไปข้างหน้า'],
  ['dy', -120, 60, 2, 0, 'สูง-ต่ำ'], ['delay', 0, 2, .05, 0, 'เริ่มช้า (วิ)'], ['spd', .25, 3, .05, 1, 'ความเร็ว'], ['op', .1, 1, .05, 1, 'ความทึบ'],
  ['hue', -180, 180, 5, 0, 'เปลี่ยนสี'], ['sat', 0, 3, .05, 1, 'สีสด'], ['bri', .3, 2.5, .05, 1, 'ความสว่าง'], ['glow', 0, 1.5, .05, 0, 'แสงเรือง'],
  ['mv', 0, 600, 10, 0, 'พุ่งไปข้างหน้า (px/วิ)'], ['rep', 1, 12, 1, 1, 'จำนวนชิ้น (กระจายรอบ)']];
let MAN = {}, IMG = {}, L = [], SEL = 0, T0 = performance.now() / 1000, SLOW = 1, LOOP = true, ZM = 1, BG = 0, DIR = 0;
const BGS = [['หญ้า', '#5c963e'], ['ดิน', '#9b7653'], ['มืด', '#1d1b22'], ['เขียว (ตัด)', '#00ff00']];
const hero = new Image(); hero.src = 'art/td/map1/hero_chibi16_side.png';
const store = { get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const newLayer = key => { const o = {key: key || Object.keys(MAN).find(k => k.startsWith('vfx_')) || Object.keys(MAN)[0], blend: 'normal', flip: 0, loop: 0}; for (const p of P) o[p[0]] = p[4]; return o; };
const PRE = {   // starting sets built from the owner's clips
  'Q โซ่ดึง + วงฟัน': [{key: 'vfx_bzchain1', rep: 6, sq: .6, fwd: 0, dy: -8}, {key: 'vfx_bzchainring', sq: .6, delay: .9, glow: .3}],
  'R ทุบพื้น': [{key: 'vfx_bzslamring', sq: .6, fwd: 70}, {key: 'vfx_bzslam', fwd: 70, glow: .35}, {key: 'vfx_bzcrack', fwd: 130, delay: .1, op: .9}],
  'ตีธรรมดา': [{key: 'vfx_bzswing', fwd: 34, dy: -30, glow: .25}],
  'X คลั่ง': [{key: 'vfx_bzrage', sc: 1.1, loop: 1, glow: .4}, {key: 'vfx_bzwave', fwd: 40, dy: -30, mv: 320, delay: .3}],
};
function presets() { const own = store.get('vfxlab.sets') || {}, s = $('preset'); s.innerHTML = '<option value="">— เลือกชุด —</option>' +
  [...Object.keys(PRE).map(k => `<option value="p:${k}">${k}</option>`), ...Object.keys(own).map(k => `<option value="u:${k}">★ ${k}</option>`)].join(''); }
function setFrom(list) { L = list.map(o => Object.assign(newLayer(o.key), o)); SEL = 0; ui(); replay(); }
$('preset').onchange = e => { const v = e.target.value; if (!v) return; const own = store.get('vfxlab.sets') || {}; setFrom(v[0] === 'p' ? PRE[v.slice(2)] : own[v.slice(2)]); };
$('savep').onclick = () => { const n = prompt('ชื่อชุด'); if (!n) return; const own = store.get('vfxlab.sets') || {}; own[n] = L; store.set('vfxlab.sets', own); presets(); };
$('delp').onclick = () => { const v = $('preset').value; if (!v.startsWith('u:')) return; const own = store.get('vfxlab.sets') || {}; delete own[v.slice(2)]; store.set('vfxlab.sets', own); presets(); };
function ui() {
  const keys = Object.keys(MAN).filter(k => /^(vfx_|pfx_)/.test(k)).sort((a, b) => (b.startsWith('vfx_') - a.startsWith('vfx_')) || a.localeCompare(b));
  $('layers').innerHTML = L.map((o, i) => `<div class="layer ${i === SEL ? 'sel' : ''}" data-i="${i}"><div class="lh"><b>${i + 1}</b>
    <select data-k="key">${keys.map(k => `<option ${k === o.key ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <select data-k="blend"><option value="normal" ${o.blend === 'normal' ? 'selected' : ''}>ปกติ</option><option value="lighter" ${o.blend === 'lighter' ? 'selected' : ''}>เรืองแสง</option><option value="screen" ${o.blend === 'screen' ? 'selected' : ''}>สว่าง</option><option value="multiply" ${o.blend === 'multiply' ? 'selected' : ''}>มืด</option></select>
    <button data-t="flip" class="${o.flip ? 'on' : ''}">กลับ</button><button data-t="loop" class="${o.loop ? 'on' : ''}">วน</button></div>
    <div class="grid">${P.map(p => `<div><label>${p[5]} <b id="v${i}_${p[0]}">${o[p[0]]}</b></label><input type="range" data-k="${p[0]}" min="${p[1]}" max="${p[2]}" step="${p[3]}" value="${o[p[0]]}"></div>`).join('')}</div></div>`).join('');
  out(); }
$('layers').addEventListener('input', e => { const d = e.target.closest('.layer'); if (!d) return; const i = +d.dataset.i, k = e.target.dataset.k; if (!k) return;
  L[i][k] = e.target.type === 'range' ? +e.target.value : e.target.value; const v = $('v' + i + '_' + k); if (v) v.textContent = L[i][k]; out(); if (k === 'key' || k === 'delay') replay(); });
$('layers').addEventListener('click', e => { const d = e.target.closest('.layer'); if (!d) return; const i = +d.dataset.i;
  if (e.target.dataset.t) { L[i][e.target.dataset.t] ^= 1; e.target.classList.toggle('on'); out(); }
  if (SEL !== i) { SEL = i; document.querySelectorAll('.layer').forEach(x => x.classList.toggle('sel', +x.dataset.i === i)); } });
$('add').onclick = () => { L.push(newLayer()); SEL = L.length - 1; ui(); replay(); };
$('dup').onclick = () => { if (!L[SEL]) return; L.splice(SEL + 1, 0, {...L[SEL]}); SEL++; ui(); };
$('del').onclick = () => { L.splice(SEL, 1); SEL = Math.max(0, SEL - 1); ui(); };
$('up').onclick = () => { if (SEL > 0) { [L[SEL - 1], L[SEL]] = [L[SEL], L[SEL - 1]]; SEL--; ui(); } };
$('down').onclick = () => { if (SEL < L.length - 1) { [L[SEL + 1], L[SEL]] = [L[SEL], L[SEL + 1]]; SEL++; ui(); } };
function out() { const t = JSON.stringify(L.map(o => { const r = {key: o.key}; for (const p of P) if (o[p[0]] !== p[4]) r[p[0]] = o[p[0]]; if (o.blend !== 'normal') r.blend = o.blend; if (o.flip) r.flip = 1; if (o.loop) r.loop = 1; return r; }));
  $('out').value = t; store.set('vfxlab.cur', L); }
$('copy').onclick = () => { $('out').select(); try { navigator.clipboard.writeText($('out').value); } catch (e) { document.execCommand('copy'); } $('copy').textContent = 'คัดลอกแล้ว ✓'; setTimeout(() => $('copy').textContent = 'คัดลอก', 1500); };
$('load').onclick = () => { try { setFrom(JSON.parse($('out').value)); } catch (e) { $('msg').textContent = 'อ่านตัวเลขไม่ได้'; } };
const replay = () => { T0 = performance.now() / 1000; };
$('play').onclick = replay;
$('loop').onclick = e => { LOOP = !LOOP; e.target.classList.toggle('on', LOOP); };
$('slow').onclick = e => { SLOW = SLOW === 1 ? .3 : 1; e.target.classList.toggle('on', SLOW < 1); };
$('zoom').onclick = e => { ZM = ZM === 1 ? 2 : ZM === 2 ? .6 : 1; e.target.textContent = 'ซูม ×' + ZM; };
$('bgb').onclick = e => { BG = (BG + 1) % BGS.length; e.target.textContent = 'พื้น: ' + BGS[BG][0]; };
$('dirb').onclick = e => { DIR = (DIR + 1) % 4; e.target.textContent = 'ทิศ: ' + ['ขวา', 'ล่าง', 'ซ้าย', 'บน'][DIR]; };
function img(k) { if (!IMG[k]) { IMG[k] = new Image(); IMG[k].src = 'fx/' + k + '.png'; } return IMG[k]; }
const life = o => { const m = MAN[o.key]; return m ? o.delay + m.n / m.fps / o.spd : 0; };
function draw(now) {
  const W = cv.width, H = cv.height, t = (now / 1000 - T0) * SLOW, end = Math.max(.5, ...L.map(life)) + .4;
  if (LOOP && t > end) T0 = now / 1000;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.fillStyle = BGS[BG][1]; g.fillRect(0, 0, W, H);
  if (BG === 0) { g.fillStyle = 'rgba(0,0,0,.06)'; for (let i = 0; i < 160; i++) { const x = (i * 97) % W, y = (i * 53) % H; g.fillRect(x, y, 6, 3); } }
  const hx = W * .42, hy = H * .72, Z = ZM, ang = [0, 90, 180, -90][DIR] * Math.PI / 180;
  g.save(); g.translate(hx, hy); g.scale(Z, Z); g.imageSmoothingEnabled = false;
  const layer = (o, behind) => { const m = MAN[o.key], im = img(o.key); if (!m || !im.complete || !im.width) return;
    const lt = (t - o.delay) * o.spd; if (lt < 0) return; let f = Math.floor(lt * m.fps); if (o.loop) f %= m.n; if (f >= m.n) return;
    const ground = o.sq < .95; if (ground !== behind) return;
    const cols = m.cols || m.n, sx = (f % cols) * m.w, sy = (f / cols | 0) * m.h, s = o.sc / 1.5;   // sheets are cut at world px; the hero is drawn 1:1.5
    for (let r = 0; r < o.rep; r++) {
      const a = ang + (o.rep > 1 ? r / o.rep * Math.PI * 2 : 0), fw = o.fwd + o.mv * lt, x = Math.cos(a) * fw, y = Math.sin(a) * fw * .5 + o.dy;
      g.save(); g.translate(x, y); if (o.sq !== 1) g.scale(1, o.sq);
      // ground / repeated pieces turn to their direction; an upright single piece is mirrored for the left and only turned by "หมุน"
      const turn = ground || o.rep > 1, fl = (o.flip ? -1 : 1) * (!turn && Math.cos(ang) < -.1 ? -1 : 1);
      g.rotate(o.rot * Math.PI / 180 + (turn ? a : 0)); g.scale(fl * s * 1.5, s * 1.5);
      g.globalAlpha = o.op; g.globalCompositeOperation = o.blend === 'normal' ? 'source-over' : o.blend;
      g.filter = `hue-rotate(${o.hue}deg) saturate(${o.sat}) brightness(${o.bri})`;
      g.drawImage(im, sx, sy, m.w, m.h, -m.ax, -m.ay, m.w, m.h);
      if (o.glow > 0) { g.globalCompositeOperation = 'lighter'; g.globalAlpha = o.op * Math.min(1, o.glow); g.filter = `blur(${4 + o.glow * 8}px) hue-rotate(${o.hue}deg) saturate(${o.sat}) brightness(${o.bri * (1 + o.glow)})`; g.drawImage(im, sx, sy, m.w, m.h, -m.ax, -m.ay, m.w, m.h); }
      g.restore(); } };
  for (const o of L) layer(o, true);
  if (hero.complete && hero.width) { g.globalAlpha = 1; g.filter = 'none'; g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0, 0, 26, 8, 0, 0, 6.3); g.fill();
    const k = 76 / 113; g.save(); if (Math.cos(ang) < -.1) g.scale(-1, 1); g.drawImage(hero, 0, 0, 128, 128, -64 * k, -122 * k, 128 * k, 128 * k); g.restore(); }
  for (const o of L) layer(o, false);
  g.restore(); requestAnimationFrame(draw); }
fetch('fx/manifest.json').then(r => r.json()).then(m => { MAN = m; presets(); const cur = store.get('vfxlab.cur'); setFrom(cur && cur.length ? cur : PRE['R ทุบพื้น']); $('msg').textContent = Object.keys(m).filter(k => k.startsWith('vfx_')).length + ' ชิ้นเอฟเฟกต์จากวิดีโอ + ชิ้นเก่าในเกม'; })
  .catch(() => $('msg').textContent = 'โหลด fx/manifest.json ไม่ได้: เปิดผ่านเว็บของเกม');
requestAnimationFrame(draw);
</script>
</body>
</html>
