<script>
// Code-drawn chibi kids for classes without GPT pictures yet: one kid per class, five tiers (age, outfit and weapon change).
// Drawn as SVG facing right, then pixelized (gptpx-like) by px2.py.
const O='#24161a';
const st=(w)=>` stroke="${O}" stroke-width="${w||4}" stroke-linejoin="round" stroke-linecap="round"`;
const TIERS=['white','green','purple','red','gold'];
function kid(K,ti){
  const T=TIERS[ti],age=[0,.25,.5,.75,1][ti],gold=T==='gold',red=T==='red',pur=T==='purple',grn=T==='green',wht=T==='white';
  const f=K.f,trim=gold?'#ffd24a':red?'#e0303a':pur?'#a77aff':grn?'#4ec46a':null;
  const bodyH=48+age*44,legH=7+age*19,top=40;      // hood top y
  const headCY=top+66,neckY=top+122,bodyY=neckY,bodyB=bodyY+bodyH,footY=bodyB+legH;
  let back='',front='',hoodDeco='',acc='',hat='';
  // ----- back: capes, wings, scarf tails
  if(gold&&K.wings)back+=`<path d="M70 ${bodyY+6} Q10 ${bodyY-30} 6 ${bodyY+40} Q24 ${bodyY+34} 30 ${bodyY+60} Q46 ${bodyY+46} 56 ${bodyY+66} Z" fill="#1a1428"${st(4)}/><path d="M66 ${bodyY+10} Q18 ${bodyY-18} 14 ${bodyY+34}" fill="none" stroke="#ffd24a" stroke-width="4"/>`;
  if(pur||red||gold){const cc=gold?K.capeG||'#2a2040':red?'#b02a34':'#6a4aa8',edge=gold?'#ffd24a':red?'#e0303a':'#8a6ac8';

  if(red)back+=`<path d="M94 ${neckY+6} Q72 ${neckY+12} 54 ${neckY+30} Q66 ${neckY+28} 66 ${neckY+40} Q80 ${neckY+22} 96 ${neckY+18} Z" fill="#d8303a"${st()}/>`;
  // ----- tail
  if(K.tail)back+=K.tail(bodyY+bodyH*.6);
  // ----- legs + paws
  const legs=`<rect x="80" y="${bodyB-6}" width="20" height="${legH+8}" rx="8" fill="${f.body}"${st()}/><rect x="104" y="${bodyB-6}" width="20" height="${legH+8}" rx="8" fill="${f.body2}"${st()}/>
   <ellipse cx="90" cy="${footY+2}" rx="15" ry="8" fill="${f.paw}"${st()}/><ellipse cx="116" cy="${footY+2}" rx="15" ry="8" fill="${f.paw}"${st()}/>
   ${trim?`<rect x="80" y="${footY-8}" width="20" height="5" fill="${trim}"/><rect x="104" y="${footY-8}" width="20" height="5" fill="${trim}"/>`:''}`;
  // ----- body
  const bw=54+age*12;
  let body=`<path d="M${102-bw/2} ${bodyY+8} Q${102-bw/2-4} ${bodyB} ${102-bw/2+6} ${bodyB+2} L${102+bw/2-6} ${bodyB+2} Q${102+bw/2+4} ${bodyB} ${102+bw/2} ${bodyY+8} Q102 ${bodyY-6} ${102-bw/2} ${bodyY+8} Z" fill="${f.body}"${st()}/>
   <ellipse cx="106" cy="${bodyY+bodyH*.58}" rx="${bw*.3}" ry="${bodyH*.34}" fill="${f.belly}"/>`;
  if(trim)body+=`<path d="M${102-bw/2+3} ${bodyB-2} L${102+bw/2-3} ${bodyB-2}" stroke="${trim}" stroke-width="5"/><path d="M102 ${bodyY+4} L102 ${bodyY+bodyH*.3}" stroke="${trim}" stroke-width="4"/>`;
  if(pur||red||gold)body+=`<rect x="${102-bw/2+2}" y="${bodyY+bodyH*.62}" width="${bw-4}" height="7" fill="${gold?'#6a4a1a':'#3a2a2a'}"/><rect x="98" y="${bodyY+bodyH*.62-1}" width="10" height="9" rx="2" fill="${gold?'#ffd24a':'#c8c8d0'}"${st(2)}/>`;
  // back arm
  const backArm=`<path d="M${102-bw/2+4} ${bodyY+14} Q${102-bw/2-12} ${bodyY+30} ${102-bw/2-6} ${bodyY+44}" fill="none" stroke="${O}" stroke-width="16" stroke-linecap="round"/><path d="M${102-bw/2+4} ${bodyY+14} Q${102-bw/2-12} ${bodyY+30} ${102-bw/2-6} ${bodyY+44}" fill="none" stroke="${f.body2}" stroke-width="10" stroke-linecap="round"/><circle cx="${102-bw/2-6}" cy="${bodyY+46}" r="7" fill="#f6d2b4"${st(3)}/>`;
  // ----- head: hood back, ears, face opening, hair, eyes, mouth, hood face
  const hood=`<path d="M38 ${headCY} Q36 ${top} 104 ${top} Q172 ${top} 170 ${headCY} Q172 ${headCY+52} 136 ${headCY+58} L70 ${headCY+58} Q36 ${headCY+52} 38 ${headCY} Z" fill="${f.hood}"${st()}/>

  const ears=K.ears(top,f,trim);

  if(grn)acc+=`<path d="M78 ${neckY+2} Q106 ${neckY+16} 134 ${neckY} L132 ${neckY+12} Q106 ${neckY+26} 80 ${neckY+12} Z" fill="#3ea85a"${st(3.5)}/><path d="M84 ${neckY+12} L74 ${neckY+30} L88 ${neckY+24} Z" fill="#3ea85a"${st(3)}/>`;
  if(red)acc+=`<path d="M78 ${neckY} Q106 ${neckY+16} 134 ${neckY-2} L132 ${neckY+12} Q106 ${neckY+28} 80 ${neckY+12} Z" fill="#d8303a"${st(3.5)}/>`;
  if(gold)acc+=`<path d="M84 ${neckY+2} Q106 ${neckY+14} 128 ${neckY+2}" fill="none" stroke="#ffd24a" stroke-width="4"/><path d="M100 ${neckY+10} L106 ${neckY+24} L112 ${neckY+10} Z" fill="#ffd24a"${st(2.5)}/>`;

  // shoulder guards and cuffs: green cuffs, purple one guard, red two guards + forearm guard, gold ornate guards
  const sx=102+bw/2-6,sy=bodyY+8,pad=(x,c,e,r)=>`<ellipse cx="${x}" cy="${sy}" rx="${r||13}" ry="${(r||13)*.62}" fill="${c}"${st(3.5)}/><path d="M${x-(r||13)+2} ${sy+3} Q${x} ${sy+9} ${x+(r||13)-2} ${sy+3}" fill="none" stroke="${e}" stroke-width="3"/>`;
  if(grn)acc+=`<rect x="152" y="${bodyY+20}" width="9" height="10" rx="2" fill="#3ea85a"${st(2.5)}/>`;
  if(pur)acc+=pad(sx,'#9a9ab0','#a77aff');
  if(red)acc+=pad(102-bw/2+6,'#a8acb8','#e0303a')+pad(sx,'#b8bcc8','#e0303a',15)+`<rect x="148" y="${bodyY+16}" width="14" height="12" rx="3" fill="#a8acb8"${st(3)}/><rect x="148" y="${bodyY+25}" width="14" height="3" fill="#e0303a"/>`;
  if(gold)acc+=pad(102-bw/2+6,'#ffd24a','#fff2a0',14)+pad(sx,'#ffd24a','#fff2a0',16);
  if(K.hat&&gold)hat=K.hat(top);
  // ----- front arm + weapon
  const wp=K.weapon(T,bodyY,bodyH);
  const frontArm=`<path d="M${102+bw/2-6} ${bodyY+14} Q${102+bw/2+18} ${bodyY+22} ${164} ${bodyY+28}" fill="none" stroke="${O}" stroke-width="17" stroke-linecap="round"/><path d="M${102+bw/2-6} ${bodyY+14} Q${102+bw/2+18} ${bodyY+22} ${164} ${bodyY+28}" fill="none" stroke="${f.body}" stroke-width="11" stroke-linecap="round"/>
    ${trim?`<path d="M156 ${bodyY+21} L158 ${bodyY+33}" stroke="${trim}" stroke-width="5"/>`:''}`;
  const hand=gold&&K.goldGlove?`<circle cx="170" cy="${bodyY+30}" r="9" fill="#ffd24a"${st(3)}/>`:`<circle cx="170" cy="${bodyY+30}" r="8" fill="#f6d2b4"${st(3)}/>`;
  return `<svg class="k" viewBox="-6 -8 230 ${footY+24}" xmlns="http://www.w3.org/2000/svg">${back}${legs}${backArm}${body}${acc}${frontArm}${hood}${ears}${deco}${face}${hair}${eyes}${mouth}${hat}${wp.back||''}${wp.front||''}${hand}${wp.over||''}</svg>`;
}
