{ // a sky-dome environment light so the PBR heroes / KayKit people get soft light from all around (same recipe as grind3d.html)

  scene.environment = pm.fromScene(es, .035).texture; pm.dispose();
}

// ---------- the maps (owner 2026-11-18 night: "ทำแมพให้สวยให้เรียบร้อย เอาแบบสวยๆเลย ใช้ทุกอย่างให้เป็นประโยชน์"): 18 x 10 tiles (1 tile = 1 unit),

    grass: ['#b5a24a', '#9c8a3c', '#cdb862'], road: ['#b77c4c', '#9e6a40', '#cf9a66'], edge: '#7a6428', cliff: ['#9a6e4a', '#7a5238', '#b88a62'], water: [0x1f6a86, 0x4aa8b0], sky: 0xf0c890,

};
const MAPKEYS = ['forest', 'autumn', 'snow'];
let MAPK = Q.get('map'); if (!MAPS[MAPK]) MAPK = 'forest';   // one map for now (owner 2026-11-19 "ทำแมพเดียวก่อน"); ?map= still opens the others
const MAP = MAPS[MAPK];
scene.background.setHex(MAP.sky); scene.fog = new THREE.Fog(MAP.sky, 26, 60); HEMI.color.setHex(MAP.hemi[0]); HEMI.groundColor.setHex(MAP.hemi[1]); sun.color.setHex(MAP.sun);
const MW = 18, MH = 10, OX = -MW / 2, OZ = -MH / 2;
const WP = MAP.path.map(([x, z]) => new V3(x + OX, 0, z + OZ));
const SEG = []; let PATHLEN = 0; for (let i = 0; i < WP.length - 1; i++) { const a = WP[i], b = WP[i + 1], L = a.distanceTo(b); SEG.push({ a, b, L, s0: PATHLEN, d: b.clone().sub(a).normalize() }); PATHLEN += L; }
function pathAt(s, out, side = 0) { let g = SEG[SEG.length - 1]; for (const q of SEG) if (s <= q.s0 + q.L) { g = q; break; } const t = clamp(s - g.s0, 0, g.L); out.copy(g.a).addScaledVector(g.d, t); out.x += -g.d.z * side; out.z += g.d.x * side; return g; }
function distToPath(x, z) { let best = 1e9; for (const q of SEG) { const px = x - q.a.x, pz = z - q.a.z, t = clamp(px * q.d.x + pz * q.d.z, 0, q.L), dx = px - q.d.x * t, dz = pz - q.d.z * t; best = Math.min(best, Math.hypot(dx, dz)); } return best; }
const tileC = (i, j) => new V3(i + .5 + OX, 0, j + .5 + OZ);
const ROAD = new Set(); for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { const c = tileC(i, j); if (distToPath(c.x, c.z) < .55) ROAD.add(i + ',' + j); }
const CASTLE = new V3(WP[WP.length - 1].x + .55, 0, WP[WP.length - 1].z), CAVEP = new V3(WP[0].x - .1, 0, WP[0].z);
// build spots: tiles next to the road that cover the most road (picked by code, spread out)
const PADS = []; {
  const cand = []; for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { if (ROAD.has(i + ',' + j)) continue; const c = tileC(i, j), d = distToPath(c.x, c.z); if (d < .9 || d > 1.6 || i < 1 || i > MW - 3) continue;
    if (c.distanceTo(CASTLE) < 2 || c.distanceTo(CAVEP) < 1.6) continue;
    let cover = 0; const tp = new V3(); for (let s = 0; s < PATHLEN; s += .5) { pathAt(s, tp); if (tp.distanceTo(c) < 3.2) cover++; } cand.push({ i, j, c, cover }); }
  cand.sort((a, b) => b.cover - a.cover); for (const q of cand) { if (PADS.length >= 12) break; if (PADS.every(p => p.c.distanceTo(q.c) > 2.1)) PADS.push({ i: q.i, j: q.j, c: q.c, tower: null }); }
}
const HPAD = PADS.shift();   // the hero dais (owner: the hero stays in ONE slot)
const IRAD = .9;   // island corner radius
function sdIsland(x, z) { const qx = Math.abs(x) - (MW / 2 - IRAD), qz = Math.abs(z) - (MH / 2 - IRAD); return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - IRAD; }
function islandShape(grow = 0) { const s = new THREE.Shape(), w = MW / 2 + grow, h = MH / 2 + grow, r = IRAD + grow;
  s.moveTo(-w + r, -h); s.lineTo(w - r, -h); s.quadraticCurveTo(w, -h, w, -h + r); s.lineTo(w, h - r); s.quadraticCurveTo(w, h, w - r, h); s.lineTo(-w + r, h); s.quadraticCurveTo(-w, h, -w, h - r); s.lineTo(-w, -h + r); s.quadraticCurveTo(-w, -h, -w + r, -h); return s; }
// the painted ground: 96 px per tile
const GPX = 96, groundTex = canvasTex(MW * GPX, MH * GPX, (g, W, H) => {
  const R = rng(MAPK.length * 31 + 7), X = x => (x - OX) * GPX, Z = z => (z - OZ) * GPX;
  g.fillStyle = MAP.grass[0]; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 900; i++) { const x = R() * W, y = R() * H, r = 20 + R() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, r); const c = R() < .5 ? MAP.grass[1] : MAP.grass[2]; gr.addColorStop(0, c + '55'); gr.addColorStop(1, c + '00'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  g.lineWidth = 1.6; for (let i = 0; i < 26000; i++) { const x = R() * W, y = R() * H, l = 4 + R() * 9; g.strokeStyle = (R() < .5 ? MAP.grass[1] : MAP.grass[2]) + (R() < .5 ? 'aa' : '66'); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (R() - .5) * 5, y - l); g.stroke(); }
  // the road: soft dark edge, dirt, lighter middle, ruts, pebbles, edge stones
  const road = (w, col, blur = 0) => { g.save(); g.filter = blur ? `blur(${blur}px)` : 'none'; g.strokeStyle = col; g.lineWidth = w * GPX; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); WP.forEach((p, i) => i ? g.lineTo(X(p.x), Z(p.z)) : g.moveTo(X(p.x) - GPX, Z(p.z))); g.stroke(); g.restore(); };
  road(1.22, MAP.edge + '88', 14); road(1.0, MAP.road[1], 3); road(.9, MAP.road[0], 0); road(.45, MAP.road[2] + '66', 10);
  const inRoad = (x, y) => distToPath(x / GPX + OX, y / GPX + OZ) < .43;
  for (let i = 0; i < 2600; i++) { const x = R() * W, y = R() * H; if (!inRoad(x, y)) continue; g.fillStyle = R() < .5 ? MAP.road[1] + 'cc' : MAP.road[2] + 'cc'; g.beginPath(); g.ellipse(x, y, 1.5 + R() * 3.5, 1.2 + R() * 2.5, R() * 3, 0, TAU); g.fill(); }
  for (const off of [-.2, .2]) { g.save(); g.strokeStyle = MAP.road[1] + '66'; g.lineWidth = 5; g.setLineDash([30, 14]); g.beginPath(); for (let s = 0; s <= PATHLEN; s += .1) { const p = new V3(); pathAt(s, p, off); s ? g.lineTo(X(p.x), Z(p.z)) : g.moveTo(X(p.x), Z(p.z)); } g.stroke(); g.restore(); }
  for (let s = .3; s < PATHLEN; s += .27) for (const side of [-.5, .5]) { if (R() < .35) continue; const p = new V3(); pathAt(s, p, side * (1 + (R() - .5) * .12)); if (distToPath(p.x, p.z) < .44) continue; const x = X(p.x), y = Z(p.z), r = 5 + R() * 7;
    g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(x + 2, y + 3, r, r * .7, 0, 0, TAU); g.fill(); g.fillStyle = R() < .5 ? MAP.cliff[2] : MAP.cliff[0]; g.beginPath(); g.ellipse(x, y, r, r * .72, R() * 3, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.ellipse(x - r * .25, y - r * .25, r * .4, r * .25, 0, 0, TAU); g.fill(); }
  // bare earth under the build spots, cobbles in front of the castle, a dark rocky patch at the cave
  for (const p of [...PADS, HPAD]) { const x = X(p.c.x), y = Z(p.c.z), gr = g.createRadialGradient(x, y, 10, x, y, GPX * .75); gr.addColorStop(0, MAP.road[1] + 'aa'); gr.addColorStop(1, MAP.road[1] + '00'); g.fillStyle = gr; g.fillRect(x - GPX, y - GPX, GPX * 2, GPX * 2); }
  { const x = X(CASTLE.x - .4), y = Z(CASTLE.z); for (let i = 0; i < 160; i++) { const a = R() * TAU, d = Math.sqrt(R()) * GPX * 1.5; g.fillStyle = R() < .5 ? MAP.cliff[2] : MAP.cliff[0]; g.fillRect(x + Math.cos(a) * d - 7, y + Math.sin(a) * d - 5, 13 + R() * 6, 9 + R() * 4); g.fillStyle = 'rgba(0,0,0,.15)'; g.fillRect(x + Math.cos(a) * d - 7, y + Math.sin(a) * d + 4, 13, 2); } }
  { const x = X(CAVEP.x + .3), y = Z(CAVEP.z), gr = g.createRadialGradient(x, y, 10, x, y, GPX * 1.6); gr.addColorStop(0, 'rgba(40,30,25,.55)'); gr.addColorStop(1, 'rgba(40,30,25,0)'); g.fillStyle = gr; g.fillRect(x - GPX * 2, y - GPX * 2, GPX * 4, GPX * 4); }
  if (MAP.flowers) for (let i = 0; i < 700; i++) { const x = R() * W, y = R() * H; if (distToPath(x / GPX + OX, y / GPX + OZ) < .7) continue; g.fillStyle = ['#fff6d8', '#ffd94a', '#ff9ec0', '#d8e8ff', '#ffb070'][R() * 5 | 0]; g.beginPath(); g.arc(x, y, 2 + R() * 1.8, 0, TAU); g.fill(); }

  for (const [x0, x1] of [[0, eg], [W, W - eg]]) { const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, 'rgba(20,30,10,.35)'); gr.addColorStop(1, 'rgba(20,30,10,0)'); g.fillStyle = gr; g.fillRect(Math.min(x0, x1), 0, eg, H); }
});
groundTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const rockTex = canvasTex(256, 256, g => { const R = rng(5); g.fillStyle = MAP.cliff[0]; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 10 + R() * 14) { g.fillStyle = R() < .5 ? MAP.cliff[1] : MAP.cliff[2]; g.globalAlpha = .55; g.fillRect(0, y, 256, 3 + R() * 6); }
  g.globalAlpha = 1; for (let i = 0; i < 260; i++) { const x = R() * 256, y = R() * 256, w = 10 + R() * 30, h = 6 + R() * 14; g.fillStyle = [MAP.cliff[1], MAP.cliff[2], MAP.cliff[0]][R() * 3 | 0]; g.globalAlpha = .7; g.beginPath(); g.ellipse(x, y, w / 2, h / 2, 0, 0, TAU); g.fill(); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x - w / 2, y + h / 2 - 2, w, 2); }
  g.globalAlpha = 1; });
rockTex.wrapS = rockTex.wrapT = THREE.RepeatWrapping; rockTex.repeat.set(.45, .7);
{ // the island: painted ground on a rounded shape, rock cliffs below it, a grass lip
  const top = new THREE.ShapeGeometry(islandShape(), 24); top.rotateX(-Math.PI / 2); const P0 = top.attributes.position, uv = [];
  for (let i = 0; i < P0.count; i++) uv.push((P0.getX(i) - OX) / MW, 1 - (P0.getZ(i) - OZ) / MH); top.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  const ground = new THREE.Mesh(top, new THREE.MeshLambertMaterial({ map: groundTex })); ground.receiveShadow = true; scene.add(ground);
  const cl = new THREE.ExtrudeGeometry(islandShape(), { depth: 1.5, bevelEnabled: false, curveSegments: 24 }); cl.rotateX(Math.PI / 2); cl.translate(0, -.04, 0);
  const cliff = new THREE.Mesh(cl, [new THREE.MeshLambertMaterial({ color: MAP.edge }), new THREE.MeshLambertMaterial({ map: rockTex })]); cliff.receiveShadow = true; scene.add(cliff);
  const lip = new THREE.Mesh(new THREE.ShapeGeometry((() => { const s = islandShape(.08); s.holes.push(new THREE.Path(islandShape(-.04).getPoints(48).reverse())); return s; })(), 24).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: MAP.edge }));
  lip.position.y = -.005; scene.add(lip);
}
// the water: deep blue far out, light near the island, a moving foam line along the shore, sparkles
const WATER = new THREE.ShaderMaterial({ uniforms: { t: { value: 0 }, c0: { value: new THREE.Color(MAP.water[0]) }, c1: { value: new THREE.Color(MAP.water[1]) }, hw: { value: new THREE.Vector2(MW / 2 - IRAD, MH / 2 - IRAD) }, r: { value: IRAD }, fogc: { value: new THREE.Color(MAP.sky) } },

addEventListener('resize', resize);

const NORENDER = Q.get('norender') === '1';   // the balance checks run the game logic only

    const [AN, WPN, ...rest] = await Promise.all([ld.loadAsync('art/tribe3d/people/anims.glb'), ld.loadAsync('art/tribe3d/people/weapons.glb'), ...kk.map(n => ld.loadAsync(`art/tribe3d/people/${n}.glb`)), ...[1, 2, 3].map(l => ld.loadAsync(`art/tribe3d/rts/WatchTower_FirstAge_Level${l}.glb`)), loadScenery(ld)]);
    for (const c of AN.animations) for (const t of c.tracks) t.name = t.name.replace(/^([A-Za-z]+)_\d+\./, '$1.'); KANIMS = AN.animations;
    for (const c of WPN.scene.children) WEAP[c.name] = c;
    kk.forEach((n, i) => { const sc = rest[i].scene, b = new THREE.Box3().setFromObject(sc); KK[n] = { scene: sc, k: .82 / (b.max.y - b.min.y) }; });
    TW.k = []; TW.top = [];
    for (let l = 0; l < 3; l++) { const s = rest[4 + l].scene, b = new THREE.Box3().setFromObject(s), sz = b.getSize(new V3()); const k = .95 / Math.max(sz.x, sz.z); s.position.y = -b.min.y * k; TW[l] = s; TW.k[l] = k;
      // the floor of the lookout: the highest point near the middle below the roof (sampled with a ray from the side of the platform)
      TW.top[l] = platformTop(s, k, sz.y * k); }
  } catch (e) { LOAD.msg = 'โหลดไม่สำเร็จ: ' + e.message; console.error(e); G.state = 'load'; return; }
  const qh = Q.get('hero'); if (HEROES[qh] && Q.get('menu') !== '1') pickHero(qh); else G.state = 'title';

function platformTop(s, k, H) {   // cast rays down at the middle from heights below the top; the first floor found under the roof = where the people stand

setPx(G.px); boot(); frame();
window.GAME = { info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures }), castSkill, learnSkill, canLearn, HPAD, endGameT: w => endGame(w), MAPK, camZoom: () => CAM.zoom, closeCam: (x, z, d = 4) => { CAM.override = { pos: new V3(x, d * .8, z + d * .6), look: new V3(x, .4, z) }; camera.position.copy(CAM.override.pos); camera.lookAt(x, .4, z); }, zoomAt, G, MON, TOWERS, PADS, PROJ, FX, get HERO() { return HERO; }, TDEF, HEROES, KITS, buildTower, upgradeTower, sellTower, startWave, pickHero, setPx, tap, toScreen: (x, y, z) => toScreen(new V3(x, y, z)),
