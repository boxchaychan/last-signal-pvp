function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }

// ---------- the map: 18 x 10 tiles (1 tile = 1 unit), a winding road from the cave (left) to the castle (right)
const MW = 18, MH = 10, OX = -MW / 2, OZ = -MH / 2;
const WP = [[.3, 2.5], [4.5, 2.5], [4.5, 7.5], [8.5, 7.5], [8.5, 1.5], [13.5, 1.5], [13.5, 7.5], [16.6, 7.5]].map(([x, z]) => new V3(x + OX, 0, z + OZ));
const SEG = []; let PATHLEN = 0; for (let i = 0; i < WP.length - 1; i++) { const a = WP[i], b = WP[i + 1], L = a.distanceTo(b); SEG.push({ a, b, L, s0: PATHLEN, d: b.clone().sub(a).normalize() }); PATHLEN += L; }
function pathAt(s, out, side = 0) { let g = SEG[SEG.length - 1]; for (const q of SEG) if (s <= q.s0 + q.L) { g = q; break; } const t = clamp(s - g.s0, 0, g.L); out.copy(g.a).addScaledVector(g.d, t); out.x += -g.d.z * side; out.z += g.d.x * side; return g; }
function distToPath(x, z) { let best = 1e9; for (const q of SEG) { const px = x - q.a.x, pz = z - q.a.z, t = clamp(px * q.d.x + pz * q.d.z, 0, q.L), dx = px - q.d.x * t, dz = pz - q.d.z * t; best = Math.min(best, Math.hypot(dx, dz)); } return best; }

const ROAD = new Set(); for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { const c = tileC(i, j); if (distToPath(c.x, c.z) < .55) ROAD.add(i + ',' + j); }
// build spots: tiles next to the road that cover the most road (picked by code, spread out)

  const cand = []; for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { if (ROAD.has(i + ',' + j)) continue; const c = tileC(i, j), d = distToPath(c.x, c.z); if (d < .9 || d > 1.6 || i < 1 || i > MW - 3) continue;
    let cover = 0; const tp = new V3(); for (let s = 0; s < PATHLEN; s += .5) { pathAt(s, tp); if (tp.distanceTo(c) < 3.2) cover++; } cand.push({ i, j, c, cover }); }
  cand.sort((a, b) => b.cover - a.cover); for (const q of cand) { if (PADS.length >= 12) break; if (PADS.every(p => p.c.distanceTo(q.c) > 2.1)) PADS.push({ i: q.i, j: q.j, c: q.c, tower: null }); }

  const sideM = [0, 1, 2, 3, 4, 5].map(k => new THREE.MeshLambertMaterial({ color: k === 2 ? 0x6cae44 : k === 3 ? 0x3a2a1a : 0x7a5434 }));

  { const c = HPAD.c, st = new THREE.Mesh(new THREE.CylinderGeometry(.5, .56, .2, 20), new THREE.MeshLambertMaterial({ color: 0x8a8070 })); st.position.set(c.x, .1, c.z); st.receiveShadow = st.castShadow = true;
    const top = new THREE.Mesh(new THREE.CylinderGeometry(.44, .44, .04, 20), new THREE.MeshLambertMaterial({ color: 0xb8a070 })); top.position.set(c.x, .21, c.z); top.receiveShadow = true;
    const rim = new THREE.Mesh(new THREE.TorusGeometry(.47, .03, 6, 32).rotateX(Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xe8c040, emissive: 0x3a2a00 })); rim.position.set(c.x, .21, c.z); scene.add(st, top, rim);
    for (let i = 0; i < 4; i++) { const a = i / 4 * TAU + Math.PI / 4, p = new THREE.Mesh(new THREE.CylinderGeometry(.05, .06, .5, 6), new THREE.MeshLambertMaterial({ color: 0x6a5a48 })); p.position.set(c.x + Math.cos(a) * .52, .3, c.z + Math.sin(a) * .52); p.castShadow = true;
      const f = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEX.soft, color: 0xffb040, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false })); f.position.set(p.position.x, .62, p.position.z); f.scale.setScalar(.22); f.userData.flame = true; scene.add(p, f); HPAD.flames = (HPAD.flames || []).concat(f); } }
  for (const p of PADS) { const e = new THREE.Mesh(new THREE.BoxGeometry(.96, .06, .96), em); e.position.set(p.c.x, .03, p.c.z); const s = new THREE.Mesh(slab, sm); s.position.set(p.c.x, .07, p.c.z); s.receiveShadow = e.receiveShadow = true; scene.add(e, s); p.slab = s; }

function updTimers(dt) { for (let i = TIMERS.length - 1; i >= 0; i--) { const q = TIMERS[i]; if ((q.t -= dt) <= 0) { TIMERS.splice(i, 1); q.fn(); } } }

const addMat = (color, map, opacity = 1) => new THREE.MeshBasicMaterial({ color, map: map || null, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

    const a = Math.random() * TAU, sp = spd * rnd(.3, 1), v = new V3(Math.cos(a) * sp, up * rnd(.4, 1.3), Math.sin(a) * sp), sz = size * rnd(.7, 1.3); s.position.copy(p); s.scale.setScalar(sz);

  addFx(m, life, (q, k) => { q.scale.set(.45 + k * .4, 3.2, .45 + k * .4); q.material.opacity = .5 * (1 - k); }, () => m.material.dispose()); }

const AU = { ctx: null, buf: {} }, SND = { on: Q.get('snd') !== '0' };
function audioInit() {

const SHEET = {}, TL = new THREE.TextureLoader(), PXW = 1 / 86;   // world units per sprite pixel

function platformTop(s, k, H) {   // cast rays down at the middle from heights below the top; the first floor found under the roof = where the people stand
  const g = s.clone(); g.scale.setScalar(k); g.position.set(0, s.position.y, 0); g.updateMatrixWorld(true); const rc = new THREE.Raycaster(); let best = H * .55;
  for (const f of [.95, .85, .75, .65]) { rc.set(new V3(0.04, H * f, 0.04), new V3(0, -1, 0)); const hits = rc.intersectObject(g, true); for (const h of hits) { if (h.point.y < H * f - .05 && h.point.y > H * .3) { best = h.point.y; return best; } } }
  return best;
}
setPx(G.px); boot(); frame();
window.GAME = { castSkill, learnSkill, canLearn, HPAD, closeCam: (x, z, d = 4) => { CAM.base = new V3(x, d * .8, z + d * .6); camera.position.copy(CAM.base); camera.lookAt(x, .4, z); }, G, MON, TOWERS, PADS, PROJ, FX, get HERO() { return HERO; }, TDEF, HEROES, KITS, buildTower, upgradeTower, sellTower, startWave, pickHero, setPx, tap, toScreen: (x, y, z) => toScreen(new V3(x, y, z)),
  sim: (sec, dt = 1 / 30) => { for (let t = 0; t < sec; t += dt) { NOW += dt; tick(dt); } } };
