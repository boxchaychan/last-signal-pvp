<script>
'use strict';
const Q = new URLSearchParams(location.search), V3 = THREE.Vector3, TAU = Math.PI * 2, UP = new V3(0, 1, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a);

// ---------- renderer, light, camera
const glc = document.getElementById('gl'), uic = document.getElementById('ui'), ui = uic.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fd0e8);
const camera = new THREE.PerspectiveCamera(30, 1, .5, 200);
const HEMI = new THREE.HemisphereLight(0xeaf5ff, 0x5a6a30, .45); scene.add(HEMI);
const sun = new THREE.DirectionalLight(0xfff0d4, 1.25); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 70 }); sun.shadow.bias = -.0006; sun.shadow.normalBias = .02;
sun.position.set(-9, 22, 12); scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight(0xcfe6ff, .45); rim.position.set(8, 8, -12); scene.add(rim);
{ // a sky-dome environment light so the PBR heroes / KayKit people get soft light from all around (same recipe as grind3d.html)
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene(), g = new THREE.SphereGeometry(50, 48, 24), P0 = g.attributes.position, col = [], c = new THREE.Color();
  for (let i = 0; i < P0.count; i++) { const y = P0.getY(i) / 50;
    if (y > 0) c.setRGB(lerp(1.05, .35, Math.pow(y, .5)), lerp(1.0, .62, Math.pow(y, .5)), lerp(.92, 1.05, Math.pow(y, .5)));
    else c.setRGB(.36, .40, .22).lerp(new THREE.Color(.62, .55, .40), Math.max(0, 1 + y * 3)); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const sb = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(1, .93, .8).multiplyScalar(14) })); sb.position.set(-24, 38, 26); es.add(sb);
  scene.environment = pm.fromScene(es, .035).texture; pm.dispose();
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t; }
const TEX = {
  soft: canvasTex(64, 64, g => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.35, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); }),
  disc: canvasTex(128, 128, g => { const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,.12)'); r.addColorStop(.75, 'rgba(255,255,255,.28)'); r.addColorStop(.93, 'rgba(255,255,255,1)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 128, 128); }),
  blob: canvasTex(64, 64, g => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(.6, 'rgba(0,0,0,.35)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); }),
};

// ---------- the map: 18 x 10 tiles (1 tile = 1 unit), a winding road from the cave (left) to the castle (right)

const WP = [[.3, 2.5], [4.5, 2.5], [4.5, 7.5], [8.5, 7.5], [8.5, 1.5], [13.5, 1.5], [13.5, 7.5], [16.6, 7.5]].map(([x, z]) => new V3(x + OX, 0, z + OZ));

const ROAD = new Set(); for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { const c = tileC(i, j); if (distToPath(c.x, c.z) < .55) ROAD.add(i + ',' + j); }

const PADS = []; {
  const cand = []; for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { if (ROAD.has(i + ',' + j)) continue; const c = tileC(i, j), d = distToPath(c.x, c.z); if (d < .9 || d > 1.6 || i < 1 || i > MW - 3) continue;
    let cover = 0; const tp = new V3(); for (let s = 0; s < PATHLEN; s += .5) { pathAt(s, tp); if (tp.distanceTo(c) < 3.2) cover++; } cand.push({ i, j, c, cover }); }
  cand.sort((a, b) => b.cover - a.cover); for (const q of cand) { if (PADS.length >= 12) break; if (PADS.every(p => p.c.distanceTo(q.c) > 2.1)) PADS.push({ i: q.i, j: q.j, c: q.c, tower: null }); }
}
{ // ground: one mesh, a flat colour per tile (two greens, dirt road), on a thick earth block (a diorama)
  const pos = [], col = [], R = rng(7), c = new THREE.Color();
  const quad = (x0, z0, x1, z1, y, cc) => { pos.push(x0, y, z0, x0, y, z1, x1, y, z1, x0, y, z0, x1, y, z1, x1, y, z0); for (let k = 0; k < 6; k++) col.push(cc.r, cc.g, cc.b); };
  for (let i = 0; i < MW; i++) for (let j = 0; j < MH; j++) { const road = ROAD.has(i + ',' + j), x0 = i + OX, z0 = j + OZ, v = R() * .06;
    if (road) c.setRGB(.78 + v, .58 + v, .36 + v * .8); else if ((i + j) & 1) c.setRGB(.36 + v, .62 + v, .22 + v * .5); else c.setRGB(.31 + v, .57 + v, .19 + v * .5);
    c.convertSRGBToLinear(); quad(x0, z0, x0 + 1, z0 + 1, road ? -.015 : 0, c); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })); ground.receiveShadow = true; scene.add(ground);
  const sideM = [0, 1, 2, 3, 4, 5].map(k => new THREE.MeshLambertMaterial({ color: k === 2 ? 0x6cae44 : k === 3 ? 0x3a2a1a : 0x7a5434 }));
  const block = new THREE.Mesh(new THREE.BoxGeometry(MW, 1.6, MH), sideM); block.position.set(0, -.84, 0); block.receiveShadow = true; scene.add(block);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(MW + .02, .16, MH + .02), new THREE.MeshLambertMaterial({ color: 0x5d9a3a })); lip.position.set(0, -.13, 0); scene.add(lip);
  // the sea around the island
  const sea = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x5aa9d6 })); sea.rotation.x = -Math.PI / 2; sea.position.y = -1.25; scene.add(sea);

}

// ---------- effects
const FX = [], TIMERS = [];
function addFx(o, life, upd, end) { scene.add(o); const f = { o, t: 0, life, upd, end }; FX.push(f); return f; }
function updFx(dt) { for (let i = FX.length - 1; i >= 0; i--) { const f = FX[i]; f.t += dt; const k = f.t / f.life; if (k >= 1 || (f.upd && f.upd(f.o, Math.min(1, k), dt, f) === true)) { scene.remove(f.o); f.end && f.end(); FX.splice(i, 1); } } }

function updTimers(dt) { for (let i = TIMERS.length - 1; i >= 0; i--) { const q = TIMERS[i]; if ((q.t -= dt) <= 0) { TIMERS.splice(i, 1); q.fn(); } } }
const GEO = { ring: new THREE.RingGeometry(.86, 1, 48), plane: new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), col: new THREE.CylinderGeometry(1, 1, 1, 20, 1, true) };
const addMat = (color, map, opacity = 1) => new THREE.MeshBasicMaterial({ color, map: map || null, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
function burst(p, o = {}) {
  const { n = 8, color = 0xffe08a, spd = 3, up = 2, size = .25, life = .45, grav = -6 } = o;
  for (let i = 0; i < n; i++) { const m = new THREE.SpriteMaterial({ map: TEX.soft, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }), s = new THREE.Sprite(m);
    const a = Math.random() * TAU, sp = spd * rnd(.3, 1), v = new V3(Math.cos(a) * sp, up * rnd(.4, 1.3), Math.sin(a) * sp), sz = size * rnd(.7, 1.3); s.position.copy(p); s.scale.setScalar(sz);
    addFx(s, life * rnd(.7, 1.2), (q, k, dt) => { v.y += grav * dt; q.position.addScaledVector(v, dt); v.multiplyScalar(Math.max(0, 1 - 3 * dt)); q.material.opacity = 1 - k; q.scale.setScalar(sz * (1 - k * .5)); }, () => m.dispose()); }
}
function ring(p, color, r0, r1, life, opa = 1) { const m = new THREE.Mesh(GEO.ring, addMat(color, null, opa)); m.rotation.x = -Math.PI / 2; m.position.set(p.x, .08, p.z);
  addFx(m, life, (q, k) => { const r = lerp(r0, r1, 1 - (1 - k) * (1 - k)); q.scale.set(r, r, r); q.material.opacity = opa * (1 - k); }, () => m.material.dispose()); }
function disc(p, color, r, life, opa = .9) { const m = new THREE.Mesh(GEO.plane, addMat(color, TEX.disc, 0)); m.position.set(p.x, .09, p.z); m.scale.set(r * 2, 1, r * 2);
  return addFx(m, life, (q, k) => { q.material.opacity = opa * Math.min(1, k * 8) * Math.min(1, (1 - k) * 5); }, () => m.material.dispose()); }
function column(p, color, life) { const m = new THREE.Mesh(GEO.col, addMat(color, null, .5)); m.position.set(p.x, 1.6, p.z); m.scale.set(.45, 3.2, .45);
  addFx(m, life, (q, k) => { q.scale.set(.45 + k * .4, 3.2, .45 + k * .4); q.material.opacity = .5 * (1 - k); }, () => m.material.dispose()); }
const CAM = { shake: 0 }; const shake = a => { CAM.shake = Math.max(CAM.shake, a); };

// ---------- sound (Kenney CC0 clips already in the repo + a synthesized bow twang)
const AU = { ctx: null, buf: {} }, SND = { on: Q.get('snd') !== '0' };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; } try { AU.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return; }
  const F = { hit: 'impactSoft_medium_001', boom: 'impactSoft_heavy_000', coin: 'handleCoins', build: 'impactWood_heavy_000', lvl: 'jingles_HIT15', tick: 'click_002', slash: 'drawKnife1', hurt: 'impactPunch_medium_000' };
  for (const [k, f] of Object.entries(F)) fetch(`art/tribe3d/sfx/${f}.ogg`).then(r => r.arrayBuffer()).then(b => AU.ctx.decodeAudioData(b)).then(b => { AU.buf[k] = b; }).catch(() => { });
}
let SFXN = 0;
function sfx(k, vol = 1, rate = 1) {

// ---------- pixel monsters: our sprite sheets (art/action/mobs/<n>.png + .json: 6 frames x rows walk / attack / death / hurt, foot point fx, fy), upright cards
const MOB = {
  shroom: { hp: 34, spd: 1.15, gold: 4 }, wisp: { hp: 26, spd: 1.55, gold: 4 }, monkey: { hp: 30, spd: 1.6, gold: 4 }, kappa: { hp: 40, spd: 1.2, gold: 5 }, paper_doll: { hp: 28, spd: 1.45, gold: 4 }, goblin_archer: { hp: 36, spd: 1.3, gold: 5 },
  wolf: { hp: 55, spd: 1.75, gold: 7 }, skeleton: { hp: 80, spd: 1.1, gold: 8 }, boar_guard: { hp: 120, spd: .95, gold: 10 }, draugr: { hp: 95, spd: 1.05, gold: 9 }, jackal_warrior: { hp: 90, spd: 1.25, gold: 9 }, nekomata: { hp: 70, spd: 1.6, gold: 8 }, fox_spirit: { hp: 75, spd: 1.5, gold: 8 },
  golem: { hp: 260, spd: .7, gold: 18 }, troll: { hp: 300, spd: .75, gold: 20 }, oni: { hp: 280, spd: .85, gold: 20 }, croc_guard: { hp: 220, spd: .9, gold: 16 }, terracotta_general: { hp: 240, spd: .85, gold: 18 }, ice_golem: { hp: 320, spd: .65, gold: 22 },
  boss_treant: { hp: 2200, spd: .5, gold: 120, boss: true, sc: 1.25 }, boss_nian: { hp: 4200, spd: .6, gold: 180, boss: true, sc: 1.25 }, boss_orochi: { hp: 7000, spd: .5, gold: 260, boss: true, sc: 1.3 }, boss_jotun: { hp: 11000, spd: .5, gold: 400, boss: true, sc: 1.35 },
};
const MOBNAME = { shroom: 'เห็ดพิษ', wisp: 'ภูตตะเกียง', monkey: 'ลิงโจร', kappa: 'กัปปะ', paper_doll: 'ตุ๊กตากระดาษ', goblin_archer: 'ก็อบลิน', wolf: 'หมาป่าเงา', skeleton: 'โครงกระดูก', boar_guard: 'นักรบหมูป่า', draugr: 'ดรากร์', jackal_warrior: 'นักรบหมาใน', nekomata: 'แมวสองหาง', fox_spirit: 'ปีศาจจิ้งจอก',
  golem: 'โกเลมหิน', troll: 'โทรล', oni: 'ยักษ์โอนิ', croc_guard: 'ทหารจระเข้', terracotta_general: 'นายพลดินเผา', ice_golem: 'โกเลมน้ำแข็ง', boss_treant: 'ต้นไม้อสูร', boss_nian: 'เหนียนโซ่ว', boss_orochi: 'โอโรจิแปดหัว', boss_jotun: 'ยักษ์โยตุน' };
const T1 = ['shroom', 'wisp', 'monkey', 'kappa', 'paper_doll', 'goblin_archer'], T2 = ['wolf', 'skeleton', 'boar_guard', 'draugr', 'jackal_warrior', 'nekomata', 'fox_spirit'], T3 = ['golem', 'troll', 'oni', 'croc_guard', 'terracotta_general', 'ice_golem'];
const BOSSW = { 5: 'boss_treant', 10: 'boss_nian', 15: 'boss_orochi', 20: 'boss_jotun' }, NWAVE = 20;
const SHEET = {}, TL = new THREE.TextureLoader(), PXW = 1 / 86;   // world units per sprite pixel
function loadSheet(k) {

  const S = SHEET[k] = {}; S.p = Promise.all([fetch(`art/action/mobs/${k}.json`).then(r => r.json()), TL.loadAsync(`art/action/mobs/${k}.png`)]).then(([J, t]) => {

    const sc = PXW * (MOB[k].sc || 1), g = new THREE.PlaneGeometry(J.w * sc, J.h * sc); g.translate((J.w / 2 - J.fx) * sc, (J.fy - J.h / 2) * sc, 0);   // foot point (fx, fy from the top) at the origin

}
const CARD_V = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const CARD_F = 'uniform sampler2D map; uniform vec4 rect; uniform float flash; uniform vec3 tint; uniform float op; varying vec2 vUv;' +
  'void main(){ vec4 c = texture2D(map, rect.xy + vUv * rect.zw); if (c.a < .45) discard; vec3 col = mix(c.rgb * tint, vec3(1.0), flash); gl_FragColor = vec4(col, op); }';
const MON = [], BLOB = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), BLOBM = new THREE.MeshBasicMaterial({ map: TEX.blob, transparent: true, depthWrite: false });
function spawnMon(k, hpMul) {
  const S = SHEET[k]; if (!S || !S.ok) return null; const D = MOB[k];

  const NH = HKEYS.length, cw = Math.min(170 * S, (SW - 60 * S) / NH), ch = Math.min(220 * S, SH - 130 * S), gap = 12 * S, x0 = SW / 2 - (cw * NH + gap * (NH - 1)) / 2, y0 = 100 * S;

    ui.beginPath(); ui.arc(x + cw / 2, y + ch * .28, ch * .18, 0, TAU); ui.fillStyle = 'rgba(0,0,0,.25)'; ui.fill(); heroIcon(k, x + cw / 2, y + ch * .28, ch * .18);
    txt(D.name, x + cw / 2, y + ch * .58, 18 * S, '#fff'); txt(D.role, x + cw / 2, y + ch * .58 + 20 * S, 11.5 * S, '#fff8e0', 'center', 600); txt('สกิล: ' + D.skill, x + cw / 2, y + ch * .58 + 36 * S, 11.5 * S, '#fff8e0', 'center', 600);
    rr(x + cw * .18, y + ch - 32 * S, cw * .64, 24 * S, 12 * S); ui.fillStyle = 'rgba(30,20,10,.75)'; ui.fill(); txt('เลือก', x + cw / 2, y + ch - 20 * S, 13 * S, '#ffe9b0'); });
  if (G.best) txt('ดีที่สุด: ผ่าน ' + G.best + ' คลื่น', SW / 2, y0 + ch + 20 * S, 13 * S, '#fff3cf', 'center', 600);
}
function drawEnd() {
  ui.fillStyle = 'rgba(0,0,0,.45)'; ui.fillRect(0, 0, SW, SH); const win = G.state === 'win';
  txt(win ? 'ชนะ! ปราสาทปลอดภัย' : 'ปราสาทแตกแล้ว...', SW / 2, SH * .32, 32 * S, win ? '#ffe14a' : '#ff8a7a'); txt(`ผ่าน ${win ? NWAVE : G.wave - 1} คลื่น · ล่าได้ ${G.kills} ตัว`, SW / 2, SH * .32 + 34 * S, 15 * S, '#fff3cf');
  const bw = 150 * S, bh = 40 * S, y = SH * .55; [['again', 'เล่นอีกครั้ง', SW / 2 - bw - 8 * S], ['title', 'เปลี่ยนฮีโร่', SW / 2 + 8 * S]].forEach(([k, l, x]) => { MENU.push({ k, x, y, w: bw, h: bh }); rr(x, y, bw, bh, bh / 2); ui.fillStyle = k === 'again' ? '#f0a020' : 'rgba(255,255,255,.18)'; ui.fill(); txt(l, x + bw / 2, y + bh / 2, 15 * S, '#fff'); });
}

// ---------- input
const RAY = new THREE.Raycaster(), PL = new THREE.Plane(new V3(0, 1, 0), 0), _n = new THREE.Vector2();
function groundAt(x, y) { _n.set(x / SW * 2 - 1, -(y / SH) * 2 + 1); RAY.setFromCamera(_n, camera); const p = new V3(); return RAY.ray.intersectPlane(PL, p) ? p : null; }
function padAt(p) { if (!p) return null; let best = null, bd = .62; for (const q of PADS) { const d = Math.max(Math.abs(q.c.x - p.x), Math.abs(q.c.z - p.z)); if (d < bd) { bd = d; best = q; } } return best; }
const inBtn = (b, x, y) => b && (b.r ? Math.hypot(x - b.x, y - b.y) < b.r * 1.1 : x >= b.rx && x <= b.rx + b.w && y >= b.ry && y <= b.ry + b.h);
uic.addEventListener('contextmenu', e => e.preventDefault());
uic.addEventListener('pointermove', e => { if (G.menu && !G.menu.pad.tower) { const b = MENU.find(q => e.clientX >= q.x && e.clientX <= q.x + q.w && e.clientY >= q.y && e.clientY <= q.y + q.h); G.menu.hover = b && TDEF[b.k] ? b.k : null; } });
uic.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); tap(e.clientX, e.clientY); });
function tap(x, y) {
  const mb = MENU.find(q => x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h);
  if (G.state === 'title') { if (mb && mb.k.startsWith('hero:')) pickHero(mb.k.slice(5)); return; }
  if (G.state === 'win' || G.state === 'lose') { if (mb) { if (mb.k === 'again') restart(); else location.search = G.px ? '?px=1&menu=1' : '?menu=1'; } return; }
  if (G.state !== 'play') return;
  if (mb && G.menu) { const t = G.menu.pad.tower; if (TDEF[mb.k]) { if (buildTower(G.menu.pad, mb.k)) G.menu = null; else sfx('tick', .4, .6); } else if (mb.k === 'up') { upgradeTower(t); } else if (mb.k === 'sell') { sellTower(t); G.menu = null; } return; }
  if (inBtn(BTN.spd, x, y)) { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; return; } if (inBtn(BTN.px, x, y)) { setPx(!G.px); return; } if (inBtn(BTN.snd, x, y)) { SND.on = !SND.on; return; }
  if (!G.queue.length && !MON.length && G.wave < NWAVE && inBtn(BTN.wave, x, y)) { startWave(); return; }
  if (HERO && inBtn(BTN.skill, x, y)) { G.menu = null; G.select = false; if (HERO.D.aimed) { if (HERO.skillT <= 0 && !HERO.dead) HERO.aim = !HERO.aim; } else heroSkill(); return; }
  if (HERO && inBtn(BTN.hero, x, y)) { G.menu = null; HERO.aim = false; G.select = !G.select; return; }
  const p = groundAt(x, y); if (!p) { G.menu = null; return; }
  if (HERO && HERO.aim) { HERO.aim = false; heroSkill(p); return; }
  const pad = padAt(p); if (pad && !G.select) { G.menu = G.menu && G.menu.pad === pad ? null : { pad }; return; }
  G.menu = null; if (HERO && !HERO.dead && Math.abs(p.x) < -OX - .2 && Math.abs(p.z) < -OZ - .2) { HERO.goto = p.clone(); HERO.home.copy(p); G.select = false; ring(p, 0x9fe8ff, .1, .6, .4); }
}
addEventListener('keydown', e => { audioInit(); if (G.state !== 'play') return; if (e.code === 'Space') { e.preventDefault(); startWave(); } if (e.code === 'KeyQ' && HERO) { if (HERO.D.aimed) HERO.aim = !HERO.aim; else heroSkill(); } if (e.code === 'Escape') { G.menu = null; G.select = false; if (HERO) HERO.aim = false; } });

// ---------- view: the whole island fits the screen (landscape phones); ?px=1 / the pill = render at low resolution, upscaled with hard pixels
function setPx(on) { G.px = on; glc.classList.toggle('px', on); resize(); }
function resize() { SW = innerWidth; SH = innerHeight; DPR = Math.min(2, devicePixelRatio || 1); renderer.setPixelRatio(G.px ? clamp(300 / SH, .2, 1) : DPR); renderer.setSize(SW, SH, false); uic.width = SW * DPR; uic.height = SH * DPR; camera.aspect = SW / SH; camera.updateProjectionMatrix(); fitCam(); layout(); }
function fitCam() {
  const tilt = 52 * Math.PI / 180, c = new V3(0, 0, .3); let d = 8; const pts = [[OX, 0, OZ], [-OX, 0, OZ], [OX, 0, -OZ], [-OX, 0, -OZ], [OX, -1.2, -OZ], [-OX, -1.2, -OZ]].map(a => new V3(...a));
  for (let i = 0; i < 200; i++) { camera.position.set(c.x, c.y + d * Math.sin(tilt), c.z + d * Math.cos(tilt)); camera.lookAt(c); camera.updateMatrixWorld(); let ok = true;
    for (const p of pts) { const q = p.clone().project(camera); if (Math.abs(q.x) > .99 || q.y > .84 || q.y < -.92) { ok = false; break; } } if (ok) break; d += .25; }
  CAM.base = camera.position.clone(); CAM.look = c;
}
addEventListener('resize', resize);

// ---------- loop
const LOAD = { msg: 'กำลังโหลด...', f: 0 }; let NOW = 0; const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame); let dt = Math.min(.05, clock.getDelta()); NOW += dt; SFXN = 0;
  if (G.state === 'play' || G.state === 'win' || G.state === 'lose') { const steps = G.state === 'play' ? G.speed : 1; for (let i = 0; i < steps; i++) tick(dt); } else if (HERO) HERO.u.mixer.update(dt);
  const sx = (Math.random() - .5) * CAM.shake, sy = (Math.random() - .5) * CAM.shake; CAM.shake = Math.max(0, CAM.shake - dt * .8); if (CAM.base) { camera.position.set(CAM.base.x + sx, CAM.base.y + sy, CAM.base.z); }
  RANGE_T -= dt; RINGM.material.opacity = RANGE_T > 0 ? .9 : 0; RFILL.material.opacity = RANGE_T > 0 ? .12 : 0;

function tick(dt) {

async function boot() {

    const [AN, WPN, ...rest] = await Promise.all([ld.loadAsync('art/tribe3d/people/anims.glb'), ld.loadAsync('art/tribe3d/people/weapons.glb'), ...kk.map(n => ld.loadAsync(`art/tribe3d/people/${n}.glb`)), ...[1, 2, 3].map(l => ld.loadAsync(`art/tribe3d/rts/WatchTower_FirstAge_Level${l}.glb`)), loadScenery(ld)]);
    for (const c of AN.animations) for (const t of c.tracks) t.name = t.name.replace(/^([A-Za-z]+)_\d+\./, '$1.'); KANIMS = AN.animations;
    for (const c of WPN.scene.children) WEAP[c.name] = c;
    kk.forEach((n, i) => { const sc = rest[i].scene, b = new THREE.Box3().setFromObject(sc); KK[n] = { scene: sc, k: .82 / (b.max.y - b.min.y) }; });
    TW.k = []; TW.top = [];
    for (let l = 0; l < 3; l++) { const s = rest[4 + l].scene, b = new THREE.Box3().setFromObject(s), sz = b.getSize(new V3()); const k = .95 / Math.max(sz.x, sz.z); s.position.y = -b.min.y * k; TW[l] = s; TW.k[l] = k;
      // the floor of the lookout: the highest point near the middle below the roof (sampled with a ray from the side of the platform)

}
function platformTop(s, k, H) {   // cast rays down at the middle from heights below the top; the first floor found under the roof = where the people stand

}
setPx(G.px); boot(); frame();
window.GAME = { closeCam: (x, z, d = 4) => { CAM.base = new V3(x, d * .8, z + d * .6); camera.position.copy(CAM.base); camera.lookAt(x, .4, z); }, G, MON, TOWERS, PADS, PROJ, FX, get HERO() { return HERO; }, TDEF, HEROES, buildTower, upgradeTower, sellTower, startWave, pickHero, heroSkill, setPx, tap, toScreen: (x, y, z) => toScreen(new V3(x, y, z)),
