<script>
'use strict';

   ORIGINAL pixels (tools/art/pixrig_parts.py -> art/turnrig), moved by code. Everything is drawn on a low-res canvas, 1 canvas px = 1 art px, so the

  { f: 'bg_china', gy: 250, mob: 'boss_nian' }, { f: 'bg_siam', gy: 252, mob: 'boss_chalawan' }, { f: 'bg_egypt', gy: 250, mob: 'boss_sphinx' }];
const IMG = {}, MOB = {};
const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(src); i.src = src; });

/* ---------- the rig ---------- */
let RIG, PART = {}, ORDER = [];
function buildRig(rig, atlas) {

}
const FOOT = { x: 86, y: 152 };

/* world matrix of a part: parent * T(pivot - parent pivot + offset) * R(r) */

/* hits during a move: [time, kind] */
const HITS = { attack: [[.43, 1], [.69, 2]], skill: [[.74, 3]] };

/* ---------- the same hero as PixelLab drawn frames (to compare) ---------- */
let CLIP, CLIPJ;
const FR = { idle: [60, 8, 8, true], attack: [10, 41, 26], skill: [120, 16, 18], hurt: [70, 4, 10], death: [80, 8, 10], win: [60, 8, 8, true] };
function clipFrame(H, now) {
  const a = H.act === 'dead' ? 'death' : H.act === 'idle' || !FR[H.act] ? 'idle' : H.act, [s, n, fps, loop] = FR[a];
  let t = a === 'idle' ? now : H.act === 'dead' ? 9 : H.t; if (a === 'attack') t = clamp(H.t - .3, 0, 9); if (a === 'skill') t = clamp(H.t - .55, 0, 9);

}
function clipPos(H) {

}
const HITS_F = { attack: [[.3 + 6 / 26, 1], [.3 + 15 / 26, 1], [.3 + 24 / 26, 2]], skill: [[.55 + 5 / 18, 1], [.55 + 10 / 18, 3]] };
const LEN_F = { attack: 2.25, skill: 2.0, hurt: .5, death: .9, win: 9e9 };

/* ---------- state ---------- */

let FX = [], NUM = [], AUTO = false, autoT = 0, turnN = 0, capeV = 0, capeS = 0, lastHX = HOME, lastHY = 250;

function heroDo(a, done) { Hh.act = a; Hh.t = 0; Hh.fired = 0; Hh.done = done || null; if (a !== 'death' && a !== 'win') Hh.x = Hh.x || HOME; }

function setBg(i) { T.bg = i; const b = BGS[i]; Hh.gy = E.gy = b.gy; E.k = b.mob; E.hp = E.max = 100; E.alpha = 1; enemyDo('idle'); E.x = EX; }

/* ---------- pixel effects (all on whole pixels) ---------- */

function drawNum(o) {

  for (const ch of o.s) { const m = DIG[+ch]; for (let p = 0; p < 15; p++) if (m[p] === '1') { const X = x + (p % 3) * s, Y = Math.round(y) + Math.floor(p / 3) * s; px(g, X - 1, Y - 1, s + 2, s + 2, '#1a0d05'); } x += 4 * s; }
  x = Math.round(o.x - w / 2); for (const ch of o.s) { const m = DIG[+ch]; for (let p = 0; p < 15; p++) if (m[p] === '1') px(g, x + (p % 3) * s, Math.round(y) + Math.floor(p / 3) * s, s, s, o.col || (o.big ? '#ffe14d' : '#fff')); x += 4 * s; }
  g.globalAlpha = 1;
}

/* ---------- hits ---------- */
function hitEnemy(kind, at) {
  const dmg = kind === 3 ? 38 + (Math.random() * 6 | 0) : kind === 2 ? 17 + (Math.random() * 4 | 0) : 11 + (Math.random() * 4 | 0);
  E.hp = Math.max(0, E.hp - dmg); E.flash = .1; E.kx = kind === 3 ? 14 : kind === 2 ? 9 : 5; T.stop = kind === 3 ? .13 : kind === 2 ? .08 : .06; T.shake = kind === 3 ? 7 : kind === 2 ? 4 : 2.5;
  number({ s: String(dmg), x: E.x, y: E.gy - mobH() * .7, big: kind === 3 });
  fx({ kind: 'spark', x: at.x, y: at.y, d: .3, r0: Math.random(), big: kind > 1, n: kind > 1 ? 10 : 8 });
  if (kind === 3) { T.flash = .18; fx({ kind: 'ring', x: E.x - 10, y: E.gy, r0: 6, r1: 70, th: 4, d: .45, fl: .32, col: '#3fa8f0' }); fx({ kind: 'pillar', x: E.x - 10, y: E.gy, w: 12, h: 300, d: .5 }); }
  if (E.act !== 'death') enemyDo(E.hp <= 0 ? 'death' : 'hurt');
}
function hitHero() {
  const dmg = 9 + (Math.random() * 7 | 0); Hh.hp = Math.max(0, Hh.hp - dmg); Hh.flash = .1; T.stop = .07; T.shake = 3.5;
  number({ s: String(dmg), x: Hh.x, y: Hh.gy - 110, col: '#ff7a6a' }); fx({ kind: 'spark', x: Hh.x + 10, y: Hh.gy - 60, d: .28, r0: .3, col: '#ffb08a' });
  heroDo(Hh.hp <= 0 ? 'death' : 'hurt');
}

/* ---------- monster ---------- */
const mobH = () => (MOB[E.k] ? MOB[E.k].j.size || 100 : 100);
function enemyFrame() {
  const m = MOB[E.k]; if (!m) return null; const j = m.j, n = j.n;
  if (E.act === 'attack') { const f = Math.floor(seg(E.t, .32, .92) * n); return [j.rows.attack, Math.min(n - 1, f)]; }
  if (E.act === 'hurt') return [j.rows.hurt, Math.min(n - 1, Math.floor(E.t * 14))];
  if (E.act === 'death') return [j.rows.death, Math.min(n - 1, Math.floor(E.t * 9))];
  return [j.rows.walk, Math.floor(T.now * 5) % n];
}
function enemyX() {
  if (E.act === 'attack') { const go = seg(E.t, 0, .3), bk = seg(E.t, 1.05, 1.35); return lerp(lerp(EX, Hh.x + mobH() * .5 + 28, eo(go)), EX, sm(bk)); }
  return E.x;
}

/* ---------- drawing ---------- */
function drawHero(c, now) {
  if (T.frames) {
    const f = clipFrame(Hh, now), C = CLIPJ.cell, cols = CLIPJ.cols, p = clipPos(Hh);
    c.drawImage(CLIP, (f % cols) * C, Math.floor(f / cols) * C, C, C, Math.round(p.x - CLIPJ.fx), Math.round(p.y - CLIPJ.fy), C, C); return { x: p.x, y: p.y };
  }
  const P = heroPose(Hh, now), dx = P.x - lastHX, dy = P.y - lastHY; lastHX = P.x; lastHY = P.y;
  /* the cape: a spring pushed by how fast the body moves */
  const dt = 1 / 60; capeV += ((clamp(-dx * 1.2, -9, 9) - capeS) * 60 - capeV * 9) * dt; capeS += capeV * dt; P.cape = capeS + 1.2 * Math.sin(now * 1.7); P.capeW = .6 + Math.min(1.5, Math.abs(dx) * .3);
  const M = mats(P); Hh.lastM = M; drawRig(c, P, M);
  if (T.bones) { c.fillStyle = '#ff3b30'; for (const n of ORDER) { const q = M[n].transformPoint(new DOMPoint(0, 0)); c.fillRect(Math.round(q.x) - 1, Math.round(q.y) - 1, 3, 3); } }
  return { x: P.x, y: P.y, P };
}

function shadow(x, y, w) { g.fillStyle = 'rgba(10,6,14,.45)'; for (let r = -2; r <= 2; r++) { const ww = Math.round(w * Math.sqrt(1 - (r / 2.6) ** 2)); g.fillRect(Math.round(x - ww / 2), Math.round(y + r), ww, 1); } }
function bars() {
  const bw = Math.min(150, Math.round(VW * .34)), y = 26;
  const bar = (x, hp, max, col, right) => { px(g, x - 1, y - 1, bw + 2, 8, '#120c08'); px(g, x, y, bw, 6, '#3a2418'); const w = Math.round(bw * hp / max); px(g, right ? x + bw - w : x, y, w, 6, col); px(g, right ? x + bw - w : x, y, w, 2, '#ffffff55'); };
  bar(8, Hh.hp, Hh.max, '#5fd86a', false); bar(VW - bw - 8, E.hp, E.max, '#ff5a4a', true);
}
function frame() {
  const now = T.now;
  const sh = T.shake > .2 ? [Math.round((Math.random() - .5) * T.shake), Math.round((Math.random() - .5) * T.shake)] : [0, 0];
  g.setTransform(1, 0, 0, 1, sh[0] - CX, sh[1] - CY); g.imageSmoothingEnabled = false;
  g.drawImage(IMG[BGS[T.bg].f], 0, 0);
  /* monster */
  const m = MOB[E.k], ef = enemyFrame(), exx = enemyX() + E.kx; E.xd = exx;
  if (m && ef) {
    shadow(exx, E.gy, mobH() * .7); const j = m.j; g.save(); g.globalAlpha = E.alpha; g.translate(Math.round(exx), Math.round(E.gy)); g.scale(-1, 1);
    g.drawImage(m.img, ef[1] * j.w, ef[0] * j.h, j.w, j.h, -j.fx, -j.fy, j.w, j.h);
    if (E.flash > 0) { g.globalAlpha = E.alpha * .8; g.drawImage(m.white, ef[1] * j.w, ef[0] * j.h, j.w, j.h, -j.fx, -j.fy, j.w, j.h); } g.restore();
  }
  /* hero: drawn on its own canvas, then ghosts + flash */
  hg.setTransform(1, 0, 0, 1, -CX, -CY); hg.clearRect(CX, CY, VW, VH); const hp = drawHero(hg, now); hg.setTransform(1, 0, 0, 1, 0, 0);
  shadow(hp.x, Hh.gy, Hh.act === 'death' && Hh.t > .5 ? 90 : 46);
  g.setTransform(1, 0, 0, 1, sh[0], sh[1]);
  for (const gh of Hh.ghosts) { g.globalAlpha = gh.a * .5; g.drawImage(gh.c, 0, 0); } g.globalAlpha = 1;
  g.drawImage(HC, 0, 0);
  if (Hh.flash > 0) { hg.globalCompositeOperation = 'source-in'; hg.fillStyle = '#fff'; hg.fillRect(0, 0, VW, VH); hg.globalCompositeOperation = 'source-over'; g.globalAlpha = .8; g.drawImage(HC, 0, 0); g.globalAlpha = 1; }
  const fast = (Hh.act === 'attack' && Hh.t > .2 && Hh.t < .42) || (Hh.act === 'skill' && Hh.t > .3 && Hh.t < .76) || (T.frames && (Hh.act === 'attack' || Hh.act === 'skill') && Hh.t > .1 && Hh.t < .55);
  if (fast && T.stop <= 0) { const c = document.createElement('canvas'); c.width = VW; c.height = VH; c.getContext('2d').drawImage(HC, 0, 0); Hh.ghosts.push({ c, a: 1 }); }
  /* effects + numbers */
  g.setTransform(1, 0, 0, 1, sh[0] - CX, sh[1] - CY);
  for (const f of FX) FXD[f.kind](f);
  for (const o of NUM) drawNum(o);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (T.flash > 0) { g.globalAlpha = clamp(T.flash / .18, 0, 1) * .55; g.fillStyle = '#e8fbff'; g.fillRect(0, 0, VW, VH); g.globalAlpha = 1; }
  bars();
}

/* ---------- time ---------- */
function stepHero(dt) {
  if (Hh.act === 'idle') return; Hh.t += dt;
  const hits = T.frames ? HITS_F[Hh.act] : HITS[Hh.act], len = T.frames ? LEN_F[Hh.act] : A[Hh.act];
  if (hits) for (let i = Hh.fired; i < hits.length; i++) if (Hh.t >= hits[i][0]) {
    Hh.fired = i + 1; const k = hits[i][1];
    let at = { x: E.xd - 14, y: E.gy - mobH() * .55 };
    if (!T.frames && Hh.lastM) { const tp = bladeTip(Hh.lastM); at = { x: Math.min(tp.x, E.xd + 10), y: tp.y }; }
    hitEnemy(k, at);
  }
  /* slash arcs follow the sword's real swing */
  if (!T.frames && Hh.act === 'attack') {
    if (!Hh.s1 && Hh.t >= .37) { Hh.s1 = 1; const P = heroPose(Hh, T.now); fx({ kind: 'crescent', x: P.x + 2, y: P.y - 66, r: 58, th: 13, a0: -2.7, a1: .55, d: .32 }); }
    if (!Hh.s2 && Hh.t >= .63) { Hh.s2 = 1; const P = heroPose(Hh, T.now); fx({ kind: 'crescent', x: P.x + 4, y: P.y - 62, r: 54, th: 12, a0: .9, a1: -1.9, d: .3 }); }
    if (!Hh.d1 && Hh.t >= .22) { Hh.d1 = 1; fx({ kind: 'dust', x: HOME - 4, y: Hh.gy, d: .4, dir: -1 }); }
  }
  if (!T.frames && Hh.act === 'skill') {
    if (Hh.t < .32 && Math.random() < .6) fx({ kind: 'mote', x: Hh.x + (Math.random() - .5) * 40, y: Hh.gy - Math.random() * 20, h: 50 + Math.random() * 40, d: .6, s: Math.random() * 9 });
    if (!Hh.s1 && Hh.t >= .62) { Hh.s1 = 1; fx({ kind: 'crescent', x: E.x - 40, y: Hh.gy - 70, r: 64, th: 15, a0: -2.2, a1: 1.2, d: .3 }); }
  }
  if (T.frames && (Hh.act === 'attack' || Hh.act === 'skill') && !Hh.d1 && Hh.t >= .14) { Hh.d1 = 1; fx({ kind: 'dust', x: HOME - 4, y: Hh.gy, d: .4, dir: -1 }); }
  if (Hh.t >= len) { const d = Hh.done; const was = Hh.act; Hh.act = was === 'death' ? 'dead' : 'idle'; Hh.t = 0; Hh.s1 = Hh.s2 = Hh.d1 = 0; if (was !== 'death') Hh.x = HOME; if (d) d(); }
}
function stepEnemy(dt) {
  if (E.flash > 0) E.flash -= dt; E.kx *= Math.exp(-dt * 9);
  if (E.act === 'idle' || E.act === 'gone') return; E.t += dt;
  if (E.act === 'attack') { if (!E.fired && E.t >= .32 + ((MOB[E.k].j.hit || 3) / MOB[E.k].j.n) * .6) { E.fired = 1; hitHero(); } if (E.t >= 1.35) { E.act = 'idle'; const d = E.done; E.done = null; if (d) d(); } }
  else if (E.act === 'hurt') { if (E.t >= .42) { E.act = 'idle'; } }
  else if (E.act === 'death') { if (E.t > .9) E.alpha = Math.max(0, 1 - (E.t - .9) * 2); if (E.t >= 1.8) { E.act = 'gone'; setTimeout(() => { E.hp = E.max; E.alpha = 1; enemyDo('idle'); }, 500); } }
}
function step(dt) {
  T.now += dt;
  for (const f of FX) f.t += dt; FX = FX.filter(f => f.t < f.d); for (const o of NUM) o.t += dt; NUM = NUM.filter(o => o.t < 1);
  for (const gh of Hh.ghosts) gh.a -= dt * 5; Hh.ghosts = Hh.ghosts.filter(gh => gh.a > 0).slice(-6);
  if (T.shake > 0) T.shake *= Math.exp(-dt * 14); if (T.flash > 0) T.flash -= dt; if (Hh.flash > 0) Hh.flash -= dt;
  if (T.stop > 0) { T.stop -= dt; return; }
  stepHero(dt); stepEnemy(dt);
  if (AUTO) autoStep(dt);
}

/* ---------- a small turn loop: our turn, their turn ---------- */
let busy = false;
function say(s) { $('turn').textContent = s; }
function heroTurn() {
  busy = true; turnN++; const sk = turnN % 3 === 0; say(sk ? 'เทิร์นเรา: สกิล' : 'เทิร์นเรา: โจมตี');
  heroDo(sk ? 'skill' : 'attack', () => setTimeout(() => { if (E.act === 'death' || E.act === 'gone') { say('ชนะ!'); heroDo('win'); setTimeout(() => { heroDo('idle'); busy = false; }, 1600); return; } enemyTurn(); }, 300));
}
function enemyTurn() { say('เทิร์นศัตรู'); enemyDo('attack', () => setTimeout(() => { if (Hh.act === 'dead' || Hh.act === 'death') { setTimeout(() => { Hh.hp = Hh.max; heroDo('idle'); busy = false; say(''); }, 1200); return; } busy = false; }, 350)); }
function autoStep() { if (!busy && E.act !== 'gone' && Hh.act === 'idle') heroTurn(); }

/* ---------- loop + buttons ---------- */
let last = performance.now();
function loop(n) { let dt = Math.min(.05, (n - last) / 1000); last = n; if (T.slow) dt *= .25; step(dt); frame(); requestAnimationFrame(loop); }
function ui() { $('mode').textContent = T.frames ? 'แบบ: เฟรม PixelLab' : 'แบบ: กระดูก'; $('mode').classList.toggle('on', T.frames); $('slow').classList.toggle('on', T.slow); $('vb').classList.toggle('on', T.bones); $('auto').classList.toggle('on', AUTO); $('vb').style.display = T.frames ? 'none' : ''; }
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
  if (AUTO) { AUTO = false; ui(); } busy = false; say(''); const a = b.dataset.a;
  if (Hh.act === 'dead' && a !== 'death') Hh.hp = Hh.max;
  if (a === 'hurt') { hitHero(); return; }
  if (E.act === 'gone') { E.hp = E.max; E.alpha = 1; enemyDo('idle'); }
  Hh.x = HOME; heroDo(a);
});
$('auto').onclick = () => { AUTO = !AUTO; if (AUTO) { Hh.hp = Hh.max; if (Hh.act !== 'idle') heroDo('idle'); busy = false; } else say(''); ui(); };
$('mode').onclick = () => { T.frames = !T.frames; heroDo('idle'); Hh.x = HOME; ui(); };
$('slow').onclick = () => { T.slow = !T.slow; ui(); };
$('vb').onclick = () => { T.bones = !T.bones; ui(); };
$('bgb').onclick = () => { setBg((T.bg + 1) % BGS.length); };

(async () => {
  resize();
  const [rig, atlas, clip, clipj] = await Promise.all([fetch('art/turnrig/rig.json').then(r => r.json()), load('art/turnrig/parts.png'), load('art/poses/combo/chibi_pl.png'), fetch('art/poses/combo/chibi_pl.json').then(r => r.json())]);
  buildRig(rig, atlas); CLIP = clip; CLIPJ = clipj;
  await Promise.all(BGS.map(async b => {
    IMG[b.f] = await load(`art/gem/${b.f}.png`);
    const [j, img] = await Promise.all([fetch(`art/action/mobs/${b.mob}.json`).then(r => r.json()), load(`art/action/mobs/${b.mob}.png`)]);
    const w = document.createElement('canvas'); w.width = img.width; w.height = img.height; const wc = w.getContext('2d'); wc.drawImage(img, 0, 0); wc.globalCompositeOperation = 'source-in'; wc.fillStyle = '#fff'; wc.fillRect(0, 0, w.width, w.height);
    MOB[b.mob] = { j, img, white: w };
  }));
  setBg(T.bg); ui();
  window.TR = { T, Hh, E, step, frame, heroDo, setBg, ready: true };
  requestAnimationFrame(loop);
})().catch(e => { console.error(e); say('โหลดไม่สำเร็จ ลองรีเฟรช'); });
</script>
