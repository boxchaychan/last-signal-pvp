<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ต่อตัวละคร · Rig</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #232a3b; font: 600 13px system-ui, sans-serif; color: #eef; touch-action: none; user-select: none; -webkit-user-select: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #pn { position: fixed; right: 0; top: 0; bottom: 0; width: 262px; background: #161b28ee; border-left: 2px solid #4a557a; padding: 8px; box-sizing: border-box; overflow-y: auto; touch-action: pan-y; }
  #pn.hide { transform: translateX(100%); }
  #tg { position: fixed; right: 266px; top: 8px; z-index: 5; }
  #pn.hide + #tg { right: 8px; }
  button, select { font: 700 13px system-ui; color: #fff; background: #3a4766; border: 0; border-radius: 8px; height: 34px; padding: 0 8px; margin: 2px 0; }
  button.on { background: #7a4ad8; } button.g { background: #2f8a4a; } button.r { background: #a8362c; } button.mv { background: #2c5a8a; } button.mv.on { background: #e08a2a; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 4px 0; }
  .row > * { flex: 1; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0; } .g4 button { margin: 0; padding: 3px 2px; height: auto; min-height: 34px; line-height: 1.15; font-size: 12px; }
  label { display: block; margin-top: 6px; color: #aab; font-size: 12px; }
  input[type=range] { width: 100%; }
  h3 { margin: 10px 0 4px; font-size: 14px; color: #ffd24a; }
  #sel { font-size: 15px; color: #fff; }
  #hint { position: fixed; left: 8px; bottom: 8px; right: 272px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccd; font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #ttl { position: fixed; left: 10px; top: 8px; font: 800 15px system-ui; color: #ffd24a; text-shadow: 0 1px 2px #000; pointer-events: none; }
  textarea { width: 100%; height: 70px; font: 11px monospace; background: #0d1018; color: #9fe; border: 1px solid #4a557a; box-sizing: border-box; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="pn">
  <h3 style="margin-top:0">ท่ามาตรฐาน (ใช้ได้ทุกตัว)</h3>
  <div class="g4" id="mvs"></div>
  <label>แรงพอง (ย่อ-ขยาย) <span id="vp"></span></label><input id="pop" type="range" min="0" max="1.8" step="0.05" value="1">
  <label>ความเร็ว <span id="vsp"></span></label><input id="spd" type="range" min="0.1" max="1.6" step="0.05" value="1">
  <div class="row"><button id="left">หันซ้าย</button><button id="bones">ดูกระดูก</button></div>
  <div class="row"><button id="wside">อาวุธอยู่ฝั่งซ้ายของรูป (กลับทิศท่า)</button></div>
  <h3>ต่อชิ้น</h3>
  <div class="row"><button id="mA" class="on">จัดวาง</button><button id="mP">หมุนท่า</button></div>
  <div>ชิ้นที่เลือก: <span id="sel">-</span></div>
  <select id="pick" style="width:100%"></select>
  <label>หน้าที่ของชิ้นนี้ (ท่ามาตรฐานขยับตามหน้าที่)</label><select id="role" style="width:100%"></select>
  <label>ท่ามาตรฐานหมุนชิ้นนี้แรงแค่ไหน <span id="vg"></span></label><input id="gn" type="range" min="0" max="1.6" step="0.05">
  <label>ขนาด <span id="vs"></span></label><input id="sc" type="range" min="0.1" max="2" step="0.01">
  <label>มุมตั้งต้น <span id="vr"></span></label><input id="rt" type="range" min="-180" max="180" step="1">
  <label>ต่อกับ (ชิ้นแม่)</label><select id="par" style="width:100%"></select>
  <div class="row"><button id="up">ชั้นขึ้น ▲</button><button id="dn">ชั้นลง ▼</button></div>
  <div class="row"><button id="flip">พลิกซ้าย-ขวา</button><button id="feet">ตั้งจุดเท้า</button></div>
  <h3>ตรวจให้ตรง</h3>
  <div class="row"><button id="fit1">จัดชิ้นนี้ให้ตรงรูป</button><button id="fitA">จัดทุกชิ้น</button></div>
  <div class="row"><button id="undoF">ย้อนการจัด</button><button id="chk" class="g">ตรวจ</button></div>
  <div class="row"><button id="seamB">ลบรอยต่อ</button><button id="diffB">ดูจุดที่ไม่ตรง</button></div>
  <div id="score" style="font-size:12px;color:#cde;line-height:1.45;white-space:pre-wrap"></div>
  <h3>ข้อต่องอได้ (แบบ Spine)</h3>
  <div class="row"><button id="mshP">ชิ้นงอได้</button><button id="mshO">รูปเดียว ไม่ตัดชิ้น</button></div>
  <label>ความนุ่มของข้อต่อ <span id="vms"></span></label><input id="msoft" type="range" min="4" max="40" step="1" value="18">
  <div class="row"><button id="mshV">ดูตาข่าย</button></div>
  <div style="font-size:12px;color:#9ab;line-height:1.4">ชิ้นงอได้ = ข้อต่อโค้งเหมือนผิว ไม่หักเป็นแผ่น. รูปเดียว = ใช้ภาพทั้งตัวภาพเดียว ไม่ต้องตัดชิ้น (ท่าเล็กสวย ท่าใหญ่ที่แขนบังตัวจะเห็นช่อง)</div>
  <h3>ภาพต้นแบบ</h3>
  <label>ความชัดของภาพต้นแบบ</label><input id="ro" type="range" min="0" max="1" step="0.05" value="0">
  <div class="row"><button id="zin">ซูม +</button><button id="zout">ซูม −</button></div>
  <h3>บันทึก</h3>
  <div class="row"><button id="cp" class="g">คัดลอกส่ง Claude</button></div>
  <div class="row"><button id="lo">แยกชิ้นออกหมด</button></div>
  <div class="row"><button id="dl">ดาวน์โหลดไฟล์</button><button id="rs" class="r">เริ่มใหม่</button></div>
  <textarea id="tx" placeholder="วางข้อมูลที่บันทึกไว้ตรงนี้ แล้วกด 'โหลด'"></textarea>
  <div class="row"><button id="ld">โหลด</button></div>
</div>
<button id="tg">☰</button>
<div id="ttl"></div>
<div id="hint"></div>
<script src="rig2d/bones.js?v=19"></script><script src="rig2d/fx.js?v=4"></script>
<script>
'use strict';
/* Rig tool, version 2 (first made 2026-11-14 on the owner's "เอาทูลมา ฉันต่อเอง"; rebuilt 2026-11-27 after one hero of the owner's recording was taken
   apart: pieces that are moved, turned AND scaled, moves shared by every hero). rig.html?char=<name> opens art/rigs/<name>.json.
   - ต่อชิ้น: put the pieces together by hand (place, turning point, size, start angle, parent, layer) and say what each piece IS (its role).
   - ท่ามาตรฐาน: the shared moves of rig2d/bones.js played on this rig, with the pop strength and speed; what you see is what a game draws
     (same file, Bones2D.player). One-shot moves repeat with a short stand between.
   - Saves itself in the browser; "คัดลอกส่ง Claude" copies the rig as text for the chat; Claude puts it into art/rigs/<name>.json. */
const QS = new URLSearchParams(location.search), CHAR = QS.get('char') || 'zeusgpt', KEY = 'rig2dv2_' + CHAR;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), $ = s => document.querySelector(s), B = Bones2D;
let R = null, R0 = null, names = [], PL = null;   /* the rig being edited, the rig of the file, part keys, the player */
const ALPHA = {};
const label = k => R.parts[k].n || k;
function adopt(o) { if (!o.parts || !o.order) throw 'bad'; delete o.img0; delete o.img; for (const k of names) { if (!o.parts[k]) o.parts[k] = JSON.parse(JSON.stringify(R0.parts[k])); if (!o.order.includes(k)) o.order.push(k); } for (const k in o.parts) if (!R0.parts[k]) delete o.parts[k]; o.order = o.order.filter(k => R0.parts[k]);
  for (const c of ['v', 'name', 'title', 'dir', 'ref', 'size', 'view', 'faces', 'swaps', 'clips', 'figH', 'refMask', 'checks']) o[c] = R0[c]; if (o.bake == null) o.bake = !!R0.bake; if (o.mesh === undefined && R0.mesh) o.mesh = R0.mesh; if (o.moves === undefined && R0.moves) o.moves = JSON.parse(JSON.stringify(R0.moves)); o.img = R0.img; if (R0.img0) { Object.assign(R0.img, R0.img0); R0.img0 = null; } if (o.flip == null) o.flip = !!R0.flip; if (!o.feet) o.feet = R0.feet.slice(); for (const k of names) { const q = o.parts[k], d = R0.parts[k]; q.img = d.img; if (!q.n) q.n = d.n; if (!q.role) q.role = d.role || 'none'; if (q.g == null && d.g != null) q.g = d.g; } o.img = R0.img; R = o; B.prep(R); if (R.bake) B.bake(R); PL = B.player(R); PL.pop = +$('#pop').value; }
const clean = () => { const o = JSON.parse(JSON.stringify(R, (k, v) => (k === 'img' || k === 'img0') && typeof v === 'object' && !(typeof v === 'string') ? undefined : k[0] === '_' ? undefined : v)); for (const k of names) o.parts[k].img = R0.parts[k].img; return o; };
function save() { try { localStorage.setItem(KEY, JSON.stringify(clean())); } catch (e) { } }

/* ---- view */
let DIFF = false, HAD = false, DPR = 1, W = 0, H = 0, ZOOM = 1, PAN = [0, 0], MODE = 'A', SEL = '', PLAY = '', GAP = 0, POSE = {}, LEFT = false, BONES = false, LAST = 0, FEET = false;
function view() { const [w, h] = R.size, hb = tlOn() ? 104 * DPR : 0, Hv = H - hb, s = Math.min(W / w, Hv / h) * .78 * ZOOM, pw = $('#pn').classList.contains('hide') ? 0 : 262 * DPR; return [s, 0, 0, s, (W - pw) * .5 + PAN[0] - w / 2 * s, Hv * .52 + PAN[1] - h / 2 * s]; }   /* the timeline bar takes the bottom while it is open */
function resize() { DPR = Math.min(3, devicePixelRatio || 1); W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR; }
addEventListener('resize', resize);
function mats() { B.prep(R); return PLAY ? PL.mats : B.world(R, POSE, null); }
function draw(now) {
  const dt = Math.min(.05, (now - LAST) / 1000 || 0); LAST = now; B.prep(R);
  if (tlOn()) tlTick(dt); else if (PLAY) { PL.speed = +$('#spd').value; PL.pop = +$('#pop').value; const mv = mvOf(PLAY);
    if (!mv.loop && !mv.fn && PL.name !== PLAY) { GAP -= dt; if (GAP <= 0) { PL.play(PLAY, { restart: true }); } }   /* a one-shot ended and fell back to standing: again after a short stand */
    else if (!mv.loop && !mv.fn && PL.done) { GAP -= dt; if (GAP <= 0) { PL.play(PLAY, { restart: true }); GAP = .7; } }
    PL.update(dt); if (!mv.loop && !mv.fn && PL.name === PLAY && !PL.done) GAP = mv.hold ? .9 : .55; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#2b3348'; ctx.fillRect(0, 0, W, H);
  let V = view(); const F = R.feet; if (LEFT) V = B.mul(V, [-1, 0, 0, 1, 2 * F[0], 0]);
  ctx.setTransform(...V); ctx.fillStyle = '#3a4560'; ctx.fillRect(-3000, F[1], 6446, 900); ctx.fillStyle = '#00000030'; ctx.beginPath(); ctx.ellipse(F[0], F[1] + 4, R.size[0] * .22, R.size[1] * .022, 0, 0, 7); ctx.fill();
  const ro = +$('#ro').value; if (ro > 0 && R.img._ref && !PLAY) { ctx.globalAlpha = ro; ctx.drawImage(R.img._ref, 0, 0); ctx.globalAlpha = 1; }
  const M = PLAY ? PL.mats : B.world(R, POSE, null); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.globalAlpha = 1;
  if (PLAY) { const f = B.pt(V, F[0], F[1]); ctx.setTransform(1, 0, 0, 1, 0, 0); PL.draw(ctx, f[0], f[1], Math.abs(V[3]), LEFT); FX.step(PL, dt, { scale: Math.abs(V[3]) * R.size[1] / 426, left: LEFT, width: W, height: H, range: R.size[0] * 1.3 }); FX.draw(ctx); }   /* what a game draws: the player + its effects */
  for (const k of (PLAY ? [] : R.order)) { const q = R.parts[k], m = B.mul(V, M[k]); ctx.setTransform(...m); { const im = PLAY ? PL.image(k) : R.img[k]; ctx.drawImage(im, -q.pv[0] - (im._ox || 0), -q.pv[1] - (im._oy || 0)); }
    if (k === SEL && !PLAY) { ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3 / q.s / Math.abs(V[0]); { const im0 = (R.img0 && R.img0[k]) || R.img[k]; ctx.strokeRect(-q.pv[0], -q.pv[1], im0.width, im0.height); } } }
  if (DIFF && !PLAY && R.img._ref) { const [w, h] = R.size; if (!DIFFC || DIFFC.key !== snap2()) { DIFFC = document.createElement('canvas'); DIFFC.width = w; DIFFC.height = h; DIFFC.key = snap2(); const g = DIFFC.getContext('2d'); g.drawImage(R.img._ref, 0, 0, w, h); const rf = g.getImageData(0, 0, w, h).data; g.clearRect(0, 0, w, h); const P = B.player(R, { base: null }); P.mats = B.world(R, POSE, null); P.draw(g, R.feet[0], R.feet[1], 1, false); g.setTransform(1, 0, 0, 1, 0, 0); const d = g.getImageData(0, 0, w, h); for (let i = 0; i < d.data.length; i += 4) { const e = d.data[i + 3] > 200 ? (Math.abs(d.data[i] - rf[i]) + Math.abs(d.data[i + 1] - rf[i + 1]) + Math.abs(d.data[i + 2] - rf[i + 2])) / 3 : 0; d.data[i] = 255; d.data[i + 1] = 30; d.data[i + 2] = 60; d.data[i + 3] = e > 40 ? 200 : 0; } g.putImageData(d, 0, 0); }
    ctx.setTransform(...V); ctx.drawImage(DIFFC, 0, 0); }
  ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dot = k => B.pt(B.mul(V, M[k]), 0, 0);
  if (BONES || !PLAY) { for (const k of R.order) { const q = R.parts[k]; if (!BONES && k !== SEL) continue; const p = dot(k);
      if (q.p && R.parts[q.p]) { const pp = dot(q.p); ctx.strokeStyle = BONES ? '#7fe7c4' : '#ff3a6a88'; ctx.lineWidth = (BONES ? 3 : 2) * DPR; ctx.setLineDash(BONES ? [] : [6 * DPR, 6 * DPR]); ctx.beginPath(); ctx.moveTo(pp[0], pp[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle = k === SEL && !PLAY ? '#ff3a6a' : '#7fe7c4'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.arc(p[0], p[1], (k === SEL && !PLAY ? 9 : 5) * DPR, 0, 7); ctx.fill(); ctx.stroke(); } }
  if (!PLAY) { const f = B.pt(V, F[0], F[1]); ctx.strokeStyle = FEET ? '#ffd24a' : '#ffffff66'; ctx.lineWidth = 2 * DPR; ctx.beginPath(); ctx.moveTo(f[0] - 16 * DPR, f[1]); ctx.lineTo(f[0] + 16 * DPR, f[1]); ctx.moveTo(f[0], f[1] - 10 * DPR); ctx.lineTo(f[0], f[1] + 4 * DPR); ctx.stroke(); }
  if (tlOn()) tlDraw();   /* the timeline bar + joint dots (rig2d/timeline.js) */
  requestAnimationFrame(draw); }

/* ---- input: tap a piece to pick it; drag it to move (จัดวาง) or turn it (หมุนท่า); drag the red dot to move the turning point */
let DRAG = null;
const vnow = () => { let V = view(); if (LEFT) V = B.mul(V, [-1, 0, 0, 1, 2 * R.feet[0], 0]); return V; };
function hit(x, y) { const V = vnow(), M = mats();
  for (let i = R.order.length - 1; i >= 0; i--) { const k = R.order[i], q = R.parts[k], l = B.pt(B.inv(B.mul(V, M[k])), x, y), px = Math.round(l[0] + q.pv[0]), py = Math.round(l[1] + q.pv[1]), a = ALPHA[k];
    if (px >= 0 && py >= 0 && px < a.w && py < a.h && a.d[(py * a.w + px) * 4 + 3] > 40) return k; } return null; }
cv.addEventListener('pointerdown', e => { if (tlOn() && tlDown(e)) return; const x = e.clientX * DPR, y = e.clientY * DPR; cv.setPointerCapture(e.pointerId); if (PLAY) stop(); const V = vnow(), M = mats();
  if (FEET) { const l = B.pt(B.inv(V), x, y); R.feet = [Math.round(l[0]), Math.round(l[1])]; FEET = false; $('#feet').classList.remove('on'); save(); hint(); return; }
  const p = B.pt(B.mul(V, M[SEL]), 0, 0);
  if (Math.hypot(x - p[0], y - p[1]) < 16 * DPR) { DRAG = { k: 'pivot', x, y }; return; }
  const k = hit(x, y); if (!k) { DRAG = { k: 'pan', x, y, p0: PAN.slice() }; return; } select(k);
  const q = R.parts[k], c = B.pt(B.mul(V, M[k]), 0, 0);
  DRAG = MODE === 'A' ? { k: 'move', x, y, at0: q.at.slice() } : { k: 'turn', a0: Math.atan2(y - c[1], x - c[0]), p0: (POSE[k] || B.REST).r, c }; });
cv.addEventListener('pointermove', e => { if (tlOn() && tlMove(e)) return; if (!DRAG) return; const x = e.clientX * DPR, y = e.clientY * DPR, V = vnow(), sc = V[3], dir = LEFT ? -1 : 1;
  if (DRAG.k === 'pan') { PAN = [DRAG.p0[0] + x - DRAG.x, DRAG.p0[1] + y - DRAG.y]; return; }
  const q = R.parts[SEL];
  if (DRAG.k === 'move') { q.at = [DRAG.at0[0] + (x - DRAG.x) / sc * dir, DRAG.at0[1] + (y - DRAG.y) / sc]; }
  else if (DRAG.k === 'turn') { const a = Math.atan2(y - DRAG.c[1], x - DRAG.c[0]); POSE[SEL] = Object.assign({}, B.REST, { r: DRAG.p0 + (a - DRAG.a0) * 180 / Math.PI * dir }); }
  else if (DRAG.k === 'pivot') {   /* move the turning point inside the piece, keep the picture where it is */
    const M = mats(), l = B.pt(B.inv(B.mul(V, M[SEL])), x, y), np = [q.pv[0] + l[0], q.pv[1] + l[1]], bw = B.pt(B.bind(q), np[0] - q.pv[0], np[1] - q.pv[1]); q.pv = [Math.round(np[0]), Math.round(np[1])]; q.at = bw; } });
const up = () => { if (tlOn() && tlUp()) return; if (DRAG && DRAG.k !== 'pan') { if (R.bake && DRAG.k !== 'turn') B.bake(R); save(); } DRAG = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { ZOOM *= e.deltaY < 0 ? 1.1 : .9; e.preventDefault(); }, { passive: false });

/* ---- panel */
function select(k) { SEL = k; const q = R.parts[k]; $('#sel').textContent = label(k); $('#pick').value = k; $('#sc').value = q.s; $('#vs').textContent = q.s.toFixed(2); $('#rt').value = q.r; $('#vr').textContent = q.r + '°'; $('#par').value = q.p || ''; $('#role').value = q.role || 'none'; $('#gn').value = q.g == null ? 1 : q.g; $('#vg').textContent = Math.round((q.g == null ? 1 : q.g) * 100) + '%'; }
function stop() { if (typeof tlLeave === 'function') tlLeave(); PLAY = ''; for (const b of document.querySelectorAll('#mvs button')) b.classList.toggle('on', !b.dataset.mv); hint(); }
let DIFFC = null; const snap2 = () => JSON.stringify(R.parts) + JSON.stringify(POSE);
const tlOn = () => typeof TLON === 'function' && TLON();   /* rig2d/timeline.js may load a moment after this script */
const mvOf = k => (R.moves && R.moves[k]) || B.MOVES[k] || { dur: R.clips[k].dur, clip: 1 }, FX = Bones2DFX.create();
function play(k) { if (!k) { stop(); return; } if (typeof tlLeave === 'function') tlLeave(); PLAY = k; POSE = {}; GAP = 0; PL = B.player(R); const mk = mvOf(k); PL.play(mk.loop || mk.fn ? k : 'idle'); if (!(mk.loop || mk.fn)) GAP = .35; PL.update(0); for (const b of document.querySelectorAll('#mvs button')) b.classList.toggle('on', b.dataset.mv === k); hint(); }
function boot() {
  let o = null; try { const s = localStorage.getItem(KEY); if (s) o = JSON.parse(s); } catch (e) { } HAD = !!o; try { adopt(o || JSON.parse(JSON.stringify(R0, (k, v) => (k === 'img' || k === 'img0') && typeof v === 'object' ? undefined : k[0] === '_' ? undefined : v))); } catch (e) { adopt(JSON.parse(JSON.stringify(R0, (k, v) => (k === 'img' || k === 'img0') && typeof v === 'object' ? undefined : k[0] === '_' ? undefined : v))); }
  $('#ttl').textContent = (R.title || CHAR) + ' · ' + names.length + ' ชิ้น';
  const opt = (sel, v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; $(sel).append(o); };
  for (const k of names) opt('#pick', k, label(k)); opt('#par', '', '(ไม่มี: ชิ้นหลัก)'); for (const k of names) opt('#par', k, label(k)); for (const r in B.ROLES) opt('#role', r, B.ROLES[r]);
  for (const k of ['idle', 'bowshot', 'thrust', ...Object.keys(R.clips || {}), 'throw', 'attack', 'shoot', 'cast', 'hit', 'die', 'spawn', 'cheer', 'walk', 'run', '']) { if (R.view === 'front' && (k === 'walk' || k === 'run')) continue; if (k === 'bowshot' && !R.shot) continue;   /* the bow move only for a hero with a bow (an arrow picture): on others the pull hand just crosses the chest */   /* a hero seen from the front stands in its cell */ const b = document.createElement('button'); b.className = 'mv'; b.dataset.mv = k; b.textContent = k ? ((B.MOVES[k] && B.MOVES[k].n) || B.NAMES[k] || (R.clips && R.clips[k] && (R.clips[k].n || k + ' (เฟรมวาด)'))) : 'หยุด'; b.onclick = () => play(k); $('#mvs').append(b); }
  $('#pick').onchange = e => select(e.target.value);
  $('#role').onchange = e => { R.parts[SEL].role = e.target.value; save(); };
  $('#gn').oninput = e => { R.parts[SEL].g = +e.target.value; $('#vg').textContent = Math.round(+e.target.value * 100) + '%'; save(); };
  $('#sc').oninput = e => { R.parts[SEL].s = +e.target.value; $('#vs').textContent = (+e.target.value).toFixed(2); save(); };
  $('#rt').oninput = e => { R.parts[SEL].r = +e.target.value; $('#vr').textContent = e.target.value + '°'; save(); };
  const sl = () => { $('#vp').textContent = Math.round(+$('#pop').value * 100) + '%'; $('#vsp').textContent = 'x' + (+$('#spd').value).toFixed(2); }; $('#pop').oninput = sl; $('#spd').oninput = sl; sl();
  $('#par').onchange = e => { const v = e.target.value; let p = v; while (p) { if (p === SEL) { alert('ต่อวนกันไม่ได้'); $('#par').value = R.parts[SEL].p || ''; return; } p = R.parts[p].p; } R.parts[SEL].p = v; save(); };
  $('#up').onclick = () => { const i = R.order.indexOf(SEL); if (i < R.order.length - 1) { R.order.splice(i, 1); R.order.splice(i + 1, 0, SEL); save(); } };
  $('#dn').onclick = () => { const i = R.order.indexOf(SEL); if (i > 0) { R.order.splice(i, 1); R.order.splice(i - 1, 0, SEL); save(); } };
  $('#flip').onclick = () => { R.parts[SEL].fx = !R.parts[SEL].fx; save(); };
  $('#feet').onclick = () => { stop(); FEET = !FEET; $('#feet').classList.toggle('on', FEET); hint(); };
  $('#left').onclick = () => { LEFT = !LEFT; $('#left').classList.toggle('on', LEFT); };
  $('#bones').onclick = () => { BONES = !BONES; $('#bones').classList.toggle('on', BONES); };
  $('#wside').classList.toggle('on', !!R.flip); $('#wside').onclick = () => { R.flip = !R.flip; $('#wside').classList.toggle('on', R.flip); save(); };
  $('#mA').onclick = () => { stop(); MODE = 'A'; POSE = {}; $('#mA').classList.add('on'); $('#mP').classList.remove('on'); hint(); };
  $('#mP').onclick = () => { stop(); MODE = 'P'; $('#mP').classList.add('on'); $('#mA').classList.remove('on'); hint(); };
  $('#zin').onclick = () => ZOOM *= 1.2; $('#zout').onclick = () => ZOOM /= 1.2;
  $('#cp').onclick = () => { const s = JSON.stringify(clean()); $('#tx').value = s; (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => alert('คัดลอกแล้ว: วางในแชตส่งให้ Claude ได้เลย'), () => { $('#tx').select(); alert('กดค้างที่กล่องข้อความแล้วคัดลอกเอง'); }); };
  $('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(clean(), null, 1)], { type: 'application/json' })); a.download = CHAR + '.json'; a.click(); };
  $('#rs').onclick = () => { if (confirm('เริ่มใหม่จากไฟล์ตั้งต้น?')) { try { localStorage.removeItem(KEY); } catch (e) { } adopt(JSON.parse(JSON.stringify(R0, (k, v) => (k === 'img' || k === 'img0') && typeof v === 'object' ? undefined : k[0] === '_' ? undefined : v))); POSE = {}; select(SEL); } };
  const apart = () => { stop(); let x = -R.size[0] * 1.15, y = 0, rh = 0;   /* spread the pieces in rows left of the reference, straight, size kept */
    for (const k of names) { const q = R.parts[k], w = R.img[k].width * q.s, h = R.img[k].height * q.s; if (x + w > -14) { x = -R.size[0] * 1.15; y += rh + 14; rh = 0; } q.r = 0; q.fx = false; q.at = [x + q.pv[0] * q.s, y + q.pv[1] * q.s]; x += w + 14; rh = Math.max(rh, h); }
    let x0 = 0, y0 = 0, x1 = R.size[0], y1 = R.size[1]; for (const k of names) { const q = R.parts[k], l = q.at[0] - q.pv[0] * q.s, t = q.at[1] - q.pv[1] * q.s; x0 = Math.min(x0, l); y0 = Math.min(y0, t); x1 = Math.max(x1, l + R.img[k].width * q.s); y1 = Math.max(y1, t + R.img[k].height * q.s); }
    const pw = $('#pn').classList.contains('hide') ? 0 : 262 * DPR, s0 = Math.min(W / R.size[0], H / R.size[1]) * .78, fit = Math.min((W - pw) * .95 / (x1 - x0), H * .8 / (y1 - y0)); ZOOM = fit / s0;   /* everything on screen: the pieces and the faint whole picture */
    PAN = [(R.size[0] / 2 - (x0 + x1) / 2) * fit, (R.size[1] / 2 - (y0 + y1) / 2) * fit - H * .06]; POSE = {}; $('#ro').value = .4; save(); select(SEL); };
  $('#lo').onclick = () => { if (confirm('แยกทุกชิ้นออกมาวางเรียงข้างตัว ให้ต่อเองตั้งแต่ต้น?')) apart(); };
  $('#ld').onclick = () => { try { adopt(JSON.parse($('#tx').value)); save(); select(SEL); alert('โหลดแล้ว'); } catch (e) { alert('ข้อมูลไม่ถูกต้อง'); } };
  $('#tg').onclick = () => $('#pn').classList.toggle('hide');
  /* ตรวจให้ตรง (owner: "ทำให้จัดกระดูก ภาพถูกต้อง ... ชอบใส่ตัวละครบิดไม่ตรง ... ลดรอยออก"): fit pieces onto the reference, score, seams, show what differs */
  const snap = () => JSON.stringify(Object.fromEntries(Object.entries(R.parts).map(([k, q]) => [k, { at: q.at, r: q.r, s: q.s }]))); let UNDO = [];
  const score = () => { if (!R.img._ref) { $('#score').textContent = 'ตัวนี้ไม่มีภาพต้นแบบให้เทียบ'; return; } const e = B.restScore(R); $('#score').textContent = 'ตรงกับรูปต้นแบบ: ' + Math.max(0, 100 - e * 2).toFixed(0) + '%  (ความต่างสี ' + e.toFixed(1) + ')'; };
  const fit = keys => { if (!R.img._ref) { alert('ตัวนี้ไม่มีภาพต้นแบบ'); return; } stop(); UNDO.push(snap()); $('#score').textContent = 'กำลังจัด...'; setTimeout(() => { const r = B.autofit(R, keys); save(); select(SEL); score(); const lines = Object.entries(r).filter(([, v]) => v.after < v.before).map(([k, v]) => label(k) + ' ' + v.before + ' → ' + v.after); $('#score').textContent += '\n' + (lines.length ? 'จัดแล้ว: ' + lines.join(', ') : 'ตรงอยู่แล้ว'); }, 30); };
  $('#fit1').onclick = () => fit([SEL]); $('#fitA').onclick = () => fit(null);
  $('#undoF').onclick = () => { const s = UNDO.pop(); if (!s) return; const o = JSON.parse(s); for (const k in o) Object.assign(R.parts[k], o[k]); B.prep(R); save(); select(SEL); score(); };
  $('#chk').onclick = () => { stop(); $('#score').textContent = 'กำลังตรวจทุกท่า...'; setTimeout(() => { score(); const s = B.seams(R), bad = Object.entries(s).filter(([, v]) => v.worst > .0005); $('#score').textContent += '\n' + (bad.length ? 'มีรอยแตกตอนขยับ: ' + bad.map(([k, v]) => (B.NAMES[k] || k) + ' ' + v.at + ' วิ').join(', ') : 'ไม่มีรอยต่อแตกในทุกท่า'); }, 30); };
  const seamUI = () => $('#seamB').classList.toggle('on', !!R.bake);
  $('#seamB').onclick = () => { stop(); if (R.bake) { B.unseam(R); R.bake = false; } else { if (!R.img._ref) { alert('ตัวนี้ไม่มีภาพต้นแบบ'); return; } R.bake = true; B.bake(R); } save(); seamUI(); score(); };
  seamUI();
  const meshUI = () => { const m = R.mesh && R.mesh.mode; $('#mshP').classList.toggle('on', m === 'pieces'); $('#mshO').classList.toggle('on', m === 'one'); $('#mshV').classList.toggle('on', !!R._meshShow); const s = (R.mesh && R.mesh.soft) || 18; $('#msoft').value = s; $('#vms').textContent = s + ' px'; };
  const meshSet = mode => { if (mode === 'one' && !R.img._ref) { alert('ตัวนี้ไม่มีภาพต้นแบบ'); return; } R.mesh = R.mesh && R.mesh.mode === mode ? false : Object.assign({}, R.mesh || {}, { mode });   /* false (not deleted) so a saved 'off' is kept over the file's setting */ R._mesh = null; save(); meshUI(); if (!PLAY) play('idle'); };
  $('#mshP').onclick = () => meshSet('pieces'); $('#mshO').onclick = () => meshSet('one');
  $('#msoft').oninput = () => { if (!R.mesh) R.mesh = { mode: 'pieces' }; R.mesh.soft = +$('#msoft').value; R._mesh = null; save(); meshUI(); };
  $('#mshV').onclick = () => { R._meshShow = !R._meshShow; meshUI(); };
  meshUI();
  if (typeof tlInit === 'function') tlInit(); else addEventListener('load', () => tlInit());   /* the timeline: make moves in the tool (rig2d/timeline.js) */
  $('#diffB').onclick = () => { DIFF = !DIFF; $('#diffB').classList.toggle('on', DIFF); };
  setTimeout(score, 50);
  resize(); select(names.includes('torso') ? 'torso' : names.find(k => R.parts[k].role === 'body') || names[0]); stop(); hint(); if (QS.get('apart') === '1') { if (!HAD) apart(); }   /* "let me join it myself": the first visit starts with the pieces apart beside a faint picture of the whole hero; a rig already saved in this browser is kept */
  else if (QS.get('play') !== '0') play(QS.get('play') || 'idle'); requestAnimationFrame(draw);
  window.RIG = { get R() { return R; }, get PL() { return PL; }, select, play, stop, B }; }
function hint() { if (tlOn()) { $('#hint').textContent = tlHint(); return; } $('#hint').textContent = PLAY ? 'กำลังเล่นท่า "' + ((mvOf(PLAY) && mvOf(PLAY).n) || (R.clips && R.clips[PLAY] && R.clips[PLAY].n) || B.NAMES[PLAY] || PLAY) + '" · เลื่อน แรงพอง / ความเร็ว ได้ · แตะตัวละครหรือกด หยุด เพื่อกลับไปต่อชิ้น' : FEET ? 'แตะตรงพื้นใต้เท้าของตัวละคร (จุดที่ตัวยืน)'
  : MODE === 'A' ? 'จัดวาง: แตะชิ้นเพื่อเลือก · ลากเพื่อย้าย · ลากจุดแดง = จุดหมุน (วางที่ข้อต่อ) · ลากที่ว่าง = เลื่อนจอ · ปรับขนาด / มุม / ชิ้นแม่ / ชั้น / หน้าที่ ในแถบขวา'
  : 'หมุนท่า: ลากชิ้นเพื่อหมุนรอบจุดแดง ชิ้นลูกหมุนตาม (ไว้ทดสอบว่าต่อถูก) · กดปุ่มท่ามาตรฐานเพื่อดูท่า'; }
fetch('art/rigs/' + CHAR + '.json').then(r => { if (!r.ok) throw new Error('ไม่พบไฟล์ art/rigs/' + CHAR + '.json'); return r.json(); }).then(o => B.images(o)).then(rig => { R0 = rig; names = Object.keys(rig.parts);
  for (const k of names) { const i = rig.img[k], c = document.createElement('canvas'); c.width = i.width; c.height = i.height; const g = c.getContext('2d'); g.drawImage(i, 0, 0); ALPHA[k] = { w: i.width, h: i.height, d: g.getImageData(0, 0, i.width, i.height).data }; }
  if (rig.ref) return new Promise(ok => { const i = new Image(); i.onload = () => { rig.img._ref = i; ok(); }; i.onerror = () => ok(); i.src = rig.dir + rig.ref; }); }).then(boot).catch(e => { $('#hint').textContent = 'เปิดไม่ได้: ' + (e.message || e); });
