<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>กระเป๋านักดาบ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#191422;color:#f3ead2;font:600 14px/1.35 system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{display:flex;height:100%;gap:8px;padding:8px}
#left{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
#grid{position:relative;background:#231c30;border:3px solid #4a3d63;border-radius:10px}
.cell{position:absolute;border-radius:6px;background:#2d2540;border:1px dashed #4a3d6388}
.cell.open{background:#5b4630;border:2px solid #8a6a44}
.cell.buy{background:#2f3a2c;border:2px dashed #7fbf5a;color:#9fe870;display:flex;align-items:center;justify-content:center;font-size:11px}
.cell.ok{background:#3f7f3a}.cell.bad{background:#8a3030}
.it{position:absolute;pointer-events:auto;touch-action:none}
.it i{position:absolute;border-radius:7px;border:2px solid #0006;font-style:normal}
.it b{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;text-shadow:0 2px 0 #0008}
.it em{position:absolute;right:1px;top:-3px;font-style:normal;font-size:11px;color:#ffe27a;text-shadow:0 1px 2px #000;pointer-events:none}
.it.sel i{border-color:#fff;box-shadow:0 0 8px #fff8}.it.fire{filter:brightness(1.9)}
.it u{position:absolute;left:2px;bottom:2px;height:4px;background:#9fe870;border-radius:2px;text-decoration:none;pointer-events:none}
.t-w i{background:#b7473a}.t-d i{background:#3f6fa8}.t-f i{background:#4f9a4a}.t-g i{background:#8a55b8}.t-u i{background:#b08a2e}
#tray{min-height:54px;background:#231c30;border:2px dashed #4a3d63;border-radius:10px;position:relative;padding:4px;display:flex;gap:6px;align-items:center;font-size:11px;color:#a99cc0}
#right{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#top{display:flex;gap:10px;align-items:center;font-size:15px;flex-wrap:wrap}
#top span{background:#231c30;border-radius:8px;padding:3px 9px}
#shop{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{background:#2b2340;border:2px solid #4a3d63;border-radius:10px;padding:5px 3px;text-align:center;min-height:86px;position:relative;touch-action:none}
.card.r2{border-color:#4f8fd8}.card.r3{border-color:#e0b040}.card.sold{opacity:.25}.card.no .pr{color:#ff7a6a}
.card .ic{font-size:28px;line-height:34px}.card .nm{font-size:11px}.card .pr{color:#ffd24a}.card .lk{position:absolute;left:3px;top:1px;font-size:12px;opacity:.5}.card .lk.on{opacity:1}
#info{background:#231c30;border-radius:10px;padding:6px 9px;min-height:54px;font-weight:500;font-size:13px}
#btns{display:flex;gap:6px;flex-wrap:wrap}
button{font:700 14px system-ui;border:0;border-radius:10px;padding:9px 12px;color:#fff;background:#4a3d63}
#go{background:#c8402a;flex:1;font-size:17px}#sell{background:#7a6a2a}
#arena{flex:1;min-height:0;position:relative;background:linear-gradient(#3a5a78,#6f9a6a 62%,#4f7a45 62%);border-radius:10px;overflow:hidden;display:none}
#arena canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#foe{position:absolute;right:6px;top:4px;display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end;max-width:60%;font-size:17px}
#foe span{background:#0006;border-radius:5px;padding:0 2px;position:relative}#foe span.fire{background:#fff8}
#pop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9}
#pop div{background:#2b2340;border:3px solid #e0b040;border-radius:14px;padding:16px 20px;text-align:center;max-width:88%;font-size:15px}
#pop h2{margin:0 0 8px;font-size:24px}
#ghost{position:fixed;pointer-events:none;z-index:8;opacity:.85;display:none}
</style></head><body>
<div id="app"><div id="left"><div id="grid"></div><div id="tray"></div></div>
<div id="right"><div id="top"></div><div id="shop"></div><div id="arena"><canvas id="cv"></canvas><div id="foe"></div></div>
<div id="info"></div><div id="btns"><button id="rr">🎲 สุ่มใหม่ (1)</button><button id="rot">🔄 หมุน</button><button id="sell">💰 ขาย</button><button id="spd">⏩ x1</button><button id="go">⚔ สู้!</button></div></div></div>
<div id="ghost"></div><div id="pop"><div></div></div>
<script>
// กระเป๋านักดาบ (Bag Brawl): an original backpack auto-battler (owner 2026-11-13: "ทำเกมอีกเกมให้ฉัน ให้คิดเองหมดเลย เกมแนว backpack ... ขอสนุกๆ").
// Loop: shop (buy items, arrange them in the bag, buy bag cells, merge two of a kind) -> auto battle against a monster -> next round.
// Neighbouring items boost each other, so WHERE things sit matters. 5 hearts; a boss every 5 rounds; beat round 15 to win, then endless.
// No generated art: emoji items, our own chibi swordsman clips (art/poses/combo/chibi_pl.png) and our monster sheets (art/td/map1/mob_*.png).
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const S1=[[0,0]],H2=[[0,0],[1,0]],V2=[[0,0],[0,1]],V3=[[0,0],[0,1],[0,2]],SQ=[[0,0],[1,0],[0,1],[1,1]],LL=[[0,0],[0,1],[1,1]];
const IT={
 dagger:{e:'🗡️',n:'มีดสั้น',sh:S1,c:3,r:1,t:'w',dmg:3,cd:1.1,sta:.5,d:'ฟันเร็ว'},
 sword:{e:'⚔️',n:'ดาบคู่ใจ',sh:V2,c:5,r:1,t:'w',dmg:8,cd:1.8,sta:1,d:'ดาบมาตรฐาน'},
 bow:{e:'🏹',n:'ธนู',sh:V3,c:6,r:1,t:'w',dmg:6,cd:1.5,sta:.8,crit:.25,d:'คริติคอล 25%'},
 axe:{e:'🪓',n:'ขวานผ่าเกราะ',sh:LL,c:7,r:2,t:'w',dmg:14,cd:2.7,sta:1.8,pierce:.6,d:'ทะลุโล่ 60%'},
 hammer:{e:'🔨',n:'ค้อนยักษ์',sh:SQ,c:9,r:2,t:'w',dmg:22,cd:3.6,sta:2.6,stun:.6,d:'ตีแล้วศัตรูมึน 0.6 วิ'},
 wand:{e:'🪄',n:'คทาเพลิง',sh:V2,c:7,r:2,t:'w',dmg:4,cd:2,sta:1,burn:2,d:'ติดไฟ 2 ทุกครั้งที่โดน'},
 poison:{e:'🧪',n:'ขวดพิษ',sh:S1,c:4,r:1,t:'w',dmg:0,cd:2.4,sta:0,poi:2,d:'ใส่พิษ 2 (พิษไม่หาย ทะลุโล่)'},
 bomb:{e:'💣',n:'ระเบิด',sh:S1,c:4,r:1,t:'u',start:14,d:'เริ่มสู้: ระเบิดใส่ศัตรูทันที'},
 shield:{e:'🛡️',n:'โล่ไม้',sh:H2,c:4,r:1,t:'d',blk:6,cd:3,d:'ได้โล่ 6 ทุก 3 วิ'},
 helm:{e:'🪖',n:'หมวกเหล็ก',sh:S1,c:4,r:1,t:'d',hp:16,sblk:8,d:'+เลือด และเริ่มสู้พร้อมโล่'},
 cactus:{e:'🌵',n:'เกราะหนาม',sh:V2,c:6,r:2,t:'d',hp:10,thorn:2,d:'ใครตีเรา โดนสะท้อนกลับ'},
 feather:{e:'🪶',n:'ขนนกลม',sh:S1,c:5,r:2,t:'d',dodge:.1,d:'หลบการโจมตี 10%'},
 apple:{e:'🍎',n:'แอปเปิล',sh:S1,c:2,r:1,t:'f',heal:3,cd:3,d:'ฟื้นเลือดทุก 3 วิ'},
 meat:{e:'🍖',n:'เนื้อย่าง',sh:H2,c:5,r:1,t:'f',hp:24,heal:5,cd:4,d:'+เลือดสูงสุด และฟื้นเลือด'},
 juice:{e:'🧃',n:'น้ำชูกำลัง',sh:S1,c:3,r:1,t:'f',sreg:.45,d:'พลังกายฟื้นเร็วขึ้น (อาวุธตีถี่ขึ้น)'},
 stone:{e:'🪨',n:'หินลับมีด',sh:S1,c:3,r:1,t:'g',adj:{dmg:.3},d:'อาวุธที่ติดกัน แรงขึ้น 30%'},
 glove:{e:'🧤',n:'ถุงมือไว',sh:S1,c:4,r:1,t:'g',adj:{cd:.18},d:'อาวุธที่ติดกัน ตีเร็วขึ้น 18%'},
 clover:{e:'🍀',n:'โคลเวอร์',sh:S1,c:3,r:1,t:'g',adj:{crit:.2},d:'อาวุธที่ติดกัน คริติคอล +20%'},
 ember:{e:'🔥',n:'อัญมณีเพลิง',sh:S1,c:5,r:2,t:'g',adj:{burn:1},d:'อาวุธที่ติดกัน ติดไฟเพิ่ม'},
 frost:{e:'❄️',n:'อัญมณีน้ำแข็ง',sh:S1,c:5,r:2,t:'g',adj:{frz:.25},d:'อาวุธที่ติดกัน ทำให้ศัตรูช้าลง'},
 heart:{e:'❤️',n:'หัวใจนักสู้',sh:S1,c:6,r:3,t:'g',adj:{ls:.2},d:'อาวุธที่ติดกัน ดูดเลือด 20%'},
 star:{e:'⭐',n:'ดาวนำโชค',sh:S1,c:7,r:3,t:'g',adj:{lv:1},d:'ของทุกชิ้นที่ติดกัน เก่งขึ้น 1 ดาว'},
 pig:{e:'🐷',n:'กระปุกหมู',sh:S1,c:3,r:1,t:'u',gold:1,d:'ได้ทองเพิ่ม 1 ทุกรอบ'},
 crown:{e:'👑',n:'มงกุฎราชา',sh:H2,c:10,r:3,t:'u',hp:20,all:.15,d:'อาวุธทุกชิ้นในกระเป๋า แรงขึ้น 15%'}};
for(const k in IT)IT[k].id=k;
const LM=[0,1,1.55,2.3,3],FOES=[['shroom','เห็ดพิษ'],['wolf','หมาป่า'],['goblin_archer','ก็อบลินธนู'],['wisp','วิญญาณไฟ'],['skeleton','โครงกระดูก'],['boar_guard','ทหารหมูป่า'],['golem','โกเลมหิน']];
const MOB={wolf:[50,38,6],shroom:[30,27,6],skeleton:[54,51,6],boar_guard:[74,69,6],goblin_archer:[45,41,6],golem:[80,70,6],wisp:[36,35,6]};
const GW=8,GH=5;let CS=52,G,UID=1,sel=null,spd=+(localStorage.getItem('bag.spd')||1),BT=null;
const rot=(sh,r)=>{let c=sh.map(p=>p.slice());for(let i=0;i<r;i++)c=c.map(([x,y])=>[-y,x]);const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(([x,y])=>[x-mx,y-my])};
const cellsOf=(o,x=o.x,y=o.y,r=o.r)=>rot(IT[o.id].sh,r).map(([a,b])=>[x+a,y+b]);
function newGame(){G={round:1,hp:5,gold:12,open:{},items:[],shop:[],best:+(localStorage.getItem('bag.best')||0),buys:0,wins:0};for(let y=1;y<4;y++)for(let x=2;x<6;x++)G.open[x+','+y]=1;
 give('sword',3,1,0);give('apple',4,1,0);roll(true);sel=null;draw()}
function give(id,x,y,r){const o={u:UID++,id,lv:1,r:r||0,x,y,bag:x!=null};G.items.push(o);return o}
const occ=skip=>{const m={};for(const o of G.items)if(o.bag&&o!==skip)for(const[x,y]of cellsOf(o))m[x+','+y]=o;return m};
function fits(o,x,y,r){const m=occ(o);return cellsOf(o,x,y,r).every(([a,b])=>G.open[a+','+b]&&!m[a+','+b])}
function firstFit(o){for(let r=0;r<4;r++)for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(fits(o,x,y,r))return[x,y,r];return null}
const cellCost=()=>2+(G.buys/3|0);
function buyable(x,y){if(G.open[x+','+y]||x<0||y<0||x>=GW||y>=GH)return false;return[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>G.open[(x+a)+','+(y+b)])}
function roll(free){if(!free){if(G.gold<1)return;G.gold--}const pool=Object.values(IT);G.shop=G.shop.filter(s=>s&&s.lock&&!s.sold);
 while(G.shop.length<5){const rr=Math.random(),r=rr<Math.min(.04+G.round*.012,.2)?3:rr<Math.min(.2+G.round*.03,.55)?2:1;const c=pool.filter(i=>i.r===r);G.shop.push({id:pick(c).id})}}
function buy(i,x,y,r){const s=G.shop[i];if(!s||s.sold)return null;const d=IT[s.id];if(G.gold<d.c){say('ทองไม่พอ');return null}const o={u:UID++,id:d.id,lv:1,r:r||0,bag:false};
 if(x!=null){if(!fits(o,x,y,o.r))return null;o.x=x;o.y=y;o.bag=true}G.gold-=d.c;s.sold=1;s.lock=0;G.items.push(o);return o}
function tryMerge(o,t){if(t&&t!==o&&t.id===o.id&&t.lv===o.lv&&o.lv<3){t.lv++;G.items=G.items.filter(i=>i!==o);sel=t;say('รวมร่าง! '+IT[t.id].n+' ★'+t.lv);return true}return false}
function sellIt(o){if(!o)return;const v=Math.max(1,Math.floor(IT[o.id].c*LM[o.lv]*.5));G.gold+=v;G.items=G.items.filter(i=>i!==o);sel=null;say('ขายได้ '+v+' ทอง');draw()}
// ---- build a fighter from a bag (neighbours matter)
function build(items,hp){const f={hp,max:hp,blk:0,sta:5,stam:5,sreg:1,poi:0,burn:0,thorn:0,dodge:0,stun:0,slow:0,its:[],dot:0,all:0};const m={};
 for(const o of items)for(const[x,y]of cellsOf(o))m[x+','+y]=o;
 const nb=o=>{const s=new Set;for(const[x,y]of cellsOf(o))for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const t=m[(x+a)+','+(y+b)];if(t&&t!==o)s.add(t)}return[...s]};
 const lvOf=o=>Math.min(4,o.lv+nb(o).filter(t=>IT[t.id].adj&&IT[t.id].adj.lv).length);
 for(const o of items){const d=IT[o.id],L=LM[lvOf(o)];f.max+=(d.hp||0)*L;f.blk+=(d.sblk||0)*L;f.thorn+=(d.thorn||0)*L;f.dodge+=(d.dodge||0)*(1+(L-1)*.5);f.sreg+=(d.sreg||0)*L;f.all+=(d.all||0)*L;
  if(d.start)f.its.push({u:o.u,d,start:d.start*L});
  if(d.t==='w'){const w={u:o.u,d,dmg:d.dmg*L,cd:d.cd,sta:d.sta,crit:d.crit||0,burn:(d.burn||0)*L,poi:(d.poi||0)*L,stun:d.stun||0,pierce:d.pierce||0,ls:0,frz:0,t:Math.random()*.4};
   for(const t of nb(o)){const a=IT[t.id].adj;if(!a)continue;const k=1+(LM[t.lv]-1)*.6;if(a.dmg)w.dmg*=1+a.dmg*k;if(a.cd)w.cd*=1-Math.min(.5,a.cd*k);if(a.crit)w.crit+=a.crit*k;if(a.burn)w.burn+=a.burn*k;if(a.ls)w.ls+=a.ls*k;if(a.frz)w.frz+=a.frz*k}
   f.its.push(w)}
  else if(d.cd)f.its.push({u:o.u,d,blk:(d.blk||0)*L,heal:(d.heal||0)*L,cd:d.cd,sta:0,t:Math.random()*.4})}
 for(const w of f.its)if(w.dmg)w.dmg*=1+f.all;f.hp=f.max=Math.round(f.max);return f}
function foe(round){const boss=round%5===0,n=FOES[Math.min(FOES.length-1,(round-1)*.55|0)],its=[];let bud=(5+round*4.8+round*round*.2)*(boss?1.35:1),x=0;const pool=Object.values(IT).filter(d=>d.t!=='g'&&d.id!=='pig'&&d.r<=1+(round>3)+(round>8));
 let guard=0;while(bud>2&&guard++<40){const d=pick(pool);if(d.c>bud)continue;let lv=1;if(round>5&&Math.random()<.3)lv=2;if(round>10&&Math.random()<.3)lv=3;if(its.length===0&&d.t!=='w')continue;bud-=d.c*LM[lv];its.push({u:UID++,id:d.id,lv,r:0,x:x,y:0});x+=3}
 const f=build(its,(36+round*14+round*round*1.0)*(boss?1.5:1));for(const w of f.its)if(w.dmg)w.dmg*=1+round*.05;f.name=(boss?'👹 บอส ':'')+n[1];f.k=n[0];f.boss=boss;f.list=its;return f}
function tick(A,B,dt,T,ev){for(const[f,e,s]of[[A,B,0],[B,A,1]]){if(f.hp<=0)continue;f.sta=Math.min(f.stam,f.sta+f.sreg*dt);f.dot+=dt;
  if(f.dot>=1){f.dot-=1;let d=f.poi+f.burn+(T>28?(T-28)*.8:0);if(d>0){f.hp-=d;ev.push({s,k:'dot',v:Math.round(d)})}if(f.burn>0)f.burn=Math.max(0,f.burn-1)}
  if(f.slow>0)f.slow-=dt;if(f.stun>0){f.stun-=dt;continue}
  for(const w of f.its){if(w.start){if(!w.done){w.done=1;hit(f,e,s,w,w.start,0,ev)}continue}w.t+=dt*(f.slow>0?.7:1);if(w.t<w.cd||f.sta<w.sta)continue;w.t=0;f.sta-=w.sta;
   if(w.blk){f.blk+=w.blk;ev.push({s,k:'blk',v:Math.round(w.blk),u:w.u})}if(w.heal){const h=Math.min(w.heal,f.max-f.hp);f.hp+=h;ev.push({s,k:'heal',v:Math.round(w.heal),u:w.u})}
   if(w.dmg!=null&&!w.blk&&!w.heal){if(Math.random()<e.dodge){ev.push({s,k:'miss',u:w.u});continue}const c=Math.random()<w.crit;hit(f,e,s,w,w.dmg*(c?2:1),c,ev)}}}}
function hit(f,e,s,w,dmg,crit,ev){let d=dmg;if(d>0){const b=Math.min(e.blk,d*(1-(w.pierce||0)));e.blk-=b;d-=b;e.hp-=d;if(w.ls){f.hp=Math.min(f.max,f.hp+d*w.ls)}if(e.thorn&&!w.start)f.hp-=e.thorn}
 if(w.burn)e.burn+=w.burn;if(w.poi)e.poi+=w.poi;if(w.stun)e.stun=Math.max(e.stun,w.stun);if(w.frz)e.slow=Math.max(e.slow,2*w.frz/.25);ev.push({s,k:'hit',v:Math.round(d),crit,u:w.u,big:dmg>=12})}
function simFight(A,B){let T=0;const ev=[];while(A.hp>0&&B.hp>0&&T<90){tick(A,B,.05,T,ev);T+=.05;ev.length=0}return A.hp>0&&B.hp<=0?1:A.hp<=0&&B.hp>0?0:A.hp>=B.hp?1:0}
// ---- UI
const say=t=>{$('#info').innerHTML=t};
function layout(){const W=innerWidth,H=innerHeight;CS=Math.max(34,Math.floor(Math.min((H-16-66)/GH,(W*.56)/GW)));const g=$('#grid');g.style.width=GW*CS+6+'px';g.style.height=GH*CS+6+'px'}
function itemEl(o,cs){const d=IT[o.id],c=cellsOf(o,0,0,o.r),w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1,el=document.createElement('div');el.className='it t-'+d.t+(sel===o?' sel':'');el.dataset.u=o.u;el.style.width=w*cs+'px';el.style.height=h*cs+'px';
 for(const[x,y]of c){const i=document.createElement('i');i.style.cssText=`left:${x*cs+2}px;top:${y*cs+2}px;width:${cs-4}px;height:${cs-4}px`;el.appendChild(i)}
 const b=document.createElement('b');b.textContent=d.e;b.style.cssText=`left:0;top:0;width:${w*cs}px;height:${h*cs}px;font-size:${Math.min(w,h)*cs*.62+(w!==h?cs*.12:0)}px`;el.appendChild(b);
 if(o.lv>1){const e=document.createElement('em');e.textContent='★'.repeat(o.lv);el.appendChild(e)}return el}
function draw(){layout();const g=$('#grid');g.innerHTML='';const bt=!!BT;
 for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const c=document.createElement('div'),op=G.open[x+','+y];c.className='cell'+(op?' open':(!bt&&buyable(x,y)?' buy':''));c.style.cssText=`left:${x*CS+3}px;top:${y*CS+3}px;width:${CS-2}px;height:${CS-2}px`;c.dataset.x=x;c.dataset.y=y;if(!op&&!bt&&buyable(x,y))c.textContent='+'+cellCost();g.appendChild(c)}
 for(const o of G.items)if(o.bag){const el=itemEl(o,CS);el.style.left=o.x*CS+3+'px';el.style.top=o.y*CS+3+'px';g.appendChild(el)}
 const tr=$('#tray');tr.innerHTML='';const loose=G.items.filter(o=>!o.bag);if(!loose.length)tr.textContent='ที่พักของ: ซื้อแล้วของจะมาอยู่ตรงนี้ ลากเข้ากระเป๋า (ของที่ไม่อยู่ในกระเป๋าไม่ได้ใช้ตอนสู้)';
 for(const o of loose){const el=itemEl(o,34);el.style.position='relative';el.style.flex='0 0 auto';tr.appendChild(el)}
 $('#top').innerHTML=`<span>รอบ ${G.round}${G.round%5===0?' 👹':''}</span><span>${'❤️'.repeat(G.hp)}${'🖤'.repeat(5-G.hp)}</span><span>🪙 ${G.gold}</span><span>🏆 ${G.best}</span>`;
 const sh=$('#shop');sh.innerHTML='';sh.style.display=bt?'none':'grid';$('#arena').style.display=bt?'block':'none';
 G.shop.forEach((s,i)=>{const d=IT[s.id],c=document.createElement('div');c.className='card r'+d.r+(s.sold?' sold':'')+(G.gold<d.c?' no':'');c.dataset.i=i;c.innerHTML=`<span class="lk${s.lock?' on':''}" data-lk="${i}">${s.lock?'🔒':'🔓'}</span><div class="ic">${d.e}</div><div class="nm">${d.n}</div><div class="pr">🪙${d.c} · ${d.sh.length}ช่อง</div>`;sh.appendChild(c)});
 for(const id of['rr','rot','sell','go'])$('#'+id).style.display=bt?'none':'';$('#spd').textContent='⏩ x'+spd;$('#spd').style.display=bt?'':'none';
 if(sel&&!bt)say(desc(sel));else if(!bt&&!$('#info').innerHTML)say('ลากของจากร้านลงกระเป๋า · แตะของเพื่อดูรายละเอียด/หมุน · ของชนิดเดียวกันวางทับกัน = รวมร่าง ★ · ช่องเขียว + คือซื้อช่องกระเป๋าเพิ่ม')}
function desc(o){const d=IT[o.id],L=LM[o.lv],p=[];if(d.dmg)p.push(`ตี ${Math.round(d.dmg*L)} ทุก ${d.cd} วิ`);if(d.blk)p.push(`โล่ ${Math.round(d.blk*L)}`);if(d.heal)p.push(`ฟื้น ${Math.round(d.heal*L)}`);if(d.hp)p.push(`เลือด +${Math.round(d.hp*L)}`);
 return `<b>${d.e} ${d.n} ${'★'.repeat(o.lv)}</b> — ${d.d}${p.length?' ('+p.join(', ')+')':''}<br><small>ขายได้ ${Math.max(1,Math.floor(d.c*L*.5))} ทอง · สีแดง=อาวุธ ฟ้า=ป้องกัน เขียว=อาหาร ม่วง=ของเสริมคนข้างๆ</small>`}

let drag=null;const gh=$('#ghost');
function cellAt(cx,cy,o){const r=$('#grid').getBoundingClientRect(),c=cellsOf(o,0,0,o.r),w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1;return[Math.round((cx-r.left-3-w*CS/2)/CS),Math.round((cy-r.top-3-h*CS/2)/CS)]}
function mark(o,x,y){document.querySelectorAll('.cell.ok,.cell.bad').forEach(c=>c.classList.remove('ok','bad'));if(x==null)return;const ok=fits(o,x,y,o.r);for(const[a,b]of cellsOf(o,x,y,o.r)){const c=document.querySelector(`.cell[data-x="${a}"][data-y="${b}"]`);if(c)c.classList.add(ok?'ok':'bad')}}
addEventListener('pointerdown',e=>{if(BT)return;const t=e.target.closest('.it'),c=e.target.closest('.card'),lk=e.target.dataset&&e.target.dataset.lk;
 if(lk!=null){const s=G.shop[+lk];if(!s.sold)s.lock=!s.lock;draw();return}
 if(t){const o=G.items.find(i=>i.u==t.dataset.u);drag={o,sx:e.clientX,sy:e.clientY,mv:0}}
 else if(c){const s=G.shop[+c.dataset.i];if(s.sold)return;drag={o:{u:0,id:s.id,lv:1,r:0,bag:false},shop:+c.dataset.i,sx:e.clientX,sy:e.clientY,mv:0};say(desc(drag.o))}
 else{const cl=e.target.closest('.cell.buy');if(cl){if(G.gold>=cellCost()){G.gold-=cellCost();G.buys++;G.open[cl.dataset.x+','+cl.dataset.y]=1}else say('ทองไม่พอซื้อช่อง');draw()}else if(!e.target.closest('button')){sel=null;draw()}}});
addEventListener('pointermove',e=>{if(!drag)return;if(!drag.mv&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<9)return;if(!drag.mv){drag.mv=1;gh.innerHTML='';gh.appendChild(itemEl(drag.o,CS));gh.style.display='block'}
 const el=gh.firstChild;gh.style.left=e.clientX-el.offsetWidth/2+'px';gh.style.top=e.clientY-el.offsetHeight/2+'px';const[x,y]=cellAt(e.clientX,e.clientY,drag.o);mark(drag.o,x,y)});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag,o=d.o;drag=null;gh.style.display='none';mark(o);
 if(!d.mv){if(d.shop!=null){const b=buy(d.shop);if(b){const f=firstFit(b);if(f){[b.x,b.y,b.r]=f;b.bag=true}sel=b}}else sel=o;draw();return}
 const[x,y]=cellAt(e.clientX,e.clientY,o),r=$('#grid').getBoundingClientRect(),inG=e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom,under=document.elementFromPoint(e.clientX,e.clientY),tu=under&&under.closest('.it'),tgt=tu&&G.items.find(i=>i.u==tu.dataset.u);
 if(d.shop!=null){if(tgt&&tgt.id===o.id&&tgt.lv===1){const b=buy(d.shop);if(b)tryMerge(b,tgt)}else if(inG&&fits(o,x,y,o.r)){sel=buy(d.shop,x,y,o.r)}else if(under&&under.closest('#tray,#left')){sel=buy(d.shop)}}
 else if(under&&under.closest('#sell'))sellIt(o);
 else if(tgt&&tryMerge(o,tgt)){}
 else if(inG&&fits(o,x,y,o.r)){o.x=x;o.y=y;o.bag=true;sel=o}
 else if(under&&under.closest('#tray')){o.bag=false;sel=o}
 draw()});
$('#rot').onclick=()=>{if(!sel)return say('แตะของที่จะหมุนก่อน');const o=sel,r=(o.r+1)%4;if(!o.bag){o.r=r}else if(fits(o,o.x,o.y,r))o.r=r;else{const old=o.r;o.r=r;const f=firstFit(o);if(f){[o.x,o.y,o.r]=f}else{o.r=old;say('หมุนตรงนี้ไม่ได้ ไม่มีที่ว่างพอ')}}draw()};
$('#sell').onclick=()=>{if(!sel)return say('แตะของที่จะขายก่อน (หรือลากของมาวางที่ปุ่มนี้)');sellIt(sel)};
$('#rr').onclick=()=>{roll();draw()};$('#spd').onclick=()=>{spd=spd===1?2:spd===2?4:1;localStorage.setItem('bag.spd',spd);draw()};$('#go').onclick=()=>startBattle();
// ---- battle
const HERO=new Image();HERO.src='art/poses/combo/chibi_pl.png';const MIM={};for(const k in MOB){MIM[k]=new Image();MIM[k].src='art/td/map1/mob_'+k+'.png'}
function startBattle(){const mine=G.items.filter(o=>o.bag);if(!mine.some(o=>IT[o.id].t==='w'))return say('⚠️ ในกระเป๋าไม่มีอาวุธเลย! ใส่อาวุธ (สีแดง) อย่างน้อย 1 ชิ้นก่อน');sel=null;
 BT={A:build(mine,74+G.round*6),B:foe(G.round),T:0,fx:[],ha:0,ea:0,hh:0,eh:0,done:0};draw();$('#foe').innerHTML=BT.B.list.map(o=>`<span data-u="${o.u}">${IT[o.id].e}${o.lv>1?'<sup>'+o.lv+'</sup>':''}</span>`).join('');say('⚔️ '+BT.B.name+' โผล่มาแล้ว!');last=0;requestAnimationFrame(loop)}
let last=0;function loop(t){if(!BT)return;const dt=Math.min(.05,(t-last)/1000||0)*spd;last=t;const b=BT,ev=[];
 if(!b.done){let rem=dt;while(rem>0&&b.A.hp>0&&b.B.hp>0){const s=Math.min(.05,rem);tick(b.A,b.B,s,b.T,ev);b.T+=s;rem-=s}
  for(const e of ev){const tx=e.k==='heal'||e.k==='blk'?e.s:1-e.s;if(e.k==='hit'){if(e.s===0){b.ha=.25;b.eh=.2}else{b.ea=.25;b.hh=.2}}
   b.fx.push({x:tx?.74:.26,t:0,v:e.k==='miss'?'พลาด':e.k==='blk'?'🛡+'+e.v:e.k==='heal'?'+'+e.v:e.v,c:e.k==='heal'?'#9fe870':e.k==='blk'?'#8fc8ff':e.k==='dot'?'#c88cff':e.crit?'#ffd24a':'#fff',big:e.crit||e.big,dx:R(-.05,.05)});
   if(e.u){const el=document.querySelector(`[data-u="${e.u}"]`);if(el){el.classList.add('fire');setTimeout(()=>el.classList.remove('fire'),140)}}}
  if(b.A.hp<=0||b.B.hp<=0||b.T>90){b.done=1;b.win=b.A.hp>0&&(b.B.hp<=0||b.A.hp>=b.B.hp);setTimeout(endBattle,900/spd)}}
 for(const k of['ha','ea','hh','eh'])b[k]=Math.max(0,b[k]-dt/spd);for(const f of b.fx)f.t+=dt/spd;b.fx=b.fx.filter(f=>f.t<.9);paint(t/1000);requestAnimationFrame(loop)}
function paint(now){const cv=$('#cv'),r=cv.getBoundingClientRect(),W=cv.width=Math.round(r.width),H=cv.height=Math.round(r.height),g=cv.getContext('2d'),b=BT;g.imageSmoothingEnabled=false;const gy=H*.86;
 const bar=(x,f,nm)=>{const w=W*.36,p=Math.max(0,f.hp)/f.max;g.fillStyle='#000a';g.fillRect(x,H*.28+0,w,13);g.fillStyle=p>.4?'#5fd060':'#e8503a';g.fillRect(x+2,H*.28+2,(w-4)*p,9);g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='left';
  g.fillText(`${nm}  ${Math.max(0,Math.ceil(f.hp))}/${f.max}`+(f.blk>0?`  🛡${Math.round(f.blk)}`:'')+(f.poi>0?`  ☠${Math.round(f.poi)}`:'')+(f.burn>0?`  🔥${Math.round(f.burn)}`:'')+(f.stun>0?'  💫':''),x,H*.28-4);g.fillStyle='#000a';g.fillRect(x,H*.28+15,w*.6,5);g.fillStyle='#ffd24a';g.fillRect(x+1,H*.28+16,(w*.6-2)*f.sta/f.stam,3)};
 bar(W*.04,b.A,'นักดาบ');bar(W*.6,b.B,b.B.name);
 const k=Math.max(1,Math.round(H/170));let cell=60+(now*6|0)%8;if(b.A.hp<=0)cell=87;else if(b.hh>0)cell=71;else if(b.ha>0)cell=10+[6,7,14,15][(b.T*3|0)%4];
 if(HERO.width){const s=k*.62,x=W*.26+(b.ha>0?18*k*b.ha*4:0);g.drawImage(HERO,cell%10*204,(cell/10|0)*204,204,204,x-103*s,gy-174*s,204*s,204*s)}
 const M=MOB[b.B.k],mi=MIM[b.B.k];if(mi.width){const s=k*(b.B.boss?2.6:1.9)*(b.B.hp<=0?.6:1),f=(now*8|0)%M[2],x=W*.74-(b.ea>0?18*k*b.ea*4:0);g.save();g.translate(x,gy);g.scale(-s,s);if(b.eh>0)g.filter='brightness(2.5)';g.globalAlpha=b.B.hp<=0?.4:1;g.drawImage(mi,f*M[0],0,M[0],M[1],-M[0]/2,-M[1],M[0],M[1]);g.restore()}
 g.textAlign='center';for(const f of b.fx){g.font=`800 ${f.big?26:17}px system-ui`;g.globalAlpha=Math.max(0,1-f.t/.9);g.fillStyle='#000';g.fillText(f.v,W*(f.x+f.dx)+1,gy-70*k*.5-f.t*60+1);g.fillStyle=f.c;g.fillText(f.v,W*(f.x+f.dx),gy-70*k*.5-f.t*60)}g.globalAlpha=1;
 if(b.T>28&&!b.done){g.font='700 13px system-ui';g.fillStyle='#ffb0a0';g.fillText('⏳ เหนื่อยล้า! ทั้งคู่เสียเลือดเรื่อยๆ',W/2,H*.16)}}
function endBattle(){const b=BT;BT=null;const win=b.win,pig=G.items.filter(o=>o.bag&&IT[o.id].gold).reduce((s,o)=>s+o.lv,0),inc=9+Math.min(6,G.round>>1)+(win?2:0)+pig;let h;
 if(win){G.wins++;h=`<h2>🎉 ชนะ!</h2>ล้ม ${b.B.name} ได้ใน ${b.T.toFixed(1)} วิ`}else{G.hp--;h=`<h2>💥 แพ้...</h2>${b.B.name} เหลือเลือด ${Math.max(0,Math.ceil(b.B.hp))} · เสีย ❤️ 1 ดวง`}
 if(G.round>G.best){G.best=G.round-(win?0:1);localStorage.setItem('bag.best',G.best)}
 if(G.hp<=0){pop(`<h2>☠️ จบเกม</h2>ไปได้ถึงรอบ ${G.round} · ชนะ ${G.wins} ครั้ง<br>สถิติสูงสุด: รอบ ${G.best}<br><br><button onclick="closePop();newGame()">เล่นใหม่</button>`);return}
 const vic=win&&G.round===15;G.round++;G.gold+=inc;roll(true);
 pop(h+`<br>ได้ทอง 🪙 ${inc}${pig?' (กระปุกหมู +'+pig+')':''}${vic?'<br><br>👑 <b>ชนะบอสรอบ 15 แล้ว! คุณคือสุดยอดนักดาบ</b><br>เล่นต่อแบบไม่มีที่สิ้นสุดได้':''}<br><br><button onclick="closePop()">${vic?'เล่นต่อ':'ไปร้านค้า'}</button>`);draw();say(G.round%5===0?'👹 รอบนี้เจอบอส! เตรียมกระเป๋าให้ดี':'จัดกระเป๋าแล้วกด สู้!')}
function pop(h){$('#pop div').innerHTML=h;$('#pop').style.display='flex'}window.closePop=()=>{$('#pop').style.display='none'};
addEventListener('resize',()=>draw());addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')$('#rot').click();if(e.key===' '&&!BT&&$('#pop').style.display!=='flex')$('#go').click()});
// a simple bot for balance checks: BG.sim(200) -> average round reached
function botGame(smart){newGameQuiet();let guard=0;while(G.hp>0&&G.round<=40&&guard++<200){let tries=0;while(tries++<12){const afford=G.shop.map((s,i)=>[s,i]).filter(([s])=>!s.sold&&IT[s.id].c<=G.gold);if(!afford.length){if(G.gold>=3&&tries<6){roll();continue}break}
   const[s,i]=smart?afford.sort((a,b)=>(IT[b[0].id].t==='w')-(IT[a[0].id].t==='w'))[0]:pick(afford);const same=G.items.find(o=>o.bag&&o.id===s.id&&o.lv<3&&o.lv===1);const b=buy(i);if(!b)break;
   if(same&&tryMerge(b,same))continue;let f=firstFit(b);while(!f&&G.gold>=cellCost()){const c=[];for(let y=0;y<GH;y++)for(let x=0;x<GW;x++)if(buyable(x,y))c.push([x,y]);if(!c.length)break;const[x,y]=pick(c);G.gold-=cellCost();G.buys++;G.open[x+','+y]=1;f=firstFit(b)}
   if(f){[b.x,b.y,b.r]=f;b.bag=true}else{G.gold+=Math.floor(IT[b.id].c/2);G.items=G.items.filter(o=>o!==b)}}
  const win=simFight(build(G.items.filter(o=>o.bag),74+G.round*6),foe(G.round));if(!win)G.hp--;const pig=G.items.filter(o=>o.bag&&IT[o.id].gold).length;G.gold+=9+Math.min(6,G.round>>1)+(win?2:0)+pig;G.round++;roll(true)}return G.round-1}
function newGameQuiet(){G={round:1,hp:5,gold:12,open:{},items:[],shop:[],best:0,buys:0,wins:0};for(let y=1;y<4;y++)for(let x=2;x<6;x++)G.open[x+','+y]=1;give('sword',3,1,0);give('apple',4,1,0);roll(true)}
window.BG={sim(n,smart){const save=G;const r=[];for(let i=0;i<n;i++)r.push(botGame(smart));G=save;r.sort((a,b)=>a-b);return{avg:r.reduce((a,b)=>a+b,0)/n,min:r[0],med:r[n>>1],max:r[n-1],win15:r.filter(x=>x>=15).length/n}},get G(){return G},get BT(){return BT},IT,build,foe,simFight,startBattle,buy,draw};
newGame();
