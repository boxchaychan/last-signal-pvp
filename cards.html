<!doctype html>

<title>ศึกการ์ดอสูร</title>
<link rel="icon" href="data:,">
<!-- cards.html "ศึกการ์ดอสูร" = card battler, monsters stay as CARDS on the board (owner 2026-11-26 "แบบ hearthstone", genre only,
     nothing copied). Each deck has a LEADER with a fury gauge and a signature move (ทีเด็ด). v1: the Lu Bu deck (human army from clash,
     Lu Bu = leader) vs the Tomb King deck (desert pixel monsters from art/horde/mobs) played by the computer. ONE canvas, all UI drawn in
     code (no HTML menus). Every card hits with its own effect (by weapon / element). Notes: the MONSTER CARD GAME section at the end of
     docs/action-game.md. Test hooks: window.CG (state, step(), auto play with ?bot=1). -->
<style>
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
@font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-thai-800-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
@font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #241712; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; }
</style>

<body>
<canvas id="c"></canvas>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), g = cv.getContext('2d');
const VW = 844, VH = 390;   /* design size (phone landscape); scaled to fit */
let SC = 1, OX = 0, OY = 0, DPR = 1;
function resize() { DPR = Math.min(2.5, devicePixelRatio || 1); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; SC = Math.min(innerWidth / VW, innerHeight / VH); OX = (innerWidth - VW * SC) / 2; OY = (innerHeight - VH * SC) / 2; }
addEventListener('resize', resize); resize();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, ease = t => 1 - Math.pow(1 - t, 3);
const FONT = (w, s) => `${w} ${s}px Kanit, "Noto Sans Thai", sans-serif`;
let RS = 1; const rnd = () => (RS = (RS * 16807) % 2147483647) / 2147483647; RS = (Date.now() % 100000) + 1;

/* ---------- art */
const IMG = {}; function img(p) { if (!IMG[p]) { const i = new Image(); i.src = p; IMG[p] = i; } return IMG[p]; }
let MOBS = {}; fetch('art/horde/mobs/index.json').then(r => r.json()).then(j => { MOBS = j.mobs; });
const HUM = { h_spear: { cw: 68, fx: 30, fy: 64, atk: 13, w: 32, h: 35 }, h_archer: { cw: 68, fx: 30, fy: 64, atk: 13, w: 41, h: 28 }, hk_rider: { cw: 68, fx: 30, fy: 64, atk: 13, w: 27, h: 30 }, hk_glaive: { cw: 68, fx: 30, fy: 64, atk: 13, w: 25, h: 29 }, hk_samurai: { cw: 68, fx: 30, fy: 64, atk: 13, w: 25, h: 29 }, hk_tank: { cw: 68, fx: 30, fy: 64, atk: 13, w: 26, h: 26 } };   /* clash human units with move sheets (art/clash/anim, cells 68, feet 30 / 64); w / h = the figure itself */
/* sprite frame for a card: { im, sx, sy, sw, sh, fx, fy, scale } ; human sheets face right, horde monsters face left */
function frameOf(art, atk, t) {
  const [kind, k] = art.split(':');
  if (kind === 'h') { const A = HUM[k], im = img('art/clash/anim/' + k + '.png'), n = atk ? A.atk : 8, f = Math.floor(t) % n; return { im, sx: f * A.cw, sy: atk ? 0 : A.cw, sw: A.cw, sh: A.cw, fx: A.fx, fy: A.fy, px: 1, flip: false, fw: A.w, fh: A.h }; }
  if (kind === 'l') { const im = img('art/cards/lubu_anim.png'), n = atk ? 13 : 8, f = Math.floor(t) % n; return { im, sx: f * 132, sy: atk ? 0 : 132, sw: 132, sh: 132, fx: 58, fy: 125, px: 1, flip: false, fw: 99, fh: 102 }; }
  const m = MOBS[k]; if (!m) return null; const im = img(m.f), row = atk ? (m.rows.attack || 0) : 0, n = m.n || 4, f = Math.floor(t) % n;
  return { im, sx: f * m.w, sy: row * m.h, sw: m.w, sh: m.h, fx: m.fx, fy: m.fy, px: m.px || 2, flip: true, el: m.el };
}

/* ---------- cards. Keywords (ours, in Thai): taunt = ผู้พิทักษ์ (must be hit first), charge = จู่โจม (hits the turn it comes), poison = พิษ (kills what it damages) */
const CARDS = {
  spear: { n: 'ทหารทวน', c: 1, a: 1, h: 2, kw: ['taunt'], art: 'h:h_spear', fx: 'thrust', r: 0 },
  xbow: { n: 'นักธนูหน้าไม้', c: 2, a: 2, h: 1, bc: 'shot1', art: 'h:h_archer', fx: 'arrow', r: 0, txt: 'ลงแล้วยิง 1' },
  cav: { n: 'ทหารม้าเกราะ', c: 3, a: 3, h: 3, kw: ['charge'], art: 'h:hk_rider', fx: 'charge', r: 1 },
  axe: { n: 'ทหารง้าว', c: 3, a: 4, h: 2, art: 'h:hk_glaive', fx: 'chop', r: 0 },
  swordk: { n: 'ซามูไรดาบ', c: 4, a: 4, h: 4, art: 'h:hk_samurai', fx: 'slash', r: 1 },
  vanguard: { n: 'ทัพหน้าเกราะหนัก', c: 5, a: 5, h: 6, kw: ['taunt'], art: 'h:hk_tank', fx: 'smash', r: 2 },
  banner: { n: 'ธงศึก', c: 2, spell: 'allAtk', icon: 'banner', r: 0, txt: 'การ์ดเราทุกใบ โจมตี +2 ตานี้' },
  drum: { n: 'กลองศึก', c: 1, spell: 'drum', icon: 'drum', r: 0, txt: 'โทสะ +2 จั่ว 1 ใบ' },
  redhare: { n: 'ม้าเซ็กเธาว์', c: 3, spell: 'hare', t: 'own', icon: 'horse', r: 2, txt: 'การ์ดเรา 1 ใบ โจมตี +2 ตีได้ทันที' },
  diao: { n: 'กลอุบายเตียวเสี้ยน', c: 2, spell: 'freeze', t: 'enemy', icon: 'fan', r: 1, txt: 'การ์ดศัตรู 1 ใบ ตีไม่ได้ 1 ตา' },
  viper: { n: 'งูพิษเนินทราย', c: 1, a: 1, h: 1, kw: ['poison'], art: 'm:mob_desert_dune_viper', r: 0 },
  wolf: { n: 'หมาป่าเนินทราย', c: 2, a: 2, h: 2, kw: ['charge'], art: 'm:mob_desert_dune_wolf', r: 0 },
  mummy: { n: 'มัมมี่เร่ร่อน', c: 2, a: 2, h: 3, art: 'm:mob_desert_linenwalker', r: 0 },
  bird: { n: 'นกเท้าไว', c: 2, a: 3, h: 1, kw: ['charge'], art: 'm:mob_desert_strider_bird', r: 0 },
  scorp: { n: 'แมงป่องก้ามพิษ', c: 3, a: 2, h: 3, kw: ['poison'], art: 'm:mob_desert_stingclaw_scorpion', r: 1 },
  cactus: { n: 'กระบองเพชรเดินได้', c: 3, a: 1, h: 5, kw: ['taunt'], art: 'm:mob_desert_spinewalker', r: 0 },
  turtle: { n: 'เต่าป้อมปราการ', c: 4, a: 2, h: 7, kw: ['taunt'], art: 'm:mob_desert_fortress_tortoise', r: 1 },
  jackal: { n: 'นักบวชหมาใน', c: 4, a: 3, h: 4, bc: 'heal4', art: 'm:mob_desert_jackal_priest', r: 1, txt: 'ลงแล้วฟื้นเลือดแม่ทัพ 4' },
  colossus: { n: 'ยักษ์หินทราย', c: 6, a: 6, h: 7, art: 'm:mob_desert_sandstone_colossus', r: 2 },
  storm: { n: 'พายุทราย', c: 3, spell: 'aoe2', icon: 'storm', r: 1, txt: 'การ์ดศัตรูทุกใบโดน 2' },
  quick: { n: 'ทรายดูด', c: 1, spell: 'dmg3', t: 'enemyCard', icon: 'sink', r: 0, txt: 'การ์ดศัตรู 1 ใบโดน 3' },
  mummyTok: { n: 'มัมมี่ปลุก', c: 1, a: 2, h: 2, art: 'm:mob_desert_linenwalker', r: 0, token: true },
};
const KWN = { taunt: 'ผู้พิทักษ์', charge: 'จู่โจม', poison: 'พิษ' };
const LEADERS = {
  lubu: { n: 'ลิโป้', hp: 30, ult: 'sweep', un: 'ง้าวกรีดฟ้า', ud: 'การ์ดศัตรูทุกใบโดน 4 แม่ทัพศัตรูโดน 2', col: '#e8442e',
    deck: { spear: 3, xbow: 2, cav: 3, axe: 2, swordk: 2, vanguard: 2, banner: 2, drum: 2, redhare: 1, diao: 1 } },
  tomb: { n: 'ราชาสุสาน', hp: 30, ult: 'raise', un: 'ปลุกสุสาน', ud: 'ปลุกมัมมี่ 3 ตัว ฟื้นเลือด 3', col: '#9b6ad6',
    deck: { viper: 2, wolf: 2, mummy: 3, bird: 2, scorp: 2, cactus: 2, turtle: 2, jackal: 1, colossus: 1, storm: 1, quick: 2 } },
};
const FURY_MAX = 10;

/* ---------- state */
let S = null, UID = 1;
function mkPlayer(lk, ai) { const L = LEADERS[lk], deck = []; for (const [k, n] of Object.entries(L.deck)) for (let i = 0; i < n; i++) deck.push(k);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  return { lk, L, ai, hp: L.hp, maxHp: L.hp, mana: 0, maxMana: 0, fury: 0, deck, hand: [], board: [], fatigue: 0, hurtT: 0, x: 0, y: 0 }; }
function newGame() {
  S = { p: [mkPlayer('lubu', !!Q.get('bot')), mkPlayer('tomb', true)], turn: 0, cur: 0, phase: 'title', fx: [], parts: [], nums: [], q: [], busy: 0, shake: 0, hitstop: 0, msg: null, winner: -1, t: 0, cine: null, turnN: 0 };
  for (let i = 0; i < 3; i++) draw(S.p[0], true); for (let i = 0; i < 4; i++) draw(S.p[1], true);
  if (Q.get('skip') || Q.get('bot')) startTurn(0);
}
function mkCard(k, owner) { const d = CARDS[k]; return { id: UID++, k, d, owner, a: d.a, h: d.h, maxH: d.h, kw: (d.kw || []).slice(), sleep: true, atkUsed: false, frozen: 0, buff: 0, x: 0, y: 0, tx: 0, ty: 0, dead: false, anim: 0, atkAnim: 0, flash: 0, born: 0 }; }
function draw(P, quiet) {
  if (!P.deck.length) { P.fatigue++; dmgLeader(P, P.fatigue); popText(P.x, P.y - 30, 'การ์ดหมด!', '#ffd0a0'); return; }
  const k = P.deck.pop(); if (P.hand.length >= 10) return; const c = mkCard(k, S.p.indexOf(P)); c.x = VW + 40; c.y = P === S.p[0] ? 340 : -60; c.born = quiet ? 1 : 0; P.hand.push(c);
}
const foe = P => S.p[1 - S.p.indexOf(P)];
function startTurn(i) {
  S.cur = i; S.phase = 'play'; S.turnN++; const P = S.p[i]; P.maxMana = Math.min(10, P.maxMana + 1); P.mana = P.maxMana; P.fury = Math.min(FURY_MAX, P.fury + 1);
  for (const c of P.board) { c.sleep = false; c.atkUsed = false; if (c.frozen > 0) c.frozen--; }
  for (const c of foe(P).board) c.buff = 0;
  draw(P); banner(i === 0 ? 'ตาของคุณ' : 'ตาของ' + P.L.n, i === 0 ? '#ffd56a' : '#d9b2ff');
  if (P.ai) setTimeout(() => aiTurn(), 900);
}
function endTurn() { if (S.phase !== 'play' || S.busy) return; for (const c of S.p[S.cur].board) c.buff = 0; startTurn(1 - S.cur); }

/* ---------- rules */
const hasTaunt = P => P.board.some(c => c.kw.includes('taunt') && !c.dead);
const canAttack = c => !c.dead && !c.atkUsed && c.frozen <= 0 && (!c.sleep || c.kw.includes('charge')) && (c.a + c.buff) > 0;
function legalTarget(att, tgt) { const E = foe(S.p[att.owner]); if (tgt === 'leader') return !hasTaunt(E); if (tgt.owner === att.owner || tgt.dead) return false; return !hasTaunt(E) || tgt.kw.includes('taunt'); }
function playable(P, c) { if (c.d.c > P.mana) return false; if (!c.d.spell && P.board.length >= 7) return false; if (c.d.t === 'own' && !P.board.length) return false; if ((c.d.t === 'enemy' || c.d.t === 'enemyCard') && !foe(P).board.length) return false; return true; }
function play(P, c, target, slot) {
  if (!playable(P, c)) return false; P.mana -= c.d.c; P.hand.splice(P.hand.indexOf(c), 1); const E = foe(P);
  if (c.d.spell) { castSpell(P, c, target); return true; }
  const at = slot == null ? P.board.length : clamp(slot, 0, P.board.length); P.board.splice(at, 0, c); c.sleep = true; c.born = 0; c.flash = 1;
  burst(c.tx || VW / 2, c.ty || 220, 'summon', 22); S.shake = Math.max(S.shake, 3);
  if (c.d.bc === 'shot1') { const t = target && target !== 'leader' && target.owner !== c.owner ? target : (E.board.length ? E.board[Math.floor(rnd() * E.board.length)] : 'leader'); later(.35, () => { arrowShot(c, t, 1); }); }
  if (c.d.bc === 'heal4') { later(.3, () => healLeader(P, 4)); }
  return true;
}
function castSpell(P, c, t) {
  const E = foe(P), sx = P === S.p[0] ? VW / 2 : VW / 2, sy = P === S.p[0] ? 300 : 80;
  banner(c.d.n, '#ffe8a8', .9);
  if (c.d.spell === 'allAtk') for (const m of P.board) { m.buff += 2; m.flash = 1; burst(m.x, m.y, 'buff', 10); }
  if (c.d.spell === 'drum') { P.fury = Math.min(FURY_MAX, P.fury + 2); draw(P); burst(P.x, P.y, 'buff', 16); }
  if (c.d.spell === 'hare') { const m = t && t !== 'leader' && t.owner === S.p.indexOf(P) ? t : P.board[0]; if (m) { m.a += 2; m.sleep = false; m.atkUsed = false; m.kw.includes('charge') || m.kw.push('charge'); m.flash = 1; burst(m.x, m.y, 'fire', 20); } }
  if (c.d.spell === 'freeze') { const m = t && t !== 'leader' && t.owner !== S.p.indexOf(P) ? t : E.board[0]; if (m) { m.frozen = 2; m.flash = 1; burst(m.x, m.y, 'charm', 20); } }
  if (c.d.spell === 'aoe2') { S.shake = 8; for (const m of E.board.slice()) { burst(m.x, m.y, 'earth', 14); hurt(m, 2, 'earth'); } burst(VW / 2, P === S.p[0] ? 130 : 230, 'sand', 60); }
  if (c.d.spell === 'dmg3') { const m = t && t !== 'leader' && t.owner !== S.p.indexOf(P) ? t : E.board[0]; if (m) { burst(m.x, m.y, 'sand', 26); hurt(m, 3, 'earth'); } }
  cleanup();
}
function attack(att, tgt) {
  if (!canAttack(att) || !legalTarget(att, tgt)) return false; att.atkUsed = true; const P = S.p[att.owner], E = foe(P);
  const tx = tgt === 'leader' ? E.x : tgt.x, ty = tgt === 'leader' ? E.y : tgt.y; S.busy++;
  att.lunge = { t: 0, tx, ty, hit: false, tgt }; att.atkAnim = .001; P.fury = Math.min(FURY_MAX, P.fury + 1);
  return true;
}
function resolveHit(att, tgt) {
  const P = S.p[att.owner], E = foe(P), dmg = att.a + att.buff, fx = att.d.fx || (frameOf(att.d.art, false, 0) || {}).el || 'neutral';
  const tx = tgt === 'leader' ? E.x : tgt.x, ty = tgt === 'leader' ? E.y : tgt.y;
  hitFx(fx, tx, ty, att); S.hitstop = .08; S.shake = Math.max(S.shake, dmg >= 5 ? 9 : 5);
  if (tgt === 'leader') dmgLeader(E, dmg);
  else { hurt(tgt, dmg, fx, att.kw.includes('poison')); if (tgt.a > 0) hurt(att, tgt.a + tgt.buff, (tgt.d.fx || (frameOf(tgt.d.art, false, 0) || {}).el || 'neutral'), tgt.kw.includes('poison'), true); }
  cleanup();
}
function hurt(c, n, fx, poison, quietFx) { if (c.dead || n <= 0) return; c.h -= n; c.flash = 1; popNum(c.x, c.y - 10, '-' + n, poison ? '#9cff6a' : '#fff3c4'); if (poison) c.h = Math.min(c.h, 0); }
function dmgLeader(P, n) { P.hp -= n; P.hurtT = .4; popNum(P.x, P.y - 18, '-' + n, '#ff8c7a', 26); if (P.hp <= 0 && S.winner < 0) { S.winner = 1 - S.p.indexOf(P); later(1.2, () => { S.phase = 'over'; }); } }
function healLeader(P, n) { P.hp = Math.min(P.maxHp, P.hp + n); popNum(P.x, P.y - 18, '+' + n, '#8dff9a', 24); burst(P.x, P.y, 'heal', 20); }
function cleanup() {
  for (const P of S.p) for (const c of P.board) if (c.h <= 0 && !c.dead) { c.dead = true; c.deadT = 0; P.fury = Math.min(FURY_MAX, P.fury + 2); shatter(c); }
  setTimeout(() => { for (const P of S.p) P.board = P.board.filter(c => !c.dead); }, 520);
}
function ultimate(P) {
  if (P.fury < FURY_MAX || S.busy || S.cine) return false; P.fury = 0; const E = foe(P); S.busy++;
  S.cine = { P, t: 0, done: false };
  later(1.35, () => {
    if (P.L.ult === 'sweep') { S.sweep = { t: 0, y: E === S.p[1] ? 128 : 228 }; S.shake = 14; for (const m of E.board.slice()) hurt(m, 4, 'war'); dmgLeader(E, 2); for (let i = 0; i < 40; i++) burst(80 + i * 18, E === S.p[1] ? 128 : 228, 'fire', 2); cleanup(); }
    if (P.L.ult === 'raise') { for (let i = 0; i < 3 && P.board.length < 7; i++) { const c = mkCard('mummyTok', S.p.indexOf(P)); P.board.push(c); c.flash = 1; } healLeader(P, 3); S.shake = 8; for (let i = 0; i < 30; i++) burst(200 + i * 15, P === S.p[1] ? 128 : 228, 'undead', 2); }
  });
  later(2.0, () => { S.cine = null; S.busy--; });
  return true;
}
function later(sec, fn) { S.q.push({ t: sec, fn }); }
function banner(text, col, dur = 1.2) { S.msg = { text, col, t: 0, dur }; }

/* ---------- AI: play what fits (most expensive first), then attack: kill taunts, make good trades, else hit the leader */
function aiTurn() {
  const P = S.p[S.cur]; if (!P.ai || S.phase !== 'play' || S.winner >= 0) return;
  if (S.busy || S.cine) { setTimeout(aiTurn, 250); return; }
  const E = foe(P);
  if (P.fury >= FURY_MAX && (E.board.length >= 2 || P.L.ult === 'raise')) { ultimate(P); setTimeout(aiTurn, 2300); return; }
  const cand = P.hand.filter(c => playable(P, c)).sort((a, b) => b.d.c - a.d.c);
  for (const c of cand) {
    if (c.d.spell === 'aoe2' && E.board.length < 2) continue; if (c.d.spell === 'allAtk' && P.board.filter(canAttack).length < 2) continue;
    let t = null; if (c.d.t === 'enemyCard' || c.d.t === 'enemy') t = E.board.slice().sort((a, b) => (b.a + b.h) - (a.a + a.h))[0]; if (c.d.t === 'own') t = P.board.slice().sort((a, b) => b.h - a.h)[0];
    if (play(P, c, t)) { setTimeout(aiTurn, 750); return; }
  }
  const att = P.board.filter(canAttack);
  if (att.length) {
    const a = att[0], dmg = a.a + a.buff, taunts = E.board.filter(c => !c.dead && c.kw.includes('taunt'));
    let tgt = null;
    if (taunts.length) tgt = taunts.sort((x, y) => x.h - y.h)[0];
    else { const kills = E.board.filter(c => !c.dead && c.h <= dmg && (c.a < a.h || c.a + c.h > a.a + a.h)).sort((x, y) => (y.a + y.h) - (x.a + x.h)); tgt = kills[0] || 'leader'; }
    if (attack(a, tgt)) { setTimeout(aiTurn, 900); return; } a.atkUsed = true; setTimeout(aiTurn, 100); return;
  }
  setTimeout(() => { if (S.cur === S.p.indexOf(P) && S.phase === 'play' && !S.busy) endTurn(); else setTimeout(aiTurn, 300); }, 500);
}

/* ---------- effects (all drawn in code): one look per weapon / element */
const EL = { fire: ['#ffd76a', '#ff7a2a', '#c8331f'], poison: ['#d4ff7a', '#62d64a', '#2c8a3a'], earth: ['#f0c890', '#b98a5a', '#6e4c34'], undead: ['#e6dcff', '#a58ad6', '#5a4878'],
  shadow: ['#d9a6ff', '#7a3ac8', '#2a1440'], neutral: ['#ffffff', '#ffe6b0', '#c8a070'], war: ['#fff2c0', '#ff4a2a', '#8a1a12'], holy: ['#ffffff', '#fff0a0', '#ffc840'],

/* ---------- layout */
const CW = 58, CH = 80, HCW = 62, HCH = 86;
function layout() {

  for (const [P, y] of [[P1, 128], [P0, 228]]) { const n = P.board.length, w = n * CW + (n - 1) * 8; P.board.forEach((c, i) => { c.tx = VW / 2 - w / 2 + CW / 2 + i * (CW + 8); c.ty = y; }); }
  const H = P0.hand, n = H.length, spread = Math.min(66, 420 / Math.max(1, n));
  H.forEach((c, i) => { const off = i - (n - 1) / 2; c.tx = VW / 2 + 10 + off * spread; c.ty = 372 + Math.abs(off) * 2.5; c.rot = off * .045; if (c === DRAG.card) { c.tx = DRAG.x; c.ty = DRAG.y; c.rot = 0; } else if (c === HOVER) { c.ty -= 40; c.rot = 0; } });
  P1.hand.forEach((c, i) => { c.tx = VW / 2 - (P1.hand.length - 1) * 9 + i * 18; c.ty = -18; c.rot = 0; });
}
function moveCards(dt) { for (const P of S.p) for (const c of [...P.board, ...P.hand]) { if (c.lunge) continue; const k = 1 - Math.exp(-dt * 14); c.x = lerp(c.x, c.tx, k); c.y = lerp(c.y, c.ty, k); } }

/* ---------- update */
function update(dt) {

  layout(); moveCards(dt);
  for (const P of S.p) for (const c of P.board) { c.anim += dt * 7; if (c.flash > 0) c.flash -= dt * 2.5; if (c.atkAnim > 0) { c.atkAnim += dt * 18; if (c.atkAnim > 13) c.atkAnim = 0; }
    if (c.lunge) { const L = c.lunge; L.t += dt; const T = L.t / .2;
      if (T < 1) { c.x = lerp(c.tx, L.tx, ease(T) * .82); c.y = lerp(c.ty, L.ty, ease(T) * .82); }
      else if (!L.hit) { L.hit = true; resolveHit(c, L.tgt); }
      else if (T < 1.8) { const u = (T - 1) / .8; c.x = lerp(lerp(c.tx, L.tx, .82), c.tx, ease(u)); c.y = lerp(lerp(c.ty, L.ty, .82), c.ty, ease(u)); }
      else { c.lunge = null; S.busy = Math.max(0, S.busy - 1); } } }
  for (const P of S.p) { if (P.hurtT > 0) P.hurtT -= dt; }
  for (const p of S.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; if (p.vr) p.rot += p.vr * dt; p.vx *= .985; }
  S.parts = S.parts.filter(p => p.t < p.life); for (const f of S.fx) f.t += dt; S.fx = S.fx.filter(f => f.t < f.life);
  for (const n of S.nums) n.t += dt; S.nums = S.nums.filter(n => n.t < 1.1); if (S.msg) { S.msg.t += dt; if (S.msg.t > S.msg.dur) S.msg = null; }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 30); if (S.cine) S.cine.t += dt; if (S.sweep) { S.sweep.t += dt; if (S.sweep.t > .6) S.sweep = null; }
}
