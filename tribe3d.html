<!doctype html>
<html lang="th">
<head>

<title>เผ่าดึกดำบรรพ์ · แมพ 3D</title>
<!--
  Stone-age tribe, WIDE 3D-pixel map test (owner 2026-11-15 "สร้างเผ่าดึกดำบรรพ์ ... ทำ 3D แบบนี้ได้ไหม" -> "ทำเลยแมพกว้างๆ").
  Same look as kaiju.html: three.js r147 (vendor/threejs) rendered into a low-resolution target (1 render pixel = 1/8 world unit),
  depth outlines + light top edges in a post pass, nearest-neighbour enlargement, camera snapped to the pixel grid.
  Everything is made in code (free): terraced terrain from seeded noise (360 x 360 units: mountains in the north, a river, a lake,
  sea + beach in the south), forests, rocks, grass tufts, a village (cone / dome / mammoth-bone huts, longhouse, campfire, totem,
  palisade with a gate, watchtowers, racks, piles, garden plots, dock, cave in the cliff with torches), blocky placeholder villagers.
  Camera LOCKED to 4 angles (button / C), drag or WASD to pan, wheel / pinch / Q E to zoom, day / sunset / night (button / N).
  URL: ?cam=0..3, ?seed=N, ?t=0..2 time of day, ?ol=0 no outlines. QA hooks: window.TB (ready, hold, step, draw, info()).
-->
<style>
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  @font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-thai-800-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  :root { --gold: #ffcf5a; --ink: #140c06; --ol: 0 2px 0 #140c06, 0 -1px 0 #140c06, 2px 0 0 #140c06, -2px 0 0 #140c06, 2px 2px 0 #140c06, -2px 2px 0 #140c06; }

  #card .s { font-size: 11px; font-weight: 600; color: #f3dcb0; }

  .ib { position: relative; width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 2px solid var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 32%, #8a6236, #43290f 75%); box-shadow: 0 4px 0 var(--ink), inset 0 2px 0 #ffe7b840; }

  #msg { position: fixed; left: 50%; top: 28%; transform: translate(-50%, -50%); font-weight: 800; font-size: 22px; text-align: center; text-shadow: var(--ol), 0 0 14px #ff9a3c; pointer-events: none; transition: opacity .6s; white-space: nowrap; }
  #msg small { display: block; font-size: 14px; font-weight: 600; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 800 18px Kanit, sans-serif; color: #fff; text-shadow: var(--ol); background: radial-gradient(circle at 50% 40%, #6a4a26, #20140a); }
</style>

<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="card" class="pnl"><div class="t">เผ่าดึกดำบรรพ์</div><div class="s">แมพ 3D พิกเซล · ทดสอบ</div></div>
  <div id="tr">
    <button id="bCam" class="ib" title="มุมกล้อง"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2.5h6L17 7h3a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5v-10A1.5 1.5 0 0 1 4 7zm8 2.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zm0 2.2a2.3 2.3 0 1 1 0 4.6 2.3 2.3 0 0 1 0-4.6z"/></svg><em id="camL">B</em></button>

    <button id="bZi" class="ib" title="ซูมเข้า"><svg viewBox="0 0 24 24"><path d="M10 2.5a7.5 7.5 0 0 1 6 12l5 5-1.8 1.8-5-5A7.5 7.5 0 1 1 10 2.5zm0 2.3a5.2 5.2 0 1 0 0 10.4 5.2 5.2 0 0 0 0-10.4z"/><path d="M8.9 6.8h2.2v2.1h2.1v2.2h-2.1v2.1H8.9v-2.1H6.8V8.9h2.1z"/></svg></button>
    <button id="bTime" class="ib" title="เวลา"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/><path d="M11 1.5h2v3h-2zM11 19.5h2v3h-2zM1.5 11h3v2h-3zM19.5 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM4.2 18.4l2.1-2.1 1.4 1.4-2.1 2.1zM16.3 6.3l2.1-2.1 1.4 1.4-2.1 2.1z"/></svg><em id="timeL">กลางวัน</em></button>

  </div>
  <div id="hint">ลากเพื่อเลื่อนแมพ · ล้อเมาส์ / บีบนิ้ว ซูม · WASD เลื่อน · C มุมกล้อง · N เวลา</div>

</div>

<script src="vendor/threejs/three.min.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const qi = (k, lo, hi, d) => { const v = parseInt(Q.get(k), 10); return isNaN(v) ? d : Math.max(lo, Math.min(hi, v)); };
const V3 = THREE.Vector3, D2R = Math.PI / 180, $ = id => document.getElementById(id);
const CAMS = [ { n: 'A · ต่ำ 30°', p: 30, y: 45 }, { n: 'B · 45°', p: 45, y: 45 }, { n: 'C · สูง 60°', p: 60, y: 45 }, { n: 'D · ตรง 40°', p: 40, y: 0 } ];
let camI = qi('cam', 0, 3, 1), timeI = qi('t', 0, 2, 0), OUTL = Q.get('ol') !== '0';
const SEED = qi('seed', 1, 1e9, 11);
const U = .125, T = 1 / U;                 // world units per render pixel (8 px per unit)
const TS = 2, NT = 180, MAPW = NT * TS, HM = MAPW / 2, LH = 2.2;   // 2-unit tiles, 360 x 360 units, 2.2 units per terrace
const VX = 0, VZ = 10, VR = 40;            // village centre and its flat radius
const SSTEP = [1, 1.5, 2, 3, 4, 5, 6];

function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function noise2(seed) {
  const r = rng(seed), P = new Float32Array(65536); for (let i = 0; i < 65536; i++) P[i] = r();
  return (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const g = (a, b) => P[((b & 255) << 8) | (a & 255)]; const a = g(xi, yi), b = g(xi + 1, yi), c = g(xi, yi + 1), d = g(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
}
const N1 = noise2(SEED), N2 = noise2(SEED + 7), N3 = noise2(SEED + 13);
const fbm = (n, x, y) => n(x, y) * .55 + n(x * 2.03 + 17, y * 2.03 + 5) * .28 + n(x * 4.1 + 3, y * 4.1 + 29) * .17;
function mkC(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// ---------- renderer + outline pass (same as kaiju.html)
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1200);
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postM = new THREE.ShaderMaterial({
  uniforms: { tC: { value: null }, tD: { value: null }, res: { value: new THREE.Vector2(1, 1) }, nf: { value: new THREE.Vector2(1, 1200) }, thr: { value: .7 }, ol: { value: 1 },
              haze: { value: .2 }, hazeC: { value: new THREE.Color(.78, .86, .96) }, sat: { value: 1.15 }, cool: { value: new THREE.Color(.9, .95, 1.1) }, warm: { value: new THREE.Color(1.07, 1.0, .9) } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform sampler2D tD; uniform vec2 res; uniform vec2 nf; uniform float thr; uniform float ol; uniform float haze; uniform vec3 hazeC; uniform float sat; uniform vec3 cool; uniform vec3 warm; varying vec2 vUv;
    float D(vec2 o){ return nf.x + texture2D(tD, vUv + o / res).r * (nf.y - nf.x); }
    void main(){
      vec3 c = texture2D(tC, vUv).rgb;
      float d = D(vec2(0.));
      if (ol > .5) {
        float m = max(max(d - D(vec2(1., 0.)), d - D(vec2(-1., 0.))), max(d - D(vec2(0., 1.)), d - D(vec2(0., -1.))));
        if (m > thr) c = c * .4 + vec3(.05, .03, .02);
        else if (D(vec2(0., 1.)) - d > thr) c = min(c * 1.18 + .04, vec3(1.));
      }
      float l = dot(c, vec3(.299, .587, .114));
      c = mix(vec3(l), c, sat);                                         // richer colours
      c *= mix(cool, warm, smoothstep(.18, .75, l));                    // cool shadows, warm lights
      float dc = nf.x + texture2D(tD, vec2(.5)).r * (nf.y - nf.x);
      c = mix(c, hazeC, smoothstep(dc + 15., dc + 190., d) * haze);    // haze on far land
      vec2 q = vUv - .5; c *= 1. - .35 * dot(q, q);                     // soft vignette
      gl_FragColor = vec4(c, 1.);
    }`, depthTest: false, depthWrite: false });
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postM));
let S = 2, zS = 0, rw = 2, rh = 2, rt = null, pitch = 0, yaw = 0;
const R = new V3(), F = new V3(), UPV = new V3(), TOC = new V3();
function layout() {
  const dpr = window.devicePixelRatio || 1, dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  S = zS || 2;
  const fit = () => { rh = Math.ceil(dh / S); rh += rh & 1; rw = Math.ceil(dw / S); rw += rw & 1; };
  fit(); while (rw * rh > 1400000 && S < 6) { S = SSTEP[Math.min(SSTEP.length - 1, SSTEP.indexOf(S) + 1)]; fit(); }
  zS = S;
  renderer.setSize(rw, rh, false);
  const cw = rw * S / dpr, ch = rh * S / dpr;
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: ((innerWidth - cw) / 2) + 'px', top: ((innerHeight - ch) / 2) + 'px' });
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  rt = new THREE.WebGLRenderTarget(rw, rh, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  rt.texture.generateMipmaps = false; rt.depthTexture = new THREE.DepthTexture(rw, rh); rt.depthTexture.type = THREE.UnsignedIntType;
  postM.uniforms.tC.value = rt.texture; postM.uniforms.tD.value = rt.depthTexture; postM.uniforms.res.value.set(rw, rh);
  cam.left = -rw / 2 * U; cam.right = rw / 2 * U; cam.top = rh / 2 * U; cam.bottom = -rh / 2 * U; cam.updateProjectionMatrix();
  postM.uniforms.nf.value.set(cam.near, cam.far);
}
function setCam(i) {
  camI = (i + CAMS.length) % CAMS.length; const c = CAMS[camI]; pitch = c.p * D2R; yaw = c.y * D2R;
  TOC.set(Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw));
  R.set(Math.cos(yaw), 0, -Math.sin(yaw)); F.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  UPV.set(-Math.sin(pitch) * Math.sin(yaw), Math.cos(pitch), -Math.sin(pitch) * Math.cos(yaw)); cam.up.copy(UPV);
  postM.uniforms.thr.value = .7;
  $('camL').textContent = 'ABCD'[camI]; if (TB.ready) say('มุมกล้อง ' + c.n, 1100);
}

// ---------- lights + time of day
const hemi = new THREE.HemisphereLight(0xb8d4ff, 0x7a6a58, .56); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, .52); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -100, right: 100, top: 100, bottom: -100, near: 1, far: 500 }); sun.shadow.bias = -.0005; sun.shadow.normalBias = .05;
scene.add(sun); scene.add(sun.target);
const SUNDIR = new V3(-50, 100, 70).normalize();
const TIMES = [
  { n: 'กลางวัน', sky: 0xb8d4ff, gnd: 0x7a6a58, hi: .56, sc: 0xffe6bc, si: .66, bg: 0x6aa84f, fire: .0, water: 1, haze: .22, hz: [.8, .88, .98], sat: 1.15, cool: [.88, .95, 1.12], warm: [1.07, 1.0, .9], cloud: .2 },
  { n: 'เย็น', sky: 0xffb890, gnd: 0x5a3a5a, hi: .5, sc: 0xffa050, si: .62, bg: 0x6a7a4a, fire: .6, water: .85, haze: .3, hz: [1, .7, .55], sat: 1.12, cool: [.86, .86, 1.12], warm: [1.12, .98, .82], cloud: .16 },
  { n: 'กลางคืน', sky: 0x4a5a9a, gnd: 0x20203a, hi: .34, sc: 0x9ab0ff, si: .16, bg: 0x1a2a3a, fire: 2.2, water: .5, haze: .35, hz: [.08, .1, .2], sat: .95, cool: [.85, .92, 1.2], warm: [1.12, 1.0, .85], cloud: 0 },
];
const FIRES = [];   // {x, y, z, light, big}
function setTime(i) {
  timeI = (i + TIMES.length) % TIMES.length; const t = TIMES[timeI];
  hemi.color.set(t.sky); hemi.groundColor.set(t.gnd); hemi.intensity = t.hi; sun.color.set(t.sc); sun.intensity = t.si;
  scene.background = new THREE.Color(t.bg);
  if (timeI === 1) SUNDIR.set(-80, 45, 60).normalize(); else if (timeI === 2) SUNDIR.set(40, 90, -60).normalize(); else SUNDIR.set(-50, 100, 70).normalize();
  for (const f of FIRES) if (f.light) f.light.intensity = t.fire * (f.big ? 1.6 : 1);
  if (waterM) waterM.uniforms.k.value = t.water;
  const u = postM.uniforms; u.haze.value = t.haze; u.hazeC.value.setRGB(...t.hz); u.sat.value = t.sat; u.cool.value.setRGB(...t.cool); u.warm.value.setRGB(...t.warm); CLOUD.k.value = t.cloud;
  $('timeL').textContent = t.n; if (TB.ready) say(t.n, 1000);
}

// ---------- terrain: terraces from seeded noise
const LV = new Int8Array(NT * NT), KIND = new Uint8Array(NT * NT);   // KIND: 0 water, 1 sand, 2 grass, 3 forest, 4 rock, 5 snow, 6 dirt
const tIdx = (i, j) => j * NT + i;
const riverX = z => 52 * Math.sin(z / 64 + 1.1) + 16 * Math.sin(z / 23) + 74;
function tileY(i, j) { if (i < 0 || j < 0 || i >= NT || j >= NT) return -5; const l = LV[tIdx(i, j)]; return l < 0 ? -1.3 : l * LH; }
function groundY(x, z) { return tileY(Math.floor((x + HM) / TS), Math.floor((z + HM) / TS)); }
function kindAt(x, z) { const i = Math.floor((x + HM) / TS), j = Math.floor((z + HM) / TS); return (i < 0 || j < 0 || i >= NT || j >= NT) ? 0 : KIND[tIdx(i, j)]; }
const HUTS = [[0, 20, 'cone'], [40, 22, 'dome'], [80, 24, 'cone'], [120, 21, 'bone'], [160, 25, 'cone'], [200, 22, 'dome'], [240, 23, 'cone'], [290, 21, 'bone'], [330, 26, 'dome']];
function onPath(x, z) {   // footpaths from the fire to each hut and out of the east gate
  const ax = x - VX, az = z - VZ, d = Math.hypot(ax, az), a = (Math.atan2(az, ax) / D2R + 360) % 360;
  for (const [h, r] of HUTS) { const da = Math.abs(((a - h + 540) % 360) - 180); if (d < r && da * D2R * d < 1.6) return true; }
  return Math.abs(az) < 1.8 && ax > 0;
}
function genTerrain() {
  for (let j = 0; j < NT; j++) for (let i = 0; i < NT; i++) {
    const wx = -HM + (i + .5) * TS, wz = -HM + (j + .5) * TS;
    let e = fbm(N1, wx / 70 + 50, wz / 70 + 50);
    e += .6 * Math.max(0, (-wz - 30) / (HM - 30));                 // mountains to the north
    e -= .55 * Math.max(0, (wz - 105) / (HM - 105));               // sea to the south
    let lv = Math.floor((e - .3) * 9);
    const dv = Math.hypot(wx - VX, wz - VZ);
    if (dv < VR) lv = 1; else if (dv < VR + 12) lv = Math.round(1 + (lv - 1) * (dv - VR) / 12);
    if (wz < VZ - VR + 2 && wz > VZ - VR - 16 && Math.abs(wx - VX) < 30) lv = Math.max(lv, 4);   // the cliff with the cave, north of the village
    const dr = Math.abs(wx - riverX(wz)), rw2 = 5 + 2.5 * N2(wz / 20, 3);
    let water = e < .3 || (dr < rw2 && wz > -HM * .7);
    if (Math.hypot(wx + 92, wz - 38) < 20 + 6 * N2(wx / 12, wz / 12)) water = true;   // lake west of the village
    if (water) lv = -1;
    LV[tIdx(i, j)] = Math.max(-1, Math.min(7, lv));
  }
  // kinds
  for (let j = 0; j < NT; j++) for (let i = 0; i < NT; i++) {
    const k = tIdx(i, j), l = LV[k], wx = -HM + (i + .5) * TS, wz = -HM + (j + .5) * TS, dv = Math.hypot(wx - VX, wz - VZ);
    let nearW = false; for (let dy = -1; dy <= 1 && !nearW; dy++) for (let dx = -1; dx <= 1; dx++) { const ii = i + dx, jj = j + dy; if (ii >= 0 && jj >= 0 && ii < NT && jj < NT && LV[tIdx(ii, jj)] < 0) { nearW = true; break; } }
    let kind;
    if (l < 0) kind = 0;
    else if (l === 0 || (nearW && l <= 1 && dv > VR)) kind = 1;
    else if (dv < VR - 4 && (dv < 12 || onPath(wx, wz) || N2(wx / 9, wz / 9) > .74)) kind = 6;   // plaza, paths to the huts, a few worn patches
    else if (l >= 6) kind = 5;
    else if (l >= 4 || (l === 3 && N2(wx / 14 + 9, wz / 14) > .55)) kind = 4;
    else kind = fbm(N3, wx / 40, wz / 40) > .52 && dv > VR + 4 ? 3 : 2;
    KIND[k] = kind;
  }
}
const TOPC = [[86, 120, 110], [230, 208, 152], [108, 172, 74], [80, 146, 60], [138, 132, 128], [238, 242, 250], [176, 134, 90]];

  tower(VX - VR + 4, VZ + 20);
  // garden plots outside the fence (south-west), berry bushes
  const rows = [], plants = [];
  for (let k = 0; k < 6; k++) for (let q = 0; q < 2; q++) { const x = VX - 22 + q * 9, z = VZ + VR + 4 + k * 1.8; rows.push({ x, y: groundY(x, z), z, sx: 7, sy: .5, sz: .9 }); for (let p = 0; p < 6; p++) plants.push({ x: x - 3 + p * 1.2, y: groundY(x, z) + .4, z, s: .8 + r() * .4, g: r() }); }
  inst(new THREE.BoxGeometry(1, .6, 1).translate(0, .3, 0), L(0x8a5a32), rows, false);
  inst(new THREE.BoxGeometry(.6, .7, .6).translate(0, .35, 0), new THREE.MeshLambertMaterial(), plants, true, o => tmpC.setHSL(.28 + o.g * .06, .55, .32 + o.g * .1));
  // cave in the cliff north of the village, two torches
  let zc = VZ; while (groundY(VX, zc) < LH * 3 && zc > -HM + 4) zc -= .5;
  const cave = new THREE.Mesh(new THREE.BoxGeometry(7, 5, 1.2), new THREE.MeshBasicMaterial({ color: 0x0c0806 })); cave.position.set(VX, LH + 2.5, zc + .1); scene.add(cave);
  const arch = new THREE.Mesh(new THREE.BoxGeometry(9, 1.2, 1.6), L(0x6a6460)); arch.position.set(VX, LH + 5.4, zc + .3); arch.castShadow = true; scene.add(arch);
  torch(VX - 5, zc + 2.5); torch(VX + 5, zc + 2.5);
  // dock on the river bank nearest the village
  let dx = VX + 20; while (groundY(dx, VZ) >= 0 && dx < HM - 4) dx += .5;
  const dock = []; for (let k = 0; k < 7; k++) dock.push({ x: dx - 1 + k * 1.1, y: .2, z: VZ, sx: 1, sy: .3, sz: 4 });
  inst(new THREE.BoxGeometry(1, 1, 1), L(0x8a6238), dock, true);
  // blocky placeholder villagers (real ones = PixelLab 8-direction sprites later)
  const skin = [0xe0a878, 0xc88a5a, 0xa86e44], fur = [0x8a5a32, 0x6b4a2e, 0xb08050, 0x9a6a3a];
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group(), a = r() * 6.28, d = 6 + r() * 26, x = VX + Math.cos(a) * d, z = VZ + Math.sin(a) * d;
    addMesh(g, new THREE.BoxGeometry(.9, 1.2, .6), L(fur[i % 4]), 0, 1.1, 0);
    addMesh(g, new THREE.BoxGeometry(.7, .7, .7), L(skin[i % 3]), 0, 2.05, 0);
    addMesh(g, new THREE.BoxGeometry(.76, .3, .76), L(0x2a1a10), 0, 2.45, -.02);
    for (const s of [-.22, .22]) addMesh(g, new THREE.BoxGeometry(.3, .55, .3), L(skin[i % 3]), s, .28, 0);
    g.position.set(x, groundY(x, z), z); scene.add(g);
    villagers.push({ g, x, z, tx: x, tz: z, wait: r() * 3, sp: 2 + r() * 1.5, ph: r() * 6 });
  }
}
function updVillagers(dt) {
  for (const v of villagers) {
    if (v.wait > 0) { v.wait -= dt; continue; }
    const dx = v.tx - v.x, dz = v.tz - v.z, d = Math.hypot(dx, dz);
    if (d < .3) { v.wait = 1 + Math.random() * 4; const a = Math.random() * 6.28, rr = 6 + Math.random() * 26; v.tx = VX + Math.cos(a) * rr; v.tz = VZ + Math.sin(a) * rr; continue; }
    v.x += dx / d * v.sp * dt; v.z += dz / d * v.sp * dt; v.ph += dt * 10;
    v.g.position.set(v.x, groundY(v.x, v.z) + Math.abs(Math.sin(v.ph)) * .25, v.z); v.g.rotation.y = Math.atan2(dx, dz);
  }
}

// ---------- fire / smoke particles (square pixels, dithered fade)
const MAXP = 1600, pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3), pSize = new Float32Array(MAXP), pAl = new Float32Array(MAXP);
const pV = new Float32Array(MAXP * 3), pLife = new Float32Array(MAXP), pMax = new Float32Array(MAXP), pKind = new Uint8Array(MAXP), pS0 = new Float32Array(MAXP);
let pN = 0, pGeo;
function buildParticles() {
  pGeo = new THREE.BufferGeometry();
  for (const [n, a, k] of [['position', pPos, 3], ['pcol', pCol, 3], ['psize', pSize, 1], ['palpha', pAl, 1]]) pGeo.setAttribute(n, new THREE.BufferAttribute(a, k).setUsage(THREE.DynamicDrawUsage));
  const m = new THREE.ShaderMaterial({
    vertexShader: 'attribute vec3 pcol; attribute float psize; attribute float palpha; varying vec3 vC; varying float vA; void main(){ vC = pcol; vA = palpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_PointSize = palpha > .01 ? psize : 0.; }',
    fragmentShader: 'varying vec3 vC; varying float vA; float b2(vec2 a){ return mod(2. * a.x + 3. * a.y, 4.); } void main(){ vec2 p = floor(gl_FragCoord.xy); float th = (4. * b2(mod(p, 2.)) + b2(mod(floor(p * .5), 2.)) + .5) / 16.; if (vA < th) discard; gl_FragColor = vec4(vC, 1.); }',
    depthWrite: false });
  const pts = new THREE.Points(pGeo, m); pts.frustumCulled = false; pts.renderOrder = 6; scene.add(pts);
}
const FR = [[1, .95, .7], [1, .7, .25], [.95, .38, .12], [.45, .18, .1]];
function spawnP(x, y, z, vx, vy, vz, life, size, kind) { const i = pN; pN = (pN + 1) % MAXP; pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z; pV[i * 3] = vx; pV[i * 3 + 1] = vy; pV[i * 3 + 2] = vz; pLife[i] = pMax[i] = life; pS0[i] = size; pKind[i] = kind; pAl[i] = 1; }
function updParticles(dt) {
  const tt = TIMES[timeI];
  for (const f of FIRES) {
    const n = f.big ? 40 : f.torch ? 10 : 18;
    if (Math.random() < dt * n) spawnP(f.x + (Math.random() - .5) * (f.big ? 1.6 : .5), f.y, f.z + (Math.random() - .5) * (f.big ? 1.6 : .5), (Math.random() - .5), 3 + Math.random() * 3, (Math.random() - .5), .6 + Math.random() * .5, (f.big ? 4 : 3) + Math.random() * 2, 1);
    if (!f.torch && Math.random() < dt * (f.big ? 5 : 2)) spawnP(f.x, f.y + 2.5, f.z, (Math.random() - .5) * .6 + .5, 2.2 + Math.random(), (Math.random() - .5) * .6, 3 + Math.random() * 2, 6 + Math.random() * 4, 0);
    if (f.light && tt.fire > 0) f.light.intensity = tt.fire * (f.big ? 1.6 : 1) * (.85 + Math.random() * .3);
  }
  if (timeI === 2 && Math.random() < dt * 30) { const a = Math.random() * 6.28, rr = 8 + Math.random() * 70, x = camT.x + Math.cos(a) * rr, z = camT.z + Math.sin(a) * rr, k = kindAt(x, z); if (k === 2 || k === 3) spawnP(x, groundY(x, z) + 1 + Math.random() * 3, z, (Math.random() - .5) * 1.2, (Math.random() - .5) * .5, (Math.random() - .5) * 1.2, 3 + Math.random() * 3, 2.5, 2); }
  for (let i = 0; i < MAXP; i++) {
    if (pLife[i] <= 0) { pAl[i] = 0; continue; }
    pLife[i] -= dt; const k = 1 - pLife[i] / pMax[i];
    pPos[i * 3] += pV[i * 3] * dt; pPos[i * 3 + 1] += pV[i * 3 + 1] * dt; pPos[i * 3 + 2] += pV[i * 3 + 2] * dt;
    if (pKind[i] === 1) { const c = FR[Math.min(3, k * 4.2 | 0)]; pCol[i * 3] = c[0]; pCol[i * 3 + 1] = c[1]; pCol[i * 3 + 2] = c[2]; pSize[i] = pS0[i] * (1 - k * .5); pAl[i] = 1 - k * k; }
    else if (pKind[i] === 2) { pCol[i * 3] = .85; pCol[i * 3 + 1] = 1; pCol[i * 3 + 2] = .45; pSize[i] = pS0[i]; pAl[i] = Math.sin(k * Math.PI) * (.6 + .4 * Math.sin(pLife[i] * 9 + i)); }
    else { const g = timeI === 2 ? .35 : .78; pCol[i * 3] = g; pCol[i * 3 + 1] = g; pCol[i * 3 + 2] = g * 1.04; pSize[i] = pS0[i] * (1 + k * 1.5); pAl[i] = (1 - k) * .55; }
    if (pLife[i] <= 0) pAl[i] = 0;
  }
  for (const n of ['position', 'pcol', 'psize', 'palpha']) pGeo.attributes[n].needsUpdate = true;
}

// ---------- input: drag to pan, wheel / pinch to zoom, keys
const camT = new V3(VX, 0, VZ), keys = {}, ptrs = new Map(); let pinch0 = 0;
function zoomBy(d) { zS = SSTEP[Math.max(0, Math.min(SSTEP.length - 1, SSTEP.indexOf(S) + d))]; layout(); }
function pan(dxCss, dyCss) {
  const k = (window.devicePixelRatio || 1) / S * U;
  camT.addScaledVector(R, -dxCss * k).addScaledVector(F, dyCss * k / Math.sin(pitch));
  camT.x = Math.max(-HM + 20, Math.min(HM - 20, camT.x)); camT.z = Math.max(-HM + 20, Math.min(HM - 20, camT.z));
}
addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); } });
addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  if (ptrs.size === 1) pan(e.clientX - p.x, e.clientY - p.y);
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (d > pinch0 * 1.3) { zoomBy(1); pinch0 = d; } else if (d < pinch0 / 1.3) { zoomBy(-1); pinch0 = d; } }
});
const ptrEnd = e => ptrs.delete(e.pointerId);
addEventListener('pointerup', ptrEnd); addEventListener('pointercancel', ptrEnd);
addEventListener('contextmenu', e => e.preventDefault()); document.addEventListener('gesturestart', e => e.preventDefault());
let wheelT = 0; addEventListener('wheel', e => { const n = performance.now(); if (n - wheelT < 180) return; wheelT = n; zoomBy(e.deltaY > 0 ? -1 : 1); }, { passive: true });
addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (k === 'c') setCam(camI + 1); if (k === 'n') setTime(timeI + 1); if (k === 'q' || k === '-') zoomBy(-1); if (k === 'e' || k === '=' || k === '+') zoomBy(1); if (k === 'o') toggleOl(); if (k.startsWith('arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function btn(id, f) { const b = $(id); b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); b.classList.add('on'); f(); }); const up = () => b.classList.remove('on'); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up); }
btn('bCam', () => setCam(camI + 1)); btn('bZi', () => zoomBy(1)); btn('bZo', () => zoomBy(-1)); btn('bTime', () => setTime(timeI + 1)); btn('bOl', () => toggleOl());
function toggleOl() { OUTL = !OUTL; postM.uniforms.ol.value = OUTL ? 1 : 0; $('bOl').classList.toggle('off', !OUTL); }
addEventListener('resize', () => { if (TB.ready) { zS = 0; layout(); } });
let msgT = 0; function say(html, ms) { const m = $('msg'); m.innerHTML = html; m.style.opacity = 1; clearTimeout(msgT); msgT = setTimeout(() => { m.style.opacity = 0; }, ms); }

// ---------- loop
const CT = new V3();
function step(dt) {
  let kx = 0, ky = 0; if (keys.a || keys.arrowleft) kx--; if (keys.d || keys.arrowright) kx++; if (keys.w || keys.arrowup) ky--; if (keys.s || keys.arrowdown) ky++;
  if (kx || ky) pan(-kx * 420 * dt, -ky * 420 * dt);
  if (waterM) waterM.uniforms.t.value += dt; CLOUD.t.value += dt;
  updVillagers(dt); updParticles(dt);
}
function draw() {
  CT.set(camT.x, groundY(camT.x, camT.z) * .5, camT.z);
  const tr = CT.dot(R), tu = CT.dot(UPV);
  CT.addScaledVector(R, Math.round(tr / U) * U - tr).addScaledVector(UPV, Math.round(tu / U) * U - tu);
  cam.position.copy(CT).addScaledVector(TOC, 500); cam.lookAt(CT);
  // the sun's shadow box follows the view, moved in whole shadow texels so shadows do not crawl
  const tx = 200 / 2048, sx = Math.round(CT.x / tx) * tx, sz = Math.round(CT.z / tx) * tx;
  sun.target.position.set(sx, 0, sz); sun.position.set(sx + SUNDIR.x * 250, SUNDIR.y * 250, sz + SUNDIR.z * 250);
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
const TB = window.TB = { ready: false, hold: false, step, draw, setCam, setTime, zoomBy, camT, info: () => ({ rw, rh, S, cam: camI, time: timeI, ...TB.stats }) };
let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; if (!TB.hold) { step(dt); draw(); } requestAnimationFrame(frame); }
(async function init() {
  try {
    await new Promise(r => setTimeout(r, 30));
    const t0 = performance.now();
    genTerrain(); buildTerrain(); const st = buildNature(); buildVillage(); buildParticles();
    TB.stats = { ...st, buildMs: Math.round(performance.now() - t0), villagers: villagers.length };
    setCam(camI); setTime(timeI); layout();
    $('bOl').classList.toggle('off', !OUTL); postM.uniforms.ol.value = OUTL ? 1 : 0;
    $('load').remove(); TB.ready = true;
    say(matchMedia('(pointer: coarse)').matches ? 'ลากนิ้วเพื่อเลื่อนแมพ<small>บีบนิ้วซูม · ปุ่มบนขวา: มุมกล้อง / ซูม / เวลา</small>' : 'ลากเมาส์หรือ WASD เพื่อเลื่อนแมพ<small>ล้อเมาส์ซูม · C มุมกล้อง · N เวลา</small>', 4500);
    requestAnimationFrame(frame);
  } catch (err) { $('load').textContent = 'โหลดไม่สำเร็จ: ' + err.message; console.error(err); }
})();
</script>
