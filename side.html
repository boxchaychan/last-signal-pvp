<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>เกมด้านข้าง · ทดสอบ</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141f; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .pad { position: fixed; bottom: 18px; width: 74px; height: 74px; border-radius: 50%; border: 3px solid #ffffffaa; background: #ffffff22; color: #fff; font: 800 28px system-ui; display: grid; place-items: center; }
  #bl { left: 18px; } #br { left: 104px; } #bj { right: 22px; width: 88px; height: 88px; background: #5ad06a44; } #ba { right: 124px; background: #ff9a3044; } #ba { display: none; }
  #hint { position: fixed; left: 12px; top: 10px; color: #fff; font: 700 13px system-ui, sans-serif; text-shadow: 0 1px 3px #000; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="pad" id="bl">◀</div><div class="pad" id="br">▶</div><div class="pad" id="bj">⤒</div><div class="pad" id="ba">⚔</div>
<div id="hint">เดิน: A/D หรือ ◀ ▶ · กระโดด: Space / W / ⤒ (กดสองครั้ง = กระโดดสองชั้น) · ตี: J หรือ ⚔ (กดต่อ = คอมโบ 3 ท่า)</div>
<script>
'use strict';
// Side-view platformer test (owner 2026-11-14: "จะไปทำแบบเมเปิ้ลด้านข้าง", "สไตล์เมเปิ้ลนะ ไม่ใช้อันเก่า").
// Hero = the dagger girl, standard 1-credit pixel conversion (owner chose it over pro), her PixelLab run (8 frames, art/sidegame/dagger_run.png: cell 0 = stance,
// 1 = first step, 2-8 = the loop). Ground, platforms, background and tree = the side-view tests of 2026-11-11 (art/side/map30/).
// Everything is drawn in world pixels on a small canvas, then blown up by a whole number K so pixels stay square.
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const img = s => { const i = new Image(); i.src = s; return i; };
// ?hero=rabbit = the squat hooded rabbit with its PixelLab run (cells 128 x 96: 0 = stance, 1-8 = the loop; feet x 50, y 92); the dagger girl then stands nearby
// for size. &dust=1 = the run as PixelLab drew it, with dust puffs at the feet (default = puffs taken out by tools/art/hood_run_clean.py).
const QS = new URLSearchParams(location.search), RABBIT = QS.get('hero') === 'rabbit';
const HERO = RABBIT ? {img: img(QS.get('dust') === '1' ? 'art/sidegame/rabbit_run_dust.png' : 'art/sidegame/rabbit_run.png'), cw: 128, ch: 96, feet: [50, 92], loop: 8, fps: 16} : null;
// rabbit attack: 3-hit combo from the owner's second 12-frame sheet (tools/art/hood_attack_cut.py v2: frames lined up by the eyes so the body stays put,
// effects kept as drawn), cells 155 x 115, feet x 77 y 96. Each hit = 4 frames [ms each]; pressing again during a hit queues the next; the impact frame shakes the view.
// The first sheet (v1) is kept as art/sidegame/rabbit_attack_v1.png.
// Default = the fourth sheet (owner 2026-11-14 "อันนี้จะโอเคกว่า"): 16 frames with a dash, a spin and a jumping ground slam, cells 158 x 112, feet 80,96
// (frames keep the place the artist drew them in their cell, the drawn ground line is the floor). &atk=3 = the third sheet, &atk=2 = the second.
const ATK = !RABBIT ? null : QS.get('atk') === '2' ? {img: img('art/sidegame/rabbit_attack.png'), cw: 155, ch: 115, feet: [77, 96],
  hits: [{f: [0, 1, 2, 3], ms: [50, 80, 100, 130], hit: 2}, {f: [4, 5, 6, 7], ms: [80, 90, 100, 130], hit: 5}, {f: [8, 9, 10, 11], ms: [90, 80, 110, 150], hit: 10}]}
  : QS.get('atk') === '3' ? {img: img('art/sidegame/rabbit_attack3.png'), cw: 116, ch: 93, feet: [55, 86],
  hits: [{f: [0, 1, 2, 3], ms: [40, 50, 55, 110], hit: 3}, {f: [4, 5, 6, 7, 8, 9], ms: [50, 60, 60, 60, 60, 70], hit: 5}, {f: [10, 11, 12, 13, 14, 15], ms: [50, 90, 60, 60, 70, 80], hit: 11}]}
  : {img: img('art/sidegame/rabbit_attack4.png'), cw: 158, ch: 112, feet: [80, 96],
  hits: [{f: [0, 1, 2, 3, 4], ms: [40, 60, 100, 80, 70], hit: 2}, {f: [5, 6, 7, 8], ms: [60, 100, 80, 70], hit: 6}, {f: [9, 10, 11, 12, 13, 14, 15], ms: [70, 90, 60, 150, 80, 80, 90], hit: 12}]};
const A = {on: false, n: 0, t: 0, queued: false, shake: 0};
function attack() { if (!ATK) return; if (A.on) { A.queued = true; return; } A.on = true; A.n = 0; A.t = 0; A.queued = false; }
const RUN = img('art/sidegame/dagger_run.png'), BG = img('art/side/map30/bg.png'), TILES = img('art/side/map30/tiles_wang.png'), TREE = img('art/side/map30/tree.png');
const T = 32, CW = 168, CH = 132, FEET = [71, 127];   // run cells are 168 x 132 (room ahead for the daggers), feet at x 71, y 127
// the world: platforms [x, y, width in tiles, rows]; the first is the ground. One-way: you land on top, jump up through them.
const WORLD_W = 2400, GROUND = 600, GRASS = 17;   // the top row of a ground tile is empty for 17 px above the grass
const PLAT = [[-64, GROUND, 80, 4], [260, GROUND - 150, 6, 2], [560, GROUND - 280, 5, 2], [900, GROUND - 170, 7, 2], [1260, GROUND - 320, 6, 2], [1640, GROUND - 200, 6, 2], [1980, GROUND - 330, 5, 2]];
const P = {x: 120, y: GROUND, vx: 0, vy: 0, face: 1, ground: true, jumps: 0, t: 0, run: 0};
const keys = {}, touch = {l: 0, r: 0};
let K = 2, VW = 0, VH = 0, cam = {x: 0, y: 0}, DPR = 1, view = null;
// the view is about 400 world px tall, so the hero (~110 px) is a quarter of the screen
function resize() { DPR = Math.min(3, devicePixelRatio || 1); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; K = Math.max(1, Math.round(cv.height / 400)); VW = Math.ceil(cv.width / K); VH = Math.ceil(cv.height / K);
  view = document.createElement('canvas'); view.width = VW; view.height = VH; }
addEventListener('resize', resize); resize();
addEventListener('keydown', e => { keys[e.code] = 1; if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp') && !e.repeat) jump(); if ((e.code === 'KeyJ' || e.code === 'KeyK') && !e.repeat) attack(); });
addEventListener('keyup', e => { keys[e.code] = 0; });
const hold = (id, k) => { const el = document.getElementById(id); el.addEventListener('pointerdown', e => { touch[k] = 1; el.setPointerCapture(e.pointerId); e.preventDefault(); }); const up = () => touch[k] = 0; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); };
hold('bl', 'l'); hold('br', 'r'); if (ATK) { const b = document.getElementById('ba'); b.style.display = 'grid'; b.addEventListener('pointerdown', e => { attack(); e.preventDefault(); }); } document.getElementById('bj').addEventListener('pointerdown', e => { jump(); e.preventDefault(); });
function jump() { if (P.ground || P.jumps < 2) { P.vy = P.ground ? -560 : -480; P.ground = false; P.jumps++; } }
function step(dt) {
  const dir = (keys.KeyD || keys.ArrowRight || touch.r ? 1 : 0) - (keys.KeyA || keys.ArrowLeft || touch.l ? 1 : 0), MAX = 230;
  if (A.on) { const h = ATK.hits[A.n]; A.t += dt * 1000; const end = h.ms.reduce((a, b) => a + b, 0);
    if (A.t >= end) { if (A.queued && A.n < 2) { A.n++; A.t = 0; A.queued = false; } else A.on = false; } }
  A.shake = Math.max(0, A.shake - dt);
  const slow = A.on && P.ground ? .15 : 1;   // planted while swinging on the ground
  P.vx += (dir * MAX * slow - P.vx) * Math.min(1, dt * (P.ground ? 14 : 6)); if (dir && !A.on) P.face = dir;
  P.vy = Math.min(900, P.vy + 1500 * dt); const oy = P.y; P.x = Math.max(20, Math.min(WORLD_W - 20, P.x + P.vx * dt)); P.y += P.vy * dt; P.ground = false;
  if (P.vy >= 0) for (const [px, py, n] of PLAT) if (P.x > px + 4 && P.x < px + n * T - 4 && oy <= py + 1 && P.y >= py) { P.y = py; P.vy = 0; P.ground = true; P.jumps = 0; }
  P.run = P.ground && Math.abs(P.vx) > 30 ? P.run + dt : 0; P.t += dt;
  const tx = P.x - VW / 2, ty = P.y - VH * .62; cam.x += (tx - cam.x) * Math.min(1, dt * 6); cam.y += (ty - cam.y) * Math.min(1, dt * 4);
  cam.x = Math.max(0, Math.min(WORLD_W - VW, cam.x)); cam.y = Math.min(GROUND + 4 * T - VH, cam.y); }
function tile(g, c, r, x, y) { g.drawImage(TILES, c * T, r * T, T, T, x, y, T, T); }
function platform(g, x, y, n, rows) { for (let r = 0; r < rows; r++) for (let c = 0; c < n; c++) {
  const tc = c === 0 ? 0 : c === n - 1 ? 2 : 1, tr = r === 0 ? 0 : r === rows - 1 ? 2 : 1; if (tr === 1 && tc === 1 && (c + r) % 3 === 0) tile(g, 0, 3, x + c * T, y + r * T); else tile(g, tc, tr, x + c * T, y + r * T); } }
function draw() {
  const g = view.getContext('2d'); g.imageSmoothingEnabled = false;
  const sky = g.createLinearGradient(0, 0, 0, VH); sky.addColorStop(0, '#3a78c8'); sky.addColorStop(1, '#8cc4f0'); g.fillStyle = sky; g.fillRect(0, 0, VW, VH);
  if (BG.width) { const s = Math.max(2, Math.ceil(VH * .9 / BG.height)), bw = BG.width * s, by = GROUND - cam.y - BG.height * s + 40, off = -((cam.x * .35) % bw);   // the far landscape, slower than the ground
    for (let x = off - bw, i = 0; x < VW; x += bw, i++) { g.save(); if (i & 1) { g.translate(x + bw, 0); g.scale(-1, 1); g.drawImage(BG, 0, by, bw, BG.height * s); } else g.drawImage(BG, x, by, bw, BG.height * s); g.restore(); } }
  const sh = A.shake > 0 ? (Math.random() < .5 ? -2 : 2) : 0; g.save(); g.translate(-Math.round(cam.x) + sh, -Math.round(cam.y));
  if (TREE.width) g.drawImage(TREE, 1100, GROUND - GRASS - TREE.height + 14);
  for (const [x, y, n, r] of PLAT) platform(g, x, y - GRASS, n, r);   // tiles drawn up by GRASS so the visible grass top is the line feet stand on
  // the hero: stance when still, first step then the loop when running, a stride frame in the air
  let c = 0; if (!P.ground) c = P.vy < 0 ? 3 : 6; else if (P.run > 0) { const f = P.run * 14 | 0; c = f < 1 ? 1 : 2 + (f - 1) % 7; }
  const bob = !c && Math.sin(P.t * 3) > .6 ? 1 : 0, hx = Math.round(P.x), hy = Math.round(P.y);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(hx, hy, HERO ? 16 : 22, HERO ? 4 : 5, 0, 0, 7); g.fill();
  if (HERO) { if (RUN.width) { g.save(); g.translate(230, GROUND); g.drawImage(RUN, 0, 0, CW, CH, -FEET[0], -FEET[1], CW, CH); g.restore(); }   // the dagger girl standing, for size
    const h = HERO; let k = 0; if (!P.ground) k = P.vy < 0 ? 2 : 6; else if (P.run > 0) k = 1 + (P.run * h.fps | 0) % h.loop;
    if (A.on && ATK.img.width) { const H = ATK.hits[A.n]; let t = A.t, i = 0; while (i < H.f.length - 1 && t >= H.ms[i]) t -= H.ms[i++]; const fr = H.f[i];
      if (fr === H.hit && !A.hitDone) { A.shake = .09; A.hitDone = true; } if (fr !== H.hit) A.hitDone = false;
      g.save(); g.translate(hx, hy); g.scale(P.face, 1); g.drawImage(ATK.img, fr * ATK.cw, 0, ATK.cw, ATK.ch, -ATK.feet[0], -ATK.feet[1], ATK.cw, ATK.ch); g.restore(); }
    else if (h.img.width) { g.save(); g.translate(hx, hy + (k ? 0 : bob)); g.scale(P.face, 1); g.drawImage(h.img, k * h.cw, 0, h.cw, h.ch, -h.feet[0], -h.feet[1], h.cw, h.ch); g.restore(); } }
  else if (RUN.width) { g.save(); g.translate(hx, hy + bob); g.scale(P.face, 1); g.drawImage(RUN, c * CW, 0, CW, CH, -FEET[0], -FEET[1], CW, CH); g.restore(); }
  g.restore();
  ctx.imageSmoothingEnabled = false; ctx.drawImage(view, 0, 0, VW * K, VH * K); }
let last = 0; function frame(now) { const dt = Math.min(.05, (now - (last || now)) / 1000); last = now; step(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame); window.GM = {P, step, draw, jump, keys, attack, A};
setTimeout(() => document.getElementById('hint').style.opacity = 0, 7000);
</script>
</body>
</html>
