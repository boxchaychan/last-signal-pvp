<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ดูกระดูกโมเดล</title>
<style>html,body{margin:0;height:100%;background:#20242c;color:#eee;font:14px sans-serif;overflow:hidden}#ui{position:fixed;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px}button{background:#39414f;color:#fff;border:0;border-radius:6px;padding:6px 10px;font:inherit}button.on{background:#d0453a}</style>
</head><body><div id="ui"></div>
<script src="vendor/threejs/three.min.js"></script><script src="vendor/threejs/GLTFLoader.js"></script><script src="vendor/threejs/SkeletonUtils.js"></script>
<script>
/* rig check page: rigview.html?m=<skinned glb from tools/blender/hy3d_rig.py or tripo_rig.py>; plays every KayKit move on it (same re-bind as grind3d.html) */
const Q = new URLSearchParams(location.search), V3 = THREE.Vector3;
const R3 = new THREE.WebGLRenderer({ antialias: true }); R3.setPixelRatio(Math.min(2, devicePixelRatio)); document.body.appendChild(R3.domElement); R3.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x20242c); const cam = new THREE.PerspectiveCamera(30, 1, .1, 100);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(2, 4, 3); scene.add(sun);
const grid = new THREE.GridHelper(4, 20, 0x556070, 0x343a46); scene.add(grid);
function fit() { R3.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); } addEventListener('resize', fit); fit();
function rigTripo(gl, kscene, clips) {
  let J = null; const sms = []; gl.scene.traverse(o => { if (o.userData && o.userData.joints && !J) J = JSON.parse(o.userData.joints); if (o.isSkinnedMesh) sms.push(o); });
  const r = THREE.SkeletonUtils.clone(kscene); let ks = null; const bare = [];
  r.traverse(o => { if (o.isSkinnedMesh) { bare.push(o); ks = ks || o.skeleton; } }); bare.forEach(o => o.parent.remove(o)); r.updateMatrixWorld(true);
  const bone = {}, kw = {}, kq = {}, ksc = {}; for (const b of ks.bones) { bone[b.name] = b; kw[b.name] = new V3(); kq[b.name] = new THREE.Quaternion(); ksc[b.name] = new V3(); b.matrixWorld.decompose(kw[b.name], kq[b.name], ksc[b.name]); }
  const kkHips = bone.hips.position.clone(), k = J.hips[1] / kw.hips.y;
  const DIR = { hips: 'spine', spine: 'chest', chest: 'head', upperarml: 'lowerarml', lowerarml: 'wristl', wristl: 'handl', handl: 'handslotl', upperarmr: 'lowerarmr', lowerarmr: 'wristr', wristr: 'handr', handr: 'handslotr', upperlegl: 'lowerlegl', lowerlegl: 'footl', footl: 'toesl', upperlegr: 'lowerlegr', lowerlegr: 'footr', footr: 'toesr' };
  const R = {}, inv = new THREE.Matrix4(), W = new THREE.Matrix4();
  r.traverse(o => {   // each KayKit bone moved to HER joint, turned so it points where her limb points (KayKit clips then play unchanged)
    if (!o.isBone) return; const n = o.name, pn = o.parent && o.parent.isBone ? o.parent.name : null, rot = new THREE.Quaternion();
    if (DIR[n] && J[n] && J[DIR[n]]) rot.setFromUnitVectors(kw[DIR[n]].clone().sub(kw[n]).normalize(), new V3(...J[DIR[n]]).sub(new V3(...J[n])).normalize());
    else if (pn && n !== 'head') rot.copy(R[pn]);
    R[n] = rot; W.compose(J[n] ? new V3(...J[n]) : new V3(), rot.clone().multiply(kq[n]), ksc[n]);
    o.parent.updateMatrixWorld(); inv.copy(o.parent.matrixWorld).invert(); inv.multiply(W).decompose(o.position, o.quaternion, o.scale); o.updateMatrixWorld(true);
  });
  const src = sms[0].material, rmM = src.roughnessMap || src.metalnessMap || null;   // metal / roughness map from the rig (G rough, B metal): only shines with the environment light
  const m = new THREE.MeshStandardMaterial({ map: src.map || null, normalMap: src.normalMap || null, roughnessMap: rmM, metalnessMap: scene.environment ? rmM : null, roughness: rmM ? 1 : .72, metalness: rmM && scene.environment ? 1 : 0, envMapIntensity: +(Q.get('envi') || .55) });
  const skel = new THREE.Skeleton(ks.bones), meshes = {};
  for (const sm of sms) {
    const g = sm.geometry.clone(), names = sm.skeleton.bones.map(b => b.name), si = g.attributes.skinIndex, map = j => ks.bones.indexOf(bone[names[j]]);
    for (let i = 0; i < si.count; i++) si.setXYZW(i, map(si.getX(i)), map(si.getY(i)), map(si.getZ(i)), map(si.getW(i)));
    const me = new THREE.SkinnedMesh(g, m); me.name = sm.name; me.castShadow = true; me.frustumCulled = false; r.add(me); r.updateMatrixWorld(true); me.bind(skel, new THREE.Matrix4()); meshes[sm.name] = me;
  }
  const herHips = bone.hips.position.clone();
  const mine = clips.map(c => new THREE.AnimationClip(c.name, c.duration, c.tracks.filter(t => !/\.scale$/.test(t.name) && (!/\.position$/.test(t.name) || t.name === 'hips.position')).map(t => {
    if (t.name !== 'hips.position') return t; const v = t.values.slice();
    for (let i = 0; i < v.length; i += 3) { v[i] = herHips.x + (v[i] - kkHips.x) * k; v[i + 1] = herHips.y + (v[i + 1] - kkHips.y) * k; v[i + 2] = herHips.z + (v[i + 2] - kkHips.z) * k; }
    return new THREE.VectorKeyframeTrack(t.name, t.times, v);
  })));
  const body = meshes.body || Object.values(meshes)[0]; body.geometry.computeBoundingBox(); const bb = body.geometry.boundingBox;
  return { root: r, h: bb.max.y - bb.min.y, meshes, bone, mat: m, clips: mine, k };
}
const ld = new THREE.GLTFLoader(); let mixer = null, H = null, yaw = .5;
Promise.all([ld.loadAsync('art/tribe3d/people/Knight.glb'), ld.loadAsync(Q.get('m') || 'art/grind3d/hy3d_sword.glb'), ld.loadAsync('art/grind3d/hero_anims.glb')]).then(([KN, M, AN]) => {
  H = rigTripo(M, KN.scene, AN.animations); scene.add(H.root); mixer = new THREE.AnimationMixer(H.root); const s = 1 / H.h; H.root.scale.setScalar(s);
  const ui = document.getElementById('ui'); let cur = null;
  const play = c => { if (cur) cur.fadeOut(.15); cur = mixer.clipAction(c).reset().fadeIn(.15).play(); [...ui.children].forEach(b => b.classList.toggle('on', b.textContent === c.name)); };
  H.clips.forEach(c => { const b = document.createElement('button'); b.textContent = c.name; b.onclick = () => play(c); ui.appendChild(b); });
  const first = H.clips.find(c => /idle/i.test(c.name)) || H.clips[0]; if (Q.get('a')) play(H.clips.find(c => c.name === Q.get('a')) || first); else play(first); window.RV = { H, play };
});
let lx = null; addEventListener('pointerdown', e => lx = e.clientX); addEventListener('pointerup', () => lx = null); addEventListener('pointermove', e => { if (lx !== null) { yaw += (e.clientX - lx) * .01; lx = e.clientX; } });
const clock = new THREE.Clock(); (function loop() { requestAnimationFrame(loop); const dt = Math.min(.05, clock.getDelta()); if (mixer) mixer.update(dt); cam.position.set(Math.sin(yaw) * 3.4, 1.1, Math.cos(yaw) * 3.4); cam.lookAt(0, .5, 0); R3.render(scene, cam); })();
</script></body></html>
