     the game type comes later: horde survival or level grinding). Terrain = a height grid (plateaus, cliffs with rock bands, stairs, a river with waterfalls,
     an oasis), props built in code (palms, bushes, rocks, ruins, tents, flags), the KayKit ranger to walk round. Drawn small into a render target,
     outlined by a depth edge pass, blown up with hard pixels; orthographic camera at a fixed angle, snapped to whole texels, the canvas moved by the rest.
     Keys: WASD / arrows walk, P pixel on / off, + / - pixel size. Notes: last section of docs/action-game.md -->

    fragmentShader: `uniform float t; varying vec2 vUv; float h(float x){ return fract(sin(x * 91.7) * 4375.5); }
      void main(){ float col = floor(vUv.x * 10.), sp = .6 + h(col) * .8, s = fract(vUv.y * 2.5 + t * sp + h(col + 3.) * 5.); vec3 c = mix(vec3(.35, .78, .88), vec3(.92, 1., 1.), step(.62, s)); c = mix(c, vec3(1.), smoothstep(.15, 0., vUv.y) * .8); gl_FragColor = vec4(c, 1.); }` });
  for (const F of FALLS) { const [ax, az] = F.a, [bx, bz] = F.b, dx = bx - ax, dz = bz - az, top = F.hi * LH - .12, bot = F.lo * LH - .12, w = 2.1;

}

/* ---------- props built in code: palms, bushes, rocks, cacti, ruins, tents, flags (one merged geometry per kind, instanced) */
const M4 = (x, y, z, s = 1, ry = 0, rx = 0, rz = 0, sy) => new THREE.Matrix4().compose(new V3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new V3(s, sy || s, s));
function merge(list) {   /* [geometry, colour, matrix] -> one non-indexed geometry with vertex colours */

const VCM = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
function palm(seed) {   /* a curved ringed trunk + a crown of drooping fronds + coconuts */
  const r = rng(seed), list = [], lean = .5 + r() * .5, n = 8, hgt = 2.8 + r() * 1.2; let px = 0, py = 0;

      const g = new THREE.PlaneGeometry(w * 2, dl * 1.08).rotateX(-Math.PI / 2); const m = new THREE.Matrix4().compose(new V3((x + nx) / 2, (y + ny) / 2, (z + nz) / 2), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -a + Math.PI / 2, 0, 'YXZ')).multiply(new THREE.Quaternion().setFromAxisAngle(new V3(1, 0, 0), -pitch)), new V3(1, 1, 1));

  for (let i = 0; i < 3; i++) list.push([new THREE.SphereGeometry(.12, 6, 5), '#6a4a24', M4(cx + Math.cos(i * 2.1) * .16, cy - .12, Math.sin(i * 2.1) * .16)]);
  return merge(list); }
function bush(seed, big) { const r = rng(seed), list = [], n = big ? 7 : 4; for (let i = 0; i < n; i++) { const s = (big ? .42 : .3) * (.7 + r() * .6); list.push([new THREE.IcosahedronGeometry(s, 0), i % 3 === 0 ? '#4f8a3c' : i % 3 === 1 ? '#66a248' : '#7cb658', M4((r() - .5) * (big ? .9 : .5), s * .8 + r() * .2, (r() - .5) * (big ? .9 : .5), 1, r() * 6, r() * 6)]); } return merge(list); }
function rock(seed) { const r = rng(seed), list = []; for (let i = 0; i < 3; i++) { const s = .22 + r() * .25; list.push([new THREE.DodecahedronGeometry(s, 0), i ? '#c89064' : '#b07a52', M4((r() - .5) * .6, s * .6, (r() - .5) * .6, 1, r() * 6, r(), r(), s * 2.6 > .5 ? .75 : 1)]); } return merge(list); }
function cactus(seed) { const r = rng(seed), h = 1 + r() * .7, list = [[new THREE.CylinderGeometry(.14, .16, h, 7), '#5a9a44', M4(0, h / 2, 0)]];
  for (const sd of [-1, 1]) if (r() < .8) { const y = h * (.35 + r() * .3); list.push([new THREE.CylinderGeometry(.09, .09, .32, 6), '#5a9a44', M4(sd * .2, y, 0, 1, 0, 0, Math.PI / 2)], [new THREE.CylinderGeometry(.09, .09, .45, 6), '#64a84c', M4(sd * .34, y + .2, 0)]); } return merge(list); }
function ruin(seed) { const r = rng(seed), list = []; for (let i = 0; i < 4; i++) { const h = .5 + r() * 1.3; list.push([new THREE.BoxGeometry(.5, h, .5), i % 2 ? '#d6b48a' : '#c49e74', M4(i * .62 - .9, h / 2, (r() - .5) * .4, 1, (r() - .5) * .2)]); if (r() < .5) list.push([new THREE.BoxGeometry(.6, .16, .6), '#e2c49a', M4(i * .62 - .9, h + .08, 0)]); }
  list.push([new THREE.BoxGeometry(2.6, .14, .7), '#bf9870', M4(0, .07, .5)]); return merge(list); }
function tent() { return merge([[new THREE.ConeGeometry(1, 1.4, 4).rotateY(Math.PI / 4), '#e8d2b0', M4(0, .7, 0)], [new THREE.ConeGeometry(1.03, .3, 4).rotateY(Math.PI / 4), '#b4562c', M4(0, .15, 0)], [new THREE.BoxGeometry(.3, .5, .05), '#4a3020', M4(0, .25, .72)]]); }
function flag() { return merge([[new THREE.CylinderGeometry(.04, .05, 2.2, 5), '#e8e0d0', M4(0, 1.1, 0)], [new THREE.BoxGeometry(.7, .4, .03), '#e0302a', M4(.36, 1.95, 0)], [new THREE.CylinderGeometry(.18, .22, .14, 7), '#c8b49a', M4(0, .07, 0)]]); }
const PROPS = {}; const addProp = (kind, geo, x, z, s = 1, ry = R() * TAU) => { (PROPS[kind] = PROPS[kind] || { geo, m: [] }).m.push(M4(x, groundH(x, z), z, s, ry)); };
const freeCell = (x, z) => { const c = id(Math.floor(x), Math.floor(z)); return inb(Math.floor(x), Math.floor(z)) && K[c] !== 2 && STAIR[c] < 0 && Math.floor(groundH(x - .35, z - .35)) === Math.floor(groundH(x + .35, z + .35)); };
{ const PG = [palm(1), palm(2), palm(3)], BG = [bush(4, true), bush(5, false), bush(6, true)], RG = [rock(7), rock(8)], CG = cactus(9), RU = ruin(10);
  const palms = []; for (let i = 0, t = 0; i < 70 && t < 6000; t++) { const x = 1 + R() * (N - 2), z = 1 + R() * (N - 2), c = id(Math.floor(x), Math.floor(z)); if (!freeCell(x, z) || palms.some(p => Math.hypot(p[0] - x, p[1] - z) < 2.6)) continue;
    let wn = 99; for (let dz = -4; dz <= 4; dz++) for (let dx = -4; dx <= 4; dx++) if (inb(Math.floor(x) + dx, Math.floor(z) + dz) && K[id(Math.floor(x) + dx, Math.floor(z) + dz)] === 2) wn = Math.min(wn, Math.hypot(dx, dz));
    if ((K[c] === 1 && R() < .35) || (wn < 6 && R() < .15) || R() < .012) { addProp('palm' + (i % 3), PG[i % 3], x, z, .85 + R() * .4); palms.push([x, z]); i++; } }
  for (let i = 0, t = 0; i < 190 && t < 9000; t++) { const x = 1 + R() * (N - 2), z = 1 + R() * (N - 2), c = id(Math.floor(x), Math.floor(z)); if (!freeCell(x, z)) continue; if (K[c] === 1 || R() < .18) { addProp('bush' + (i % 3), BG[i % 3], x, z, .8 + R() * .5); i++; } }
  for (let i = 0, t = 0; i < 90 && t < 6000; t++) { const x = 1 + R() * (N - 2), z = 1 + R() * (N - 2); if (!freeCell(x, z)) continue; addProp('rock' + (i % 2), RG[i % 2], x, z, .8 + R() * .8); i++; }
  for (let i = 0, t = 0; i < 26 && t < 4000; t++) { const x = 1 + R() * (N - 2), z = 1 + R() * (N - 2), c = id(Math.floor(x), Math.floor(z)); if (!freeCell(x, z) || K[c] !== 0 || L[c] < 1) continue; addProp('cactus', CG, x, z, .9 + R() * .4); i++; }
  for (let i = 0, t = 0; i < 4 && t < 4000; t++) { const x = 3 + R() * (N - 6), z = 3 + R() * (N - 6); if (![[-1.3, 0], [1.3, 0], [0, .6], [0, -.4]].every(([a, b]) => freeCell(x + a, z + b))) continue; addProp('ruin', RU, x, z, 1, R() * .3); i++; }
  const camp = [N * .27 + 6.5, N * .66 - 1]; for (const [a, b, s] of [[0, 0, 1], [2.4, 1.2, .8]]) if (freeCell(camp[0] + a, camp[1] + b)) addProp('tent', tent(), camp[0] + a, camp[1] + b, s, -.4);
  for (let i = 0, t = 0; i < 6 && t < 4000; t++) { const x = 3 + R() * (N - 6), z = 3 + R() * (N - 6); if (!freeCell(x, z) || L[id(Math.floor(x), Math.floor(z))] < 1) continue; addProp('flag', flag(), x, z, 1, 0); i++; }
  for (const k in PROPS) { const P = PROPS[k], im = new THREE.InstancedMesh(P.geo, VCM, P.m.length); P.m.forEach((m, i) => im.setMatrixAt(i, m)); im.castShadow = true; im.receiveShadow = true; scene.add(im); }
}

/* ---------- the walker: the KayKit ranger (CC0) with KayKit moves */
const HERO = { x: N * .27 + 3, z: N * .66 + 6.5, y: 0, face: 0, mixer: null, acts: {}, cur: null, root: null, moving: false };
{ let best = null, bd = 1e9; for (let z = 2; z < N - 2; z++) for (let x = 2; x < N - 2; x++) { const c = id(x, z); if (K[c] !== 0 || STAIR[c] >= 0) continue; let open = true; for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) if (K[id(x + dx, z + dz)] !== 0 || L[id(x + dx, z + dz)] !== L[c]) open = false;
    const d = Math.hypot(x - (N * .27 + 9), z - (N * .66 + 1)); if (open && d < bd) { bd = d; best = [x + .5, z + .5]; } }
  if (best) [HERO.x, HERO.z] = best; HERO.y = groundH(HERO.x, HERO.z); CAM.look.set(HERO.x, HERO.y, HERO.z); }
const ld = new THREE.GLTFLoader();
Promise.all([ld.loadAsync('art/tribe3d/people/Ranger.glb'), ld.loadAsync('art/tribe3d/people/anims.glb'), ld.loadAsync('art/tribe3d/people/weapons.glb')]).then(([g, A, W]) => {
  const r = g.scene; r.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; if (o.material.metalness !== undefined) { o.material.metalness = 0; o.material.roughness = .85; } } });
  const bow = W.scene.children.find(c => c.name === 'bow_withString'); let hand = null; r.traverse(o => { if (o.name === 'handslotl' && !hand) hand = o; }); if (bow && hand) { const b = bow.clone(); b.traverse(o => { if (o.isMesh) o.castShadow = true; }); hand.add(b); }
  const bb = new THREE.Box3().setFromObject(r); r.scale.setScalar(1.05 / (bb.max.y - bb.min.y)); scene.add(r); HERO.root = r; HERO.mixer = new THREE.AnimationMixer(r);
  for (const c of A.animations) { for (const t of c.tracks) t.name = t.name.replace(/^([A-Za-z]+)_\d+\./, '$1.'); HERO.acts[c.name] = HERO.mixer.clipAction(c); } hplay('Idle'); });
function hplay(n) { const a = HERO.acts[n]; if (!a || HERO.cur === a) return; a.reset().play(); if (HERO.cur) { HERO.cur.fadeOut(.15); a.fadeIn(.15); } HERO.cur = a; }
const KEYS = {}; addEventListener('keydown', e => { KEYS[e.code] = true; if (e.code === 'KeyP') { PX.on = !PX.on; resize(); } if (e.code === 'Equal' || e.code === 'NumpadAdd') { PX.size = Math.max(120, PX.size - 30); resize(); } if (e.code === 'Minus' || e.code === 'NumpadSubtract') { PX.size = Math.min(420, PX.size + 30); resize(); } });

const JOY = { on: false, x0: 0, y0: 0, x: 0, y: 0 };
uic.addEventListener('pointerdown', e => { JOY.on = true; JOY.x0 = JOY.x = e.clientX; JOY.y0 = JOY.y = e.clientY; }); addEventListener('pointermove', e => { if (JOY.on) { JOY.x = e.clientX; JOY.y = e.clientY; } }); addEventListener('pointerup', () => { JOY.on = false; });
function updHero(dt) {

  if (JOY.on) { const dx = JOY.x - JOY.x0, dy = JOY.y - JOY.y0, l = Math.hypot(dx, dy); if (l > 8) { ix = dx / Math.max(l, 50); iy = dy / Math.max(l, 50); } }

    const fx = -Math.sin(YAW), fz = -Math.cos(YAW), rx = Math.cos(YAW), rz = -Math.sin(YAW), mx = rx * ix - fx * iy, mz = rz * ix - fz * iy, sp = 3.4 * dt;   /* screen up = away from the camera */

      const nh = groundH(nx, nz); if (Math.abs(nh - groundH(HERO.x, HERO.z)) > .35) continue; HERO.x = nx; HERO.z = nz; break; }

}

/* ---------- camera: orthographic at a fixed angle, follows the walker, snapped to whole texels; the canvas moves by the rest */
const _r = new V3(), _u = new V3();
function updCam(dt) {
  const T = new V3(clamp(HERO.x, 9, N - 9), HERO.y + .5, clamp(HERO.z, 7, N - 5)); CAM.look.lerp(T, 1 - Math.exp(-dt * 5));

}

/* ---------- the overlay: a small title, the keys, the joystick */
function drawUI() { ui.setTransform(DPR, 0, 0, DPR, 0, 0); ui.clearRect(0, 0, SW, SH); if (Q.get('noui') === '1') return;
  ui.font = '700 15px sans-serif'; ui.textAlign = 'left'; ui.lineWidth = 4; ui.strokeStyle = 'rgba(40,20,10,.8)'; ui.fillStyle = '#fff6e0'; const t = 'แมพพิกเซล  ·  ' + (PX.on ? 'พิกเซล ' + PX.size : 'ภาพปกติ') + (TOUCH ? '  ·  ลากนิ้วเพื่อเดิน' : '  ·  WASD เดิน  P สลับ  +/- ขนาดเม็ด');

  if (JOY.on) { ui.globalAlpha = .4; ui.beginPath(); ui.arc(JOY.x0, JOY.y0, 46, 0, TAU); ui.fillStyle = '#fff'; ui.fill(); ui.globalAlpha = .8; ui.beginPath(); ui.arc(clamp(JOY.x, JOY.x0 - 46, JOY.x0 + 46), clamp(JOY.y, JOY.y0 - 46, JOY.y0 + 46), 20, 0, TAU); ui.fill(); ui.globalAlpha = 1; } }

/* ---------- glows: foam at the waterfalls, dust motes */
const FOAM = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false }));
{ const p = []; for (const F of FALLS) for (let i = 0; i < 40; i++) p.push(F.foam[0] + (Math.random() - .5) * 2, F.foam[1] + Math.random() * .3, F.foam[2] + (Math.random() - .5) * 1); FOAM.geometry.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); scene.add(FOAM); }

const clock = new THREE.Clock(); let RT = 0;
function frame() {
  requestAnimationFrame(frame); const dt = Math.min(.05, clock.getDelta()); RT += dt; TIMEU.value = RT;
  updHero(dt); updCam(dt);
  { const P = FOAM.geometry.attributes.position; if (P) { for (let i = 0; i < P.count; i++) { let y = P.getY(i) + dt * .6; const F = FALLS[Math.floor(i / 40)]; if (y > F.foam[1] + .5) y = F.foam[1]; P.setY(i, y); } P.needsUpdate = true; } }
  if (PX.on) { renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null); postMat.uniforms.edge.value = .5 / 300; renderer.render(postScene, postCam); }

window.MAP = { N, L, K, STAIR, FALLS, RIVER, HERO, PX, CAM, scene, camera, renderer };
