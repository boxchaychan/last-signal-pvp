  for (let i = 0; i < 9; i++) { const a = t * .7 + i * .7, px = Math.cos(a) * (W / 2 + 6), py = Math.sin(a * 1.3) * (H / 2 + 6); g.globalAlpha = .5 + .5 * Math.sin(t * 5 + i); g.fillStyle = '#fff6c8'; g.beginPath(); for (let k = 0; k < 8; k++) { const r = k % 2 ? .8 : 3.5, b = k * Math.PI / 4; g.lineTo(px + Math.cos(b) * r, py + Math.sin(b) * r); } g.fill(); } g.globalAlpha = 1;
}
function frame(now) { t = now / 1000; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
