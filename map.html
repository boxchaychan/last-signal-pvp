<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>แมพ 1 ลองเดิน</title>
<style>
  html, body { margin: 0; height: 100%; background: #10140c; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #hint { position: fixed; left: 12px; top: 10px; color: #f4ecd0; font: 600 14px/1.4 system-ui, sans-serif; text-shadow: 0 1px 2px #000; pointer-events: none; transition: opacity 1s; }
  #fs { position: fixed; right: 10px; top: 10px; width: 40px; height: 40px; border: 2px solid #f4ecd088; border-radius: 8px; background: #0008; color: #f4ecd0; font-size: 20px; }
  #atk { position: fixed; right: 22px; bottom: 22px; width: 84px; height: 84px; border-radius: 50%; border: 3px solid #f4ecd0aa; background: #c8402a88; color: #fff; font-size: 34px; }
  #spin, #roll { position: fixed; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #f4ecd0aa; color: #fff; font-size: 24px; }
  #spin { right: 118px; bottom: 26px; background: #2a78c888; } #roll { right: 34px; bottom: 118px; background: #5a9a3a88; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #f4ecd0; font: 600 18px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">เดิน: WASD / ลูกศร · ฟัน: J / Space (กดย้ำ = คอมโบ) · หมุนฟัน: K · กลิ้งหลบ: L / Shift · มือถือ: ลากนิ้วเดิน ปุ่ม ⚔ 🌀 💨</div>
<button id="fs" title="เต็มจอ">⛶</button>
<button id="atk" title="ฟัน">⚔</button><button id="spin" title="หมุนฟัน">🌀</button><button id="roll" title="กลิ้งหลบ">💨</button>
<div id="load">กำลังโหลดแมพ…</div>
<script>
// Map 1 walk test (owner 2026-11-11 "แมพเอาให้เสร็จก่อน1แมพละฉันจะลองเดินดู"). Assets from tools/art/td_map.py (art/td/map1/):
// everything is at map size (1 map px = 1 screen px on a landscape phone) and blown up by a whole number K, so pixels stay square.
// 2026-11-13: three joined maps (td1 forest -> td2 autumn river -> td3 ruined graveyard, stronger monsters). ?map=td3 starts on a map;
// walking into an `exits` box of map.json loads the next map and puts the hero on its `entries[<map he came from>]`.
const MAPS = {td1: {dir: 'art/td/map1/', name: 'ป่าเนินผา'}, td2: {dir: 'art/td/map2/', name: 'ป่าใบไม้แดง'}, td3: {dir: 'art/td/map3/', name: 'สุสานซากหิน'}};
let MAPID = new URLSearchParams(location.search).get('map'); if (!MAPS[MAPID]) MAPID = 'td1';
const A = 'art/td/map1/', cv = document.getElementById('cv'), ctx = cv.getContext('2d');   // the hero sheets live in map 1's folder
const img = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = s; });
let TRV = null, BAN = 0;                             // travelling to another map (fade), the map-name banner
let M, GR, PR, HR = {}, MB = {}, MBW = {}, BLK, BW, BH, K = 1, VW = 0, VH = 0;
const P = {x: 0, y: 0, d: 1, mv: 0, t: 0}, keys = {}, joy = {id: null, x0: 0, y0: 0, x: 0, y: 0};
let mobs = [], cam = {x: 0, y: 0}, dbg = /dbg/.test(location.search), VIG;
// ---- combat (owner 2026-11-13 "เอาทำลงในเกมให้ครบ"): the chibi swordsman's PixelLab combo (art/poses/combo/chibi_pl.png, cell 10+n = combo frame n)
// 4 chained hits, same timing table as combo.html; monsters have HP, get knocked back, flash, die, give XP and come back after a while.
const CF = l => l.map(x => ({f: 10 + x[0], t: x[1]}));
let CSTEP = [
  {f: CF([[3, .04], [4, .04], [5, .05], [6, .07], [7, .08]]), hit: 3, dmg: 10, lunge: 16, kb: 70, stop: .05, rx: 58, ry: 26},
  {f: CF([[13, .04], [14, .06], [15, .05], [16, .08]]), hit: 1, dmg: 12, lunge: 14, kb: 80, stop: .05, rx: 56, ry: 28},
  {f: CF([[17, .04], [18, .04], [19, .06], [20, .08], [21, .08]]), hit: 2, dmg: 16, lunge: 12, kb: 100, stop: .07, rx: 52, ry: 30},
  {f: CF([[28, .04], [29, .04], [30, .05], [31, .08], [32, .1]]), hit: 3, dmg: 32, lunge: 22, kb: 210, stop: .12, rx: 64, ry: 30, big: 1}];
let CEND = CF([[33, .06], [35, .06], [36, .06], [38, .06], [40, .06]]);
const MHP0 = {wolf: 34, shroom: 22, skeleton: 46, boar_guard: 80, goblin_archer: 30, golem: 130, wisp: 20};
let MHP = MHP0;                                     // this map's monster HP (map.json `hpk` makes a zone stronger)
const NUM = [], FXS = []; let HS = 0, SHK = 0, BUF = 0;
const ST = {lv: 1, xp: 0, kills: 0, combo: 0, ct: 0, up: 0};
const need = () => 20 + ST.lv * 15;
function attack() { BUF = .3; }
const HPMAX = () => 100 + (ST.lv - 1) * 15, CD = {spin: 0, roll: 0};
function act(k) { if (P.dead || P.act || !(CHB && CHB.run)) return; if (CD[k] > 0) return; if (k === 'spin' && P.atk && !P.atk.end) return; P.atk = null; BUF = 0; P.act = {k, t: 0, h: 0}; CD[k] = k === 'spin' ? 5 : 1.1; if (k === 'roll') P.inv = .45; }
function spinHit(big) { let any = 0; const dm = Math.round(22 * (1 + (ST.lv - 1) * .12));
  for (const m of mobs) { if (m.dead || m.gone) continue; const dx = m.x - P.x, dy = (m.y - P.y) * 1.6, d = Math.hypot(dx, dy); if (d < 78) { any = 1; m.hp -= dm; m.fl = .12; m.vx = dx / (d || 1) * (big ? 220 : 90); m.vy = dy / (d || 1) * (big ? 130 : 50); m.ag = 6;
    NUM.push({x: m.x, y: m.y - M.mobs[m.k].h, v: dm, t: 0, big}); for (let k = 0; k < 6; k++) FXS.push({x: m.x, y: m.y - M.mobs[m.k].h * .5, vx: (Math.random() - .5) * 200, vy: -Math.random() * 130, t: 0, c: '#bfe9ff'}); if (m.hp <= 0) kill(m); } }
  FXS.push({ring: 1, x: P.x, y: P.y, t: 0, big: 1}); if (any) { HS = big ? .1 : .05; SHK = big ? 5 : 3; ST.combo++; ST.ct = 1.5; } }
function kill(m) { m.dead = .35; m.re = 6; ST.kills++; const xp = Math.ceil(MHP[m.k] / 8); ST.xp += xp; NUM.push({x: m.x, y: m.y - 6, v: '+' + xp + ' XP', t: -.15, xp: 1}); while (ST.xp >= need()) { ST.xp -= need(); ST.lv++; ST.up = 1.6; P.hp = HPMAX(); } }
function hurtHero(d) { if (P.dead || P.inv > 0) return; P.hp -= d; P.inv = .6; SHK = 3; NUM.push({x: P.x, y: P.y - 66, v: '-' + d, t: 0, red: 1}); if (P.hp <= 0) { P.hp = 0; P.dead = 2.4; P.atk = P.act = null; } else if (!P.act) { P.atk = null; P.act = {k: 'hurt', t: 0}; } }
function startAtk(n, v) { P.atk = {n, i: 0, t: 0, hit: 0, end: 0, v: v || ''}; }
const CG = (c0, l) => l.map(x => ({f: c0 + x[0], t: x[1]}));   // up / down swings (PixelLab slash_n / slash_s, cells 140+ / 160+ of chibi_pl.png): 2 chained hits each
const CV = {n: {st: [{f: CG(140, [[1, .04], [2, .05], [3, .06], [4, .07], [5, .07]]), hit: 2, dmg: 12, lunge: 14, kb: 80, stop: .05, rx: 58, ry: 34},
    {f: CG(140, [[9, .04], [10, .05], [11, .05], [12, .09], [13, .08]]), hit: 3, dmg: 28, lunge: 18, kb: 190, stop: .1, rx: 66, ry: 30, big: 1}], en: CG(140, [[14, .06], [15, .06], [16, .06]])},
  s: {st: [{f: CG(160, [[1, .04], [2, .05], [3, .06], [4, .07], [5, .07]]), hit: 2, dmg: 12, lunge: 14, kb: 80, stop: .05, rx: 58, ry: 34},
    {f: CG(160, [[8, .04], [9, .05], [10, .05], [11, .1], [13, .08]]), hit: 3, dmg: 28, lunge: 18, kb: 190, stop: .1, rx: 66, ry: 30, big: 1}], en: CG(160, [[14, .06], [15, .06], [16, .06]])}};
const atkV = (ix, iy) => !CV || (CHB && CHB.noV) ? '' : Math.abs(iy) > .5 && Math.abs(ix) < .35 ? (iy < 0 ? 'n' : 's') : Math.abs(ix) > .2 ? '' : P.d === 6 ? 'n' : P.d === 2 ? 's' : '';   // which way a new swing goes: up / down clips (CV) or the side combo
function doHit(s, v) {
  if (s.fx && SPR[s.fx[0]]) FXS.push({spr: s.fx[0], sc: s.fx[1], x: P.x + P.face * s.fx[2], y: P.y + s.fx[3], face: P.face, t: 0});
  let any = 0; const dm = Math.round(s.dmg * (1 + (ST.lv - 1) * .12)), vy = v === 'n' ? -1 : 1;
  for (const m of mobs) { if (m.dead) continue; const dx = v ? (m.y - P.y) * vy * 1.5 : (m.x - P.x) * P.face, dy = v ? (m.x - P.x) * .62 : m.y - P.y;   // up / down swings: the same box turned (the ground is seen from above, so depth counts 1.5x)
    if (dx > -14 && dx < s.rx && Math.abs(dy) < s.ry) { any = 1; m.hp -= dm; m.fl = .12; if (v) { m.vx = (m.x - P.x) * 1.5; m.vy = vy * s.kb * .7; } else { m.vx = P.face * s.kb; m.vy = dy * 1.5; } m.ag = 6;
      NUM.push({x: m.x, y: m.y - M.mobs[m.k].h, v: dm, t: 0, big: s.big});
      for (let k = 0; k < (s.big ? 9 : 5); k++) FXS.push({x: m.x, y: m.y - M.mobs[m.k].h * .5, vx: (Math.random() - .25) * 150 * P.face, vy: -Math.random() * 130, t: 0, c: s.big ? '#ffd24a' : '#eaf6ff'});
      if (m.hp <= 0) kill(m); } }
  if (any) { HS = s.stop; SHK = s.big ? 5 : 2; ST.combo++; ST.ct = 1.5; FXS.push({ring: 1, x: P.x + (v ? 0 : P.face * 30), y: P.y + (v ? (v === 'n' ? -22 : 22) : 0), t: 0, big: s.big}); }
}

function blocked(x, y) {
  if (x < 0 || y < 0 || x >= M.w || y >= M.h) return true;
  return BLK[((y / M.bk) | 0) * BW + ((x / M.bk) | 0)] > 0;
}
function free(x, y, r) { return !blocked(x, y) && !blocked(x - r, y) && !blocked(x + r, y) && !blocked(x, y - r * .5) && !blocked(x, y + r * .5); }
function move(o, dx, dy, r) {                      // slide along walls: x and y on their own
  if (dx && free(o.x + dx, o.y, r)) o.x += dx;
  if (dy && free(o.x, o.y + dy, r)) o.y += dy;
}
function resize() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  K = Math.max(1, Math.round(cv.height / 400)) * (typeof CHB !== 'undefined' && CHB && CHB.zoom || 1);
  if (typeof CHB !== 'undefined' && CHB && CHB.hp) K = 2 * (+new URLSearchParams(location.search).get('px') || (innerHeight < 500 ? Math.max(1, Math.round(cv.height / 640)) : Math.max(1, Math.round(cv.height / 1000))));   // wide view on a PC (hero ~1/8 of the screen), a bit closer on a phone   // chibi16: K = 2 x the screen pixels per hero pixel; default = hero about a fifth of the screen (wider view than zoom 2), &px=1..4 to choose   // ?hero=chibi128: the map twice as close     // about 400 map px tall on any screen, whole-number pixels
  VW = Math.ceil(cv.width / K); VH = Math.ceil(cv.height / K);
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; const g = c.getContext('2d');
  const gr = g.createRadialGradient(c.width / 2, c.height / 2, c.height * .35, c.width / 2, c.height / 2, Math.hypot(c.width, c.height) * .62);
  gr.addColorStop(0, 'rgba(10,14,6,0)'); gr.addColorStop(1, 'rgba(10,14,6,.55)'); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height); VIG = c;
}
addEventListener('resize', resize);

async function loadMap(id, from) {                   // everything of one map is loaded first, then swapped in at once
  const D = MAPS[id].dir, m = await fetch(D + 'map.json', {cache: 'no-cache'}).then(r => r.json());
  let gr, pr, blk, bw, bh; const mb = {}, mbw = {};
  const ld = [img(D + 'ground.png').then(i => gr = i), img(D + 'props.png').then(i => pr = i), img(D + 'block.png').then(i => {
    bw = i.width; bh = i.height; const c = document.createElement('canvas'); c.width = bw; c.height = bh; const g = c.getContext('2d'); g.drawImage(i, 0, 0);
    const d = g.getImageData(0, 0, bw, bh).data; blk = new Uint8Array(bw * bh); for (let k = 0; k < bw * bh; k++) blk[k] = d[k * 4] > 128 ? 1 : 0; }),
    ];
  for (const k in m.mobs) ld.push(img(D + 'mob_' + k + '.png').then(i => { mb[k] = i; const c = document.createElement('canvas'); c.width = i.width; c.height = i.height; const g = c.getContext('2d'); g.drawImage(i, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); mbw[k] = c; }));
  await Promise.all(ld);
  M = m; GR = gr; PR = pr; BLK = blk; BW = bw; BH = bh; MB = mb; MBW = mbw; MAPID = id;
  MHP = {}; for (const k in MHP0) MHP[k] = Math.round(MHP0[k] * (M.hpk || 1));
  const at = from && M.entries && M.entries[from] || M.start; M.start = at.slice();   // falling here = back at the gate he came in by
  P.x = at[0]; P.y = at[1]; P.atk = P.act = null; NUM.length = FXS.length = 0;
  mobs = M.spawn.map(([k, x, y], i) => ({hp: MHP[k], vx: 0, vy: 0, fl: 0, k, x, y, hx: x, hy: y, tx: x, ty: y, w: 1 + Math.random() * 2, f: Math.random() > .5 ? 1 : -1, t: Math.random() * 3, mv: 0}));
  document.title = MAPS[id].name + ' · ลองเดิน'; BAN = 3;
  if (VW) { cam.x = P.x - VW / 2; cam.y = P.y - VH / 2; }
}
function travel(to) {                                // fade out, load, fade in
  if (TRV || !MAPS[to]) return; const from = MAPID; TRV = {t: 0, ok: 0};
  loadMap(to, from).then(() => { TRV.ok = 1; }).catch(e => { console.error(e); TRV = null; });
}
async function boot() {
  const ld = [];
  if (CHB) ld.push(img(A + CHB.f).then(i => CHB.im = i));
  if (CHB && CHB.pl) { const r = new Image(); r.onload = () => CHB.run = r; r.src = 'art/poses/combo/' + (CHB.sheet || 'chibi_pl.png'); }
  if (CHB && CHB.dg) fetch('fx/manifest.json').then(r => r.json()).then(m => { for (const k of ['dslash7_n', 'bigcut0_n', 'dslashl7_n', 'dashhit_n']) { SPR[k] = m[k]; SPR[k].im = new Image(); SPR[k].im.src = 'fx/' + k + '.png'; } });   // her neon violet cut effects (owner's pick)   // PixelLab run cycle (row 0, 8 frames of 204 px, feet 103,174): used for every moving direction but straight up / down until those are made
  ld.push(loadMap(MAPID));
  await Promise.all(ld);
  document.getElementById('load').remove(); resize(); cam.x = P.x - VW / 2; cam.y = P.y - VH / 2; requestAnimationFrame(frame);
  setTimeout(() => document.getElementById('hint').style.opacity = 0, 6000);
}

// ---- input
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'KeyB') dbg = !dbg; if ((e.code === 'KeyJ' || e.code === 'Space') && !e.repeat) { attack(); e.preventDefault(); } if (e.code === 'KeyK' && !e.repeat) act('spin'); if ((e.code === 'KeyL' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && !e.repeat) act('roll'); });
for (const k of ['spin', 'roll']) document.getElementById(k).addEventListener('pointerdown', e => { act(k); e.preventDefault(); e.stopPropagation(); });
document.getElementById('atk').addEventListener('pointerdown', e => { attack(); e.preventDefault(); e.stopPropagation(); });
addEventListener('keyup', e => { keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });
cv.addEventListener('pointerdown', e => {
  if (joy.id !== null) return; joy.id = e.pointerId; joy.x0 = joy.x = e.clientX; joy.y0 = joy.y = e.clientY; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });
const up = e => { if (e.pointerId === joy.id) joy.id = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.getElementById('fs').onclick = () => {
  const d = document.documentElement;
  if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d)?.then?.(() => screen.orientation?.lock?.('landscape').catch(() => {})).catch?.(() => {});
  else document.exitFullscreen?.();
};

// ---- update
const SPD = 150;
function step(dt) {
  for (const n of NUM) n.t += dt; while (NUM.length && NUM[0].t > .8) NUM.shift();
  for (const f of FXS) { f.t += dt; if (!f.ring && !f.spr) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 380 * dt; } } while (FXS.length && FXS[0].t > .45) FXS.shift();
  SHK *= Math.pow(.002, dt); ST.ct -= dt; if (ST.ct <= 0) ST.combo = 0; ST.up -= dt; BUF -= dt;
  BAN -= dt;
  if (TRV) { TRV.t += dt; if (TRV.ok && TRV.t > .25) { TRV.out = (TRV.out || 0) + dt; if (TRV.out > .3) TRV = null; } return; }   // the world stands still while the next map loads
  if (HS > 0) { HS -= dt; return; }
  let ix = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let iy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  if (joy.id !== null) {
    const dx = joy.x - joy.x0, dy = joy.y - joy.y0, l = Math.hypot(dx, dy), R = 46;
    if (l > R) { joy.x0 = joy.x - dx / l * R; joy.y0 = joy.y - dy / l * R; }   // the base follows the finger
    if (l > 8) { ix = dx / Math.max(l, R); iy = dy / Math.max(l, R); }
  }
  if (P.face === undefined) { P.face = 1; P.hp = HPMAX(); P.inv = 0; }
  if (P.inv > 0) P.inv -= dt; CD.spin -= dt; CD.roll -= dt;
  if (P.dead) { P.dead -= dt; P.mv = 0; if (P.dead <= 0) { P.dead = 0; P.x = M.start[0]; P.y = M.start[1]; P.hp = HPMAX(); P.inv = 2; } ix = iy = 0; BUF = 0; }
  else if (P.act) { const a = P.act; a.t += dt; P.mv = 0;
    if (a.k === 'roll') { if (!a.d) { const l0 = Math.hypot(ix, iy); a.d = l0 > .2 ? [ix / l0, iy / l0] : [P.face, 0]; if (Math.abs(a.d[0]) > .2) P.face = a.d[0] > 0 ? 1 : -1; } move(P, a.d[0] * 330 * dt * (a.t < .32 ? 1 : .3), a.d[1] * 330 * dt * (a.t < .32 ? 1 : .3), 7); if (a.t >= .44) P.act = null; }
    else if (a.k === 'spin') { const i = a.t / .05 | 0; if (i >= 6 && a.h < 1) { a.h = 1; spinHit(0); } if (i >= 10 && a.h < 2) { a.h = 2; spinHit(1); } if (a.t >= .8) P.act = null; }
    else if (a.t >= .3) P.act = null;
    ix = iy = 0; BUF = 0; }
  if (!P.atk && BUF > 0 && CHB && CHB.run) { if (Math.abs(ix) > .2) P.face = ix > 0 ? 1 : -1; const v = atkV(ix, iy); if (v) P.d = v === 'n' ? 6 : 2; startAtk(0, v); }
  if (P.atk) {                                       // attacking: no walking, a short lunge, the next press chains
    const a = P.atk; a.t += dt; P.mv = 0;
    const TS = a.v ? CV[a.v].st : CSTEP, TE = a.v ? CV[a.v].en : CEND;
    if (a.end) { if (BUF > 0 && a.n < TS.length - 1) { if (Math.abs(ix) > .2) P.face = ix > 0 ? 1 : -1; startAtk(a.n + 1, a.v); }
      else if (Math.hypot(ix, iy) > .3 && a.i >= 1) P.atk = null;
      else if (a.t >= TE[a.i].t) { a.t = 0; if (++a.i >= TE.length) P.atk = null; } }
    else { const s = TS[a.n], tot = s.f.reduce((q, b) => q + b.t, 0), lg = s.lunge / tot * dt * (a.i <= s.hit ? 1.7 : .3); if (a.v) move(P, 0, (a.v === 'n' ? -1 : 1) * lg * .8, 7); else move(P, P.face * lg, 0, 7);
      if (a.i >= s.hit && !a.hit) { a.hit = 1; doHit(s, a.v); }
      if (a.t >= s.f[a.i].t) { a.t = 0; if (++a.i >= s.f.length) { if (BUF > 0 && a.n < TS.length - 1) startAtk(a.n + 1, a.v); else { a.end = 1; a.i = 0; } } } }
    ix = iy = 0;
  }
  const l = Math.hypot(ix, iy);
  if (l > .1) {
    if (Math.abs(ix) > .2) P.face = ix > 0 ? 1 : -1;
    const s = Math.min(1, l) / l; ix *= s; iy *= s;
    move(P, ix * SPD * dt, iy * SPD * dt, 7);
