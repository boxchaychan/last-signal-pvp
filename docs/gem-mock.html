<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gem Battle Mock</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* screen mock-up for the gem + backpack battle idea (owner 2026-11-08 "จอมันจะพอไหม จำลองมาให้ดูหน่อย"): one phone screen
   in landscape, 844x390, scaled to fit; three phases switched with the buttons outside the screen */
:root{--bg:#120f1c;--ink:#f4efff;--dim:#a99fc4;--gold:#ffd75a;--panel:#211a35;--line:#4a3c78}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Kanit,system-ui,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px}
#tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#tabs button{font:600 14px Kanit,sans-serif;color:var(--ink);background:#2c2347;border:2px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
#tabs button.on{background:var(--gold);color:#2a1c00;border-color:#fff1b0}
#holder{position:relative}
#stage{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;border-radius:14px;border:3px solid #000;box-shadow:0 0 0 2px #3a2f5c;background:#1b1530}
/* battle strip */
#battle{position:absolute;left:0;top:0;width:844px;height:170px;background:linear-gradient(#5d7fb8 0,#9cb6d9 45%,#c9d6e6 62%,#7f96a8 63%,#5f7584 100%)}
#battle:after{content:"";position:absolute;left:0;right:0;bottom:0;height:52px;background:repeating-linear-gradient(90deg,#6c8292 0 40px,#647a8a 40px 80px);opacity:.6}
.mtn{position:absolute;bottom:60px;width:0;height:0;border-left:90px solid transparent;border-right:90px solid transparent;border-bottom:70px solid #8aa2c4;opacity:.7}
.unit{position:absolute;bottom:14px;width:62px;height:62px;background-size:contain;background-repeat:no-repeat;background-position:50% 100%;image-rendering:pixelated;z-index:2}
.unit.en{transform:scaleX(-1)}
.unit .hp{position:absolute;left:12px;right:12px;top:-8px;height:5px;background:#300;border:1px solid #000}
.unit .hp i{display:block;height:100%;background:#5be06b}
.unit.en .hp i{background:#ff5a5a}
.dmg{position:absolute;font:800 18px Kanit;color:#ffe27a;-webkit-text-stroke:3px #2a0a14;paint-order:stroke;z-index:5;transform:skewX(-12deg)}
.skn{position:absolute;font:600 11px Kanit;color:#bfe8ff;-webkit-text-stroke:2px #102040;paint-order:stroke;z-index:5}
/* top bar */
#top{position:absolute;left:0;right:0;top:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;z-index:10}
.pill{background:rgba(16,10,30,.82);border:2px solid #000;border-radius:7px;padding:1px 9px;font:600 13px Kanit;white-space:nowrap}
.pill.t{color:var(--gold)}
#players{margin-left:auto;display:flex;gap:4px}
.pl{width:40px;height:24px;border-radius:5px;border:2px solid #000;background:#2a2140;display:flex;align-items:center;gap:2px;padding:0 2px;font:600 10px Kanit}
.pl.me{border-color:var(--gold)}
.pl .fc{width:18px;height:18px;border-radius:4px;background-size:190%;background-position:50% 6%;image-rendering:pixelated;background-color:#3b2f5e}
.pl.out{opacity:.35}
/* bottom panel */
#bot{position:absolute;left:0;right:0;top:170px;bottom:0;background:linear-gradient(#2a2145,#1a1430);border-top:3px solid #000}
.phase{position:absolute;inset:0;display:none}.phase.on{display:block}
.label{position:absolute;font:600 11px Kanit;color:var(--dim)}
/* portraits */
.port{position:absolute;width:50px;height:50px;border-radius:7px;border:3px solid #000;background-size:185%;background-position:50% 5%;image-rendering:pixelated;background-color:#3b2f5e}
.port .bar{position:absolute;left:-3px;right:-3px;bottom:-9px;height:6px;border:1px solid #000;background:#222}
.port .bar i{display:block;height:100%}
.port.ready{box-shadow:0 0 0 2px #fff6a8,0 0 12px 4px #ffd75a}
.port .st{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:9px;color:var(--gold);-webkit-text-stroke:1px #000;paint-order:stroke}
/* gem board */
#board{position:absolute;left:250px;top:8px;width:344px;height:200px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);gap:3px;padding:4px;background:#120d22;border:3px solid #000;border-radius:8px}
.gem{border-radius:9px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35)}
.gem:after{content:"";position:absolute;left:22%;top:16%;width:26%;height:22%;border-radius:50%;background:rgba(255,255,255,.75)}
.g0{background:#e8423f}.g1{background:#3fbf5a}.g2{background:#4aa4ef}.g3{background:#9a62e8}.g4{background:#f2c33a}
.gem.hit{outline:3px solid #fff;outline-offset:-2px;filter:brightness(1.35)}
#combo{position:absolute;left:606px;top:10px;width:228px}
.big{font:800 34px Kanit;color:var(--gold);-webkit-text-stroke:4px #2a0a14;paint-order:stroke;line-height:1}
.row{display:flex;gap:6px;align-items:center;font:600 13px Kanit;margin-top:6px}
.chip{background:#2f2650;border:2px solid #000;border-radius:6px;padding:1px 7px}
.timer{position:absolute;left:250px;right:250px;top:-2px;height:6px}
/* backpack: one shared bag you can drag around (owner 2026-11-08 "ทำรูปแบบให้เสร็จ ตารางช่องกระเป๋า") */
#p-bag{touch-action:none;user-select:none;-webkit-user-select:none}
.bframe{position:absolute;background:#120d22;border:3px solid #000;border-radius:8px}
.cell{position:absolute;width:34px;height:34px;background:#2a2148;border:2px solid #3d3263;border-radius:4px}
.cell.lockc{background:repeating-linear-gradient(45deg,#15102a 0 4px,#1b1533 4px 8px);border:2px dashed #2a2347}
.hl{position:absolute;width:34px;height:34px;border-radius:4px;pointer-events:none;z-index:25}
.hl.ok{background:rgba(91,224,107,.6);box-shadow:0 0 0 3px #5be06b}.hl.bad{background:rgba(255,80,80,.6);box-shadow:0 0 0 3px #ff5050}
.port.lg{background-size:150%;background-position:50% 10%;cursor:grab}
.port.lg.sel{box-shadow:0 0 0 2px #fff,0 0 10px 3px rgba(255,255,255,.7)}
.rk{position:absolute;left:-7px;top:-8px;min-width:16px;height:16px;border-radius:8px;background:#000;color:#fff;font:600 10px/16px Kanit;text-align:center;border:1px solid #fff}
.itm{position:absolute;cursor:grab}
.itm i{position:absolute;border-radius:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35)}
.itm.bagp i{background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.14) 0 3px,transparent 3px 6px)}
.itm .ic{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.itm.idle{opacity:.55}
.bdg{position:absolute;font:800 12px Kanit;-webkit-text-stroke:2px #000;paint-order:stroke;line-height:1;pointer-events:none}
.dots{position:absolute;left:1px;bottom:1px;display:flex;gap:1px;pointer-events:none}.dots u{width:7px;height:7px;border-radius:50%;border:1px solid #000}
#shop{position:absolute;left:452px;top:4px;right:6px;bottom:4px;background:#1a1430;border:2px solid #3d3263;border-radius:8px;padding:2px 6px}
#shop.sell{border-color:#ff8a7a}
#shop.sell:after{content:"ปล่อยเพื่อขาย ได้คืนครึ่งราคา";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 17px Kanit;color:#ffc0b0;background:rgba(60,10,30,.82);border-radius:6px;z-index:5}
.shead{display:flex;justify-content:space-between;align-items:center;height:22px;font:600 12px Kanit}
.sbtn{font:600 11px Kanit;color:var(--ink);cursor:pointer;padding:1px 6px}
#tray{position:relative;height:80px}
.slot{position:absolute;top:0;width:70px;height:78px;border-radius:6px;background:#120d22;border:2px solid #2c2450}
.slot .pr{position:absolute;bottom:1px;left:0;right:0;text-align:center;font:600 11px Kanit;color:var(--gold)}
.slot.poor .pr{color:#ff7a7a}.slot.poor .itm{filter:grayscale(.8) brightness(.6)!important}
#info{position:absolute;left:8px;right:8px;top:106px;bottom:29px;font:400 10.5px/1.38 Kanit;color:#e6ddff;overflow:hidden}
#info b{color:#fff}
.go{position:absolute;right:6px;bottom:4px;font:800 13px Kanit;background:#5be06b;color:#06280c;border:3px solid #000;border-radius:8px;padding:0 14px;cursor:pointer}
#ghost{position:absolute;left:0;top:0;pointer-events:none;z-index:40;opacity:.72}
.lifted{opacity:.25!important}
.fl{animation:fl .9s ease-out forwards}@keyframes fl{to{transform:translateY(-28px) skewX(-12deg);opacity:0}}
.shot{position:absolute;width:10px;height:10px;border-radius:50%;z-index:300;box-shadow:0 0 8px 3px currentColor;background:#fff}
.shot.ar{width:18px;height:3px;border-radius:2px}
.res{position:absolute;left:0;right:0;top:56px;text-align:center;font:800 40px Kanit;color:#ffe27a;-webkit-text-stroke:5px #2a0a14;paint-order:stroke;z-index:400}
.again{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:600 13px Kanit;color:var(--ink);background:#2c2347;border:2px solid var(--line);border-radius:8px;padding:2px 14px;cursor:pointer}
.blab{position:absolute;left:8px;top:34px;font:600 11px Kanit;color:#fff;-webkit-text-stroke:2px #1a2440;paint-order:stroke;z-index:6}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#e9e4f5}}
</style></head><body>
<div id="wrap">
  <div id="tabs"><button data-p="bag" class="on">1. ร้านค้า + จัดกระเป๋า</button><button data-p="fight">2. ช่วงสู้</button></div>
  <div id="holder"><div id="stage">
    <div id="battle">
      <div class="mtn" style="left:40px"></div><div class="mtn" style="left:300px;border-bottom-width:90px"></div><div class="mtn" style="left:560px"></div>
    </div>
    <div id="top">
      <span class="pill">⏸</span><span class="pill t" id="tmr">⏳ 07</span><span class="pill" id="wave">เวฟ 3/4 · มอน</span><span class="pill" id="gold">💰 12</span>
      <div id="players"></div>
    </div>
    <div id="bot">
      <div class="phase on" id="p-gem">
        <div class="label" style="left:12px;top:4px">ทีมเรา (สีเพชร = เทพ)</div>
        <div id="gemPorts"></div>
        <div id="board"></div>
        <div id="combo"><div class="label" style="position:static">คอมโบ</div><div class="big">x14</div>
          <div class="row"><span class="chip">💰 +6</span><span class="chip">🎁 ไอเทม 1</span></div>
          <div class="row" style="color:var(--dim);font-size:11px">ทุกคนได้กระดานชุดเดียวกัน · เลื่อนไม่จำกัด</div></div>
      </div>
      <div class="phase" id="p-fight">
        <div id="fightPorts"></div>
        <div class="label" style="left:12px;top:4px">เกจเต็มแล้วเทพใช้ไม้ตายเอง ไม่ต้องกด</div><div id="log" style="position:absolute;left:222px;right:222px;top:100px;font:600 12px Kanit;line-height:1.55;color:#d8cff0;text-align:center"></div>
        <div class="label" style="right:12px;top:4px;color:#ff9a9a">ศัตรู: แก๊งเสือน้อย</div><button class="again" id="again">↻ ดูอีกครั้ง</button>
      </div>
      <div class="phase" id="p-bag">
        <div class="label" style="left:12px;top:2px">🎒 กระเป๋า · ลากวาง · แตะ = หมุน · ลากไปที่ร้าน = ขาย</div>
        <div id="bagL"></div><div id="hlL"></div>
        <div id="shop"><div class="shead"><span>ร้านค้า <b id="sg" style="color:var(--gold)">💰 12</b></span><span><button id="lock" class="chip sbtn">🔓 ล็อก</button> <button id="roll" class="chip sbtn">🎲 สุ่มใหม่ 1💰</button></span></div>
          <div id="tray"></div><div id="info"></div><button class="go" id="go">พร้อม ▶</button></div>
        <div id="ghost"></div>
      </div>
    </div>
  </div></div>
</div>
<script>
const A='../art/incoming/legends/px/';
const ME=[['god_warrior','ซุนหงอคง',0],['god_assassin','โลกิ',1],['god_hunter','อาร์เทมิส',2],['god_mage','โอดิน',3],['god_support','อพอลโล',4]];
const EN=['hero_warrior','hero_assassin','hero_hunter','hero_mage','hero_support'];
const GC=['#e8423f','#3fbf5a','#4aa4ef','#9a62e8','#f2c33a'];
const $=s=>document.querySelector(s);
// battle units: ours facing right, theirs mirrored
function units(ph){const b=$('#battle');b.querySelectorAll('.unit,.dmg,.skn,.blab').forEach(e=>e.remove());const sh=ph==='fight'?110:0;
  B.leg.forEach(l=>{const [k]=ME[l.i],d=document.createElement('div');d.className='unit';d.style.left=(24+l.x*30+sh)+'px';d.style.bottom=(8+(3-l.y)*9)+'px';d.style.zIndex=3+l.y;d.style.backgroundImage='url('+A+k+'.png)';d.innerHTML='<div class="hp"><i style="width:'+(70+l.i*6)+'%"></i></div>';b.appendChild(d)});
  EN.forEach((k,i)=>{const d=document.createElement('div');d.className='unit en';d.style.left=(ph==='fight'?470+i*52:530+i*58)+'px';d.style.bottom=(14+((i+1)%2)*14)+'px';d.style.backgroundImage='url('+A+k+'.png)';d.innerHTML='<div class="hp"><i style="width:'+(90-i*12)+'%"></i></div>';b.appendChild(d)});
  if(ph==='bag')b.insertAdjacentHTML('beforeend','<div class="blab">ทีมยืนตามที่วางในกระเป๋า · ขวา = หน้า →</div>');
  if(ph==='fight'){[[500,40,'-2,980'],[560,70,'-1,240'],[610,30,'-4,415']].forEach(([x,y,t])=>{const d=document.createElement('div');d.className='dmg';d.style.left=x+'px';d.style.top=y+'px';d.textContent=t;b.appendChild(d)});
    const s=document.createElement('div');s.className='skn';s.style.left='212px';s.style.top='58px';s.textContent='กระบองยืดหด';b.appendChild(s)}}
// players list (5 players, TFT style)
$('#players').innerHTML=[['god_warrior',84,1],['hero_mage',61],['god_hunter',47],['hero_curse',22],['god_curse',0]].map(([k,h,me])=>'<div class="pl'+(me?' me':'')+(h?'':' out')+'"><div class="fc" style="background-image:url('+A+k+'.png)"></div>'+(h||'ตก')+'</div>').join('');
// portraits
function ports(el,x0,y0,dx,dy,big,noReady){el.innerHTML=ME.map(([k,n,c],i)=>{const v=[100,72,45,88,30][i];return '<div class="port'+(v>=100&&!noReady?' ready':'')+'" style="left:'+(x0+(i%big)*dx)+'px;top:'+(y0+Math.floor(i/big)*dy)+'px;background-image:url('+A+k+'.png);border-color:'+GC[c]+'"><div class="bar"><i style="width:'+v+'%;background:'+GC[c]+'"></i></div><div class="st">'+'★'.repeat(1+i%3)+'</div></div>'}).join('')}
ports($('#gemPorts'),14,26,74,72,3);
ports($('#fightPorts'),222,40,82,0,5,1);  // owner 2026-11-08: no ult buttons, a full gauge fires the ult by itself
// gem board
const seq='0132413024142301320412043113402340121340';$('#board').innerHTML=[...seq].map((g,i)=>'<div class="gem g'+g+(i>=17&&i<=19?' hit':'')+'"></div>').join('');
// ---------- backpack: ONE shared bag, Backpack Battles style (owner 2026-11-08 "กระเป๋าแบบรวมไปเลย", then "ทำรูปแบบให้เสร็จ ตารางช่องกระเป๋า")
// 12x5 grid, 9x4 open at the start; bags from the shop open locked cells next to the open area · the 5 legends are 2x2 tiles and their
// place in the bag is their place on the field (right = front) · an item works for every legend it touches (edge) · a star item boosts
// the items it touches by 25% · 2 identical items of one colour touching merge into the next colour when the fight starts ·
// drag = move / buy, tap = rotate, drag onto the shop = sell for half
const P=36,C=34,GX=10,GY=20,BW=12,BH=5,SP=21,SC=19,SHX=452;  // shop items drawn at 19 px cells
const RC=['','#cfd4e0','#7fd88e','#b48cf0','#ff8a7a','#ffd75a'],RN=['','ขาว','เขียว','ม่วง','แดง','ทอง'],RM=[0,1,1.5,2.2,3.2,4.5];
const SH={o:[[0,0]],i2:[[0,0],[0,1]],i3:[[0,0],[0,1],[0,2]],w2:[[0,0],[1,0]],sq:[[0,0],[1,0],[0,1],[1,1]],L:[[0,0],[0,1],[1,1]]};
const IT={sword:{n:'ดาบ',ic:'🗡️',s:'i2',p:4,st:{atk:10},d:'แรงตี +{atk}'},
 spear:{n:'หอกยาว',ic:'🔱',s:'i3',p:6,st:{atk:18},d:'แรงตี +{atk}'},
 shield:{n:'โล่',ic:'🛡️',s:'sq',p:6,st:{arm:20},d:'เกราะ +{arm}'},
 ring:{n:'แหวนพลัง',ic:'💍',s:'o',p:4,st:{gau:15},d:'เกจไม้ตายตอนเริ่ม +{gau}%'},
 potion:{n:'ยาฟื้นเลือด',ic:'🧪',s:'o',p:3,st:{heal:6},d:'ฮีล {heal}% ทุก 6 วิ'},
 scroll:{n:'คัมภีร์',ic:'📜',s:'w2',p:5,st:{cd:10},d:'คูลดาวน์สกิล −{cd}%'},
 fire:{n:'ไฟวิญญาณ',ic:'🔥',s:'o',p:4,st:{burn:8},d:'ตีติดไฟ {burn} ต่อวิ'},
 feather:{n:'ขนนก',ic:'🪶',s:'o',p:3,st:{spd:8},d:'ตีเร็ว +{spd}%'},
 moon:{n:'จี้จันทร์',ic:'🌙',s:'o',p:4,st:{crit:8},d:'คริ +{crit}%'},
 amulet:{n:'เครื่องราง',ic:'🧿',s:'L',p:5,st:{hp:120},d:'เลือด +{hp}'},
 whet:{n:'หินลับมีด',ic:'🪨',s:'o',p:3,star:1,d:'★ ของที่วางติดแรงขึ้น 25%'},
 bag4:{n:'ถุงเสริม',ic:'👜',s:'sq',p:4,bag:1,d:'วางบนช่องล็อกที่ติดกระเป๋า เปิดเพิ่ม 4 ช่อง'},
 bag3:{n:'ย่ามยาว',ic:'🎒',s:'i3',p:3,bag:1,d:'วางบนช่องล็อกที่ติดกระเป๋า เปิดเพิ่ม 3 ช่อง'},
 bagL:{n:'ถุงมุม',ic:'👝',s:'L',p:2,bag:1,d:'วางบนช่องล็อกที่ติดกระเป๋า เปิดเพิ่ม 3 ช่อง'}};
const STN={atk:'แรงตี',arm:'เกราะ',gau:'เกจเริ่ม',heal:'ฮีล',cd:'คูลดาวน์',burn:'ไฟ',spd:'ตีเร็ว',crit:'คริ',hp:'เลือด'};
const N4=[[1,0],[-1,0],[0,1],[0,-1]],SQ=SH.sq,key=(x,y)=>x+','+y,inB=(x,y)=>x>=0&&y>=0&&x<BW&&y<BH;
const cellsOf=(c,x,y)=>c.map(([a,b])=>[x+a,y+b]);
function rotC(c){const n=c.map(([x,y])=>[-y,x]),mx=Math.min(...n.map(a=>a[0])),my=Math.min(...n.map(a=>a[1]));return n.map(([x,y])=>[x-mx,y-my])}
const B={gold:12,open:new Set(),leg:[[0,0],[2,0],[4,0],[0,2],[2,2]].map(([x,y],i)=>({i,x,y})),items:[],shop:[],lock:false,sel:null,uid:1,toast:'',fought:false};
for(let y=0;y<4;y++)for(let x=0;x<9;x++)B.open.add(key(x,y));
const mk=(k,r,x,y)=>({id:B.uid++,k,r,c:SH[IT[k].s],x,y});
B.items=[mk('sword',3,6,0),mk('whet',1,6,2),mk('ring',5,4,2),mk('potion',1,4,3),mk('feather',2,5,2),mk('feather',2,5,3)];
const price=(k,r)=>Math.max(1,Math.round(IT[k].p*RM[r]));
const sItem=(k,r)=>({k,r,c:SH[IT[k].s],price:price(k,r)});
B.shop=[sItem('spear',2),sItem('shield',1),sItem('moon',3),sItem('bag4',1),sItem('amulet',1)];
function roll(){const ks=Object.keys(IT);B.shop=[0,1,2,3,4].map(()=>{const bg=Math.random()<.18,pool=ks.filter(k=>!!IT[k].bag===bg),k=pool[Math.random()*pool.length|0],q=Math.random()*100;
  return sItem(k,IT[k].bag?1:q<45?1:q<75?2:q<90?3:q<98?4:5)})}

function floop(now){if(!F||!F.raf)return;const dt=Math.min(.05,(now-F.last)/1000);F.last=now;F.t+=dt;
  if(!F.end)for(const u of F.U){if(u.dead)continue;u.cd-=dt;u.lt=Math.max(0,u.lt-dt);u.ht=Math.max(0,u.ht-dt);u.mv=0;
    if(u.t.heal&&(u.dt+=dt)>6){u.dt=0;const h=Math.round(u.mx*u.t.heal/100);u.hp=Math.min(u.mx,u.hp+h);fnum(u.x,u.y,'+'+h,'#7dff8a')}
    const foes=F.U.filter(o=>!o.dead&&o.s!==u.s),mates=F.U.filter(o=>!o.dead&&o.s===u.s);if(!foes.length)continue;
    const tg=u.R.dive?foes.reduce((a,o)=>(u.s?o.x<a.x:o.x>a.x)?o:a):foes.reduce((a,o)=>Math.hypot(o.x-u.x,o.y-u.y)<Math.hypot(a.x-u.x,a.y-u.y)?o:a);
    if(u.g>=100){fult(u,[tg,...foes.filter(o=>o!==tg)],mates);continue}
    const melee=!u.R.shot,side=tg.x>=u.x?1:-1;let gx,gy;
    if(melee){gx=tg.x-side*u.R.rg;gy=tg.y}else{const d=Math.hypot(tg.x-u.x,tg.y-u.y);if(d>u.R.rg){gx=u.x+(tg.x-u.x)*(1-u.R.rg/d);gy=u.y+(tg.y-u.y)*(1-u.R.rg/d)}else{gx=u.x;gy=u.y}}
    const dx=gx-u.x,dy=gy-u.y,dl=Math.hypot(dx,dy);
    if(dl>3){const st=Math.min(dl,u.R.sp*dt);u.x+=dx/dl*st;u.y+=dy/dl*st;u.mv=1;u.face=dx>0?1:-1}
    else if(u.cd<=0){u.face=side;u.cd=u.R.cd/(1+(u.t.spd||0)/100);u.lt=.2;
      if(melee)fhit(u,tg,1);else if(u.R.heal&&Math.random()<.35){const m=mates.reduce((a,o)=>o.hp/o.mx<a.hp/a.mx?o:a);const h=Math.round(m.mx*.06);m.hp=Math.min(m.mx,m.hp+h);fnum(m.x,m.y,'+'+h,'#7dff8a');u.g=Math.min(100,u.g+10)}
      else{const e=document.createElement('div');e.className='shot'+(u.R.ar?' ar':'');e.style.color=u.R.shot;e.style.background=u.R.shot;$('#battle').appendChild(e);F.S.push({x:u.x+side*14,y:u.y-34,u,tg,e})}}
    for(const o of mates)if(o!==u){const ox=u.x-o.x,oy=(u.y-o.y)*1.6,od=Math.hypot(ox,oy);if(od<32&&od>0){u.x+=ox/od*45*dt;u.y+=oy/od*30*dt}}
    u.y=Math.max(116,Math.min(160,u.y))}
  F.S=F.S.filter(p=>{if(p.tg.dead&&!F.end){p.e.remove();return false}const tx=p.tg.x,ty=p.tg.y-34,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),st=420*dt;
    if(d<=st){fhit(p.u,p.tg,1);p.e.remove();return false}p.x+=dx/d*st;p.y+=dy/d*st;p.e.style.left=(p.x-5)+'px';p.e.style.top=(p.y-2)+'px';p.e.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';return true});
  for(const u of F.U){const bob=u.mv?-Math.abs(Math.sin(F.t*11+u.x))*4:0,lx=u.lt>0?u.face*10*Math.sin(u.lt/.2*Math.PI):0;
    u.el.style.left=(u.x-31)+'px';u.el.style.top=(u.y-62)+'px';u.el.style.bottom='auto';u.el.style.zIndex=Math.round(u.y);
    u.el.style.transform='translate('+lx+'px,'+(bob+(u.dead?14:0))+'px) scaleX('+u.face+')';u.el.style.opacity=u.dead?.18:1;u.el.style.filter=u.ht>0?'brightness(2.2)':'';
    u.el.querySelector('.hp i').style.width=(u.hp/u.mx*100)+'%';u.el.querySelector('.hp i').style.background=u.s?'#ff5a5a':'#5be06b'}
  document.querySelectorAll('#fightPorts .port').forEach((e,i)=>{const u=F.U[B.leg.findIndex(l=>l.i===i)];if(!u)return;e.querySelector('.bar i').style.width=u.g+'%';e.classList.toggle('ready',u.g>=90&&!u.dead);e.style.opacity=u.dead?.35:1});
  if(!F.end){const a=F.U.some(u=>!u.s&&!u.dead),z=F.U.some(u=>u.s&&!u.dead);if(!a||!z){F.end=1;$('#battle').insertAdjacentHTML('beforeend','<div class="res">'+(a?'ชนะ!':'แพ้...')+'</div>');flog(a?'ทีมเราชนะ ไปช่วงร้านค้าต่อ':'ทีมเราแพ้ เสียเลือดผู้เล่น')}}
  F.raf=requestAnimationFrame(floop)}
$('#again').onclick=()=>fightStart();

function show(p){if(p==='bag'&&B.fought){B.fought=false;B.gold+=5;if(!B.lock)roll();toast('รอบใหม่ +5💰'+(B.lock?' (ร้านล็อกไว้)':''))}
  document.querySelectorAll('.phase').forEach(e=>e.classList.toggle('on',e.id==='p-'+p));document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('#tmr').textContent=p==='gem'?'⏳ 07':p==='fight'?'⚔ สู้':'🎒 15';$('#wave').textContent=p==='fight'?'เวฟ 4/4 · สู้กับคน':'ถัดไป เวฟ 4/4 · สู้กับคน';if(p==='fight')fightStart(B.mmsg);else{fightStop();units(p)}B.mmsg='';if(p==='bag')render()}  // owner 2026-11-08: 3 monster waves, wave 4 against a player
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.p)};
function fit(){const t=$('#tabs').offsetHeight+18,k=Math.min((innerWidth-12)/844,(innerHeight-t)/390);$('#stage').style.transform='scale('+k+')';$('#holder').style.width=844*k+'px';$('#holder').style.height=390*k+'px'}
addEventListener('resize',fit);fit();show(new URLSearchParams(location.search).get('p')||'bag');  // gems parked (owner 2026-11-08 "เพชรเอาออกไปก่อน"), the gem phase stays in the file
