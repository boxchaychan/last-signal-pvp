<title>ท่าฟันเบอร์เซิร์กเกอร์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=Noto+Sans+Thai:wght@400;600&family=Jersey+10&display=swap">
<style>
/* layout: a slim control bar over three animation cards, one per move; cards stack on a phone */
:root {
  --bg: #ebe7e4; --panel: #f7f5f3; --ink: #1c1414; --mute: #6d5f5f; --line: #d6cfcb;
  --accent: #c8102e; --accent-ink: #ffffff; --field: #7eaa5c; --field-dark: #6a9550;
  --f-head: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
  --f-body: "Noto Sans Thai", system-ui, sans-serif;
  --f-num: "Jersey 10", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #120a0b; --panel: #1d1314; --ink: #f1e6e5; --mute: #a8918f; --line: #3a2729;
  --accent: #ff2a3a; --accent-ink: #120204; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #120a0b; --panel: #1d1314; --ink: #f1e6e5; --mute: #a8918f; --line: #3a2729;
  --accent: #ff2a3a; --accent-ink: #120204; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { font-family: var(--f-head); font-weight: 600; font-size: 1.6rem; margin: 0; text-wrap: balance; }
header p { margin: 2px 0 0; color: var(--mute); font-size: .95rem; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button, .tog { font: 600 .95rem var(--f-body); color: var(--ink); background: transparent; border: 0; padding: 7px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tog[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.step { display: inline-flex; gap: 6px; }
.step[hidden] { display: none !important; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h2 { font-family: var(--f-head); font-weight: 500; font-size: 1.15rem; margin: 0; }
.use { color: var(--mute); font-size: .88rem; margin: 0; min-height: 3em; }
canvas { width: 100%; max-width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 6px; display: block; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.dot.hit { box-shadow: inset 0 0 0 2px var(--accent); }
.dot.on { background: var(--ink); }
.dot.hit.on { background: var(--accent); }
.num { font-family: var(--f-num); font-size: 1.35rem; font-variant-numeric: tabular-nums; color: var(--mute); line-height: 1; }
.hitlab { font: 600 .8rem var(--f-body); color: var(--accent); visibility: hidden; }
.hitlab.show { visibility: visible; }
footer { color: var(--mute); font-size: .85rem; }
</style>
<div class="wrap">
  <header>
    <h1>ท่าฟันเบอร์เซิร์กเกอร์</h1>
    <p>ท่าจาก PixelLab หันเฉียงขวาล่าง ท่าละ 8 เฟรม (เฟรม 0 = ท่ายืน) · ช่องสีแดง = จังหวะดาบโดน</p>
  </header>
  <div class="bar">
    <div class="seg" role="group" aria-label="ความเร็ว">
      <button id="sp-n" data-fps="12" aria-pressed="true">ปกติ</button>
      <button id="sp-s" data-fps="4" aria-pressed="false">ช้า</button>
      <button id="sp-p" data-fps="0" aria-pressed="false">ทีละเฟรม</button>
    </div>
    <span class="step" id="step" hidden>
      <button class="tog" id="prev" aria-label="เฟรมก่อนหน้า">◀ ก่อน</button>
      <button class="tog" id="next" aria-label="เฟรมถัดไป">ถัดไป ▶</button>
    </span>
    <button class="tog" id="flip" aria-pressed="false">หันซ้าย (กลับด้าน)</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>เกมจะกลับด้านเองเวลาหันซ้าย · โซ่ที่พุ่งไกลกับเอฟเฟกต์แสงแดงจะวาดเพิ่มในเกมทีหลัง</footer>
</div>

const grid = document.getElementById('grid');
let fps = 12, flip = false, t0 = performance.now(), manual = 0;
const HOLD = 4;                       // extra beats on the standing pose between loops
const cards = MOVES.map(m => {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<h2>${m.name}</h2><p class="use">${m.use}</p><canvas width="172" height="172"></canvas>
    <div class="meta"><div class="dots"></div><span class="hitlab">ฟันโดน!</span><span class="num"></span></div>`;
  grid.appendChild(el);
  const imgs = m.frames.map(s => { const i = new Image(); i.src = s; return i; });
  const dots = el.querySelector('.dots');
  m.frames.forEach((_, i) => { const d = document.createElement('span'); d.className = 'dot' + (m.hits.includes(i) ? ' hit' : ''); dots.appendChild(d); });
  return { m, imgs, cv: el.querySelector('canvas'), dots: [...dots.children], num: el.querySelector('.num'), lab: el.querySelector('.hitlab'), last: -1 };
});
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(c, f) {
  const g = c.cv.getContext('2d'); g.imageSmoothingEnabled = false;
  g.fillStyle = css('--field'); g.fillRect(0, 0, 172, 172);
  g.fillStyle = css('--field-dark');
  for (let y = 0; y < 172; y += 8) for (let x = (y / 8 % 2) * 4; x < 172; x += 8) g.fillRect(x, y, 1, 1);
  const fx = flip ? 172 - c.m.fx : c.m.fx;
  g.fillStyle = 'rgba(30,40,20,.35)'; g.beginPath(); g.ellipse(fx, c.m.fy, 26, 7, 0, 0, Math.PI * 2); g.fill();
  const im = c.imgs[f];
  if (im.complete) { g.save(); if (flip) { g.translate(172, 0); g.scale(-1, 1); } g.drawImage(im, 0, 0); g.restore(); }
  c.dots.forEach((d, i) => d.classList.toggle('on', i === f));
  c.num.textContent = f + '/' + (c.imgs.length - 1);
  c.lab.classList.toggle('show', c.m.hits.includes(f));
  c.last = f;
}
function frameOf(c, now) {
  if (!fps) return Math.min(manual, c.imgs.length - 1);
  const n = c.imgs.length + HOLD, k = Math.floor((now - t0) / 1000 * fps) % n;
  return k < c.imgs.length ? k : 0;
}
function loop(now) {
  for (const c of cards) { const f = frameOf(c, now); if (f !== c.last) draw(c, f); }
  requestAnimationFrame(loop);
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  fps = +b.dataset.fps; t0 = performance.now(); manual = 0;
  document.getElementById('step').hidden = fps !== 0;
  cards.forEach(c => c.last = -1);
}));
const maxF = Math.max(...MOVES.map(m => m.frames.length));
document.getElementById('next').onclick = () => { manual = (manual + 1) % maxF; cards.forEach(c => c.last = -1); };
document.getElementById('prev').onclick = () => { manual = (manual + maxF - 1) % maxF; cards.forEach(c => c.last = -1); };
document.getElementById('flip').onclick = e => { flip = !flip; e.currentTarget.setAttribute('aria-pressed', flip); cards.forEach(c => c.last = -1); };
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.getElementById('sp-p').click();
Promise.all(cards.flatMap(c => c.imgs.map(i => i.decode().catch(() => {})))).then(() => cards.forEach(c => c.last = -1));
requestAnimationFrame(loop);
</script>
