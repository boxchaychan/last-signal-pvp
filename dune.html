  set('hp', P.hp / maxHP(), `${Math.ceil(P.hp)} / ${maxHP()}`); set('mp', P.mp / maxMP(), `${Math.floor(P.mp)} / ${maxMP()}`); $('xp').querySelector('u').style.width = (P.xp / xpNeed() * 100) + '%'; $('lv').textContent = P.lv; $('gold').querySelector('span').textContent = P.gold;
  const Q = QUESTS[G.quest]; $('quest').innerHTML = Q ? `<small>ภารกิจ ${G.quest + 1}/${QUESTS.length}</small>${Q.t} ${G.count}/${Q.n}` : '<small>จบเนื้อเรื่องแมพนี้</small>เก็บเลเวลต่อได้เลย';
  for (const S of SKILLS) { const b = SKEL[S.id]; if (!b) continue; b.querySelector('.cd').style.height = ((P.cds[S.id] || 0) / S.cd * 100) + '%'; b.classList.toggle('off', (S.lv && P.lv < S.lv) || P.mp < S.mp); } if (SKEL.dash) SKEL.dash.querySelector('.cd').style.height = (P.dashCd / 1.25 * 100) + '%'; if (SKEL.hp) { SKEL.hp.querySelector('q').textContent = P.hpot; SKEL.hp.classList.toggle('off', !P.hpot); SKEL.mp.querySelector('q').textContent = P.mpot; SKEL.mp.classList.toggle('off', !P.mpot); }
  if (G.boss) $('boss').querySelector('u').style.width = (G.boss.hp / G.boss.max * 100) + '%';
  const near = G.near; $('talk').style.display = near ? 'block' : 'none'; if (near) $('talk').textContent = `กด F คุยกับ ${near.n}`; $('tF').style.display = near ? 'grid' : 'none';
}
function drawFace() { const c = $('face').querySelector('canvas'), x = c.getContext('2d'), q = HR.parts.find(p => p.name === 'head'); if (!q) return; x.clearRect(0, 0, 104, 104); const k = 118 / q.h; x.drawImage(HR.img, q.ax, q.ay, q.aw, q.ah, 52 - q.w * k * .56, -2, q.w * k, q.h * k); }
const closeMenu = () => { $('menu').style.display = 'none'; G.state = 'play'; };
function openNPC(n) {
  G.state = 'menu'; for (const k in I) I[k] = 0; const p = $('panel'); $('menu').style.display = 'flex'; sfx('ui');
  if (n.id === 'elder') { const Q = QUESTS[G.quest], line = !Q ? 'เจ้าปลุกเปลวเพลิงแห่งทะเลทรายสำเร็จแล้ว ผืนทรายจะจดจำชื่อเจ้า' : ['แมงป่องบุกเข้ามาใกล้ค่าย ช่วยไล่พวกมันก่อนเถิด', 'ฝูงหมาป่าซุ่มอยู่บนเนินทราย อย่าให้มันล้อมเจ้าได้', 'คำสาปปลุกมัมมี่ขึ้นจากสุสาน จงสงบวิญญาณพวกมัน', 'ดงกระบองเพชรเดินได้ขวางทางสู่สุสานเก่า ฝ่าไปให้ได้', 'โกเลมตื่นแล้ว ระวังเงาแดงบนพื้น เมื่อเห็นให้พุ่งหลบทันที'][G.quest];
    p.innerHTML = `<button class="x" aria-label="ปิด">×</button><div class="npc"><img src="art/dune/env/elder.webp" alt=""><div><h2>ผู้เฒ่าเต่าทอง</h2><p>${line}</p>${Q ? `<p style="color:var(--gold)">ภารกิจ: ${Q.t} (${G.count}/${Q.n})<br>รางวัล ${Q.r.xp} XP · ${Q.r.gold} ทอง</p>` : ''}</div></div>`; }
  else shop();
  p.querySelector('.x').onclick = closeMenu;
}
function shop() {
  const p = $('panel'), wc = Math.round(70 * Math.pow(1.72, P.wep)), ac2 = Math.round(60 * Math.pow(1.7, P.arm)), L = [['hp', 4, 'ยาแดง', `ฟื้นเลือด 55% · มี ${P.hpot}`, 18], ['mp', 5, 'ยาฟ้า', `ฟื้นเวท 60% · มี ${P.mpot}`, 22], ['wep', 11, `หอกเพลิง +${P.wep + 1}`, `พลังโจมตี +7`, wc], ['arm', 10, `เกราะทราย +${P.arm + 1}`, `เลือด +38 · ป้องกัน +1.8`, ac2]];
  p.innerHTML = `<button class="x" aria-label="ปิด">×</button><div class="npc"><img src="art/dune/env/merchant.webp" alt=""><div style="flex:1"><h2>พ่อค้าจิ้งจอก</h2><p>ของดีจากทั่วทะเลทราย · ทอง <b style="color:var(--gold)">${P.gold}</b></p></div></div><div class="shop">${L.map(q => `<button class="item" data-b="${q[0]}" ${P.gold < q[4] ? 'disabled' : ''}><i class="ic"></i><span><b>${q[2]}</b>${q[3]}<br><small>${q[4]} ทอง</small></span></button>`).join('')}</div>`;
  p.querySelectorAll('.item').forEach((b, i) => { ic(b.querySelector('.ic'), L[i][1]); b.onclick = () => { const q = L[i]; if (P.gold < q[4]) return; P.gold -= q[4]; if (q[0] === 'hp') P.hpot++; if (q[0] === 'mp') P.mpot++; if (q[0] === 'wep') P.wep++; if (q[0] === 'arm') { P.arm++; P.hp += 38; } sfx('coin'); save(); ui(true); shop(); }; }); p.querySelector('.x').onclick = closeMenu;
}

/* ---------- save ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, lv: P.lv, xp: P.xp, gold: P.gold, hpot: P.hpot, mpot: P.mpot, wep: P.wep, arm: P.arm, quest: G.quest, count: G.count, bossDone: G.bossDone })); } catch (e) {} }
function loadSave() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) { for (const k of ['lv', 'xp', 'gold', 'hpot', 'mpot', 'wep', 'arm']) P[k] = d[k]; G.quest = d.quest; G.count = d.count; G.bossDone = d.bossDone; return true; } } catch (e) {} return false; }
function begin(fresh) { ac(); if (fresh) { try { localStorage.removeItem(KEY); } catch (e) {} Object.assign(P, { lv: 1, xp: 0, gold: 20, hpot: 3, mpot: 2, wep: 0, arm: 0 }); G.quest = 0; G.count = 0; G.bossDone = false; } else loadSave(); Object.assign(P, { x: 330, y: GROUND, vx: 0, vy: 0, on: true, plat: null, ladder: null, dead: false, inv: 0, cds: {}, dir: 1 }); P.hp = maxHP(); P.mp = maxMP(); setAnim('idle'); G.drops = []; G.fx = []; G.nums = []; G.waves = []; G.rings = []; G.rain = []; G.ecl = null; G.orbit = 0; HR.ghosts = []; HR.trail = []; resetMobs(); G.camX = 0; G.camY = GROUND - VIEW_H * .68; $('boss').style.display = 'none'; $('title').style.display = 'none'; $('over').style.display = 'none'; $('hud').style.display = 'block'; G.state = 'play'; buildKeys(); drawFace(); ui(true); heroStep(.016); toast('โอเอซิสสุดท้าย', TOUCH ? 'ไปคุยกับผู้เฒ่าเต่าทอง' : 'A D เดิน · Space โดด · J ฟัน · K L U I สกิล · F คุย'); }

/* ---------- input ---------- */
const MAP = { a: 'left', arrowleft: 'left', d: 'right', arrowright: 'right', w: 'up', arrowup: 'up', s: 'down', arrowdown: 'down', ' ': 'jump', j: 'attack', z: 'attack', f: 'talk' };
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault(); if (G.state === 'menu') { if (k === 'escape' || k === 'f') closeMenu(); return; } if (G.state !== 'play' || e.repeat) { if (MAP[k]) I[MAP[k]] = 1; return; } ac(); if (MAP[k]) { I[MAP[k]] = 1; EDGE[MAP[k]] = 1; } const S = SKILLS.find(q => q.key.toLowerCase() === k); if (S) useSkill(S); if (k === 'shift' || k === 'x') doDash(); if (k === 'q') drink('hp'); if (k === 'e') drink('mp'); });
addEventListener('keyup', e => { const k = MAP[e.key.toLowerCase()]; if (k) I[k] = 0; });
document.querySelectorAll('.tb').forEach(b => { const k = b.dataset.k, on = e => { e.preventDefault(); ac(); I[k] = 1; EDGE[k] = 1; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (x) {} }, off = () => { I[k] = 0; b.classList.remove('down'); }; b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off); });
addEventListener('blur', () => { for (const k in I) I[k] = 0; });
$('play').onclick = () => begin(false); $('fresh').onclick = () => begin(true); $('revive').onclick = () => { P.gold = Math.floor(P.gold * .9); begin(false); P.gold = Math.max(P.gold, 0); };

/* ---------- loop ---------- */
let prev = performance.now();
function frame(now) { requestAnimationFrame(frame); if (innerWidth !== lastW || innerHeight !== lastH) resize(); let dt = Math.min(.04, (now - prev) / 1000); prev = now; if (G.state === 'play') { if (G.stop > 0) { G.stop -= dt; dt *= .08; } stepWorld(dt); ui(); } else if (G.state === 'title') { G.t += dt; G.camX = 1050 + Math.sin(G.t * .1) * 600; G.camY = GROUND - VIEW_H * .72; } draw(); }
(async () => { try { await loadAll(); resetMobs(); $('load').style.display = 'none'; $('title').style.display = 'flex'; if (!localStorage.getItem(KEY)) $('fresh').style.display = 'none'; G.state = 'title'; window.DUNE = { HR, heroStep, P, G, I, EDGE, stepWorld, begin, useSkill, SKILLS, MT, QUESTS, gainXP, wakeBoss, draw, PLATS, LADDERS, ready: true }; requestAnimationFrame(frame); } catch (e) { console.error(e); $('load').querySelector('b').textContent = 'โหลดเกมไม่สำเร็จ ลองรีเฟรช'; } })();
</script>
