<html lang="th">

<style>

@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }

@font-face { font-family: Kanit; font-weight: 800; font-display: swap; src: url(art/gem/font/kanit-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF; }
:root { --gold: #f4c65b; --gold2: #a96f20; --ink: #fff4dc; --dim: #d8c6a4; --panel: rgba(25,34,42,.93); --teal: #123c42; --red: #e4483d; --blue: #3f9df0; --sl: env(safe-area-inset-left,0px); --sr: env(safe-area-inset-right,0px); --sb: env(safe-area-inset-bottom,0px); }

canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#load { z-index: 9; display: flex; background: #21121f; } #load i { display: block; width: 240px; height: 8px; margin-top: 12px; background: #3b2a35; border-radius: 4px; overflow: hidden; } #load u { display: block; width: 0; height: 100%; background: var(--gold); }
#title { background-image: url(art/dune/env/title.webp), linear-gradient(180deg,#44224f,#e47b39); } #over { background: rgba(20,8,12,.72); }
@media (max-height: 440px) {
  #stat { width: 214px; padding: 3px 6px 4px 3px; } #face { flex-basis: 42px; height: 42px; } #lv { left: 37px; top: 31px; height: 17px; line-height: 17px; font-size: 11px; min-width: 20px; } #bars b { display: none; } .bar { height: 11px; } .bar span { font-size: 9px; line-height: 10px; } #xp { height: 5px; }
  #gold { top: 62px; font-size: 12px; } #gold .ic { width: 16px; height: 16px; } #quest { width: 172px; padding: 3px 7px; font-size: 11px; } #quest small { font-size: 9.5px; } #boss { top: 5px; width: 32vw; font-size: 11px; }
  #keys { grid-template-columns: repeat(7, 46px); gap: 3px; } .sk { width: 46px; height: 46px; padding: 4px; } #panel { padding: 9px 11px; } #panel h2 { font-size: 17px; } .npc img { width: 70px; height: 78px; } .item .ic { flex-basis: 30px; height: 30px; } .item { padding: 3px 6px; font-size: 12px; } #toast b { font-size: 23px; }
}
body.t #keys { right: calc(190px + var(--sr)); bottom: calc(6px + var(--sb)); grid-template-columns: repeat(2, 46px); grid-auto-flow: row; }
body.t #touch { display: block; } body.t #talk { display: none !important; }
@media (max-height: 440px) { body.t #tA { width: 70px; height: 70px; font-size: 15px; } body.t #tJ { right: calc(92px + var(--sr)); width: 54px; height: 54px; } body.t #keys { right: calc(152px + var(--sr)); grid-template-columns: repeat(4, 42px); } body.t .sk { width: 42px; height: 42px; padding: 3px; } body.t #tL, body.t #tR { width: 60px; height: 60px; bottom: calc(30px + var(--sb)); } body.t #tR { left: calc(126px + var(--sl)); } body.t #tU, body.t #tD { width: 48px; height: 48px; left: calc(74px + var(--sl)); } body.t #tU { bottom: calc(78px + var(--sb)); } body.t #tD { bottom: calc(6px + var(--sb)); } }
</style>

<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="stat"><div id="face"><canvas width="104" height="104"></canvas></div><div id="lv">1</div><div id="bars"><b>มังกรทราย · นักรบหอก</b><div class="bar" id="hp"><u></u><span></span></div><div class="bar" id="mp"><u></u><span></span></div><div class="bar" id="xp"><u></u></div></div></div>
  <div id="gold"><i class="ic"></i><span>0</span></div>
  <div id="quest"></div>
  <div id="boss"><span>โกเลมผู้เฝ้าสุสาน</span><div class="bar"><u></u></div></div>

    <button class="tb" id="tL" data-k="left">◀</button><button class="tb" id="tR" data-k="right">▶</button><button class="tb" id="tU" data-k="up">▲</button><button class="tb" id="tD" data-k="down">▼</button>
    <button class="tb" id="tA" data-k="attack">ฟัน</button><button class="tb" id="tJ" data-k="jump">โดด</button><button class="tb" id="tF" data-k="talk">คุย</button>
  </div>
</div>
<div id="menu"><div id="panel"></div></div>
<div class="screen" id="title"><h1>ตำนานมังกรทราย</h1><p>ปลุกเปลวเพลิง ปราบอสูรแห่งโอเอซิส</p><div><button class="big" id="play">เริ่มผจญภัย</button><button class="big alt" id="fresh">เริ่มใหม่</button></div></div>
<div class="screen" id="over"><h1>พ่ายแพ้</h1><p>เปลวเพลิงยังไม่ดับ กลับไปตั้งหลักที่ค่าย</p><button class="big" id="revive">ฟื้นคืนชีพ</button></div>
<div class="screen" id="load"><b style="font-size:24px;color:#ffe39a">ตำนานมังกรทราย</b><i><u></u></i></div>

<script>
'use strict';
/* ตำนานมังกรทราย: one hand-built side-scrolling map. All art painted for this game (Codex), cut by tools/art/dune_pack.py + dune_world.py. Genre only: no names, art or maps from any existing game. */
const $ = id => document.getElementById(id), QS = new URLSearchParams(location.search), TOUCH = matchMedia('(pointer:coarse)').matches || QS.get('touch') === '1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rand = (a, b) => a + Math.random() * (b - a), irand = (a, b) => Math.floor(rand(a, b + 1)), sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false }); if (TOUCH) document.body.classList.add('t');
const VIEW_H = TOUCH ? 600 : 700, MAPW = 7860, GROUND = 1200, GRAV = 1950, KEY = 'dune_save1', RUN_SPEED = 215, CHAR = 2 / 3, HERO_SC = .5 * CHAR; /* owner: characters one third smaller against the scenery */
const CLASSES = { spear: { n: 'นักรบหอก', hero: 'มังกรทราย' } }; /* one entry per job: the owner will bring more characters */
let SW = 1, SH = 1, K = 1, VW = 960;
let lastW = 0, lastH = 0;
function resize() { if (!innerWidth || !innerHeight) return; lastW = innerWidth; lastH = innerHeight; const dpr = Math.min(devicePixelRatio || 1, TOUCH ? 1.6 : 2); SW = cv.width = Math.round(innerWidth * dpr); SH = cv.height = Math.round(innerHeight * dpr); K = SH / VIEW_H; VW = SW / K; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; }
addEventListener('resize', resize); resize();

/* ---------- the map ---------- */
const PLATS = [
  { x: 1400, y: 1076, w: 380 }, { x: 1835, y: 952, w: 430 }, { x: 1470, y: 828, w: 320 },
  { x: 2400, y: 1076, w: 470 }, { x: 2960, y: 952, w: 390 }, { x: 2500, y: 824, w: 400 },
  { x: 3430, y: 1076, w: 430 }, { x: 3020, y: 714, w: 360 }, { x: 3780, y: 936, w: 340 }, { x: 3470, y: 806, w: 300 }
];
const LADDERS = [ { x: 1600, top: 1076, bot: GROUND, k: 'ladder' }, { x: 2050, top: 952, bot: GROUND, k: 'rope' }, { x: 1630, top: 828, bot: 1076, k: 'rope' }, { x: 2640, top: 1076, bot: GROUND, k: 'ladder' }, { x: 3150, top: 952, bot: GROUND, k: 'rope' }, { x: 2700, top: 824, bot: 1076, k: 'ladder' }, { x: 3200, top: 714, bot: 952, k: 'rope' }, { x: 3640, top: 1076, bot: GROUND, k: 'ladder' }, { x: 3950, top: 936, bot: GROUND, k: 'rope' }, { x: 3620, top: 806, bot: 1076, k: 'rope' } ];
const BACK = [ /* name, x, base y, height, flip */
  ['palm1', -10, GROUND + 6, 300], ['palm3', 1085, GROUND + 6, 285], ['tent', 205, GROUND + 6, 292], ['lantern', 405, GROUND + 4, 196], ['jars', 468, GROUND + 6, 90], ['stall', 640, GROUND + 6, 238], ['crates', 810, GROUND + 6, 108], ['well', 1010, GROUND + 6, 190], ['lantern', 890, GROUND + 4, 196, 1], ['sign', 1215, GROUND + 5, 150],
  ['palm2', 1330, GROUND + 6, 280, 1], ['column', 1760, GROUND + 6, 215], ['columnb', 1880, GROUND + 6, 150], ['pond', 2250, GROUND + 12, 88], ['palm1', 2360, GROUND + 6, 285, 1], ['arch', 2860, GROUND + 6, 250], ['fall', 3320, GROUND + 6, 150], ['obelisk', 3540, GROUND + 6, 250], ['palm3', 3790, GROUND + 6, 270], ['statue', 4130, GROUND + 6, 190], ['column', 4340, GROUND + 6, 250], ['arch', 4500, GROUND + 6, 340], ['column', 4660, GROUND + 6, 250],
  ['obelisk', 4860, GROUND + 6, 300], ['statue', 5050, GROUND + 6, 215, 1], ['columnb', 5230, GROUND + 6, 180], ['portal', 5480, GROUND + 6, 250],
  ['columnb', 1520, 1076 + 4, 88], ['shrub', 1940, 952 + 4, 50], ['cactus', 2150, 952 + 4, 76], ['blocks', 2500, 1076 + 4, 46], ['shrub', 2780, 1076 + 4, 44], ['jars', 2640, 824 + 4, 54], ['column', 3080, 952 + 4, 120], ['chest', 3240, 714 + 4, 50], ['cactus', 3760, 1076 + 4, 70], ['blocks', 3900, 936 + 4, 44], ['obelisk', 3540, 806 + 4, 92]
];
const FRONT = [ ['tuft', 130, GROUND + 14, 40], ['shrub', 1130, GROUND + 15, 44], ['tuft', 1490, GROUND + 15, 46], ['blocks', 2130, GROUND + 18, 40], ['tuft', 2310, GROUND + 16, 48], ['cactus', 2960, GROUND + 15, 64], ['tuft', 3440, GROUND + 15, 42], ['shrub', 4040, GROUND + 15, 42], ['tuft', 4760, GROUND + 15, 44], ['blocks', 5160, GROUND + 18, 48], ['tuft', 5360, GROUND + 15, 42] ];
const GLOWS = [[405, 1032, 78, '255,176,74'], [890, 1032, 78, '255,176,74'], [640, 1090, 78, '114,236,214'], [3320, 1120, 70, '110,235,226'], [5480, 1080, 130, '80,240,220']];
const NPCS = [ { id: 'elder', x: 960, n: 'ผู้เฒ่าเต่าทอง', h: 76, img: 'elder' }, { id: 'shop', x: 575, n: 'พ่อค้าจิ้งจอก', h: 72, img: 'merchant' } ];
const MT = {
  scorpion: { n: 'แมงป่องทราย', lv: 1, hp: 62, atk: 7, spd: 54, xp: 9, gold: [2, 5], sc: .53, r: 44, h: 72, reach: 70, aggro: 240, hitF: 7 },
  wolf: { n: 'หมาป่าเนินทราย', lv: 3, hp: 118, atk: 12, spd: 112, xp: 17, gold: [3, 7], sc: .55, r: 46, h: 76, reach: 80, aggro: 320, hitF: 6 },
  mummy: { n: 'มัมมี่สุสาน', lv: 5, hp: 215, atk: 18, spd: 60, xp: 28, gold: [5, 10], sc: .58, r: 36, h: 100, reach: 86, aggro: 270, hitF: 8 },
  cactus: { n: 'กระบองเพชรเดิน', lv: 7, hp: 360, atk: 25, spd: 44, xp: 43, gold: [7, 14], sc: .54, r: 38, h: 114, reach: 80, aggro: 240, hitF: 8 },
  golem: { n: 'โกเลมผู้เฝ้าสุสาน', lv: 12, hp: 9500, atk: 54, spd: 58, xp: 520, gold: [180, 240], sc: .86, r: 86, h: 225, reach: 170, aggro: 900, hitF: 8, boss: 1 }
};
for (const k in MT) { const T = MT[k], c = T.boss ? .8 : CHAR; T.sc *= c; T.r *= c; T.h *= c; T.reach *= c; }
const SPAWN = [ ['scorpion', 1250, 1390, GROUND], ['scorpion', 1440, 1760, GROUND], ['scorpion', 1710, 2020, GROUND], ['scorpion', 1420, 1760, 1076], ['scorpion', 1440, 1760, 1076], ['scorpion', 1850, 2240, 952], ['wolf', 2040, 2380, GROUND], ['wolf', 2400, 2680, GROUND], ['wolf', 2420, 2850, 1076], ['wolf', 1490, 1770, 828], ['wolf', 2520, 2880, 824], ['wolf', 2700, 2950, GROUND],
  ['mummy', 2980, 3330, 952], ['mummy', 2970, 3280, GROUND], ['mummy', 3280, 3560, GROUND], ['mummy', 3450, 3840, 1076], ['mummy', 3040, 3360, 714], ['mummy', 3470, 3760, 806], ['cactus', 3600, 3880, GROUND], ['cactus', 3890, 4230, GROUND], ['cactus', 3800, 4100, 936], ['cactus', 4080, 4380, GROUND] ];
/* owner: small characters on a big wide map: everything east of the camp is stretched, then filled with more scenery and monsters */
const MX = 1.5, WF = x => x <= 1200 ? x : 1200 + (x - 1200) * MX, BARRIER = WF(4440), ARENA = [WF(4560), WF(5360)], BOSS_X = WF(5180), PORTAL_X = WF(5480);

  for (const n of NPCS) drawNPC(n); for (const m of G.mobs) drawMob(m); drawDrops(); drawPlayer(); for (const f of G.fx) drawFX(f); for (const b of FRONT) img(b[0], b[1], b[2], b[3], b[4]); drawNums(); ctx.setTransform(K, 0, 0, K, 0, 0); drawAir();
}

/* ---------- UI ---------- */
function ic(el, i) { el.style.backgroundPosition = `${(i % 4) * 33.3333}% ${Math.floor(i / 4) * 33.3333}%`; }
const SKEL = {};
function buildKeys() {
  const K = $('keys'); K.innerHTML = ''; const make = (id, icon, key, fn, title) => { const b = document.createElement('button'); b.className = 'sk'; b.title = title; b.innerHTML = `<i class="ic"></i><span class="cd"></span><em>${TOUCH ? '' : key}</em><q></q>`; ic(b.querySelector('.ic'), icon); b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); fn(); }); K.appendChild(b); SKEL[id] = b; };
  for (const S of SKILLS) make(S.id, S.ic, S.key, () => useSkill(S), `${S.n}: ${S.d}`); make('dash', 3, 'Shift', doDash, 'พุ่ง'); make('hp', 4, 'Q', () => drink('hp'), 'ยาแดง'); make('mp', 5, 'E', () => drink('mp'), 'ยาฟ้า');
}
let uiT = 0;
function ui(force) {
  const now = performance.now(); if (!force && now - uiT < 90) return; uiT = now; const set = (id, v, txt) => { $(id).querySelector('u').style.width = clamp(v * 100, 0, 100) + '%'; if (txt !== undefined) $(id).querySelector('span').textContent = txt; };
  set('hp', P.hp / maxHP(), `${Math.ceil(P.hp)} / ${maxHP()}`); set('mp', P.mp / maxMP(), `${Math.floor(P.mp)} / ${maxMP()}`); $('xp').querySelector('u').style.width = (P.xp / xpNeed() * 100) + '%'; $('lv').textContent = P.lv; $('gold').querySelector('span').textContent = P.gold;
  const Q = QUESTS[G.quest]; $('quest').innerHTML = Q ? `<small>ภารกิจ ${G.quest + 1}/${QUESTS.length}</small>${Q.t} ${G.count}/${Q.n}` : '<small>จบเนื้อเรื่องแมพนี้</small>เก็บเลเวลต่อได้เลย';
  for (const S of SKILLS) { const b = SKEL[S.id]; if (!b) continue; b.querySelector('.cd').style.height = ((P.cds[S.id] || 0) / S.cd * 100) + '%'; b.classList.toggle('off', (S.lv && P.lv < S.lv) || P.mp < S.mp); } if (SKEL.dash) SKEL.dash.querySelector('.cd').style.height = (P.dashCd / 1.25 * 100) + '%'; if (SKEL.hp) { SKEL.hp.querySelector('q').textContent = P.hpot; SKEL.hp.classList.toggle('off', !P.hpot); SKEL.mp.querySelector('q').textContent = P.mpot; SKEL.mp.classList.toggle('off', !P.mpot); }
  if (G.boss) $('boss').querySelector('u').style.width = (G.boss.hp / G.boss.max * 100) + '%';
  const near = G.near; $('talk').style.display = near ? 'block' : 'none'; if (near) $('talk').textContent = `กด F คุยกับ ${near.n}`; $('tF').style.display = near ? 'grid' : 'none';
}
function drawFace() { const c = $('face').querySelector('canvas'), x = c.getContext('2d'), m = SP.hero_idle; if (!m || !m.img) return; x.clearRect(0, 0, 104, 104); x.drawImage(m.img, 20, 0, 130, 130, -8, 2, 122, 122); }
const closeMenu = () => { $('menu').style.display = 'none'; G.state = 'play'; };
function openNPC(n) {
  G.state = 'menu'; for (const k in I) I[k] = 0; const p = $('panel'); $('menu').style.display = 'flex'; sfx('ui');
  if (n.id === 'elder') { const Q = QUESTS[G.quest], line = !Q ? 'เจ้าปลุกเปลวเพลิงแห่งทะเลทรายสำเร็จแล้ว ผืนทรายจะจดจำชื่อเจ้า' : ['แมงป่องบุกเข้ามาใกล้ค่าย ช่วยไล่พวกมันก่อนเถิด', 'ฝูงหมาป่าซุ่มอยู่บนเนินทราย อย่าให้มันล้อมเจ้าได้', 'คำสาปปลุกมัมมี่ขึ้นจากสุสาน จงสงบวิญญาณพวกมัน', 'ดงกระบองเพชรเดินได้ขวางทางสู่สุสานเก่า ฝ่าไปให้ได้', 'โกเลมตื่นแล้ว ระวังเงาแดงบนพื้น เมื่อเห็นให้พุ่งหลบทันที'][G.quest];
    p.innerHTML = `<button class="x" aria-label="ปิด">×</button><div class="npc"><img src="art/dune/env/elder.webp" alt=""><div><h2>ผู้เฒ่าเต่าทอง</h2><p>${line}</p>${Q ? `<p style="color:var(--gold)">ภารกิจ: ${Q.t} (${G.count}/${Q.n})<br>รางวัล ${Q.r.xp} XP · ${Q.r.gold} ทอง</p>` : ''}</div></div>`; }
  else shop();
  p.querySelector('.x').onclick = closeMenu;
}
function shop() {
  const p = $('panel'), wc = Math.round(70 * Math.pow(1.72, P.wep)), ac2 = Math.round(60 * Math.pow(1.7, P.arm)), L = [['hp', 4, 'ยาแดง', `ฟื้นเลือด 55% · มี ${P.hpot}`, 18], ['mp', 5, 'ยาฟ้า', `ฟื้นเวท 60% · มี ${P.mpot}`, 22], ['wep', 11, `หอกเพลิง +${P.wep + 1}`, `พลังโจมตี +7`, wc], ['arm', 10, `เกราะทราย +${P.arm + 1}`, `เลือด +38 · ป้องกัน +1.8`, ac2]];
  p.innerHTML = `<button class="x" aria-label="ปิด">×</button><div class="npc"><img src="art/dune/env/merchant.webp" alt=""><div style="flex:1"><h2>พ่อค้าจิ้งจอก</h2><p>ของดีจากทั่วทะเลทราย · ทอง <b style="color:var(--gold)">${P.gold}</b></p></div></div><div class="shop">${L.map(q => `<button class="item" data-b="${q[0]}" ${P.gold < q[4] ? 'disabled' : ''}><i class="ic"></i><span><b>${q[2]}</b>${q[3]}<br><small>${q[4]} ทอง</small></span></button>`).join('')}</div>`;
  p.querySelectorAll('.item').forEach((b, i) => { ic(b.querySelector('.ic'), L[i][1]); b.onclick = () => { const q = L[i]; if (P.gold < q[4]) return; P.gold -= q[4]; if (q[0] === 'hp') P.hpot++; if (q[0] === 'mp') P.mpot++; if (q[0] === 'wep') P.wep++; if (q[0] === 'arm') { P.arm++; P.hp += 38; } sfx('coin'); save(); ui(true); shop(); }; }); p.querySelector('.x').onclick = closeMenu;
}

/* ---------- save ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify({ v: 1, lv: P.lv, xp: P.xp, gold: P.gold, hpot: P.hpot, mpot: P.mpot, wep: P.wep, arm: P.arm, quest: G.quest, count: G.count, bossDone: G.bossDone })); } catch (e) {} }
function loadSave() { try { const d = JSON.parse(localStorage.getItem(KEY)); if (d) { for (const k of ['lv', 'xp', 'gold', 'hpot', 'mpot', 'wep', 'arm']) P[k] = d[k]; G.quest = d.quest; G.count = d.count; G.bossDone = d.bossDone; return true; } } catch (e) {} return false; }
function begin(fresh) { ac(); if (fresh) { try { localStorage.removeItem(KEY); } catch (e) {} Object.assign(P, { lv: 1, xp: 0, gold: 20, hpot: 3, mpot: 2, wep: 0, arm: 0 }); G.quest = 0; G.count = 0; G.bossDone = false; } else loadSave(); Object.assign(P, { x: 330, y: GROUND, vx: 0, vy: 0, on: true, plat: null, ladder: null, dead: false, inv: 0, cds: {}, dir: 1 }); P.hp = maxHP(); P.mp = maxMP(); setAnim('idle'); G.drops = []; G.fx = []; G.nums = []; resetMobs(); G.camX = 0; G.camY = GROUND + (TOUCH ? 150 : 96) - VIEW_H; $('boss').style.display = 'none'; $('title').style.display = 'none'; $('over').style.display = 'none'; $('hud').style.display = 'block'; G.state = 'play'; buildKeys(); drawFace(); ui(true); toast('โอเอซิสสุดท้าย', TOUCH ? 'ไปคุยกับผู้เฒ่าเต่าทอง' : 'A D เดิน · Space โดด · J ฟัน · K L U I สกิล · F คุย'); }

/* ---------- input ---------- */
const MAP = { a: 'left', arrowleft: 'left', d: 'right', arrowright: 'right', w: 'up', arrowup: 'up', s: 'down', arrowdown: 'down', ' ': 'jump', j: 'attack', z: 'attack', f: 'talk' };
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault(); if (G.state === 'menu') { if (k === 'escape' || k === 'f') closeMenu(); return; } if (G.state !== 'play' || e.repeat) { if (MAP[k]) I[MAP[k]] = 1; return; } ac(); if (MAP[k]) { I[MAP[k]] = 1; EDGE[MAP[k]] = 1; } const S = SKILLS.find(q => q.key.toLowerCase() === k); if (S) useSkill(S); if (k === 'shift' || k === 'x') doDash(); if (k === 'q') drink('hp'); if (k === 'e') drink('mp'); });
addEventListener('keyup', e => { const k = MAP[e.key.toLowerCase()]; if (k) I[k] = 0; });
document.querySelectorAll('.tb').forEach(b => { const k = b.dataset.k, on = e => { e.preventDefault(); ac(); I[k] = 1; EDGE[k] = 1; b.classList.add('down'); try { b.setPointerCapture(e.pointerId); } catch (x) {} }, off = () => { I[k] = 0; b.classList.remove('down'); }; b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off); });
addEventListener('blur', () => { for (const k in I) I[k] = 0; });
$('play').onclick = () => begin(false); $('fresh').onclick = () => begin(true); $('revive').onclick = () => { P.gold = Math.floor(P.gold * .9); begin(false); P.gold = Math.max(P.gold, 0); };

/* ---------- loop ---------- */
let prev = performance.now();
function frame(now) { requestAnimationFrame(frame); if (innerWidth !== lastW || innerHeight !== lastH) resize(); let dt = Math.min(.04, (now - prev) / 1000); prev = now; if (G.state === 'play') { if (G.stop > 0) { G.stop -= dt; dt *= .08; } stepWorld(dt); ui(); } else if (G.state === 'title') { G.t += dt; G.camX = 1050 + Math.sin(G.t * .1) * 600; G.camY = GROUND - VIEW_H * .72; } draw(); }
(async () => { try { await loadAll(); resetMobs(); $('load').style.display = 'none'; $('title').style.display = 'flex'; if (!localStorage.getItem(KEY)) $('fresh').style.display = 'none'; G.state = 'title'; window.DUNE = { P, G, I, EDGE, stepWorld, begin, useSkill, SKILLS, MT, QUESTS, gainXP, wakeBoss, draw, PLATS, LADDERS, ready: true }; requestAnimationFrame(frame); } catch (e) { console.error(e); $('load').querySelector('b').textContent = 'โหลดเกมไม่สำเร็จ ลองรีเฟรช'; } })();
</script>
