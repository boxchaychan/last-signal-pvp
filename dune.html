<style>

:root { --gold: #f4c65b; --gold2: #a96f20; --ink: #fff4dc; --dim: #d8c6a4; --panel: rgba(25,34,42,.93); --teal: #123c42; --red: #e4483d; --blue: #3f9df0; --sl: env(safe-area-inset-left,0px); --sr: env(safe-area-inset-right,0px); --sb: env(safe-area-inset-bottom,0px); }

.big { min-width: 190px; height: 48px; margin: 3px; padding: 0 20px; border-radius: 10px; background: linear-gradient(180deg, #ffd56e, #c8811f); color: #3a2208; font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #6d3f10, 0 7px 14px rgba(0,0,0,.5); } .big.alt { background: rgba(20,30,34,.86); color: var(--gold); border: 2px solid var(--gold2); box-shadow: none; }

}
body.t #keys { right: calc(190px + var(--sr)); bottom: calc(6px + var(--sb)); grid-template-columns: repeat(5, 46px); grid-auto-flow: row; }

<body>

<script>
'use strict';
/* ตำนานมังกรทราย: one hand-built side-scrolling map. All art painted for this game (Codex), cut by tools/art/dune_pack.py + dune_world.py. Genre only: no names, art or maps from any existing game. */
const $ = id => document.getElementById(id), QS = new URLSearchParams(location.search), TOUCH = matchMedia('(pointer:coarse)').matches || QS.get('touch') === '1';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rand = (a, b) => a + Math.random() * (b - a), irand = (a, b) => Math.floor(rand(a, b + 1)), sm = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const cv = $('c'), ctx = cv.getContext('2d', { alpha: false }); if (TOUCH) document.body.classList.add('t');
const OTTER = new URLSearchParams(location.search).get('hero') === 'otter', SKILL_TEST = OTTER && new URLSearchParams(location.search).get('test') === '1';   /* &test=1: every skill open, MP always full, nothing is saved */
/* the otter chi fist, by link until the owner has played it; it has its own save */
const VIEW_H = TOUCH ? 600 : 700, MAPW = 7860, GROUND = 1200, GRAV = 1950, KEY = OTTER ? 'dune_save_otter' : 'dune_save1', RUN_SPEED = 215, CHAR = 2 / 3, HERO_SC = .5 * CHAR; /* owner: characters one third smaller against the scenery */
const CLASSES = { spear: { n: 'นักรบหอก', hero: 'กิ้งก่าทราย' } }; /* one entry per job: the owner will bring more characters */
let SW = 1, SH = 1, K = 1, VW = 960;
let lastW = 0, lastH = 0;
function resize() { if (!innerWidth || !innerHeight) return; lastW = innerWidth; lastH = innerHeight; const dpr = Math.min(devicePixelRatio || 1, TOUCH ? 1.6 : 2); SW = cv.width = Math.round(innerWidth * dpr); SH = cv.height = Math.round(innerHeight * dpr); K = SH / VIEW_H; VW = SW / K; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; }
addEventListener('resize', resize); resize();

/* ---------- the map ---------- */
const PLATS = [
  { x: 1400, y: 1076, w: 380 }, { x: 1835, y: 952, w: 430 }, { x: 1470, y: 828, w: 320 },
  { x: 2400, y: 1076, w: 470 }, { x: 2960, y: 952, w: 390 }, { x: 2500, y: 824, w: 400 },
  { x: 3430, y: 1076, w: 430 }, { x: 3020, y: 714, w: 360 }, { x: 3780, y: 936, w: 340 }, { x: 3470, y: 806, w: 300 }
];
const LADDERS = [ { x: 1600, top: 1076, bot: GROUND, k: 'ladder' }, { x: 2050, top: 952, bot: GROUND, k: 'rope' }, { x: 1630, top: 828, bot: 1076, k: 'rope' }, { x: 2640, top: 1076, bot: GROUND, k: 'ladder' }, { x: 3150, top: 952, bot: GROUND, k: 'rope' }, { x: 2700, top: 824, bot: 1076, k: 'ladder' }, { x: 3200, top: 714, bot: 952, k: 'rope' }, { x: 3640, top: 1076, bot: GROUND, k: 'ladder' }, { x: 3950, top: 936, bot: GROUND, k: 'rope' }, { x: 3620, top: 806, bot: 1076, k: 'rope' } ];
const BACK = [ /* name, x, base y, height, flip */
  ['palm1', -10, GROUND + 6, 300], ['palm3', 1085, GROUND + 6, 285], ['tent', 205, GROUND + 6, 292], ['lantern', 405, GROUND + 4, 196], ['jars', 468, GROUND + 6, 90], ['stall', 640, GROUND + 6, 238], ['crates', 810, GROUND + 6, 108], ['well', 1010, GROUND + 6, 190], ['lantern', 890, GROUND + 4, 196, 1], ['sign', 1215, GROUND + 5, 150],
  ['palm2', 1330, GROUND + 6, 280, 1], ['column', 1760, GROUND + 6, 215], ['columnb', 1880, GROUND + 6, 150], ['pond', 2250, GROUND + 12, 88], ['palm1', 2360, GROUND + 6, 285, 1], ['arch', 2860, GROUND + 6, 250], ['fall', 3320, GROUND + 6, 150], ['obelisk', 3540, GROUND + 6, 250], ['palm3', 3790, GROUND + 6, 270], ['statue', 4130, GROUND + 6, 190], ['column', 4340, GROUND + 6, 250], ['arch', 4500, GROUND + 6, 340], ['column', 4660, GROUND + 6, 250],
  ['obelisk', 4860, GROUND + 6, 300], ['statue', 5050, GROUND + 6, 215, 1], ['columnb', 5230, GROUND + 6, 180], ['portal', 5480, GROUND + 6, 250],
  ['columnb', 1520, 1076 + 4, 88], ['shrub', 1940, 952 + 4, 50], ['cactus', 2150, 952 + 4, 76], ['blocks', 2500, 1076 + 4, 46], ['shrub', 2780, 1076 + 4, 44], ['jars', 2640, 824 + 4, 54], ['column', 3080, 952 + 4, 120], ['chest', 3240, 714 + 4, 50], ['cactus', 3760, 1076 + 4, 70], ['blocks', 3900, 936 + 4, 44], ['obelisk', 3540, 806 + 4, 92]
];
const FRONT = [ ['tuft', 130, GROUND + 14, 40], ['shrub', 1130, GROUND + 15, 44], ['tuft', 1490, GROUND + 15, 46], ['blocks', 2130, GROUND + 18, 40], ['tuft', 2310, GROUND + 16, 48], ['cactus', 2960, GROUND + 15, 64], ['tuft', 3440, GROUND + 15, 42], ['shrub', 4040, GROUND + 15, 42], ['tuft', 4760, GROUND + 15, 44], ['blocks', 5160, GROUND + 18, 48], ['tuft', 5360, GROUND + 15, 42] ];
const GLOWS = [[405, 1032, 78, '255,176,74'], [890, 1032, 78, '255,176,74'], [640, 1090, 78, '114,236,214'], [3320, 1120, 70, '110,235,226'], [5480, 1080, 130, '80,240,220']];
const NPCS = [ { id: 'elder', x: 960, n: 'ผู้เฒ่าเต่าทอง', h: 76, img: 'elder' }, { id: 'shop', x: 575, n: 'พ่อค้าจิ้งจอก', h: 72, img: 'merchant' } ];
const MT = {
  scorpion: { n: 'แมงป่องทราย', lv: 1, hp: 62, atk: 7, spd: 54, xp: 9, gold: [2, 5], sc: .53, r: 44, h: 72, reach: 70, aggro: 240, hitF: 7 },
  wolf: { n: 'หมาป่าเนินทราย', lv: 3, hp: 118, atk: 12, spd: 112, xp: 17, gold: [3, 7], sc: .55, r: 46, h: 76, reach: 80, aggro: 320, hitF: 6 },
  mummy: { n: 'มัมมี่สุสาน', lv: 5, hp: 215, atk: 18, spd: 60, xp: 28, gold: [5, 10], sc: .58, r: 36, h: 100, reach: 86, aggro: 270, hitF: 8 },
  cactus: { n: 'กระบองเพชรเดิน', lv: 7, hp: 360, atk: 25, spd: 44, xp: 43, gold: [7, 14], sc: .54, r: 38, h: 114, reach: 80, aggro: 240, hitF: 8 },
  golem: { n: 'โกเลมผู้เฝ้าสุสาน', lv: 12, hp: 9500, atk: 54, spd: 58, xp: 520, gold: [180, 240], sc: .86, r: 86, h: 225, reach: 170, aggro: 900, hitF: 8, boss: 1 }
};
for (const k in MT) { const T = MT[k], c = T.boss ? .8 : CHAR; T.sc *= c; T.r *= c; T.h *= c; T.reach *= c; }
const SPAWN = [ ['scorpion', 1250, 1390, GROUND], ['scorpion', 1440, 1760, GROUND], ['scorpion', 1710, 2020, GROUND], ['scorpion', 1420, 1760, 1076], ['scorpion', 1440, 1760, 1076], ['scorpion', 1850, 2240, 952], ['wolf', 2040, 2380, GROUND], ['wolf', 2400, 2680, GROUND], ['wolf', 2420, 2850, 1076], ['wolf', 1490, 1770, 828], ['wolf', 2520, 2880, 824], ['wolf', 2700, 2950, GROUND],
