     (code-made board, pines, table, baked sun shadows). Units = the owner's ChatGPT sheet cut to true pixels by tools/art/clash_cut.py
     (art/clash/units/*.png), moved by code only (bob, lunge, flash, pixel dissolve). Sprites are drawn in SCREEN pixels: the foot snaps
     to a whole pixel and 1 art pixel = PIX whole device pixels, so they never blur. Hit effects = PVFX Foundry sheets (art/pvfx, CC0) per unit kind (hitFx / deathFx), screen shake + hit-stop on heavy blows. Notes: the CLASH section at the end of docs/action-game.md.
