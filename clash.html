<title>ศึกหกเผ่า</title>
<!-- clash.html "ศึกหกเผ่า" (owner 2026-11-23): battle-scene TEST. Two armies of tiny pixel units clash on a 3D tabletop board
     (code-made board, pines, table, baked sun shadows). Units = the owner's ChatGPT sheet cut to true pixels by tools/art/clash_cut.py
     (art/clash/units/*.png), moved by code only (bob, lunge, flash, pixel dissolve). Sprites are drawn in SCREEN pixels: the foot snaps
     to a whole pixel and 1 art pixel = PIX whole device pixels, so they never blur. Hit effects = PVFX Foundry sheets (art/pvfx, CC0) per unit kind (hitFx / deathFx), screen shake + hit-stop on heavy blows. Notes: the CLASH section at the end of docs/action-game.md.
     Console: CLASH.quick(20) plays 20 battles without drawing and returns the wins. Check: node tools/qa/clash_check.js -->
<style>
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
@font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }

:root { --ink:#1a140e; --pan:#2b2118; --pan2:#4a3826; --line:#0c0805; --hi:#8a6a44; --txt:#fbf3e2; --dim:#cdbd9f; --gold:#ffd25a; --blue:#4aa8ff; --red:#ff5a55; }
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--txt); font: 600 14px/1.15 Kanit, system-ui, sans-serif; touch-action: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ov, #lt { pointer-events: none; } #lt { mix-blend-mode: screen; }
#vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse 75% 70% at 50% 54%, transparent 62%, rgba(12,16,6,.42) 100%); }
button { font: inherit; color: inherit; border: 2px solid var(--line); background: var(--pan2); box-shadow: inset 0 2px 0 var(--hi), inset 0 -3px 0 #0006; cursor: pointer; padding: 0 12px; height: 40px; }
button:active { transform: translateY(1px); }
.hide { display: none !important; }
#top { position: fixed; left: max(6px, env(safe-area-inset-left)); right: max(6px, env(safe-area-inset-right)); top: 4px; display: flex; gap: 6px; pointer-events: none; }
.army { flex: 1; min-width: 0; background: #2b2118e6; border: 2px solid var(--line); padding: 2px 7px 4px; }
.army .n { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
.army small { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.army .hp { height: 7px; background: #0c0805; margin-top: 2px; position: relative; overflow: hidden; }
.army .hp i { position: absolute; inset: 0 auto 0 0; background: var(--blue); }
.army.r .hp i { left: auto; right: 0; background: var(--red); }
.army.r .n { flex-direction: row-reverse; }
#mid { width: 150px; background: #2b2118e6; border: 2px solid var(--line); text-align: center; display: flex; flex-direction: column; justify-content: center; }
#mid b { color: var(--gold); font-weight: 800; font-size: 16px; } #mid small { color: var(--dim); font-size: 11px; }
#btns { position: fixed; right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
.pick { font-size: 13px; min-width: 96px; } #go { background: #3f8b3a; font-weight: 800; font-size: 17px; min-width: 120px; }
#hint { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); max-width: 46vw; font-size: 12px; color: var(--dim); background: #0008; padding: 3px 8px; pointer-events: none; }
#ban { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(ellipse at center, #1a140ecc, #0c0805ee); }
#ban h1 { font-weight: 800; font-size: clamp(26px, 8vh, 48px); color: var(--gold); text-shadow: 0 3px 0 #6b3d10, 0 5px 0 #000; }
#ban p { color: var(--dim); font-size: 14px; text-align: center; }
#ban button { background: #3f8b3a; font-size: 18px; font-weight: 800; min-width: 170px; height: 46px; }
#rot { position: fixed; inset: 0; background: var(--ink); display: none; align-items: center; justify-content: center; text-align: center; font-size: 18px; padding: 20px; z-index: 9; }
@media (orientation: portrait) and (max-width: 700px) { #rot { display: flex; } }
@media (max-width: 720px) { #mid { width: 112px; } .army small { font-size: 10px; } }
