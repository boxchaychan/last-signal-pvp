<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ป่าเนินผา · เทส 3D พิกเซล</title>
<!--
  Map 1 of map.html (ป่าเนินผา) as a 3D-pixel walk test (owner 2026-11-16 "หากจะทำแมพให้เป็น 3D พิกเซลละ" -> "ลองทำดู1แมพ"; free, code only).
  The 2D map's own painting is turned back into a world seen from above by tools/art/map3d_build.py (art/td/map1/3d/): the plateaus
  stand up as real blocks (their walls take the painted wall colours of ground.png), the stairs are real steps, the sun casts shadows,
  a post pass draws dark outlines from the depth buffer. three.js r147 (vendor/threejs) renders into a low-resolution target:
  1 render pixel = 1 pixel of the swordsman's sheets (U = 0.5 map px), enlarged with nearest-neighbour.
  Every picture (swordsman, monsters, rocks, ruins, bushes, trees) is a flat card standing upright facing the camera, drawn at whole
  pixels (hero 1:1, map art 2:1) and snapped to the pixel grid. Camera LOCKED to 4 angles (the sheets only have front / side / back).
  Trees: "รูปเดิม" = the map's own tree pictures (and their painted shadows), "3D" = Quaternius trees / bushes (CC0, art/tribe3d/nature)
  with real shadows on a ground painted without the tree shadows.
  Walk only: no combat, monsters just wander (the game itself stays map.html).
  URL: ?cam=0..3 (A 49° / B 60° / C 35° / D turned 22°), ?z=1|1.5|2|3 (device px per pixel), ?trees=3d, ?t=0..2 day / evening / night,
  ?ol=0 no outlines.  Keys: WASD / arrows walk, C camera, Q / E zoom, T trees, N time, O outlines.
  QA hooks: window.M3 (ready, hold, step(dt), draw(), P, setCam(i), zoom(d), setTrees(m), setTime(i), info(), go(x, z)).
-->
<style>
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-thai-600-normal.woff2) format('woff2'); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
  @font-face { font-family: Kanit; font-weight: 600; font-display: swap; src: url(art/gem/font/kanit-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+2212; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2e1a; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Kanit, sans-serif; color: #fff; }
  #hud > * { pointer-events: auto; }
  .pnl { position: fixed; background: #2a1c10e0; border: 2px solid #120a04; border-radius: 10px; box-shadow: 0 3px 0 #120a04, inset 0 1px 0 #ffe7b833; }
  #card { left: calc(8px + env(safe-area-inset-left)); top: 8px; padding: 4px 12px 6px; font-size: 14px; line-height: 1.25; pointer-events: none; }
  #card b { color: #ffcf5a; font-size: 15px; }
  #card small { color: #e8d8b8; font-size: 11px; }
  #btns { position: fixed; right: calc(8px + env(safe-area-inset-right)); top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .b { font: 600 13px Kanit, sans-serif; color: #fff; min-width: 86px; padding: 6px 8px; background: linear-gradient(#6a4a2a, #43301a); border: 2px solid #120a04; border-radius: 9px;
       box-shadow: 0 3px 0 #120a04, inset 0 1px 0 #ffe7b855; text-shadow: 0 1px 0 #120a04; cursor: pointer; }
  .b:active { transform: translateY(2px); box-shadow: 0 1px 0 #120a04; }
  #say { position: fixed; left: 50%; top: 16%; transform: translateX(-50%); font: 600 20px Kanit, sans-serif; color: #ffcf5a; text-shadow: 0 2px 0 #120a04, 0 -1px 0 #120a04, 2px 0 0 #120a04, -2px 0 0 #120a04;
         opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid #ffffff55; background: #00000022; display: none; pointer-events: none; }
  #joy i { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: #ffffff66; }
  #load { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 18px Kanit, sans-serif; color: #ffcf5a; background: #1d2e1a; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="card" class="pnl"><b>ป่าเนินผา · 3D พิกเซล (เทส)</b><br><small id="hint">เดิน: WASD / ลูกศร · มือถือ: แตะค้างแล้วลากนิ้ว</small></div>
  <div id="btns">
    <button class="b" id="bCam">มุม A</button>
    <button class="b" id="bZin">ซูมเข้า +</button>
    <button class="b" id="bZout">ซูมออก −</button>
    <button class="b" id="bTree">ต้นไม้: รูปเดิม</button>
    <button class="b" id="bTime">กลางวัน</button>
  </div>
  <div id="say"></div>
  <div id="joy"><i></i></div>
</div>
<div id="load">กำลังโหลดแมพ…</div>
<script src="vendor/threejs/three.min.js"></script>
<script src="vendor/threejs/GLTFLoader.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), Q = new URLSearchParams(location.search), V3 = THREE.Vector3, D2R = Math.PI / 180;
const U = .5;                                   // world units (= map px) per render pixel = one pixel of the swordsman's sheets
const CAMS = [{ n: 'A', p: 48.59, y: 0 }, { n: 'B', p: 60, y: 0 }, { n: 'C', p: 35, y: 0 }, { n: 'D', p: 48.59, y: 22 }];   // A: ground art rows land on exactly 3 pixels
const DH3 = Math.round(62 / Math.cos(48.59 * D2R));   // plateau height: its wall looks as tall as in the 2D map from camera A
const NSTEP = 8, SL = 58;                       // stairs: steps, length out from the wall
const SSTEP = [1, 1.5, 2, 3, 4];
const M3 = window.M3 = { ready: false, hold: false };
let camI = Math.max(0, Math.min(3, +Q.get('cam') || 0)), zS = SSTEP.includes(+Q.get('z')) ? +Q.get('z') : 0, S = 2, rw = 2, rh = 2, rt = null;
let pitch = 0, yaw = 0, treeMode = Q.get('trees') === '3d' ? 1 : 0, timeI = Math.max(0, Math.min(2, +Q.get('t') || 0)), OL = Q.get('ol') !== '0';
const R = new V3(), F = new V3(), UPV = new V3(), TOC = new V3();
let sayT = 0;
function say(s, ms) { const e = $('say'); e.textContent = s; e.style.opacity = 1; clearTimeout(sayT); sayT = setTimeout(() => e.style.opacity = 0, ms || 1200); }

// ---------- renderer, low-res target, outline + grade pass (as kaiju.html / tribe3d.html)
const cv = $('cv');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.BasicShadowMap;
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 5000);
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postM = new THREE.ShaderMaterial({
  uniforms: { tC: { value: null }, tD: { value: null }, res: { value: new THREE.Vector2(1, 1) }, nf: { value: new THREE.Vector2(1, 5000) }, thr: { value: 3 }, ol: { value: 1 },
              sat: { value: 1.08 }, cool: { value: new THREE.Color(.94, .97, 1.06) }, warm: { value: new THREE.Color(1.04, 1, .95) }, vig: { value: .3 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `uniform sampler2D tC; uniform sampler2D tD; uniform vec2 res; uniform vec2 nf; uniform float thr; uniform float ol; uniform float sat; uniform vec3 cool; uniform vec3 warm; uniform float vig; varying vec2 vUv;
    float D(vec2 o){ return nf.x + texture2D(tD, vUv + o / res).r * (nf.y - nf.x); }
    void main(){
      vec4 c4 = texture2D(tC, vUv); vec3 c = c4.rgb;
      if (ol > .5 && c4.a > .5) {
        float d = D(vec2(0.));
        float m = max(max(d - D(vec2(1., 0.)), d - D(vec2(-1., 0.))), max(d - D(vec2(0., 1.)), d - D(vec2(0., -1.))));
        if (m > thr) c = c * .38 + vec3(.04, .03, .02);                  // the far side of a depth step: a dark outline
        else if (D(vec2(0., 1.)) - d > thr) c = min(c * 1.16 + .03, vec3(1.));   // a lit top edge
      }
      float l = dot(c, vec3(.299, .587, .114));
      c = mix(vec3(l), c, sat);
      c *= mix(cool, warm, smoothstep(.18, .75, l));
      vec2 q = vUv - .5; c *= 1. - vig * dot(q, q);
      gl_FragColor = vec4(c, 1.);
    }`, depthTest: false, depthWrite: false });
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postM));

function layout() {
  const dpr = window.devicePixelRatio || 1, dw = Math.round(innerWidth * dpr), dh = Math.round(innerHeight * dpr);
  S = zS || SSTEP.reduce((a, v) => Math.abs(v - dh / 800) < Math.abs(a - dh / 800) ? v : a, 1);   // default: the swordsman about a sixth of the screen
  const fit = () => { rh = Math.ceil(dh / S); rh += rh & 1; rw = Math.ceil(dw / S); rw += rw & 1; };
  fit(); while (rw * rh > 1700000 && S < 4) { S = SSTEP[SSTEP.indexOf(S) + 1]; fit(); }
  zS = S;
  renderer.setSize(rw, rh, false);
  const cw = rw * S / dpr, ch = rh * S / dpr;
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: ((innerWidth - cw) / 2) + 'px', top: ((innerHeight - ch) / 2) + 'px' });
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  rt = new THREE.WebGLRenderTarget(rw, rh, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  rt.texture.generateMipmaps = false; rt.depthTexture = new THREE.DepthTexture(rw, rh); rt.depthTexture.type = THREE.UnsignedIntType;
  postM.uniforms.tC.value = rt.texture; postM.uniforms.tD.value = rt.depthTexture; postM.uniforms.res.value.set(rw, rh);
  cam.left = -rw / 2 * U; cam.right = rw / 2 * U; cam.top = rh / 2 * U; cam.bottom = -rh / 2 * U; cam.updateProjectionMatrix();
  postM.uniforms.nf.value.set(cam.near, cam.far);
}

// ---------- lights + time of day
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8d0b8, .72); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, .38); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -.0006; sun.shadow.normalBias = 1; scene.add(sun); scene.add(sun.target);
const SUNDIR = new V3();
const TIMES = [
  { n: 'กลางวัน', sky: 0xffffff, gnd: 0xd8d0b8, hi: .72, sc: 0xfff2dc, si: .38, d: [-.45, .8, -.4], card: 0xffffff, bg: 0x1d2e1a, sat: 1.08, cool: [.94, .97, 1.06], warm: [1.04, 1, .95], vig: .3 },
  { n: 'เย็น', sky: 0xffc89a, gnd: 0x6a4a6a, hi: .56, sc: 0xffa050, si: .62, d: [-.85, .42, -.18], card: 0xffd2b0, bg: 0x2a1e1a, sat: 1.12, cool: [.86, .86, 1.12], warm: [1.14, .98, .82], vig: .42 },
  { n: 'กลางคืน', sky: 0x7080c8, gnd: 0x2a2a48, hi: .5, sc: 0xa8bcff, si: .26, d: [.35, .85, -.4], card: 0x8e9ad0, bg: 0x0c1220, sat: .92, cool: [.86, .94, 1.2], warm: [1.08, 1, .9], vig: .55 },
];
const CARDMATS = [];   // card materials: tinted by the time of day (the flat pictures get no light of their own)
function setTime(i) {
  timeI = (i + TIMES.length) % TIMES.length; const t = TIMES[timeI];
  hemi.color.set(t.sky); hemi.groundColor.set(t.gnd); hemi.intensity = t.hi; sun.color.set(t.sc); sun.intensity = t.si; SUNDIR.set(...t.d).normalize();
  scene.background = new THREE.Color(t.bg); for (const m of CARDMATS) m.color.set(t.card);
  const u = postM.uniforms; u.sat.value = t.sat; u.cool.value.setRGB(...t.cool); u.warm.value.setRGB(...t.warm); u.vig.value = t.vig;
  $('bTime').textContent = t.n; if (M3.ready) say(t.n);
}

// ---------- camera (locked angles, zoom only)
function setCam(i) {
  camI = (i + CAMS.length) % CAMS.length; const c = CAMS[camI]; pitch = c.p * D2R; yaw = c.y * D2R;
  TOC.set(Math.cos(pitch) * Math.sin(yaw), Math.sin(pitch), Math.cos(pitch) * Math.cos(yaw));
  R.set(Math.cos(yaw), 0, -Math.sin(yaw)); F.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  UPV.set(-Math.sin(pitch) * Math.sin(yaw), Math.cos(pitch), -Math.sin(pitch) * Math.cos(yaw)); cam.up.copy(UPV);
  for (const c2 of CARDS) { c2.geoFor(); if (c2.mesh) c2.place(); }
  $('bCam').textContent = 'มุม ' + c.n; if (M3.ready) say('มุมกล้อง ' + c.n + ' · ' + Math.round(c.p) + '°' + (c.y ? ' หมุน ' + c.y + '°' : ''));
}
const CT = new V3(), CTS = new V3();
function snap(v) {   // move a point along the screen axes so it lands on the render-pixel grid (crisp sprites, no shimmer)
  const pr = v.dot(R), pu = v.dot(UPV); return v.addScaledVector(R, Math.round(pr / U) * U - pr).addScaledVector(UPV, Math.round(pu / U) * U - pu);
}
function placeCam() {
  const hw = rw / 2 * U, hd = rh / 2 * U / Math.sin(pitch), cot = 1 / Math.tan(pitch);
  let x = CT.x, zg = CT.z - CT.y * cot;                       // where the middle of the screen meets the low ground
  x = MW > 2 * hw ? Math.max(hw, Math.min(MW - hw, x)) : MW / 2;
  zg = MH > 2 * hd ? Math.max(hd - DH3 * cot * .6, Math.min(MH - hd, zg)) : MH / 2;
  CTS.set(x, 0, zg); snap(CTS);
  cam.position.copy(CTS).addScaledVector(TOC, 2500); cam.lookAt(CTS);
  const sh = Math.max(hw, hd) + 160, tx = Math.round(CTS.x / 8) * 8, tz = Math.round(CTS.z / 8) * 8;   // the sun's shadow box follows the view
  sun.target.position.set(tx, 0, tz); sun.position.set(tx, 0, tz).addScaledVector(SUNDIR, 1200);
  const sc = sun.shadow.camera; if (sc.right !== sh) { Object.assign(sc, { left: -sh, right: sh, top: sh, bottom: -sh, near: 1, far: 2600 }); sc.updateProjectionMatrix(); }
}

// ---------- loading
const tl = new THREE.TextureLoader();
const tex = src => new Promise((ok, no) => tl.load(src, t => { t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; ok(t); }, undefined, () => no(new Error(src))));
const img = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(src)); i.src = src; });
let J, MW, MH, GW, GH, FP, WK, ST = [];
const TX = {};

// ---------- the ground, the plateaus, their walls, the stairs
function topAlpha(im) {   // the top picture with the plateau footprint as alpha: the raised top surface
  const c = document.createElement('canvas'); c.width = GW; c.height = GH; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, GW, GH); for (let i = 0; i < GW * GH; i++) d.data[i * 4 + 3] = FP[i] ? 255 : 0; x.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c); t.magFilter = t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; return t;
}
let groundM, topM, topDepth;
function buildTerrain() {
  const geo = new THREE.PlaneGeometry(MW, MH).rotateX(-Math.PI / 2).translate(MW / 2, 0, MH / 2);
  groundM = new THREE.MeshLambertMaterial({ map: TX.top });
  const g = new THREE.Mesh(geo, groundM); g.receiveShadow = true; scene.add(g);
  topM = new THREE.MeshLambertMaterial({ map: TX.topA, alphaTest: .5 });
  const t = new THREE.Mesh(geo.clone().translate(0, DH3, 0), topM); t.receiveShadow = t.castShadow = true;
  topDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: TX.topA, alphaTest: .5 }); t.customDepthMaterial = topDepth; scene.add(t);
  // outside the map: low dark forest floor, and the forest behind the north plateau at the plateau's height
  const out = new THREE.MeshLambertMaterial({ color: 0x3c5a2c });
  const o1 = new THREE.Mesh(new THREE.PlaneGeometry(MW + 3000, MH + 3000).rotateX(-Math.PI / 2).translate(MW / 2, -.5, MH / 2), out); o1.receiveShadow = true; scene.add(o1);
  const o2 = new THREE.Mesh(new THREE.BoxGeometry(MW + 3000, DH3, 1500).translate(MW / 2, DH3 / 2 - .3, -750), new THREE.MeshLambertMaterial({ color: 0x4a6a30 })); o2.receiveShadow = true; scene.add(o2);
  // walls: one quad per footprint pixel edge; the wall facing the camera (south) takes the painted wall right under that top in ground.png
  const P = [], N = [], UV = [], fp = (i, j) => i >= 0 && j >= 0 && i < GW && j < GH && FP[j * GW + i] > 0;
  const southEdge = new Int32Array(GW * GH).fill(-1);
  for (let i = 0; i < GW; i++) { let last = -1; for (let j = GH - 1; j >= 0; j--) { if (fp(i, j)) { if (last < 0) last = j; southEdge[j * GW + i] = last; } else last = -1; } }
  const DA = J.dh / 2, uu = x => x / MW, vv = y => 1 - Math.max(0, y) / MH;
  function quad(ax, az, bx, bz, nx, nz, col, se) {   // vertical wall from (ax, az) to (bx, bz); texture = the painted wall of column col under footprint edge se
    const u0 = uu(col * 2), u1 = uu(col * 2 + 2), vT = vv((se + 1 - DA) * 2), vB = vv((se + 1) * 2);
    P.push(ax, 0, az, bx, 0, bz, bx, DH3, bz, ax, 0, az, bx, DH3, bz, ax, DH3, az);
    UV.push(u0, vB, u1, vB, u1, vT, u0, vB, u1, vT, u0, vT);
    for (let k = 0; k < 6; k++) N.push(nx, 0, nz);
  }
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    if (!fp(i, j)) continue; const se = southEdge[j * GW + i], x0 = i * 2, x1 = x0 + 2, z0 = j * 2, z1 = z0 + 2;
    if (!fp(i, j + 1) && j + 1 < GH) quad(x0, z1, x1, z1, 0, 1, i, se);
    if (!fp(i, j - 1) && j > 0) quad(x1, z0, x0, z0, 0, -1, i, se);
    if (!fp(i + 1, j) && i + 1 < GW) quad(x1, z1, x1, z0, 1, 0, i, se);
    if (!fp(i - 1, j) && i > 0) quad(x0, z0, x0, z1, -1, 0, i, se);
  }
  const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); wg.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3)); wg.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2));
  const w = new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ map: TX.wall, side: THREE.DoubleSide })); w.castShadow = w.receiveShadow = true; scene.add(w);
  // stairs: real steps in the colours of the painted stairs, from the wall out over the low ground
  const tread = new THREE.MeshLambertMaterial({ color: 0xa69476 }), riser = new THREE.MeshLambertMaterial({ color: 0x706054 }), side = new THREE.MeshLambertMaterial({ color: 0x82563a });
  for (const s of J.stairs) {
    const st = { x0: s.x0, x1: s.x1, z0: s.z0, z1: s.z1, zb: s.z1 + SL }; ST.push(st);
    for (let k = 0; k < NSTEP; k++) {
      const zf = st.zb - k * SL / NSTEP, zb0 = s.z0 - 2, h = (k + 1) * DH3 / NSTEP;
      const b = new THREE.Mesh(new THREE.BoxGeometry(s.x1 - s.x0, h, zf - zb0).translate((s.x0 + s.x1) / 2, h / 2, (zf + zb0) / 2), [side, side, tread, side, riser, side]);
      b.castShadow = b.receiveShadow = true; scene.add(b);
    }
    for (const sx of [s.x0 - 3, s.x1 + 3]) {   // low stone side walls
      const b = new THREE.Mesh(new THREE.BoxGeometry(6, DH3 * .5, SL * .5).translate(sx, DH3 * .25, st.z1 + SL * .25), side); b.castShadow = b.receiveShadow = true; scene.add(b);
    }
  }
}
function stairAt(x, z) { for (const s of ST) if (x >= s.x0 + 2 && x <= s.x1 - 2 && z >= s.z0 - 6 && z <= s.zb) return s; return null; }
function hAt(x, z) {
  const s = stairAt(x, z); if (s) return (Math.min(NSTEP - 1, Math.floor((s.zb - z) / (SL / NSTEP))) + 1) * DH3 / NSTEP;
  const i = x >> 1, j = z >> 1; return i >= 0 && j >= 0 && i < GW && j < GH && FP[j * GW + i] ? DH3 : 0;
}
function walkAt(x, z) { if (x < 0 || z < 0 || x >= MW || z >= MH) return false; if (stairAt(x, z)) return true; return WK[(z >> 1) * GW + (x >> 1)] > 0; }
function canGo(x0, z0, x1, z1, r) {   // free ground at the new spot (4 points round the feet) and no climb higher than one step
  const h0 = hAt(x0, z0);
  for (const [dx, dz] of [[0, 0], [r, 0], [-r, 0], [0, r * .6], [0, -r * .6]]) { const x = x1 + dx, z = z1 + dz; if (!walkAt(x, z) || Math.abs(hAt(x, z) - h0) > DH3 / NSTEP + .5) return false; }
  return true;
}

// ---------- cards: flat pictures standing upright, facing the camera, 1 picture px = k render px, snapped to the pixel grid
const CARDS = [];
function cardGeo(w, h, fx, fy, k, tw, th, rx, ry, flat) {   // picture rect (rx, ry, w, h) of a tw x th texture, feet at (fx, fy) in the rect
  const c = Math.cos(pitch), sn = Math.sin(pitch), sx = k * U, sy = k * U / c;
  if (flat) return flatGeo(w, h, fx, fy, sx, k * U / sn, tw, th, rx, ry);
  const lift = (h - fy) * sy / sn * c + .8;   // pulled toward the camera (same spot on screen) so pixels under the feet stay above the ground
  const y0 = -(h - fy) * sy, y1 = fy * sy, x0 = -fx * sx, x1 = (w - fx) * sx, oy = lift * sn, oz = lift * c;

const PV = new V3();

const TREEK = { tree: 1, tree2: 1, stree: 1, bush: 1 };

// ---------- 3D trees (Quaternius, CC0) for the "3D" look
const NAT = {}, NATG = new THREE.Group(); scene.add(NATG); let natLoaded = null;
const NAT_TEXOF = { BirchTree_Leaves: 1, NormalTree_Leaves: 1, PineTree_Leaves: 1, Bush_Leaves: 1, Flowers: 1, BirchTree_Bark: 1, NormalTree_Bark: 1, PineTree_Bark: 1 };
const NAT_FLAT = { BirchTree_Leaves: 0xc8d860, NormalTree_Leaves: 0x7cb84a, PineTree_Leaves: 0x3a6e3a, Bush_Leaves: 0x6aa844 };
function mergeGeos(list) {
  const P = [], N = [], UV = [];
  for (let g of list) { if (g.index) g = g.toNonIndexed(); const p = g.attributes.position, n = g.attributes.normal, u = g.attributes.uv;
    for (let i = 0; i < p.count; i++) { P.push(p.getX(i), p.getY(i), p.getZ(i)); if (n) N.push(n.getX(i), n.getY(i), n.getZ(i)); else N.push(0, 1, 0); if (u) UV.push(u.getX(i), u.getY(i)); else UV.push(0, 0); } }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(N, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(UV, 2)); return g;
}
function loadNature() {
  if (natLoaded) return natLoaded;
  const ld = new THREE.GLTFLoader(), mats = {};
  const matFor = mn => {
    if (mats[mn]) return mats[mn];
    const card = !/Bark/.test(mn), flat = NAT_FLAT[mn], map = NAT_TEXOF[mn] ? tl.load(`art/tribe3d/nature/tex/${mn}.png`) : null;
    if (map) { map.magFilter = THREE.NearestFilter; map.minFilter = THREE.NearestMipmapNearestFilter; }
    const m = new THREE.MeshLambertMaterial({ map, color: flat || 0xffffff, alphaTest: card ? .32 : 0, side: card ? THREE.DoubleSide : THREE.FrontSide });
    if (flat) m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('#include <map_fragment>', 'vec4 tx = texture2D(map, vUv); diffuseColor.a *= tx.a; diffuseColor.rgb *= .82 + .3 * dot(tx.rgb, vec3(.3, .59, .11)) / max(.2, max(tx.r, max(tx.g, tx.b)));'); };

    'Bush', 'Bush_Large', 'Bush_Small', 'Bush_Flowers', 'Bush_Large_Flowers'];

    try {
      const g = await ld.loadAsync(`art/tribe3d/nature/${n}.glb`); g.scene.updateMatrixWorld(true); const parts = {};
      g.scene.traverse(o => { if (o.isMesh) { const mn = (o.material.name || '').replace(/\.\d+$/, ''), geo = o.geometry.clone(); geo.applyMatrix4(o.matrixWorld); (parts[mn] = parts[mn] || []).push(geo); } });
      const list = Object.entries(parts).map(([mn, l]) => ({ geo: mergeGeos(l), mat: matFor(mn), mn }));
      for (const p of list) if (/Tree_Leaves|Bush_Leaves/.test(p.mn)) {   // crown normals point out from its middle: one soft lit ball
        p.geo.computeBoundingBox(); const c = p.geo.boundingBox.getCenter(new V3()), sz = p.geo.boundingBox.getSize(new V3()), P = p.geo.attributes.position, N = p.geo.attributes.normal, v = new V3();
        c.y -= sz.y * .4; for (let i = 0; i < P.count; i++) { v.set((P.getX(i) - c.x) / sz.x, (P.getY(i) - c.y) / sz.y, (P.getZ(i) - c.z) / sz.z).normalize(); N.setXYZ(i, v.x, v.y, v.z); }

}
function plantTrees() {   // a 3D model at every tree / bush picture of the map, about as tall on screen as the picture
  let r = 7; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647, pick = l => l[Math.floor(rnd() * l.length)];
  for (const c of CARDS) {

    const n = p.k === 'bush' ? pick(['Bush', 'Bush_Large', 'Bush_Small', 'Bush_Flowers', 'Bush_Large_Flowers']) : p.n === 'trees_green_1' ? pick(['PineTree_1', 'PineTree_2', 'PineTree_4', 'PineTree_5'])
      : p.n === 'trees_green_2' ? pick(['BirchTree_1', 'BirchTree_2', 'BirchTree_4', 'BirchTree_5']) : pick(['NormalTree_2', 'NormalTree_3', 'NormalTree_4', 'NormalTree_5']);

async function setTrees(m) {

  if (m) { $('bTree').textContent = 'ต้นไม้: โหลด…'; await loadNature(); $('bTree').textContent = 'ต้นไม้: 3D'; }

// ---------- the swordsman (chibi_pl.png clips + hero_chibi16.png stills, 1 sheet px = 1 render px)
const P = M3.P = { x: 0, z: 0, y: 0, d: 2, face: 1, mv: 0, t: 0 };
let heroC, heroSil, blob;
const HS = { sheet: { w: 204, h: 140, fx: 103, fy: 137, ry0: 37 }, still: { w: 113, h: 130, fx: 56, fy: 128 } };
function heroFrame() {   // which picture: run side / up / down clips, idle side clip, front / back stills (as map.html)
  const d = P.d, v = d === 2 ? 0 : d >= 5 ? 2 : 1, fl = d >= 3 && d <= 5 ? -1 : 1;
  if (P.mv) { if (d === 6) return ['sheet', 100 + (P.t * 13 | 0) % 8, 1]; if (d === 2) return ['sheet', 110 + (P.t * 13 | 0) % 8, 1]; return ['sheet', (P.t * 13 | 0) % 8, fl]; }
  if (v === 1) return ['sheet', 60 + (P.t * 6 | 0) % 8, P.face]; return ['still', v, 1];
}
function buildHero() {
  const mk = (t, s, k) => cardGeo(s.w, s.h, s.fx, s.fy, 1, t.image.width, t.image.height, 0, 0);
  heroC = { sheetG: null, stillG: null, mat: cardMat(TX.hero), sm: cardMat(TX.still) };
  heroC.geoFor = () => {
    heroC.sheetG = mk(TX.hero, HS.sheet); heroC.stillG = mk(TX.still, HS.still);
    if (heroC.mesh) heroC.mesh.geometry = heroC.sheetG;
  };
  heroC.geoFor(); CARDS.push(heroC); heroC.place = () => {};
  heroC.mesh = new THREE.Mesh(heroC.sheetG, heroC.mat); scene.add(heroC.mesh);
  heroSil = new THREE.Mesh(heroC.sheetG, new THREE.MeshBasicMaterial({ map: TX.hero, alphaTest: .2, transparent: true, opacity: .45, color: 0x8a6cff, depthFunc: THREE.GreaterDepth, depthWrite: false, side: THREE.DoubleSide }));
  heroSil.renderOrder = 9; scene.add(heroSil);
  blob = new THREE.Mesh(new THREE.CircleGeometry(1, 20).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x101808, transparent: true, opacity: .32, depthWrite: false }));
  blob.renderOrder = -1; blob.scale.set(22, 1, 9); scene.add(blob);   // ground shadows drawn before every card
}
function placeHero() {
  const [k, f, fl] = heroFrame(), s = HS[k];
  const t = k === 'sheet' ? TX.hero : TX.still, W = t.image.width, H = t.image.height;
  heroC.mesh.material = k === 'sheet' ? heroC.mat : heroC.sm; heroC.mesh.geometry = k === 'sheet' ? heroC.sheetG : heroC.stillG;
  heroSil.geometry = heroC.mesh.geometry; heroSil.material.map = t;
  const col = k === 'sheet' ? f % 10 : f, row = k === 'sheet' ? (f / 10 | 0) : 0, x0 = col * (k === 'sheet' ? 204 : s.w), y0 = row * (k === 'sheet' ? 204 : 0) + (s.ry0 || 0);
  t.repeat.set(1, 1); t.offset.set(x0 / W, -(y0) / H);   // geometry UVs cover the rect at (0, 0): shift to this frame

}

// ---------- monsters: wander round their camp (walk only in this test)
const MOBS = [];
function buildMobs() {
  for (const [k, x, z, on] of J.spawn) {
    const m = J.mobs[k], base = TX['mob_' + k]; if (!m || !base) continue;
    const t = base.clone(); t.needsUpdate = true; t.repeat.set(1, 1);
    const mob = { k, hx: x, hz: z, x, z, y: on ? DH3 : 0, tx: x, tz: z, wait: Math.random() * 3, t: Math.random() * 9, face: Math.random() < .5 ? -1 : 1, m, tex: t };
    mob.c = addCard({ tex: t, w: m.w, h: m.h, fx: m.fx, fy: m.fy, k: 2, place() { placeCard(this, mob.x, mob.y, mob.z, mob.face < 0); } });
    mob.blob = new THREE.Mesh(blob.geometry, blob.material); mob.blob.renderOrder = -1; mob.blob.scale.set(m.w * .42, 1, m.w * .16); scene.add(mob.blob);

}
function stepMobs(dt) {
  for (const b of MOBS) {

      const dx = b.tx - b.x, dz = b.tz - b.z, l = Math.hypot(dx, dz);
      if (l < 3) { b.wait = 1 + Math.random() * 3; const a = Math.random() * 6.28, r = 20 + Math.random() * 60; b.tx = b.hx + Math.cos(a) * r; b.tz = b.hz + Math.sin(a) * r * .7; }
      else { const sp = 32 * dt, nx = b.x + dx / l * sp, nz = b.z + dz / l * sp; if (Math.abs(dx) > 1) b.face = dx > 0 ? 1 : -1;
        if (canGo(b.x, b.z, nx, nz, 6)) { b.x = nx; b.z = nz; b.y = hAt(b.x, b.z); } else { b.tx = b.x; b.tz = b.z; } }
    }

// ---------- input: keys, a finger joystick on the left of the screen
const KEY = {};
addEventListener('keydown', e => {
  KEY[e.code] = 1;
  if (e.code === 'KeyC') setCam(camI + 1); if (e.code === 'KeyQ') zoom(-1); if (e.code === 'KeyE') zoom(1);
  if (e.code === 'KeyT') setTrees(treeMode ? 0 : 1); if (e.code === 'KeyN') setTime(timeI + 1);
  if (e.code === 'KeyO') { OL = !OL; postM.uniforms.ol.value = OL ? 1 : 0; say(OL ? 'เส้นขอบ เปิด' : 'เส้นขอบ ปิด'); }
});
addEventListener('keyup', e => { KEY[e.code] = 0; });
const JOY = { id: null, x: 0, y: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', e => { if (JOY.id !== null) return; JOY.id = e.pointerId; JOY.x = e.clientX; JOY.y = e.clientY; JOY.dx = JOY.dy = 0; const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.style.display = 'block'; });
addEventListener('pointermove', e => { if (e.pointerId !== JOY.id) return; let dx = e.clientX - JOY.x, dy = e.clientY - JOY.y; const l = Math.hypot(dx, dy); if (l > 40) { dx *= 40 / l; dy *= 40 / l; } JOY.dx = dx / 40; JOY.dy = dy / 40; $('joy').firstElementChild.style.transform = `translate(${dx}px,${dy}px)`; });
const joyEnd = e => { if (e.pointerId !== JOY.id) return; JOY.id = null; JOY.dx = JOY.dy = 0; $('joy').style.display = 'none'; $('joy').firstElementChild.style.transform = ''; };
addEventListener('pointerup', joyEnd); addEventListener('pointercancel', joyEnd);
function zoom(d) { zS = SSTEP[Math.max(0, Math.min(SSTEP.length - 1, SSTEP.indexOf(S) + d))]; layout(); if (M3.ready) say('ซูม ' + S + 'x'); }
$('bCam').onclick = () => setCam(camI + 1); $('bZin').onclick = () => zoom(1); $('bZout').onclick = () => zoom(-1);
$('bTree').onclick = () => setTrees(treeMode ? 0 : 1); $('bTime').onclick = () => setTime(timeI + 1);
addEventListener('resize', () => layout());

// ---------- step + draw
const SPD = 150;
function step(dt) {
  let ix = (KEY.KeyD || KEY.ArrowRight ? 1 : 0) - (KEY.KeyA || KEY.ArrowLeft ? 1 : 0), iy = (KEY.KeyS || KEY.ArrowDown ? 1 : 0) - (KEY.KeyW || KEY.ArrowUp ? 1 : 0);
  if (M3.input) [ix, iy] = M3.input;

  const l = Math.hypot(ix, iy); P.mv = l > .2 ? 1 : 0; P.t += dt;
  if (P.mv) {

    if (canGo(P.x, P.z, P.x + wx, P.z + wz, 7)) { P.x += wx; P.z += wz; }
    else if (canGo(P.x, P.z, P.x + wx, P.z, 7)) P.x += wx;
    else if (canGo(P.x, P.z, P.x, P.z + wz, 7)) P.z += wz;

  CT.x += (P.x - CT.x) * Math.min(1, dt * 6); CT.z += (P.z - CT.z) * Math.min(1, dt * 6); CT.y += (P.y - CT.y) * Math.min(1, dt * 4);
  stepMobs(dt);
}
function draw() {
  placeCam(); placeHero();
  renderer.setRenderTarget(rt); renderer.render(scene, cam); renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
let last = 0;
function loop(t) { const dt = Math.min(.05, (t - last) / 1000 || 0); last = t; if (!M3.hold) { step(dt); draw(); } requestAnimationFrame(loop); }

async function start() {
  J = await (await fetch('art/td/map1/3d/geo.json')).json(); MW = J.w; MH = J.h; GW = J.gw; GH = J.gh;
  const D = 'art/td/map1/';
  const [grid, topIm, top3dIm] = await Promise.all([img(D + '3d/grid.png'), img(D + '3d/top.png'), img(D + '3d/top3d.png')]);
  const c = document.createElement('canvas'); c.width = GW; c.height = GH; const x = c.getContext('2d'); x.drawImage(grid, 0, 0); const gd = x.getImageData(0, 0, GW, GH).data;
  FP = new Uint8Array(GW * GH); WK = new Uint8Array(GW * GH); for (let i = 0; i < GW * GH; i++) { FP[i] = gd[i * 4] > 127; WK[i] = gd[i * 4 + 1] > 127; }
  const L = [['top', D + '3d/top.png'], ['top3d', D + '3d/top3d.png'], ['wall', D + 'ground.png'], ['props', D + 'props.png'], ['hero', 'art/poses/combo/chibi_pl.png'], ['still', D + 'hero_chibi16.png']];
  for (const k of Object.keys(J.mobs)) L.push(['mob_' + k, D + 'mob_' + k + '.png']);
  await Promise.all(L.map(async ([k, s]) => { TX[k] = await tex(s); }));
  TX.topA = topAlpha(topIm);
  setCam(camI); layout(); setTime(timeI);
  buildTerrain(); buildProps(); buildHero(); buildMobs();
  [P.x, P.z] = J.start; P.y = hAt(P.x, P.z); CT.set(P.x, P.y, P.z);
  postM.uniforms.ol.value = OL ? 1 : 0;
  if (treeMode) await setTrees(1); else setTrees(0);
  $('load').style.display = 'none'; M3.ready = true; requestAnimationFrame(loop);
}
Object.assign(M3, { step, draw, setCam, zoom, setTrees, setTime,
  go(x, z) { P.x = x; P.z = z; P.y = hAt(x, z); CT.set(P.x, P.y, P.z); },
  info: () => ({ S, rw, rh, cam: CAMS[camI].n, trees: treeMode, time: timeI, P: { x: Math.round(P.x), z: Math.round(P.z), y: Math.round(P.y) }, mobs: MOBS.length, cards: CARDS.length, nat: NATG.children.length }) });
start().catch(e => { $('load').textContent = 'โหลดไม่ได้: ' + e.message; console.error(e); });
</script>
